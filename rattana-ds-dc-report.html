<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rattana DS-DC Report v3.79</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0d1b3e; --navy-mid:#1a2f5e;
  --gold:#c9a84c;
  --success:#2ecc71; --danger:#e74c3c; --info:#3498db;
  --bg:#f4f6fb; --text:#0d1b3e; --card-bg:#ffffff; --border:#dde3f0;
  --muted:#6b7896; --row-alt:#fafbfd;
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06); --shadow-md:0 2px 8px rgba(0,0,0,.08);
}
body.dark {
  --bg:#0a1020; --text:#e8eaf0; --card-bg:#111c35; --border:#243b73;
  --muted:#8a98b8; --row-alt:#0f1830;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:700;letter-spacing:1px;font-size:16px;color:#fff;flex:1}
.logo-text span{color:var(--gold)}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.content{padding:12px;max-width:1400px;margin:0 auto;width:100%}
@media(min-width:640px){.content{padding:16px}}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px 16px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.stat-card.danger{border-top-color:var(--danger)} .stat-card.success{border-top-color:var(--success)} .stat-card.info{border-top-color:var(--info)}
.s-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.s-value{font-size:20px;font-weight:700;line-height:1.2}
.s-sub{font-size:11px;color:var(--muted);margin-top:3px}
@media(min-width:640px){.s-value{font-size:24px}}

.filter-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:10px;flex-wrap:wrap}
.filter-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);min-height:34px;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md);margin-bottom:14px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent)}
.card-head h3{font-size:14px;font-weight:700}
.row-count{font-size:12px;color:var(--muted);font-weight:500}

.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 260px)}
.tbl{width:100%;border-collapse:collapse;min-width:1100px}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.tbl thead th{padding:9px 10px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none}
.tbl thead th:hover{background:var(--navy-mid)}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.07)}
.tbl td{padding:8px 10px;font-size:12px;vertical-align:middle;white-space:nowrap}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl td.wrap{white-space:normal;min-width:140px;max-width:220px}
.tbl .empty-row td{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}
.sort-ind{font-size:9px;color:var(--gold);margin-left:3px;font-weight:700}

.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spinner-ring{width:48px;height:48px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}

.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.15);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)} .toast-error{background:var(--danger)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

.loading-bar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10001}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <p id="spinnerMsg" style="font-size:14px;color:var(--text)">กำลังโหลดข้อมูล...</p>
  </div>
</div>

<header>
  <div class="logo-text">Rattana <span>DS-DC</span> Report</div>
  <button class="icon-btn" onclick="refreshData()" title="รีเฟรช">↻</button>
  <button class="icon-btn" onclick="toggleDark()" title="Dark mode">◑</button>
  <span style="font-size:11px;color:rgba(255,255,255,.5);margin-left:4px">v3.79</span>
</header>

<div class="content">

  <div class="stat-grid">
    <div class="stat-card">
      <div class="s-label">รายการทั้งหมด</div>
      <div class="s-value" id="statTotal">-</div>
      <div class="s-sub">จากชีต DS_DC</div>
    </div>
    <div class="stat-card info">
      <div class="s-label">ยอดรวม (TRD_G_AMT)</div>
      <div class="s-value" id="statAmt">-</div>
      <div class="s-sub">บาท</div>
    </div>
    <div class="stat-card success">
      <div class="s-label">ลูกค้า (AR)</div>
      <div class="s-value" id="statAR">-</div>
      <div class="s-sub">ราย</div>
    </div>
    <div class="stat-card danger">
      <div class="s-label">แสดงผล (กรอง)</div>
      <div class="s-value" id="statFiltered">0</div>
      <div class="s-sub">รายการ</div>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">🚢 SHIP_DATE:</span>
    <button class="chip active" id="qToday"     onclick="setQuickFilter('today')">📅 วันนี้</button>
    <button class="chip"        id="qWeek"      onclick="setQuickFilter('week')">🗓 สัปดาห์นี้</button>
    <button class="chip"        id="qMonth"     onclick="setQuickFilter('month')">📆 เดือนนี้</button>
    <button class="chip"        id="qLastMonth" onclick="setQuickFilter('lastmonth')">🗂 เดือนที่แล้ว</button>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>📋 รายการ DS-DC</h3>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="row-count" id="rowCount">0 รายการ</span>
        <div id="pagination" style="display:none;align-items:center;gap:6px">
          <button onclick="goPage(-1)" id="btnPrev" style="padding:4px 12px;border-radius:6px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer">◀</button>
          <span id="pageInfo" style="font-size:13px;font-weight:600;color:var(--muted)"></span>
          <button onclick="goPage(1)"  id="btnNext" style="padding:4px 12px;border-radius:6px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer">▶</button>
        </div>
      </div>
    </div>
    <div class="tbl-wrap">
      <table class="tbl" id="mainTbl">
        <thead>
          <tr>
            <th data-key="DI_DATE"     data-type="date">DI_DATE <span class="sort-ind"></span></th>
            <th data-key="DI_REF"      data-type="str">DI_REF <span class="sort-ind"></span></th>
            <th data-key="SLMN_NAME"   data-type="str">SLMN_NAME <span class="sort-ind"></span></th>
            <th data-key="WL_CODE"     data-type="str">WL_CODE <span class="sort-ind"></span></th>
            <th data-key="SKU_NAME"    data-type="str">SKU_NAME <span class="sort-ind"></span></th>
            <th data-key="TRD_UTQNAME" data-type="str">TRD_UTQNAME <span class="sort-ind"></span></th>
            <th data-key="TRD_QTY"    data-type="num">TRD_QTY <span class="sort-ind"></span></th>
            <th data-key="TRD_Q_FREE"  data-type="num">TRD_Q_FREE <span class="sort-ind"></span></th>
            <th data-key="TRD_U_PRC"   data-type="num">TRD_U_PRC <span class="sort-ind"></span></th>
            <th data-key="TRD_G_AMT"   data-type="num">TRD_G_AMT <span class="sort-ind"></span></th>
          </tr>
        </thead>
        <tbody id="tblBody">
          <tr class="empty-row"><td colspan="10">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SHEET_ID   = '1NO8sHyDxwHTRqgcLFCxq_g_Rr09lfe4gt_odwkIgiB0';
const SHEET_NAME = 'DS_DC';
const PDDT_ID    = '16mYDqAqqJma-_0vCIAajy6bcjdOZ7F6VagxkdkqAB2I';
const PDDT_NAME  = 'PDDT';
const CACHE_KEY  = 'rattana_dsdc_v379';
const CACHE_PDDT = 'rattana_pddt_v379';
const TTL        = 5 * 60 * 1000;

let allData = [], filteredData = [];
let pddtMap = {};
let activeQuickFilter = 'today';
let currentPage = 0;
const PAGE_SIZE = 2000;
const sortState = { key: 'DI_DATE', dir: 'desc' };

// ── UI ─────────────────────────────────────────────────────────
function showSpinner(msg = 'กำลังโหลดข้อมูล...') {
  document.getElementById('spinnerMsg').textContent = msg;
  document.getElementById('spinner').classList.add('show');
}
function hideSpinner() { document.getElementById('spinner').classList.remove('show'); }
function setLoadingBar(on) { document.getElementById('loadingBar').style.width = on ? '85%' : '0'; }

function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('rattana_dark', document.body.classList.contains('dark') ? '1' : '');
}
if (localStorage.getItem('rattana_dark')) document.body.classList.add('dark');

// ── Format ─────────────────────────────────────────────────────
function fmt(n) {
  const v = parseFloat(n);
  return isNaN(v) ? (n || '-') : v.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtDate(s) {
  if (!s) return '-';
  const d = new Date(s.replace(/\//g, '-'));
  if (isNaN(d)) return s;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`;
}

// ── CSV ────────────────────────────────────────────────────────
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1]==='"'){cell+='"';i++;}else inQ=false; }
      else cell += ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===',') { row.push(cell); cell=''; }
      else if (ch==='\r') {}
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r => r.some(c => clean(c))).map(r =>
    Object.fromEntries(headers.map((k, i) => [k, clean(r[i] || '')]))
  );
}

// ── Cache ──────────────────────────────────────────────────────
function getCached() {
  try {
    const item = JSON.parse(localStorage.getItem(CACHE_KEY));
    return item && Date.now() - item.ts < TTL ? item.data : null;
  } catch { return null; }
}
function setCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

// ── PDDT ───────────────────────────────────────────────────────
async function loadPddt() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_PDDT));
    if (c && Date.now() - c.ts < TTL) { pddtMap = c.data; return; }
  } catch {}
  const url = `https://docs.google.com/spreadsheets/d/${PDDT_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(PDDT_NAME)}`;
  const res = await fetch(url);
  if (!res.ok) return;
  pddtMap = {};
  parseCsv(await res.text()).forEach(r => {
    const key = (r['PRODUCT NAME'] || '').trim().toLowerCase();
    if (key) pddtMap[key] = { brand: r['CAT BRAND'] || '', size: r['CAT SIZE'] || '' };
  });
  try { localStorage.setItem(CACHE_PDDT, JSON.stringify({ ts: Date.now(), data: pddtMap })); } catch {}
}

function enrichWithPddt(rows) {
  rows.forEach(r => {
    const p = pddtMap[(r.SKU_NAME || '').trim().toLowerCase()] || {};
    r._brand = p.brand || '';
    r._size  = p.size  || '';
  });
}

// ── Date Range ─────────────────────────────────────────────────
function getShipDateRange(period) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const today = new Date(y, m, now.getDate());
  if (period === 'today')     return { from: today, to: today };
  if (period === 'week')      { const f = new Date(today); f.setDate(today.getDate()-6); return { from: f, to: today }; }
  if (period === 'month')     return { from: new Date(y, m, 1), to: new Date(y, m+1, 0) };
  if (period === 'lastmonth') return { from: new Date(y, m-1, 1), to: new Date(y, m, 0) };
  return null;
}

function setQuickFilter(period) {
  activeQuickFilter = period;
  ['qToday','qWeek','qMonth','qLastMonth'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById({today:'qToday',week:'qWeek',month:'qMonth',lastmonth:'qLastMonth'}[period]).classList.add('active');
  applyFilters();
}

// ── Filter & Sort ──────────────────────────────────────────────
function applyFilters() {
  currentPage = 0;
  const range = getShipDateRange(activeQuickFilter);
  filteredData = allData.filter(r => {
    if (!range) return true;
    const d = new Date((r.SHIP_DATE || '').replace(/\//g, '-'));
    if (isNaN(d)) return false;
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return day >= range.from && day <= range.to;
  });
  const type = document.querySelector(`#mainTbl th[data-key="${sortState.key}"]`)?.dataset.type || 'str';
  const m = sortState.dir === 'asc' ? 1 : -1;
  filteredData.sort((a, b) => {
    const va = a[sortState.key] || '', vb = b[sortState.key] || '';
    if (type === 'num')  return ((parseFloat(va)||0) - (parseFloat(vb)||0)) * m;
    if (type === 'date') return (new Date(va.replace(/\//g,'-')) - new Date(vb.replace(/\//g,'-'))) * m;
    return va.localeCompare(vb, 'th') * m;
  });
  renderTable();
  updatePagination();
  document.getElementById('statFiltered').textContent = filteredData.length.toLocaleString();
  document.getElementById('rowCount').textContent = `${filteredData.length.toLocaleString()} รายการ`;
}

function goPage(dir) {
  const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
  currentPage = Math.max(0, Math.min(currentPage + dir, totalPages - 1));
  renderTable();
  updatePagination();
  document.querySelector('.tbl-wrap').scrollTop = 0;
}

function updatePagination() {
  const totalPages = Math.ceil(filteredData.length / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.style.display = 'none'; return; }
  pg.style.display = 'flex';
  document.getElementById('pageInfo').textContent = `หน้า ${currentPage+1} / ${totalPages}`;
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('btnNext').disabled = currentPage >= totalPages - 1;
}

// ── Render ─────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tblBody');
  if (!filteredData.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="10">ไม่พบข้อมูลตามเงื่อนไขที่กรอง</td></tr>';
    return;
  }
  const pageData = filteredData.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  const seen = new Set();
  tbody.innerHTML = pageData.map(r => {
    const isFirst = !seen.has(r.DI_REF); seen.add(r.DI_REF);
    const amt  = parseFloat(r.TRD_G_AMT) || 0;
    const top  = isFirst ? 'border-top:2px solid var(--border)' : '';
    return `<tr style="${top}">
      <td>${fmtDate(r.DI_DATE)}</td>
      <td style="font-family:monospace;font-size:11px">${r.DI_REF || '-'}${r.AR_CODE||r.AR_NAME ? `<br><span style="font-family:monospace;font-size:10px;color:var(--muted)">${r.AR_CODE||''}</span>${r.AR_NAME ? ` <span style="font-size:11px;font-weight:600">${r.AR_NAME}</span>` : ''}` : ''}</td>
      <td class="wrap">${r.SLMN_NAME || '-'}</td>
      <td><span style="background:rgba(201,168,76,.15);padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600">${r.WL_CODE || '-'}</span></td>
      <td class="wrap">${r.SKU_NAME || '-'}${(r._brand||r._size) ? `<br><span style="font-size:10px;color:var(--muted)">${[r._brand,r._size].filter(Boolean).join(' · ')}</span>` : ''}</td>
      <td style="font-size:11px">${r.TRD_UTQNAME || '-'}</td>
      <td class="num">${fmt(r.TRD_QTY)}</td>
      <td class="num">${(parseFloat(r.TRD_Q_FREE)||0) ? fmt(r.TRD_Q_FREE) : '-'}</td>
      <td class="num">${fmt(r.TRD_U_PRC)}</td>
      <td class="num" style="color:${amt>0?'var(--success)':'var(--text)'};font-weight:700">${fmt(amt)}</td>
    </tr>`;
  }).join('');
}

function updateStats() {
  document.getElementById('statTotal').textContent = allData.length.toLocaleString();
  document.getElementById('statAmt').textContent   = allData.reduce((s,r) => s+(parseFloat(r.TRD_G_AMT)||0), 0).toLocaleString('th-TH',{maximumFractionDigits:0});
  document.getElementById('statAR').textContent    = new Set(allData.map(r=>r.AR_CODE).filter(Boolean)).size.toLocaleString();
}

function updateSortIndicators() {
  document.querySelectorAll('#mainTbl thead th').forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (ind) ind.textContent = th.dataset.key === sortState.key ? (sortState.dir==='asc'?'▲':'▼') : '';
  });
}

// ── Load ───────────────────────────────────────────────────────
async function loadData(showLoading = true) {
  if (showLoading) showSpinner('กำลังโหลด DS-DC...');
  setLoadingBar(true);
  try {
    await loadPddt();
    const cached = getCached();
    if (cached) {
      allData = cached;
      enrichWithPddt(allData);
      applyFilters();
      updateStats();
      if (showLoading) hideSpinner();
      setLoadingBar(false);
      fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`)
        .then(r => r.text()).then(text => {
          const fresh = parseCsv(text);
          if (fresh.length) { enrichWithPddt(fresh); allData = fresh; setCache(fresh); applyFilters(); updateStats(); showToast('อัพเดทข้อมูลล่าสุดแล้ว ✓','info'); }
        }).catch(() => {});
      return;
    }
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allData = parseCsv(await res.text());
    enrichWithPddt(allData);
    setCache(allData);
    applyFilters();
    updateStats();
    showToast(`โหลด ${allData.length.toLocaleString()} รายการ ✓`, 'success');
  } catch (e) {
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    document.getElementById('tblBody').innerHTML = `<tr class="empty-row"><td colspan="10">❌ ${e.message}</td></tr>`;
  } finally {
    hideSpinner();
    setLoadingBar(false);
  }
}

function refreshData() {
  [CACHE_KEY, CACHE_PDDT].forEach(k => localStorage.removeItem(k));
  allData = []; filteredData = []; pddtMap = {};
  loadData();
}

// ── Sort binding ───────────────────────────────────────────────
document.querySelectorAll('#mainTbl thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key, type = th.dataset.type || 'str';
    sortState.dir = sortState.key === key ? (sortState.dir==='asc'?'desc':'asc') : ((type==='date'||type==='num')?'desc':'asc');
    sortState.key = key;
    applyFilters();
    updateSortIndicators();
  });
});

updateSortIndicators();
loadData();
</script>
</body>
</html>
