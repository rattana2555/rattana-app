<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Rattana Sales v2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ── */
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;
  --gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;
  --muted:#6b7896;--row-alt:#fafbfd;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;font-size:14px;background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;padding-bottom:max(64px,env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;font-size:16px}

/* ── Header ── */
#appHeader{background:var(--navy);color:#fff;padding:12px 16px;
  position:sticky;top:0;z-index:100;display:flex;align-items:center;
  justify-content:space-between;border-bottom:3px solid var(--gold);
  padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1.5px;font-size:18px;color:#fff}
.logo-text span{color:var(--gold)}
#btnBack{display:none;background:transparent;color:var(--gold);border:none;
  cursor:pointer;padding:4px 8px 4px 0;font-size:20px;align-items:center}
#btnBack.show{display:flex}
#btnRefresh{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:var(--radius-sm);width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;font-size:16px}
#rowCount{font-size:11px;color:#8a98b8}

/* ── WH Filter ── */
#whFilter{background:var(--card-bg);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#whFilter::-webkit-scrollbar{display:none}
.wh-chip{padding:5px 14px;border-radius:20px;border:1.5px solid;font-size:12px;
  font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:all .15s;border-color:var(--border);background:var(--card-bg);color:var(--muted)}
.wh-chip.active{border-color:var(--navy);background:var(--navy);color:#fff}

/* ── Bottom Nav ── */
#bottomNav{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);
  border-top:1px solid var(--border);display:flex;height:56px;
  padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:transparent;border:none;cursor:pointer}
.nav-btn span{font-size:10px;font-weight:600;color:var(--muted)}
.nav-btn svg{stroke:var(--muted);fill:none}
.nav-btn.active svg{stroke:var(--navy)}
.nav-btn.active span{color:var(--navy);font-weight:800}

/* ── Cards ── */
.card{background:var(--card-bg);border-radius:var(--radius-md);
  border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}

/* ── KPI Big Card ── */
.kpi-hero{background:var(--navy);border-radius:var(--radius-lg);
  padding:20px;color:#fff;margin-bottom:12px}
.kpi-hero .label{font-size:12px;color:#8a98b8;margin-bottom:4px}
.kpi-hero .value{font-size:34px;font-weight:800;color:var(--gold);letter-spacing:-1px}
.kpi-hero .sub{font-size:13px;color:#8a98b8;margin-top:4px}

/* ── Cat Card ── */
.cat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:14px;
  box-shadow:var(--shadow-md);margin-bottom:10px;cursor:pointer;
  border-left:4px solid transparent}
.cat-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.cat-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.cat-hint{font-size:10px;color:var(--muted)}
.cat-val-main{font-size:20px;font-weight:800}
.cat-val-sub{font-size:10px;color:var(--muted)}

/* ── Metric Row ── */
.metric-row{display:flex;gap:8px;margin-bottom:10px}
.metric-box{flex:1;background:#f9fafb;border-radius:8px;padding:7px 8px;text-align:center}
body.dark .metric-box{background:#1a2f5e}
.metric-box .ml{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:2px}
.metric-box .mv{font-size:14px;font-weight:800}
.metric-box .mu{font-size:9px;color:var(--muted)}

/* ── WH Mini Bars ── */
.wh-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wh-bar-col{text-align:center}
.wh-bar-sticks{height:36px;display:flex;align-items:flex-end;gap:2px;justify-content:center;margin-bottom:2px}
.stick{width:9px;border-radius:2px 2px 0 0}
.wh-bar-label{font-size:9px;color:var(--muted);font-weight:700}
.wh-bar-val{font-size:9px;font-weight:700}

/* ── 3-Bar Comparison ── */
.bar3{display:flex;flex-direction:column;gap:5px}
.bar3-row{display:flex;align-items:center;gap:6px}
.bar3-lbl{font-size:9px;color:var(--muted);width:38px;flex-shrink:0}
.bar3-track{flex:1;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden}
body.dark .bar3-track{background:#243b73}
.bar3-fill{height:100%;border-radius:3px;transition:width .3s}
.bar3-num{font-size:10px;font-weight:800;width:44px;text-align:right;flex-shrink:0}

/* ── Product Card ── */
.prod-card{background:var(--card-bg);border-radius:var(--radius-md);
  padding:12px 14px;box-shadow:var(--shadow-md);margin-bottom:8px}
.prod-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.prod-name{font-size:12px;font-weight:600;color:var(--text);flex:1;
  padding-right:8px;line-height:1.5}
.prod-right{text-align:right;flex-shrink:0}
.prod-val{font-size:13px;font-weight:800}
.prod-sub{font-size:10px;color:var(--muted)}

/* ── WH Grid (detail) ── */
.wh-grid{display:flex;gap:6px;margin-bottom:8px}
.wh-cell{flex:1;background:#f9fafb;border-radius:6px;padding:5px 0;text-align:center}
body.dark .wh-cell{background:#1a2f5e}
.wh-cell .wl{font-size:9px;color:var(--muted)}
.wh-cell .wv{font-size:11px;font-weight:700}

/* ── Cat Filter Chips ── */
.cat-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--card-bg);color:var(--muted);font-size:11px;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.cat-chip.active{border-color:currentColor;color:#fff}

/* ── Search Bar ── */
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap input{width:100%;height:40px;padding:0 14px 0 36px;
  border-radius:10px;border:1.5px solid var(--border);background:var(--card-bg);
  color:var(--text);font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--muted)}

/* ── Daily Mini Chart ── */
.daily-chart{margin-top:14px;height:64px;display:flex;align-items:flex-end;gap:3px}
.day-bar{flex:1;border-radius:3px 3px 0 0;min-width:4px;
  background:rgba(201,168,76,.7);transition:height .3s}
.day-bar:hover{background:var(--gold)}

/* ── Loading ── */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.7);
  align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(4px)}
#spinner.show{display:flex}
.spin-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 44px;
  text-align:center;border-top:4px solid var(--gold);min-width:240px}
.spin-ring{width:52px;height:52px;border:5px solid #dde3f0;border-top-color:var(--gold);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#loadingBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);
  width:0;transition:width .4s;z-index:10000}

/* ── Toast ── */
.toast{position:fixed;bottom:max(72px,env(safe-area-inset-bottom));right:16px;
  padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;
  animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);
  max-width:90vw;font-size:13px;font-family:inherit}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

.tab-content{display:none;padding:12px}
.tab-content.active{display:block;animation:slideUp .2s ease}

/* ── Grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Misc ── */
.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}
.info-row{font-size:11px;color:var(--muted);margin-bottom:8px}
.legend{display:flex;gap:14px;padding:8px 4px;flex-wrap:wrap}
.legend-dot{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.legend-dot::before{content:'';width:10px;height:10px;border-radius:2px;
  background:attr(data-color);flex-shrink:0}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const SHEET_ID = '1jim4FOu4htxBvvYbdrsKk0I0PZEiZO7RF0SbNDA25Qg';
const CATS = ['Bplus FMCG','Bplus Thaibev Al','Bplus บุหรี่','F&N'];
const WHS  = ['W1','W2','W3','W4'];
const CAT_META = {
  'Bplus FMCG':       {emoji:'🛍️', color:'#10B981', bg:'#D1FAE5', label:'FMCG'},
  'Bplus Thaibev Al': {emoji:'🍷', color:'#8B5CF6', bg:'#EDE9FE', label:'Thaibev'},
  'Bplus บุหรี่':      {emoji:'🚬', color:'#F97316', bg:'#FFEDD5', label:'บุหรี่'},
  'F&N':              {emoji:'🥛', color:'#0EA5E9', bg:'#E0F2FE', label:'F&N'},
};

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let salesRows   = [];   // [{date,product,cat,wh,exvat,cs}]
let stockRows   = [];   // [{name,cat,W1,W2,W3,W4}]
let purRows     = [];   // [{name,wh,cat,cs}]
let selectedWH  = 'ALL';
let selectedCat = null;
let currentTab  = 'Home';
let filterCat   = null;

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
const fmt  = n => n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('th');
const fmtB = n => '฿'+fmt(n);
const normS = s => String(s||'').trim().toLowerCase().replace(/[\s_\-]/g,'');

function showSpinner(msg='กำลังโหลด...', sub='ดึงข้อมูลจาก Google Sheets') {
  document.getElementById('spinMsg').textContent = msg;
  document.getElementById('spinSub').textContent = sub;
  document.getElementById('spinner').classList.add('show');
  document.getElementById('loadingBar').style.width = '70%';
}
function hideSpinner() {
  document.getElementById('spinner').classList.remove('show');
  document.getElementById('loadingBar').style.width = '100%';
  setTimeout(()=>document.getElementById('loadingBar').style.width='0', 400);
}
function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ═══════════════════════════════════════════════
   CSV FETCH + PARSE (RFC-4180)
═══════════════════════════════════════════════ */
async function fetchCSV(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${sheetName}`);
  return parseCsv(await res.text());
}

function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row=[], cell='', inQ=false;
  for (let i=0; i<text.length; i++) {
    const ch = text[i];
    if (inQ) { if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else inQ=false;} else cell+=ch; }
    else {
      if(ch==='"') inQ=true;
      else if(ch===','){row.push(cell);cell='';}
      else if(ch==='\r'){/* skip */}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=ch;
    }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const clean = s=>String(s||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').replace(/\u00A0/g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>Object.fromEntries(headers.map((k,i)=>[k,clean(r[i])])));
}

/* ═══════════════════════════════════════════════
   COLUMN FINDER
═══════════════════════════════════════════════ */
function findKey(obj, ...candidates) {
  const keys = Object.keys(obj);
  for (const cand of candidates) {
    const cn = normS(cand);
    const k = keys.find(k => k === cand || normS(k) === cn);
    if (k) return k;
  }
  return null;
}

/* ═══════════════════════════════════════════════
   LOAD ALL DATA
═══════════════════════════════════════════════ */
async function loadAll() {
  showSpinner('กำลังโหลดข้อมูล...','BP 2026 · PDDT · Sale_IN');
  try {
    const [bp, pddt, saleIn] = await Promise.all([
      fetchCSV('BP 2026'),
      fetchCSV('PDDT'),
      fetchCSV('Sale_IN'),
    ]);
    parseBP2026(bp);
    parsePDDT(pddt);
    parseSaleIN(saleIn);
    document.getElementById('rowCount').textContent = salesRows.length.toLocaleString() + ' rows';
    renderAll();
    showToast('โหลดข้อมูลสำเร็จ ✓', 'success');
  } catch(e) {
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    console.error(e);
  } finally {
    hideSpinner();
  }
}

/* ═══════════════════════════════════════════════
   PARSE BP 2026
═══════════════════════════════════════════════ */
function parseBP2026(rows) {
  if (!rows.length) { salesRows=[]; return; }
  const sample = rows[0];
  const kDate  = findKey(sample,'Doc_Date','Date','วันที่','doc_date');
  const kProd  = findKey(sample,'Product_Name','ชื่อสินค้า','สินค้า','product_name');
  const kCat   = findKey(sample,'Cat_BU','Cat BU','CatBU','Category');
  const kWH    = findKey(sample,'WH','คลัง','Warehouse');
  const kExvat = findKey(sample,'Exvat','ยอดขาย','Amount','exvat');
  const kCS    = findKey(sample,'Sales_CS','Sales CS','ยอดลัง','salescs','CS');

  salesRows = rows.flatMap(r => {
    const cat  = (r[kCat]  || '').trim();
    const prod = (r[kProd] || '').trim();
    const wh   = (r[kWH]   || '').trim();
    if (!prod || !CATS.includes(cat)) return [];
    const exvat = parseFloat(r[kExvat]) || 0;
    const cs    = parseFloat(r[kCS])    || 0;
    return [{
      date:    kDate ? String(r[kDate]||'').slice(0,10) : '',
      product: prod, cat, wh, exvat, cs
    }];
  });
}

/* ═══════════════════════════════════════════════
   PARSE PDDT
═══════════════════════════════════════════════ */
function parsePDDT(rows) {
  if (!rows.length) { stockRows=[]; return; }
  const sample = rows[0];
  const kName = findKey(sample,'Product_Name','ชื่อสินค้า','สินค้า','Name','product_name');
  const kCat  = findKey(sample,'Cat 1','Cat_BU','Cat BU','BU หลัก','CatBU','Category');
  const kW1   = findKey(sample,'Stock W1','StockW1','W1');
  const kW2   = findKey(sample,'Stock W2','StockW2','W2');
  const kW3   = findKey(sample,'Stock W3','StockW3','W3');
  const kW4   = findKey(sample,'Stock W4','StockW4','W4');

  stockRows = rows.flatMap(r => {
    const name = (r[kName]||'').trim();
    const cat  = (r[kCat] ||'').trim();
    if (!name || !CATS.includes(cat)) return [];
    return [{
      name, cat,
      W1: parseFloat(r[kW1])||0,
      W2: parseFloat(r[kW2])||0,
      W3: parseFloat(r[kW3])||0,
      W4: parseFloat(r[kW4])||0,
    }];
  });
}

/* ═══════════════════════════════════════════════
   PARSE SALE_IN
═══════════════════════════════════════════════ */
function parseSaleIN(rows) {
  if (!rows.length) { purRows=[]; return; }
  const sample = rows[0];
  const kName = findKey(sample,'Product_Name','ชื่อสินค้า','สินค้า');
  const kWH   = findKey(sample,'WH','คลัง');
  const kCat  = findKey(sample,'Cat BU','Cat_BU','CatBU');
  const kCS   = findKey(sample,'รวมรับCS','รวมรับ CS','SUM รวมรับCS','Total CS','รับCS');

  purRows = rows.flatMap(r => {
    const wh  = (r[kWH]  ||'').trim();
    const cat = (r[kCat] ||'').trim();
    const cs  = parseFloat(r[kCS]) || 0;
    const nm  = kName ? (r[kName]||'').trim() : '';
    if (!CATS.includes(cat) || cs <= 0) return [];
    return [{ name:nm, wh, cat, cs }];
  });
}

/* ═══════════════════════════════════════════════
   DERIVED DATA
═══════════════════════════════════════════════ */
function getSalesSummary() {
  const r = {};
  for (const cat of CATS) { r[cat]={ALL:{exvat:0,cs:0}}; for(const w of WHS) r[cat][w]={exvat:0,cs:0}; }
  for (const row of salesRows) {
    if (!r[row.cat]) continue;
    r[row.cat].ALL.exvat += row.exvat;
    r[row.cat].ALL.cs    += row.cs;
    if (WHS.includes(row.wh)) { r[row.cat][row.wh].exvat+=row.exvat; r[row.cat][row.wh].cs+=row.cs; }
  }
  return r;
}
function getStockSummary() {
  const r = {};
  for (const cat of CATS) { r[cat]={total:0}; for(const w of WHS) r[cat][w]=0; }
  for (const row of stockRows) {
    if (!r[row.cat]) continue;
    for (const w of WHS) { r[row.cat][w]+=row[w]||0; r[row.cat].total+=row[w]||0; }
  }
  return r;
}
function getPurSummary() {
  const r = {};
  for (const cat of CATS) { r[cat]={ALL:0}; for(const w of WHS) r[cat][w]=0; }
  for (const row of purRows) {
    if (!r[row.cat]) continue;
    r[row.cat].ALL += row.cs;
    if (WHS.includes(row.wh)) r[row.cat][row.wh] += row.cs;
  }
  return r;
}

function getDailyChart() {
  const map = {};
  for (const row of salesRows) {
    if (selectedWH !== 'ALL' && row.wh !== selectedWH) continue;
    if (!row.date) continue;
    map[row.date] = (map[row.date]||0) + row.exvat;
  }
  return Object.entries(map).sort(([a],[b])=>a.localeCompare(b));
}

    </div>`;
  }).join('');

  // WH breakdown chart
  const wbDiv = document.getElementById('homeWHBars');
  wbDiv.innerHTML = CATS.map(cat => {
    const meta = CAT_META[cat];
    const vals = WHS.map(w => ss[cat][w]?.exvat || 0);

    return `<div style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${cat}</div>
      <div style="display:flex;gap:4px">
        ${WHS.map((w,i) => {

        }).join('')}

/* ── SALES ─────────────────────────────────── */
function renderSalesCatChips() {
  const div = document.getElementById('salesCatChips');
  const chips = [
    `<button class="cat-chip${filterCat===null?' active':''}" onclick="setSalesCat(null)" style="${filterCat===null?'background:var(--navy);border-color:var(--navy);color:#fff':''}">ทั้งหมด</button>`

    return `<button class="cat-chip${active?' active':''}" onclick="setSalesCat('${cat}')"
      style="${active?`background:${meta.color};border-color:${meta.color};color:#fff`:''}">${meta.label}</button>`;
  }));
  div.innerHTML = chips.join('');
}

function setSalesCat(cat) { filterCat=cat; renderSalesCatChips(); renderSales(); }

function renderSales() {
  renderSalesCatChips();
  const q   = (document.getElementById('salesSearch').value||'').toLowerCase();
  const wk  = selectedWH;
  const map = {};
  for (const row of salesRows) {
    if (filterCat && row.cat !== filterCat) continue;
    if (wk !== 'ALL' && row.wh !== wk) continue;
    if (!map[row.product]) map[row.product] = {exvat:0,cs:0,cat:row.cat};
    map[row.product].exvat += row.exvat;
    map[row.product].cs    += row.cs;
  }
  let products = Object.entries(map).map(([name,v])=>({name,...v}))
    .sort((a,b) => b.exvat - a.exvat);
  if (q) products = products.filter(p => p.name.toLowerCase().includes(q));
  const shown = products.slice(0, 100);
  document.getElementById('salesCount').textContent =
    `แสดง ${shown.length} / ${products.length} รายการ`;
  const maxE = shown[0]?.exvat || 1;
  const list = document.getElementById('salesList');
  if (!shown.length) { list.innerHTML='<div class="empty">ไม่พบข้อมูล</div>'; return; }
  list.innerHTML = shown.map(p => {
    const meta = CAT_META[p.cat] || Object.values(CAT_META)[0];
    const pct  = (p.exvat / maxE) * 100;
    return `<div class="prod-card">
      <div class="prod-head">
        <div class="prod-name">${p.name}</div>
        <div class="prod-right">
          <div class="prod-val" style="color:${meta.color}">${fmtB(p.exvat)}</div>
          <div class="prod-sub">${fmt(p.cs)} ลัง</div>
        </div>
      </div>
      <div style="height:4px;background:#f3f4f6;border-radius:2px">
        <div style="height:100%;width:${pct}%;background:${meta.color};border-radius:2px"></div>
      </div>
      <div style="margin-top:4px;font-size:10px;color:var(--muted)">${meta.emoji} ${p.cat}</div>
    </div>`;
  }).join('') + (products.length > 100 ?
    '<div class="empty" style="padding:12px;font-size:12px">* แสดง 100 รายการแรก — ใช้ค้นหา</div>' : '');
}

function renderStockDetail() {
  if (!selectedCat) return;
  const meta = CAT_META[selectedCat];
  const wk   = selectedWH;
  const q    = (document.getElementById('stockSearch').value||'').toLowerCase();

  // Build per-product data
  const stockMap = {}, salesMap = {}, purMap = {};
  for (const row of stockRows) {
    if (row.cat !== selectedCat) continue;
    if (!stockMap[row.name]) stockMap[row.name]={W1:0,W2:0,W3:0,W4:0};
    for (const w of WHS) stockMap[row.name][w]+=row[w]||0;
  }
  for (const row of salesRows) {
    if (row.cat !== selectedCat) continue;
    if (wk !== 'ALL' && row.wh !== wk) continue;
    if (!salesMap[row.product]) salesMap[row.product]={exvat:0,cs:0};
    salesMap[row.product].exvat += row.exvat;
    salesMap[row.product].cs    += row.cs;
  }
  for (const row of purRows) {
    if (row.cat !== selectedCat) continue;
    if (wk !== 'ALL' && row.wh !== wk) continue;
    purMap[row.name] = (purMap[row.name]||0) + row.cs;
  }

  const allNames = [...new Set([...Object.keys(stockMap),...Object.keys(salesMap),...Object.keys(purMap)])];
  let products = allNames.map(name => {
    const sw = stockMap[name]||{W1:0,W2:0,W3:0,W4:0};
    const stockTotal = wk==='ALL' ? WHS.reduce((s,w)=>s+(sw[w]||0),0) : (sw[wk]||0);
    return {
      name, stockW:sw, stockTotal,
      salesCS:   salesMap[name]?.cs    || 0,
      salesBaht: salesMap[name]?.exvat || 0,
      purchaseCS: purMap[name] || 0,
    };
  }).sort((a,b) => b.stockTotal - a.stockTotal);

  if (q) products = products.filter(p => p.name.toLowerCase().includes(q));
  const shown = products.slice(0, 150);

  document.getElementById('stockDetailCount').textContent =
    `แสดง ${shown.length} / ${products.length} สินค้า`;

  const mxS = Math.max(...shown.map(p=>p.stockTotal), 1);
  const mxSL= Math.max(...shown.map(p=>p.salesCS),    1);
  const mxP = Math.max(...shown.map(p=>p.purchaseCS), 1);

  const list = document.getElementById('stockProdList');
  if (!shown.length) { list.innerHTML='<div class="empty">ไม่พบสินค้า</div>'; return; }

  list.innerHTML = shown.map(p => {
    const whGrid = wk==='ALL' ? `<div class="wh-grid">
      ${WHS.map(w=>{
        const v=p.stockW[w]||0;
        return `<div class="wh-cell">
          <div class="wl">${w}</div>
          <div class="wv" style="color:${v>0?meta.color:'#d1d5db'}">${v>9999?(v/1000).toFixed(1)+'K':v||'—'}</div>
        </div>`;
      }).join('')}
    </div>` : '';
    const bars3 = [
      {lbl:'สต๊อก',   val:p.stockTotal, mx:mxS, color:meta.color},
      {lbl:'ขาย',     val:p.salesCS,    mx:mxSL, color:'#2ecc71'},
      {lbl:'ซื้อเข้า', val:p.purchaseCS, mx:mxP,  color:'#3498db'},
    ].map(({lbl,val,mx,color})=>{
      const pct = mx>0 ? Math.min((val/mx)*100,100) : 0;
      return `<div class="bar3-row">
        <div class="bar3-lbl">${lbl}</div>
        <div class="bar3-track"><div class="bar3-fill"
          style="width:${Math.max(pct,val>0?2:0)}%;background:${color}"></div></div>
        <div class="bar3-num" style="color:${color}">${val>0?(val>9999?(val/1000).toFixed(1)+'K':val.toLocaleString('th')):'—'}</div>
      </div>`;
    }).join('');
    return `<div class="prod-card">
      <div class="prod-head">
        <div class="prod-name">${p.name}</div>
        <div class="prod-right">
          <div class="prod-val" style="color:${meta.color}">${p.stockTotal.toLocaleString('th')} ลัง</div>
          ${p.salesBaht>0?`<div class="prod-sub">${fmtB(p.salesBaht)}</div>`:''}
        </div>
      </div>
      ${whGrid}
      <div class="bar3">${bars3}</div>
    </div>`;
  }).join('') + (products.length>150?
    '<div class="empty" style="padding:10px;font-size:12px">* แสดง 150 รายการแรก — ใช้ค้นหา</div>':'');
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab'+tab).classList.add('active');
  document.getElementById('nav'+tab).classList.add('active');
  document.getElementById('btnBack').classList.remove('show');
  if (tab === 'Stock') {
    document.getElementById('stockSummaryView').style.display = 'block';
    document.getElementById('stockDetailView').style.display  = 'none';
    selectedCat = null;
    renderStock();
  }
  if (tab === 'Home')  renderHome();
  if (tab === 'Sales') renderSales();
}

function goBack() {
  document.getElementById('stockSummaryView').style.display = 'block';
  document.getElementById('stockDetailView').style.display  = 'none';
  document.getElementById('btnBack').classList.remove('show');
  selectedCat = null;
  renderStock();
}

function setWH(el, wh) {
  selectedWH = wh;
  document.querySelectorAll('.wh-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderAll();
  // Re-render stock detail if open
  if (selectedCat) {
    openStockDetail(selectedCat);
  }
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
window.onload = () => { loadAll(); };
</script>
