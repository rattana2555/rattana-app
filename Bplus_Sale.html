// Convert Date to YYYY-MM-DD (local)
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// Compute workdays in a given month
// % Time Use = (วันทำงานทั้งหมด − วันที่เหลือ) ÷ วันทำงานทั้งหมด
// "วันที่เหลือ" = วันทำงานนับจากวันนี้ (รวมวันนี้) ถึงสิ้นเดือน
// "วันที่ใช้ไปแล้ว" = วันทำงานก่อนวันนี้ (ไม่รวมวันนี้)
function computeWorkdays(year, month, workdaysSet, holidaySet, asOfDate) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let total = 0;
  let remaining = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const dow = date.getDay();
    const key = dateKey(date);
    const isWork = workdaysSet.has(dow) && !holidaySet.has(key);
    if (isWork) {
      total++;
      // วันที่เหลือ = วันนี้ + อนาคต
      if (date >= asOfDate) remaining++;
    }
  }
  const passed = total - remaining;
  return { total, passed, remaining };
}

// Find the last working day BEFORE the given date (skipping non-workdays/holidays)
// e.g. if today is Tuesday → returns Monday; if today is Monday → returns Saturday (skips Sunday)
function getLastWorkingDay(beforeDate, workdaysSet, holidaySet) {
  const d = new Date(beforeDate);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - 1);
  for (let i = 0; i < 30; i++) {
    const dow = d.getDay();
    const key = dateKey(d);
    if (workdaysSet.has(dow) && !holidaySet.has(key)) {
      return new Date(d);
    }
    d.setDate(d.getDate() - 1);
  }
  return null;
}

// Format date Thai short — "4 พ.ค. 2026"
function fmtShortDate(date) {
  if (!date) return "";
  const day = date.getDate();
  const month = THAI_MONTHS[date.getMonth()].slice(0, 3);
  return `${day} ${month}. ${date.getFullYear()}`;
}

const SHEET_ID = "1jim4FOu4htxBvvYbdrsKk0I0PZEiZO7RF0SbNDA25Qg";

async function fetchGViz(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  const text = await res.text();
  const jsonStr = text.replace(/^[^{]*/, "").replace(/\);?\s*$/, "");
  return JSON.parse(jsonStr);
}

// Parse BP 2026: expects rows with [salespersonName, monthlyTarget]
// Returns { [name]: amount }
async function fetchBP2026() {
  const data = await fetchGViz("BP 2026");
  const rows = data?.table?.rows || [];
  const salesSet = new Set(SALESPEOPLE);
  const result = {};
  for (const row of rows) {
    const cells = row.c || [];
    let name = null;
    let amount = null;
    for (const cell of cells) {
      const v = cell?.v;
      if (typeof v === "string" && salesSet.has(v.trim()) && !name) name = v.trim();
      else if (typeof v === "number" && v > 0 && !amount) amount = v;
    }
    if (name && amount) result[name] = amount;
  }
  return result;
}

// Parse Sale_IN: product name from col A (index 0), CS qty = sum of cols R:U (index 17–20)
// Returns { [productName]: totalCS }
async function fetchSaleInCS() {
  const data = await fetchGViz("Sale_IN");
  const cols = data?.table?.cols || [];
  const rows = data?.table?.rows || [];

  const norm = (s) => (s || "").toLowerCase().replace(/[\s_\-]/g, "");

  // Step 1: Find "รวมรับCS" SUM column by header
  let sumColIdx = -1;
  cols.forEach((col, i) => {
    const lbl = (col.label || col.id || "").trim();
    const lblN = norm(lbl);
    if (
      lbl.includes("รวมรับCS") || lbl.includes("รวมรับ CS") ||
      lbl.includes("รวมรับcs") || lbl.includes("รวมรับ cs") ||
      lblN.includes("รวมรับcs") || lblN.includes("รวมรับ") ||
      (lblN.includes("รวม") && lblN.includes("cs")) ||
      lblN === "sumcs" || lblN === "totalcs" ||
      (lbl.toLowerCase().includes("sum") && lbl.toLowerCase().includes("cs"))
    ) sumColIdx = i;
  });

  // Step 2: Find product name column (col A or first string col)
  let nameIdx = 0; // default col A
  cols.forEach((col, i) => {
    const lbl = norm(col.label || col.id || "");
    if (i < nameIdx && (lbl.includes("สินค้า") || lbl.includes("product") || lbl.includes("name"))) nameIdx = i;
  });

  const result = {};
  for (const row of rows) {
    const cells = row.c || [];
    const nameVal = cells[nameIdx]?.v;
    if (typeof nameVal !== "string" || !nameVal.trim()) continue;

    let cs = 0;
    if (sumColIdx >= 0) {
      // Use the specific รวมรับCS SUM column
      const v = cells[sumColIdx]?.v;
      if (typeof v === "number") cs = Math.abs(v); // use abs in case negative
    } else {
      // Fallback: sum columns R–U (index 17–20)
      for (let i = 17; i <= 20; i++) {
        const v = cells[i]?.v;
        if (typeof v === "number" && v > 0) cs += v;
      }
    }

    if (cs > 0) {
      const key = nameVal.trim();
      result[key] = (result[key] || 0) + cs;
    }
  }
  return result;
}

// Parse BP 2026: columns Product_Name + Sales_CS by header label (flexible match)
// Returns { [productName]: salesInCS }
async function fetchSalesCS() {
  const data = await fetchGViz("BP 2026");
  const cols = data?.table?.cols || [];
  const rows = data?.table?.rows || [];

  const norm = (s) => (s || "").toLowerCase().replace(/[\s_\-]/g, "");

  let nameIdx = -1;
  let csIdx = -1;

  // Pass 1: strict match
  cols.forEach((col, i) => {
    const lbl = (col.label || col.id || "").trim();
    const lblN = norm(lbl);
    // Product name
    if (lblN === "productname" || lblN === "product" || lbl === "ชื่อสินค้า" || lbl === "Product_Name") nameIdx = i;
    // Sales CS — specifically "Sales_CS" or variants
    if (
      lbl === "Sales_CS" || lbl === "sales_cs" || lbl === "salescs" ||
      lbl === "Sales CS" || lbl === "SALES_CS" ||
      lblN === "salescs"
    ) csIdx = i;
  });

  // Pass 2: wider fallback
  cols.forEach((col, i) => {
    const lbl = (col.label || col.id || "").trim();
    const lblN = norm(lbl);
    if (nameIdx === -1 && (
      lblN.includes("product") || lblN.includes("name") ||
      lbl.includes("สินค้า") || lbl.includes("ชื่อ")
    )) nameIdx = i;
    if (csIdx === -1 && (
      lblN.includes("salescs") || lblN.includes("salecs") ||
      (lblN.includes("sales") && lblN.includes("cs")) ||
      (lblN.includes("ยอดขาย") && lblN.includes("cs")) ||
      (lblN.includes("ยอด") && lblN.includes("cs")) ||
      lblN.includes("ยอดcs")
    )) csIdx = i;
  });

  // Pass 3: scan for any column with "cs" or "ลัง" not already taken
  if (csIdx === -1) {
    cols.forEach((col, i) => {
      if (csIdx !== -1 || i === nameIdx) return;
      const lbl = norm(col.label || col.id || "");
      if (lbl.includes("cs") || lbl.includes("ลัง") || lbl.includes("case")) csIdx = i;
    });
  }

  const result = {};
  for (const row of rows) {
    const cells = row.c || [];
    const nameVal = nameIdx >= 0 ? cells[nameIdx]?.v : cells[0]?.v;
    const csVal = csIdx >= 0 ? cells[csIdx]?.v : null;
    if (
      typeof nameVal === "string" && nameVal.trim() &&
      typeof csVal === "number" && csVal > 0
    ) {
      const key = nameVal.trim();
      result[key] = (result[key] || 0) + csVal;
    }
  }
  return result;
}

// Parse User sheet: find E-mail and Sale NO ROO columns
// Returns { [email]: { name, email } }
async function fetchUserSheet() {
  const data = await fetchGViz("User");
  const cols = data?.table?.cols || [];
  const rows = data?.table?.rows || [];

  if (rows.length === 0) return {};

  // Step 1: Try to find columns by header label
  let emailIdx = -1;
  let nameIdx = -1;
  cols.forEach((col, i) => {
    const lbl = (col.label || col.id || "").toLowerCase().trim();
    if (
      lbl.includes("e-mail") || lbl.includes("email") ||
      lbl.includes("mail") || lbl === "e"
    ) emailIdx = i;
    if (
      lbl.includes("sale no roo") || lbl.includes("salenoroo") ||
      lbl.includes("no roo") || lbl.includes("noroo") ||
      lbl.includes("sale no") || lbl.includes("ชื่อ") ||
      lbl.includes("name") || lbl.includes("นาม")
    ) nameIdx = i;
  });

  // Step 2: Fallback — scan first data rows to detect email column by content
  if (emailIdx === -1) {
    const sampleRows = rows.slice(0, Math.min(5, rows.length));
    const numCols = Math.max(cols.length, sampleRows[0]?.c?.length || 0, 20);
    for (let i = 0; i < numCols; i++) {
      const hasEmail = sampleRows.some((row) => {
        const v = row.c?.[i]?.v;
        return typeof v === "string" && v.includes("@") && v.includes(".");
      });
      if (hasEmail) { emailIdx = i; break; }
    }
  }

  // Step 3: If still no nameIdx, take first string column that isn't email col
  if (nameIdx === -1 && emailIdx !== -1) {
    const sampleRows = rows.slice(0, Math.min(5, rows.length));
    const numCols = Math.max(cols.length, sampleRows[0]?.c?.length || 0, 20);
    for (let i = 0; i < numCols; i++) {
      if (i === emailIdx) continue;
      const hasString = sampleRows.some((row) => {
        const v = row.c?.[i]?.v;
        return typeof v === "string" && v.trim().length > 1 && !v.includes("@");
      });
      if (hasString) { nameIdx = i; break; }
    }
  }

  if (emailIdx === -1) return {}; // cannot detect email column

  const result = {};
  for (const row of rows) {
    const cells = row.c || [];
    const email = cells[emailIdx]?.v;
    const name = nameIdx >= 0 ? cells[nameIdx]?.v : null;
    if (typeof email === "string" && email.trim().includes("@")) {
      const key = email.trim().toLowerCase();
      result[key] = {
        email: email.trim(),
        name: typeof name === "string" && name.trim() ? name.trim() : email.trim(),
      };
    }
  }
  return result;
}

function LoginScreen({ userSheet, loading, sheetError, onLogin }) {

    setError("");
    const trimmed = email.trim();
    if (!trimmed) { setError("กรุณากรอก E-mail"); return; }
    if (!trimmed.includes("@")) { setError("รูปแบบ E-mail ไม่ถูกต้อง"); return; }

    // If sheet failed to load, allow bypass with any valid email
    if (sheetError || totalUsers === 0) {
      const user = {
        email: trimmed,
        name: trimmed.split("@")[0],
      };
      setSubmitting(true);
      setTimeout(() => { onLogin(user); setSubmitting(false); }, 400);
      return;
    }

    const key = trimmed.toLowerCase();
    const user = userSheet[key];
    if (!user) {
      setError(`ไม่พบ E-mail นี้ในระบบ (${totalUsers} บัญชีในระบบ) กรุณาตรวจสอบอีกครั้ง`);

            )}

            {!loading && !sheetError && totalUsers > 0 && (
              <div className="text-[11px] text-stone-400 text-center">
                พบบัญชีในระบบ {totalUsers} บัญชี
              </div>
            )}

            <button
              onClick={handleLogin}
              disabled={loading || submitting}
              className="w-full rounded-2xl py-4 text-sm font-bold text-white shadow-lg transition-all active:scale-95 disabled:opacity-60"
              style={{ background: "linear-gradient(135deg, #10B981 0%, #059669 100%)" }}
            >
              {submitting ? "กำลังเข้าสู่ระบบ..." : loading ? "กำลังโหลด..." : "เข้าสู่ระบบ"}
            </button>
          </div>

          <div className="mt-auto pt-8 text-center text-[11px] text-stone-400">
            Sales Dashboard · Bplus
          </div>
        </div>
      </div>
    </div>
  );
}


function HomeScreen({
  period, setPeriod, selectedWH, setSelectedWH, activeWHs,
  timeUse, daysPassed, daysTotal, daysRemaining, monthlyTarget,
  bpLoading, bpError,
  periodYear, periodMonth,
  yesterdayKey, dayBeforeKey, yesterdayDate,
  onSettings, onCatTap,
  currentUser,
}) {
  const heroValues = useMemo(() => {
    let total = 0;
    let prev = 0;
    for (const wh of activeWHs) {
      for (const cat of DATA.cats) {
        if (period === "yesterday") {
          total += DATA.daily[wh][cat]?.[yesterdayKey] || 0;
          prev += DATA.daily[wh][cat]?.[dayBeforeKey] || 0;
        } else {
          total += DATA.summary[wh][cat]?.sales || 0;
        }
      }
    }
    if (period !== "yesterday") prev = 0;
    const delta = prev > 0 ? (total - prev) / prev : 0;
    return {
      total, delta,
      date: period === "yesterday" ? fmtShortDate(yesterdayDate) : "2 – 4 พ.ค. 2026",
    };
  }, [period, activeWHs, yesterdayKey, dayBeforeKey, yesterdayDate]);

  const totalCumulative = useMemo(() => {
    let total = 0;
    for (const wh of activeWHs) {
      for (const cat of DATA.cats) total += DATA.summary[wh][cat]?.sales || 0;
    }
    return total;
  }, [activeWHs]);

  const projectedMonthly = timeUse > 0 ? totalCumulative / timeUse : 0;
  const achievement = monthlyTarget > 0 ? totalCumulative / monthlyTarget : null;
  const gap = achievement !== null ? achievement - timeUse : null;
  const ahead = gap !== null && gap >= 0;

  const catValues = useMemo(() => {
    return DATA.cats.map((cat) => {
      const sales = period === "yesterday"
        ? activeWHs.reduce((s, wh) => s + (DATA.daily[wh][cat]?.[yesterdayKey] || 0), 0)
        : activeWHs.reduce((s, wh) => s + (DATA.summary[wh][cat]?.sales || 0), 0);
      const prev = activeWHs.reduce((s, wh) => s + (DATA.daily[wh][cat]?.[dayBeforeKey] || 0), 0);
      const delta = prev > 0 ? (sales - prev) / prev : 0;
      const tx = activeWHs.reduce((s, wh) => s + (DATA.summary[wh][cat]?.transactions || 0), 0);
      return { cat, sales, delta, transactions: tx };
    });
  }, [period, activeWHs, yesterdayKey, dayBeforeKey]);

  const sevenDayData = [
    { label: "29 เม.ย.", value: 0 },
    { label: "30 เม.ย.", value: 0 },
    { label: "1 พ.ค.", value: 0 },
    { label: "2 พ.ค.", value: activeWHs.reduce((s, wh) => s + DATA.cats.reduce((cs, cat) => cs + (DATA.daily[wh][cat]?.["2026-05-02"] || 0), 0), 0) },
    { label: "3 พ.ค.", value: 0 },
    { label: "4 พ.ค.", value: activeWHs.reduce((s, wh) => s + DATA.cats.reduce((cs, cat) => cs + (DATA.daily[wh][cat]?.["2026-05-04"] || 0), 0), 0) },
    { label: "วันนี้", value: 0 },
  ];

  const positive = heroValues.delta >= 0;
  const whLabel = selectedWH === "ALL" ? "ทุกคลัง" : `คลัง ${selectedWH}`;
  const monthLabel = `${THAI_MONTHS[periodMonth]} ${periodYear + 543}`;

  return (
    <div className="px-5 pt-2">
      <div className="mt-1 mb-3 flex items-start justify-between">
        <div>
          <div className="text-sm text-stone-500">สวัสดี{currentUser?.name ? ` ${currentUser.name}` : ""} 👋</div>
          <div className="text-2xl font-bold text-stone-900 mt-0.5">
            {period === "yesterday" ? "ยอดขายเมื่อวาน" : "สรุปยอดขาย"}
          </div>
        </div>
        <button
          onClick={onSettings}
          className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200"
          title="ตั้งค่า"
        >
          <Settings className="w-4 h-4 text-stone-700" />
        </button>
      </div>

      {/* WH CHIPS */}
      <div className="flex items-center gap-2 mb-4 overflow-x-auto scrollbar-hide -mx-1 px-1">
        <WHChip label="ทั้งหมด" active={selectedWH === "ALL"} onClick={() => setSelectedWH("ALL")} />
        {DATA.whs.map((wh) => (
          <WHChip key={wh} label={wh} active={selectedWH === wh} onClick={() => setSelectedWH(wh)} />
        ))}
      </div>

      {/* HERO CARD with TIME USE inside */}
      <div
        className="rounded-3xl p-5 text-white shadow-lg relative overflow-hidden"
        style={{ background: "linear-gradient(135deg, #10B981 0%, #059669 100%)" }}
      >
        <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-white/10" />
        <div className="absolute -bottom-12 -right-4 w-24 h-24 rounded-full bg-white/5" />
        <div className="relative">
          {/* TOP: sales total */}
          <div className="text-xs text-white/80 mb-1 font-medium">
            {whLabel} · {heroValues.date}
          </div>
          <div className="num text-4xl font-extrabold mt-1">
            {fmtBaht(heroValues.total)}
          </div>
          {period === "yesterday" && heroValues.delta !== 0 && (
            <div className="flex items-center gap-1.5 mt-2 text-xs font-medium">
              {positive ? <TrendingUp className="w-3.5 h-3.5" /> : <TrendingDown className="w-3.5 h-3.5" />}
              <span className="num">{positive ? "▲" : "▼"} {Math.abs(heroValues.delta * 100).toFixed(1)}%</span>
              <span className="text-white/80">เทียบวันก่อน</span>
            </div>
          )}
          {period !== "yesterday" && (
            <div className="text-xs text-white/80 mt-2">ยอดสะสมช่วงนี้ ({activeWHs.length} คลัง)</div>
          )}

          {/* DIVIDER */}
          <div className="h-px bg-white/20 my-4" />

          {/* TIME USE — embedded in hero */}
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5 min-w-0">
              <Clock className="w-3.5 h-3.5 flex-shrink-0" />
              <span className="text-xs font-bold">Time Use</span>
              <span className="text-[10px] text-white/70 num truncate">
                · ใช้ไป {daysPassed} · เหลือ {daysRemaining}/{daysTotal} วัน
              </span>
            </div>
            <span className="num text-base font-extrabold flex-shrink-0">{fmtPct(timeUse)}</span>
          </div>

          {monthlyTarget > 0 ? (
            <>
              <div className="space-y-1.5">
                <MiniBarHero label="Time Use" pct={timeUse} value={fmtPct(timeUse)} fillClass="bg-amber-300" />
                <MiniBarHero
                  label="ยอดขาย"
                  pct={achievement}
                  value={fmtPct(achievement)}
                  fillClass={ahead ? "bg-white" : "bg-rose-300"}
                />
              </div>
              <div className="flex items-center justify-between mt-2 text-[11px] font-semibold">
                <span className={ahead ? "text-white" : "text-rose-200"}>
                  {ahead ? "▲ นำเป้า" : "▼ ตามหลัง"}{" "}
                  <span className="num">{ahead ? "+" : ""}{(gap * 100).toFixed(1)} pts</span>
                </span>
                <span className="text-white/70">BP {fmtBahtShort(monthlyTarget)}</span>
              </div>
            </>
          ) : (
            <>
              <div className="h-1.5 bg-white/20 rounded-full overflow-hidden">
                <div
                  className="h-full bg-white rounded-full transition-all"
                  style={{ width: `${Math.min(timeUse * 100, 100)}%` }}
                />
              </div>
              <div className="flex items-center justify-between mt-2 text-[11px]">
                <span className="text-white/80">
                  คาดสิ้นเดือน{" "}
                  <span className="num font-bold text-white">{fmtBahtShort(projectedMonthly)}</span>
                </span>
                <span className="text-[10px] text-white/70">
                  {bpLoading ? "⏳ กำลังโหลด BP..." : bpError ? `⚠️ ${bpError}` : "ไม่พบข้อมูล BP"}
                </span>
              </div>
            </>
          )}
        </div>
      </div>

      {/* PERIOD TABS */}
      <div className="flex items-center gap-2 mt-5 overflow-x-auto scrollbar-hide -mx-1 px-1">
        {PERIODS.map((p) => (
          <button
            key={p.id}
            onClick={() => setPeriod(p.id)}
            className={`px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all ${
              period === p.id ? "bg-stone-900 text-white" : "bg-white border border-stone-200 text-stone-700"
            }`}
          >
            {p.label}
          </button>
        ))}
      </div>

      <div className="flex items-center justify-between mt-6 mb-3">
        <h2 className="text-base font-bold text-stone-900">แยกตาม Cat_BU</h2>
        <button className="text-xs text-stone-500 flex items-center gap-0.5">
          ดูทั้งหมด <ChevronRight className="w-3.5 h-3.5" />
        </button>
      </div>
      <div className="space-y-2.5">
        {catValues.map((c) => <CatRow key={c.cat} data={c} onClick={() => onCatTap(c.cat)} />)}
      </div>

      <div className="mt-7 mb-4">
        <h2 className="text-base font-bold text-stone-900 mb-3">7 วันย้อนหลัง</h2>
        <div className="h-32">
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={sevenDayData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
              <XAxis dataKey="label" tick={{ fill: "#A8A29E", fontSize: 10 }} axisLine={false} tickLine={false} interval={0} />
              <YAxis hide domain={[0, "auto"]} />
              <Line type="monotone" dataKey="value" stroke="#10B981" strokeWidth={2.5} dot={{ fill: "#10B981", r: 3 }} activeDot={{ r: 5 }} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function WHChip({ label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all flex-shrink-0 ${
        active ? "bg-emerald-500 text-white shadow-md shadow-emerald-200" : "bg-white border border-stone-200 text-stone-600"
      }`}
    >
      {label}
    </button>
  );
}

function MiniBarHero({ label, pct, value, fillClass }) {
  const safePct = Math.min(Math.max(pct || 0, 0), 1);
  return (
    <div>
      <div className="flex items-center justify-between mb-0.5">
        <span className="text-[10px] font-semibold text-white/90">{label}</span>
        <span className="num text-[10px] font-bold text-white">{value}</span>
      </div>
      <div className="h-1.5 bg-white/20 rounded-full overflow-hidden">
        <div className={`h-full rounded-full transition-all ${fillClass}`} style={{ width: `${safePct * 100}%` }} />
      </div>
    </div>
  );
}

function CatRow({ data, onClick }) {
  const meta = CAT_META[data.cat];
  const Icon = meta.icon;
  const positive = data.delta >= 0;
  return (
    <button
      onClick={onClick}
      className="w-full bg-white border border-stone-100 rounded-2xl p-3.5 flex items-center gap-3 hover:bg-stone-50 active:scale-[0.99] transition-all shadow-sm"
    >
      <div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style={{ backgroundColor: meta.bg }}>
        <Icon className="w-5 h-5" style={{ color: meta.color }} />
      </div>
      <div className="flex-1 text-left min-w-0">
        <div className="text-sm font-semibold text-stone-900 truncate">{data.cat}</div>
        <div className="text-xs text-stone-500 num mt-0.5">{data.transactions.toLocaleString()} transactions</div>
      </div>
      <div className="text-right flex-shrink-0">
        <div className="num text-sm font-bold text-stone-900">{fmtBahtShort(data.sales)}</div>
        {data.delta !== 0 && (
          <div className={`num text-xs font-semibold mt-0.5 ${positive ? "text-emerald-600" : "text-rose-600"}`}>
            {positive ? "▲" : "▼"} {Math.abs(data.delta * 100).toFixed(1)}%
          </div>
        )}
      </div>
    </button>
  );
}

// =============================================================
// DETAIL
// =============================================================
function DetailScreen({ cat, activeWHs, selectedWH, timeUse, saleInData, onBack, onProductTap }) {
  const meta = CAT_META[cat];
  const Icon = meta.icon;

  // Salesperson filter (default: ALL = ทุกคน)
  const [selectedSale, setSelectedSale] = useState("ALL");

  // List salespeople available for current cat + WH selection
  const availableSales = useMemo(() => {
    return SALESPEOPLE.filter((name) => {
      for (const wh of activeWHs) {
        if (SALE_DATA[name]?.[wh]?.[cat]) return true;
      }
      return false;
    });
  }, [activeWHs, cat]);

  // Reset selected sale if not available after filter change
  const effectiveSale = availableSales.includes(selectedSale) ? selectedSale : "ALL";

  // Helper: get sale-specific or aggregated values
  const getSaleVal = (wh, field, dateKey) => {
    if (effectiveSale === "ALL") {
      if (field === "sales") return DATA.summary[wh][cat]?.sales || 0;
      if (field === "transactions") return DATA.summary[wh][cat]?.transactions || 0;
      if (field === "daily") return DATA.daily[wh][cat]?.[dateKey] || 0;
      return 0;
    }
    const s = SALE_DATA[effectiveSale]?.[wh]?.[cat];
    if (!s) return 0;
    if (field === "sales") return s.sales;
    if (field === "transactions") return s.transactions;
    if (field === "daily") return s.daily?.[dateKey] || 0;
    return 0;
  };

  const totalSales = activeWHs.reduce((s, wh) => s + getSaleVal(wh, "sales"), 0);
  const transactions = activeWHs.reduce((s, wh) => s + getSaleVal(wh, "transactions"), 0);

  const dayMay2 = activeWHs.reduce((s, wh) => s + getSaleVal(wh, "daily", "2026-05-02"), 0);
  const dayMay4 = activeWHs.reduce((s, wh) => s + getSaleVal(wh, "daily", "2026-05-04"), 0);
  const dailyForCat = [
    { day: "29", value: 0 }, { day: "30", value: 0 }, { day: "1", value: 0 },
    { day: "2", value: dayMay2 }, { day: "3", value: 0 },
    { day: "4", value: dayMay4 }, { day: "5", value: 0 },
  ];
  const maxIdx = dailyForCat.reduce((mi, d, i) => (d.value > dailyForCat[mi].value ? i : mi), 0);

  // Top products: aggregate across selected WHs (per-sale or all)
  const products = useMemo(() => {
    const merged = new Map();
    if (effectiveSale === "ALL") {
      for (const wh of activeWHs) {
        const list = DATA.top_products[wh]?.[cat] || [];
        for (const p of list) merged.set(p.name, (merged.get(p.name) || 0) + p.sales);
      }
    } else {
      for (const wh of activeWHs) {
        const list = SALE_DATA[effectiveSale]?.[wh]?.[cat]?.top || [];
        for (const p of list) merged.set(p.name, (merged.get(p.name) || 0) + p.sales);
      }
    }
    return [...merged.entries()]
      .map(([name, sales]) => ({ name, sales }))
      .sort((a, b) => b.sales - a.sales)
      .slice(0, 5);
  }, [activeWHs, cat, effectiveSale]);

  const deltaPct = dayMay2 > 0 ? ((dayMay4 - dayMay2) / dayMay2) * 100 : 0;
  const positive = deltaPct >= 0;
  const whLabel = selectedWH === "ALL" ? "ทุกคลัง" : `คลัง ${selectedWH}`;

  return (
    <div className="px-5 pt-2">
      <div className="flex items-center gap-3 mt-1 mb-4">
        <button onClick={onBack} className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200">
          <ChevronLeft className="w-5 h-5 text-stone-700" />
        </button>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <Icon className="w-5 h-5" style={{ color: meta.color }} />
            <h1 className="text-xl font-extrabold text-stone-900 truncate">{cat}</h1>
          </div>
          <div className="text-xs text-stone-500">{whLabel} · {transactions.toLocaleString()} transactions</div>
        </div>
      </div>

      {/* SALESPERSON FILTER */}
      <div className="mb-4">
        <label className="text-xs font-semibold text-stone-600 mb-1.5 block flex items-center gap-1.5">
          <User className="w-3.5 h-3.5" /> พนักงานขาย (Sale NO ROO)
        </label>
        <div className="relative">
          <select
            value={effectiveSale}
            onChange={(e) => setSelectedSale(e.target.value)}
            className="w-full bg-white border border-stone-200 rounded-2xl px-4 py-3 text-sm font-semibold text-stone-900 focus:outline-none focus:ring-2 focus:ring-emerald-400 appearance-none pr-10 shadow-sm"
          >
            <option value="ALL">ทุกคน ({availableSales.length} คน)</option>
            {availableSales.map((name) => (
              <option key={name} value={name}>{name}</option>
            ))}
          </select>
          <ChevronRight className="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 rotate-90 text-stone-400 pointer-events-none" />
        </div>
        {effectiveSale !== "ALL" && (
          <button
            onClick={() => setSelectedSale("ALL")}
            className="text-[11px] text-emerald-600 font-semibold mt-1.5 underline"
          >
            ✕ ยกเลิกตัวกรอง
          </button>
        )}
      </div>

      <div className="bg-stone-50 rounded-3xl p-5 border border-stone-100">
        <div className="text-xs text-stone-500 mb-1 font-medium">
          {effectiveSale === "ALL" ? "ยอดขายสะสม" : `ยอดขายของ ${effectiveSale}`}
        </div>
        <div className="num text-4xl font-extrabold text-stone-900">{fmtBaht(totalSales)}</div>
        <div className="flex items-center gap-3 mt-2 flex-wrap">
          {deltaPct !== 0 && (
            <div className={`flex items-center gap-1 text-xs font-semibold ${positive ? "text-emerald-600" : "text-rose-600"}`}>
              {positive ? <TrendingUp className="w-3 h-3" /> : <TrendingDown className="w-3 h-3" />}
              <span className="num">{positive ? "▲" : "▼"} {Math.abs(deltaPct).toFixed(1)}%</span>
            </div>
          )}
        </div>
      </div>

      <div className="mt-6">
        <h2 className="text-base font-bold text-stone-900 mb-3">ยอดขายรายวัน (พ.ค.)</h2>
        <div className="h-32">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={dailyForCat} margin={{ top: 10, right: 0, left: 0, bottom: 0 }}>
              <XAxis dataKey="day" tick={{ fill: "#A8A29E", fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis hide />
              <Bar dataKey="value" radius={[6, 6, 0, 0]}>
                {dailyForCat.map((d, i) => (
                  <Cell key={i} fill={i === maxIdx && d.value > 0 ? meta.color : meta.bg} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* SALE IN CHART */}
      {(() => {
        // Aggregate Sale_IN for this category's products
        const catProductNames = new Set([
          ...Object.keys(PRODUCT_DETAIL[cat] || {}),
          ...(STOCK_DATA[cat] || []).map(row => row[0]),
        ]);
        let totalSaleIn = 0;
        for (const name of catProductNames) {
          totalSaleIn += saleInData?.[name] || 0;
        }

        // Build comparison data: sales per day vs purchase (flat reference)
        const saleInPerDay = dailyForCat.map(d => ({
          ...d,
          purchase: d.value > 0 ? Math.round(totalSaleIn / dailyForCat.filter(x => x.value > 0).length || 0) : 0,
        }));

        return (
          <div className="mt-4">
            <div className="flex items-center justify-between mb-2">
              <h2 className="text-base font-bold text-stone-900">ยอดซื้อเข้า (Sale IN)</h2>
              {totalSaleIn > 0 && (
                <span className="num text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">
                  รวม {fmtBahtShort(totalSaleIn)}
                </span>
              )}
            </div>
            {totalSaleIn > 0 ? (
              <>
                <div className="h-28">
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={saleInPerDay} margin={{ top: 8, right: 0, left: 0, bottom: 0 }}>
                      <XAxis dataKey="day" tick={{ fill: "#A8A29E", fontSize: 11 }} axisLine={false} tickLine={false} />
                      <YAxis hide />
                      <Line
                        type="monotone"
                        dataKey="purchase"
                        stroke="#3B82F6"
                        strokeWidth={2.5}
                        strokeDasharray="4 3"
                        dot={{ fill: "#3B82F6", r: 3 }}
                        activeDot={{ r: 5 }}
                      />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
                <div className="mt-2 bg-blue-50 border border-blue-100 rounded-2xl p-3 flex items-center justify-between">
                  <div>
                    <div className="text-[10px] text-blue-500 font-semibold mb-0.5">ยอดซื้อเข้าสะสม</div>
                    <div className="num text-base font-extrabold text-blue-700">{fmtBaht(totalSaleIn)}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] text-stone-500 font-semibold mb-0.5">ยอดขาย / ยอดซื้อ</div>
                    <div className={`num text-sm font-extrabold ${totalSales >= totalSaleIn ? "text-emerald-600" : "text-rose-600"}`}>
                      {totalSaleIn > 0 ? `${((totalSales / totalSaleIn) * 100).toFixed(0)}%` : "—"}
                    </div>
                  </div>
                </div>
              </>
            ) : (
              <div className="bg-stone-50 rounded-2xl p-4 text-center text-xs text-stone-400">
                ไม่พบข้อมูลยอดซื้อเข้าในช่วงนี้
              </div>
            )}
          </div>
        );
      })()}

      <div className="mt-6 mb-4">
        <h2 className="text-base font-bold text-stone-900 mb-3">สินค้าขายดี</h2>
        {products.length === 0 ? (
          <div className="bg-stone-50 rounded-2xl p-4 text-center text-sm text-stone-500">ไม่มีสินค้าขายในคลังนี้</div>
        ) : (
          <div className="space-y-2">
            {products.map((p, i) => {
              const hasDetail = !!PRODUCT_DETAIL[cat]?.[p.name];
              return (
                <button
                  key={p.name}
                  onClick={() => hasDetail && onProductTap(p.name)}
                  disabled={!hasDetail}
                  className={`w-full bg-white border border-stone-100 rounded-2xl p-3.5 flex items-center gap-3 shadow-sm transition-all ${
                    hasDetail ? "hover:bg-stone-50 active:scale-[0.99] cursor-pointer" : "opacity-90"
                  }`}
                >
                  <div className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold num"
                    style={{ backgroundColor: i === 0 ? meta.color : meta.bg, color: i === 0 ? "white" : meta.color }}>
                    {i + 1}
                  </div>
                  <div className="flex-1 text-sm font-medium text-stone-800 truncate text-left">{p.name}</div>
                  <div className="num text-sm font-bold text-stone-900 flex-shrink-0">{fmtBahtShort(p.sales)}</div>
                  {hasDetail && <ChevronRight className="w-4 h-4 text-stone-300 flex-shrink-0" />}
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function ProductScreen({ cat, productName, onBack }) {
  const meta = CAT_META[cat];
  const Icon = meta.icon;
  const detail = PRODUCT_DETAIL[cat]?.[productName];

  if (!detail) {
    return (
      <div className="px-5 pt-2">
        <div className="flex items-center gap-3 mt-1 mb-4">
          <button onClick={onBack} className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200">
            <ChevronLeft className="w-5 h-5 text-stone-700" />
          </button>
          <h1 className="text-xl font-extrabold text-stone-900 truncate">{productName}</h1>
        </div>
        <div className="bg-stone-50 rounded-2xl p-6 text-center text-sm text-stone-500">
          ไม่มีข้อมูลสินค้านี้
        </div>
      </div>
    );
  }

  // Daily chart — use same 7-day layout as DetailScreen
  const dayMay2 = detail.daily?.["2026-05-02"] || 0;
  const dayMay4 = detail.daily?.["2026-05-04"] || 0;
  const dailyData = [
    { day: "29", value: 0 }, { day: "30", value: 0 }, { day: "1", value: 0 },
    { day: "2", value: dayMay2 }, { day: "3", value: 0 },
    { day: "4", value: dayMay4 }, { day: "5", value: 0 },
  ];
  const maxIdx = dailyData.reduce((mi, d, i) => (d.value > dailyData[mi].value ? i : mi), 0);

  const deltaPct = dayMay2 > 0 ? ((dayMay4 - dayMay2) / dayMay2) * 100 : 0;
  const positive = deltaPct >= 0;
  const customers = detail.customers || [];
  const customerTotal = customers.reduce((s, c) => s + c.sales, 0);

  return (
    <div className="px-5 pt-2">
      {/* Header */}
      <div className="flex items-center gap-3 mt-1 mb-4">
        <button onClick={onBack} className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200">
          <ChevronLeft className="w-5 h-5 text-stone-700" />
        </button>
        <div className="flex-1 min-w-0">
          <div className="text-[10px] text-stone-500 uppercase tracking-wider flex items-center gap-1">
            <Icon className="w-3 h-3" style={{ color: meta.color }} />
            {cat}
          </div>
          <h1 className="text-lg font-extrabold text-stone-900 leading-tight">{productName}</h1>
        </div>
      </div>

      {/* Summary card */}
      <div className="rounded-3xl p-5 text-white shadow-lg relative overflow-hidden"
        style={{ background: `linear-gradient(135deg, ${meta.color}, ${meta.color}DD)` }}>
        <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-white/10" />
        <div className="relative">
          <div className="text-xs text-white/80 mb-1 font-medium">ยอดขายรวมของสินค้านี้</div>
          <div className="num text-3xl font-extrabold mt-1">{fmtBaht(detail.total)}</div>
          {deltaPct !== 0 && (
            <div className="flex items-center gap-1.5 mt-2 text-xs font-medium">
              {positive ? <TrendingUp className="w-3.5 h-3.5" /> : <TrendingDown className="w-3.5 h-3.5" />}
              <span className="num">{positive ? "▲" : "▼"} {Math.abs(deltaPct).toFixed(1)}%</span>
              <span className="text-white/80">เทียบวันก่อน</span>
            </div>
          )}
          <div className="text-[10px] text-white/70 mt-2 num">
            พ.ค. 2: {fmtBahtShort(dayMay2)} · พ.ค. 4: {fmtBahtShort(dayMay4)}
          </div>
        </div>
      </div>

      {/* Daily chart */}
      <div className="mt-6">
        <h2 className="text-base font-bold text-stone-900 mb-3">ยอดขายรายวัน</h2>
        <div className="h-32">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={dailyData} margin={{ top: 10, right: 0, left: 0, bottom: 0 }}>
              <XAxis dataKey="day" tick={{ fill: "#A8A29E", fontSize: 11 }} axisLine={false} tickLine={false} />
              <YAxis hide />
              <Bar dataKey="value" radius={[6, 6, 0, 0]}>
                {dailyData.map((d, i) => (
                  <Cell key={i} fill={i === maxIdx && d.value > 0 ? meta.color : meta.bg} />
                ))}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Customer list */}
      <div className="mt-6 mb-4">
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-base font-bold text-stone-900 flex items-center gap-2">
            <Store className="w-4 h-4 text-stone-600" /> ร้านค้าที่ซื้อ
          </h2>
          <span className="text-xs text-stone-500 num">{customers.length} ร้าน</span>
        </div>
        {customers.length === 0 ? (
          <div className="bg-stone-50 rounded-2xl p-4 text-center text-sm text-stone-500">
            ไม่มีข้อมูลร้านค้า
          </div>
        ) : (
          <div className="space-y-2">
            {customers.map((c, i) => {
              const pct = customerTotal > 0 ? (c.sales / customerTotal) : 0;
              return (
                <div key={c.name} className="bg-white border border-stone-100 rounded-2xl p-3.5 shadow-sm">
                  <div className="flex items-center gap-3">
                    <div className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 text-xs font-bold num"
                      style={{ backgroundColor: i === 0 ? meta.color : meta.bg, color: i === 0 ? "white" : meta.color }}>
                      {i + 1}
                    </div>
                    <div className="flex-1 text-sm font-medium text-stone-800 truncate">{c.name}</div>
                    <div className="num text-sm font-bold text-stone-900 flex-shrink-0">{fmtBahtShort(c.sales)}</div>
                  </div>
                  {/* Mini bar showing share */}
                  <div className="mt-2 h-1 bg-stone-100 rounded-full overflow-hidden ml-10">
                    <div className="h-full rounded-full" style={{ width: `${pct * 100}%`, backgroundColor: meta.color }} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
        <div className="text-[10px] text-stone-400 text-center mt-3">
          * แสดง Top {customers.length} ร้านค้าที่ซื้อสินค้านี้ทั้งหมด (ทุกคลัง ทุกเซลล์)
        </div>
      </div>
    </div>
  );
}

// SETTINGS MODAL
// =============================================================
function SettingsModal({
  asOfDate, workdays, holidays, daysTotal, daysPassed,
  setAsOfDate, setWorkdays, setHolidays, onClose,
}) {
  const [localAsOf, setLocalAsOf] = useState(dateKey(asOfDate));
  const [localWorkdays, setLocalWorkdays] = useState([...workdays]);
  const [localHolidays, setLocalHolidays] = useState([...holidays]);
  const [newHoliday, setNewHoliday] = useState("");

  const toggleDow = (dow) => {
    setLocalWorkdays((prev) =>
      prev.includes(dow) ? prev.filter((d) => d !== dow) : [...prev, dow].sort()
    );
  };

  const addHoliday = () => {
    if (!newHoliday) return;
    if (localHolidays.includes(newHoliday)) return;
    setLocalHolidays([...localHolidays, newHoliday].sort());
    setNewHoliday("");
  };

  const removeHoliday = (date) => {
    setLocalHolidays(localHolidays.filter((d) => d !== date));
  };

  // Live preview computation
  const previewAsOf = useMemo(() => {
    const [y, m, d] = localAsOf.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    date.setHours(0, 0, 0, 0);
    return date;
  }, [localAsOf]);

  const previewYear = previewAsOf.getFullYear();
  const previewMonth = previewAsOf.getMonth();

  const preview = useMemo(() => {
    return computeWorkdays(
      previewYear, previewMonth,
      new Set(localWorkdays), new Set(localHolidays), previewAsOf
    );
  }, [previewYear, previewMonth, localWorkdays, localHolidays, previewAsOf]);

  const previewTimeUse = preview.total > 0 ? preview.passed / preview.total : 0;

  // Days in month for breakdown
  const daysInMonth = new Date(previewYear, previewMonth + 1, 0).getDate();
  // Sundays count
  let sundayCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(previewYear, previewMonth, d);
    if (!localWorkdays.includes(dt.getDay())) sundayCount++;
  }
  // Holiday count this month (only those falling on a workday)
  const holidaysInMonth = localHolidays.filter((h) => {
    const [y, m] = h.split("-").map(Number);
    if (y !== previewYear || m - 1 !== previewMonth) return false;
    const [hy, hm, hd] = h.split("-").map(Number);
    const dt = new Date(hy, hm - 1, hd);
    return localWorkdays.includes(dt.getDay());
  });

  // Per-WH and grand totals - removed (targets now from BP 2026 auto-fetch)

  const save = () => {
    setAsOfDate(previewAsOf);
    setWorkdays(localWorkdays);
    setHolidays(localHolidays);
    onClose();
  };

  const formatHolidayLabel = (key) => {
    const [y, m, d] = key.split("-").map(Number);
    return `${d} ${THAI_MONTHS[m - 1].slice(0, 3)}. ${y + 543}`;
  };

  return (
    <div className="absolute inset-0 bg-black/40 z-50 flex items-end" onClick={onClose}>
      <div
        className="w-full bg-white rounded-t-3xl p-5 pb-8 max-h-[85%] overflow-y-auto"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-5 sticky top-0 bg-white pb-2 z-10">
          <h2 className="text-lg font-bold text-stone-900">ตั้งค่า Time Use</h2>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center">
            <X className="w-4 h-4 text-stone-600" />
          </button>
        </div>

        <div className="space-y-5">
          {/* Live Time Use preview */}
          <div className="bg-emerald-50 rounded-2xl p-4 text-center">
            <div className="text-xs text-emerald-700 font-semibold mb-1">% Time Use</div>
            <div className="num text-3xl font-extrabold text-emerald-700">{fmtPct(previewTimeUse)}</div>
            <div className="text-xs text-emerald-700 mt-2 num">
              ({preview.total} − {preview.remaining}) ÷ {preview.total} = {fmtPct(previewTimeUse)}
            </div>
            <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-emerald-200">
              <div>
                <div className="text-[9px] text-emerald-700 uppercase tracking-wider">ใช้ไป</div>
                <div className="num text-base font-bold text-emerald-800">{preview.passed}</div>
              </div>
              <div className="border-x border-emerald-200">
                <div className="text-[9px] text-emerald-700 uppercase tracking-wider">เหลือ</div>
                <div className="num text-base font-bold text-emerald-800">{preview.remaining}</div>
              </div>
              <div>
                <div className="text-[9px] text-emerald-700 uppercase tracking-wider">ทั้งหมด</div>
                <div className="num text-base font-bold text-emerald-800">{preview.total}</div>
              </div>
            </div>
            <div className="text-[10px] text-emerald-600 mt-2 num">
              {THAI_MONTHS[previewMonth]} {previewYear + 543} · {daysInMonth} วัน − {sundayCount} วันหยุดสัปดาห์ − {holidaysInMonth.length} วันหยุดพิเศษ
            </div>
          </div>

          {/* As-of date */}
          <div>
            <label className="text-xs font-bold text-stone-700 mb-2 block flex items-center gap-1.5">
              <CalendarDays className="w-3.5 h-3.5" /> วันที่อ้างอิง (วันนี้)
            </label>
            <input
              type="date"
              value={localAsOf}
              onChange={(e) => setLocalAsOf(e.target.value)}
              className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-3 text-base num font-bold focus:outline-none focus:ring-2 focus:ring-emerald-400"
            />
            <div className="text-[11px] text-stone-500 mt-1">
              วันนี้ถือว่าอยู่ใน "วันที่เหลือ" (ยังขายไม่จบ) · "ใช้ไป" = วันก่อนหน้านี้
            </div>
          </div>

          {/* Workday pattern */}
          <div>
            <label className="text-xs font-bold text-stone-700 mb-2 block">วันทำงานประจำสัปดาห์</label>
            <div className="grid grid-cols-7 gap-1.5">
              {THAI_DOW.map((label, dow) => {
                const active = localWorkdays.includes(dow);
                return (
                  <button
                    key={dow}
                    onClick={() => toggleDow(dow)}
                    className={`py-2.5 rounded-xl text-xs font-bold transition-all ${
                      active
                        ? "bg-emerald-500 text-white shadow-sm"
                        : "bg-stone-100 text-stone-400"
                    }`}
                  >
                    {label}
                  </button>
                );
              })}
            </div>
            <div className="text-[11px] text-stone-500 mt-1.5">
              เลือกวันที่ทำงาน · ค่าเริ่มต้น จันทร์–เสาร์
            </div>
          </div>

          {/* Special holidays */}
          <div>
            <label className="text-xs font-bold text-stone-700 mb-2 block">
              วันหยุดพิเศษ <span className="text-stone-400 font-normal">({localHolidays.length})</span>
            </label>
            <div className="flex gap-2">
              <input
                type="date"
                value={newHoliday}
                onChange={(e) => setNewHoliday(e.target.value)}
                className="flex-1 bg-stone-50 border border-stone-200 rounded-xl px-3 py-2.5 text-sm num focus:outline-none focus:ring-2 focus:ring-emerald-400"
              />
              <button
                onClick={addHoliday}
                disabled={!newHoliday}
                className="px-3 bg-emerald-500 text-white rounded-xl font-bold disabled:bg-stone-200 disabled:text-stone-400 flex items-center gap-1"
              >
                <Plus className="w-4 h-4" /> เพิ่ม
              </button>
            </div>
            {localHolidays.length > 0 && (
              <div className="mt-2 space-y-1.5 max-h-40 overflow-y-auto">
                {localHolidays.map((h) => (
                  <div key={h} className="flex items-center justify-between bg-stone-50 rounded-xl px-3 py-2">
                    <span className="text-sm font-semibold text-stone-800 num">
                      📅 {formatHolidayLabel(h)}
                    </span>
                    <button
                      onClick={() => removeHoliday(h)}
                      className="text-rose-500 hover:bg-rose-50 p-1 rounded"
                    >
                      <Trash2 className="w-3.5 h-3.5" />
                    </button>
                  </div>
                ))}
              </div>
            )}
            <div className="text-[11px] text-stone-500 mt-1.5">
              เช่น วันแรงงาน 1 พ.ค. · วันฉัตรมงคล 4 พ.ค. · วันวิสาขบูชา · วันหยุดบริษัท ฯลฯ
            </div>
          </div>

          <button
            onClick={save}
            className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md shadow-emerald-200 transition-colors"
          >
            บันทึก
          </button>
        </div>
      </div>
    </div>
  );
}

// =============================================================
// STOCK SCREEN — Cat_BU summary with drill-down
// =============================================================
function StockScreen({ selectedWH, setSelectedWH, activeWHs, saleInData, saleInCSData, saleInLoading, onCatTap }) {
  const fmtCSShort = (n) => {
    if (n >= 1000) return (n / 1000).toFixed(1) + "K ลัง";
    return Math.round(n) + " ลัง";
  };

  // Compute stock per cat for active WHs + saleIn totals per cat
  const catTotals = useMemo(() => {
    const whIdxs = activeWHs.map((w) => STOCK_WHS.indexOf(w)).filter((i) => i >= 0);
    return DATA.cats.map((cat) => {
      const rows = STOCK_DATA[cat] || [];
      let total = 0;
      let nonZeroSkus = 0;
      const whBreakdown = { W1: 0, W2: 0, W3: 0, W4: 0, SM: 0, C4: 0 };
      let saleInTotal = 0;
      let saleInCSTotal = 0;
      for (const row of rows) {
        // row = [name, w1, w2, w3, w4, sm, c4]
        let rowSum = 0;
        for (const i of whIdxs) {
          const v = row[i + 1] || 0; // +1 because row[0] is name
          rowSum += v;
        }
        total += rowSum;
        if (rowSum > 0) nonZeroSkus++;
        for (let i = 0; i < STOCK_WHS.length; i++) {
          whBreakdown[STOCK_WHS[i]] += row[i + 1] || 0;
        }
        saleInTotal += saleInData[row[0]] || 0;
        saleInCSTotal += saleInCSData[row[0]] || 0;
      }
      return { cat, total, skuCount: rows.length, nonZeroSkus, whBreakdown, saleInTotal, saleInCSTotal };
    });
  }, [activeWHs, saleInData, saleInCSData]);

  const grandTotal = catTotals.reduce((s, c) => s + c.total, 0);
  const grandSaleInCS = catTotals.reduce((s, c) => s + c.saleInCSTotal, 0);
  const totalSKUs = catTotals.reduce((s, c) => s + c.skuCount, 0);
  const whLabel = selectedWH === "ALL" ? "ทุกคลัง" : `คลัง ${selectedWH}`;

  return (
    <div className="px-5 pt-2">
      <div className="mt-1 mb-3">
        <div className="flex items-center gap-2 text-sm text-stone-500">
          <Warehouse className="w-3.5 h-3.5" /> สต็อกสินค้า
        </div>
        <div className="text-2xl font-bold text-stone-900 mt-0.5">Stock</div>
      </div>

      {/* WH CHIPS */}
      <div className="flex items-center gap-2 mb-4 overflow-x-auto scrollbar-hide -mx-1 px-1">
        <WHChip label="ทั้งหมด" active={selectedWH === "ALL"} onClick={() => setSelectedWH("ALL")} />
        {DATA.whs.map((wh) => (
          <WHChip key={wh} label={wh} active={selectedWH === wh} onClick={() => setSelectedWH(wh)} />
        ))}
      </div>

      {/* HERO */}
      <div
        className="rounded-3xl p-5 text-white shadow-lg relative overflow-hidden"
        style={{ background: "linear-gradient(135deg, #0F766E 0%, #0E7490 100%)" }}
      >
        <div className="absolute -top-10 -right-10 w-32 h-32 rounded-full bg-white/10" />
        <div className="absolute -bottom-12 -right-4 w-24 h-24 rounded-full bg-white/5" />
        <div className="relative">
          <div className="text-xs text-white/80 mb-1 font-medium">{whLabel} · ทุกหมวด</div>
          <div className="num text-4xl font-extrabold mt-1">
            {new Intl.NumberFormat("en-US").format(grandTotal)} <span className="text-xl font-bold">ลัง</span>
          </div>
          <div className="h-px bg-white/20 my-3" />
          <div className="flex items-center justify-between">
            <div>
              <div className="text-[10px] text-white/70 uppercase tracking-wider mb-0.5">ซื้อเข้า (Sale_IN)</div>
              {saleInLoading ? (
                <div className="text-sm text-white/60">⏳ กำลังโหลด...</div>
              ) : grandSaleInCS > 0 ? (
                <div className="flex items-baseline gap-1.5">
                  <span className="num text-2xl font-extrabold">{new Intl.NumberFormat("en-US").format(Math.round(grandSaleInCS))}</span>
                  <span className="text-sm font-bold text-white/80">ลัง</span>
                </div>
              ) : (
                <div className="num text-lg font-extrabold mt-0.5 text-white/50">— ไม่มีข้อมูล</div>
              )}
            </div>
            <div className="text-right">
              <div className="text-[10px] text-white/70">{DATA.cats.length} หมวด · {totalSKUs.toLocaleString()} SKU</div>
            </div>
          </div>
        </div>
      </div>

      <div className="flex items-center justify-between mt-6 mb-3">
        <h2 className="text-base font-bold text-stone-900">แยกตาม Cat_BU</h2>
        <span className="text-xs text-stone-500">หน่วย: ลัง (CS)</span>
      </div>

      <div className="space-y-2.5">
        {catTotals.map((c) => (
          <StockCatRow key={c.cat} data={c} grandTotal={grandTotal} saleInLoading={saleInLoading} onClick={() => onCatTap(c.cat)} />
        ))}
      </div>

      <div className="text-[10px] text-stone-400 text-center mt-5 mb-2">
        * แตะหมวดเพื่อดูสินค้าในหมวดนั้น · ค่าเป็น "ลัง" (Carton)
      </div>
    </div>
  );
}

function StockCatRow({ data, grandTotal, saleInLoading, onClick }) {
  const meta = CAT_META[data.cat];
  const Icon = meta.icon;
  const sharePct = grandTotal > 0 ? (data.total / grandTotal) * 100 : 0;

  return (
    <button
      onClick={onClick}
      className="w-full bg-white border border-stone-100 rounded-2xl p-4 flex items-center gap-3 hover:bg-stone-50 active:scale-[0.99] transition-all shadow-sm text-left"
    >
      <div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style={{ backgroundColor: meta.bg }}>
        <Icon className="w-5 h-5" style={{ color: meta.color }} />
      </div>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold text-stone-900 truncate">{data.cat}</div>
        <div className="text-xs text-stone-500 num mt-0.5">
          {data.nonZeroSkus.toLocaleString()} / {data.skuCount.toLocaleString()} SKU มีสต็อก
        </div>
        {!saleInLoading && data.saleInTotal > 0 && (
          <div className="text-[10px] text-blue-600 font-semibold num mt-0.5">
            📦 ซื้อเข้า {new Intl.NumberFormat("en-US").format(Math.round(data.saleInTotal))}
          </div>
        )}
        <div className="h-1.5 bg-stone-100 rounded-full overflow-hidden mt-1.5 w-full">
          <div className="h-full rounded-full transition-all" style={{ width: `${Math.min(sharePct, 100)}%`, backgroundColor: meta.color }} />
        </div>
      </div>
      <div className="text-right flex-shrink-0">
        <div className="num text-base font-extrabold text-stone-900">
          {data.total >= 1000 ? (data.total / 1000).toFixed(1) + "K" : data.total.toLocaleString()}
        </div>
        <div className="text-[10px] text-stone-400 num">ลัง</div>
        <ChevronRight className="w-4 h-4 text-stone-300 ml-auto mt-0.5" />
      </div>
    </button>
  );
}

// =============================================================
// STOCK CAT DETAIL — list of products in a category
// =============================================================
function StockCatScreen({ cat, selectedWH, setSelectedWH, activeWHs, saleInData, saleInCSData, salesCSData, timeUse, onBack }) {
  const meta = CAT_META[cat];
  const Icon = meta.icon;
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("stock"); // "stock" | "name"
  const [filter, setFilter] = useState("with"); // "all" | "with" | "out"

  const rows = STOCK_DATA[cat] || [];

  // Compute per-row total stock for active WHs
  const enriched = useMemo(() => {
    const whIdxs = activeWHs.map((w) => STOCK_WHS.indexOf(w)).filter((i) => i >= 0);
    return rows.map((row) => {
      const stocks = STOCK_WHS.map((_, i) => row[i + 1] || 0);
      const filteredTotal = whIdxs.reduce((s, i) => s + (row[i + 1] || 0), 0);
      const allTotal = stocks.reduce((a, b) => a + b, 0);
      return { name: row[0], stocks, filteredTotal, allTotal };
    });
  }, [rows, activeWHs]);

  const filtered = useMemo(() => {
    let arr = enriched;
    if (filter === "with") arr = arr.filter((p) => p.filteredTotal > 0);
    else if (filter === "out") arr = arr.filter((p) => p.filteredTotal === 0);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      arr = arr.filter((p) => p.name.toLowerCase().includes(q));
    }
    if (sortBy === "stock") arr = [...arr].sort((a, b) => b.filteredTotal - a.filteredTotal);
    else arr = [...arr].sort((a, b) => a.name.localeCompare(b.name, "th"));
    return arr;
  }, [enriched, filter, query, sortBy]);

  // For single-WH view: max stock of the selected WH across filtered products (for bar normalization)
  const maxSingleStock = useMemo(() => {
    if (selectedWH === "ALL") return 1;
    const idx = STOCK_WHS.indexOf(selectedWH);
    if (idx < 0) return 1;
    return Math.max(...filtered.map((p) => p.stocks[idx]), 1);
  }, [filtered, selectedWH]);

  const totalStock = enriched.reduce((s, p) => s + p.filteredTotal, 0);
  const whLabel = selectedWH === "ALL" ? "ทุกคลัง" : `คลัง ${selectedWH}`;

  return (
    <div className="px-5 pt-2">
      <div className="flex items-center gap-3 mt-1 mb-4">
        <button onClick={onBack} className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200">
          <ChevronLeft className="w-5 h-5 text-stone-700" />
        </button>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <Icon className="w-5 h-5" style={{ color: meta.color }} />
            <h1 className="text-xl font-extrabold text-stone-900 truncate">{cat}</h1>
          </div>
          <div className="text-xs text-stone-500 num">
            {whLabel} · {totalStock.toLocaleString()} ลัง · {rows.length.toLocaleString()} SKU
          </div>
        </div>
      </div>

      {/* WH CHIPS */}
      <div className="flex items-center gap-2 mb-3 overflow-x-auto scrollbar-hide -mx-1 px-1">
        <WHChip label="ทั้งหมด" active={selectedWH === "ALL"} onClick={() => setSelectedWH("ALL")} />
        {DATA.whs.map((wh) => (
          <WHChip key={wh} label={wh} active={selectedWH === wh} onClick={() => setSelectedWH(wh)} />
        ))}
      </div>

      {/* SEARCH BAR */}
      <div className="relative mb-3">
        <Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400" />
        <input
          type="text"
          placeholder="ค้นหาสินค้า..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          className="w-full bg-white border border-stone-200 rounded-2xl pl-10 pr-10 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 shadow-sm"
        />
        {query && (
          <button
            onClick={() => setQuery("")}
            className="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200"
          >
            <X className="w-3 h-3 text-stone-500" />
          </button>
        )}
      </div>

      {/* FILTER + SORT ROW */}
      <div className="flex items-center justify-between gap-2 mb-3">
        <div className="flex items-center gap-1.5 overflow-x-auto scrollbar-hide flex-1">
          <FilterChip label="มีสต็อก" active={filter === "with"} onClick={() => setFilter("with")} />
          <FilterChip label="หมด" active={filter === "out"} onClick={() => setFilter("out")} />
          <FilterChip label="ทั้งหมด" active={filter === "all"} onClick={() => setFilter("all")} />
        </div>
        <button
          onClick={() => setSortBy(sortBy === "stock" ? "name" : "stock")}
          className="text-[11px] font-semibold text-stone-600 bg-stone-100 px-3 py-1.5 rounded-full whitespace-nowrap"
        >
          {sortBy === "stock" ? "↓ มากสุด" : "A-Z"}
        </button>
      </div>

      <div className="text-xs text-stone-500 num mb-2">
        แสดง {filtered.length.toLocaleString()} จาก {rows.length.toLocaleString()} รายการ
      </div>

      {/* STOCK HEALTH LEGEND */}
      <div className="flex items-center gap-3 mb-3 text-[10px] font-semibold">
        <div className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-500 inline-block" />เยอะ</div>
        <div className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-amber-400 inline-block" />ปานกลาง</div>
        <div className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-red-500 inline-block" />น้อย/หมด</div>
      </div>

      {/* PRODUCT LIST */}
      {filtered.length === 0 ? (
        <div className="bg-stone-50 rounded-2xl p-6 text-center text-sm text-stone-500">
          ไม่พบสินค้าตรงเงื่อนไข
        </div>
      ) : (
        <div className="space-y-2 mb-4">
          {filtered.slice(0, 200).map((p, i) => (
            <StockProductRow
              key={p.name + i}
              product={p}
              catColor={meta.color}
              catBg={meta.bg}
              selectedWH={selectedWH}
              maxSingleStock={maxSingleStock}
              saleIn={saleInCSData[p.name] || 0}
              salesCS={salesCSData[p.name] || 0}
              timeUse={timeUse}
            />
          ))}
          {filtered.length > 200 && (
            <div className="text-[11px] text-stone-400 text-center py-3">
              * แสดง 200 รายการแรก — ใช้ค้นหาเพื่อหาสินค้าที่ต้องการ
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function FilterChip({ label, active, onClick }) {
  return (
    <button
      onClick={onClick}
      className={`px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap transition-all flex-shrink-0 ${
        active ? "bg-stone-900 text-white" : "bg-white border border-stone-200 text-stone-600"
      }`}
    >
      {label}
    </button>
  );
}

function StockProductRow({ product, catColor, catBg, selectedWH, maxSingleStock, saleIn, salesCS, timeUse }) {
  const { name, stocks, filteredTotal } = product;

  function getStockColor(stockVal, maxVal) {
    if (maxVal <= 0 || stockVal <= 0) return "#EF4444";
    const pct = stockVal / maxVal;
    const remaining = 1 - (timeUse || 0);
    if (pct >= remaining * 1.3) return "#10B981";
    if (pct >= remaining * 0.5) return "#F59E0B";
    return "#EF4444";
  }

  const fmtCS = (n) => {
    if (n <= 0) return "—";
    return n >= 1000 ? (n / 1000).toFixed(1) + "K" : n.toLocaleString();
  };

  // Shared 3-bar row renderer
  function ThreeBars({ stockVal, salesCSVal, saleInVal }) {
    const maxForBar = Math.max(stockVal, salesCSVal, saleInVal, 1);
    const stockPct   = Math.max(Math.min((stockVal  / maxForBar) * 100, 100), stockVal  > 0 ? 3 : 0);
    const salesPct   = Math.max(Math.min((salesCSVal / maxForBar) * 100, 100), salesCSVal > 0 ? 3 : 0);
    const saleInPct  = Math.max(Math.min((saleInVal  / maxForBar) * 100, 100), saleInVal  > 0 ? 3 : 0);
    const barColor   = getStockColor(stockVal, maxForBar);

    return (
      <div className="space-y-1.5 mt-2">
        {/* Stock */}
        <div className="flex items-center gap-2">
          <span className="text-[10px] text-stone-500 w-12 flex-shrink-0">สต๊อก</span>
          <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
            <div className="h-full rounded-full transition-all"
              style={{ width: `${stockPct}%`, backgroundColor: barColor }} />
          </div>
          <span className="num text-[10px] font-bold text-stone-700 w-10 text-right flex-shrink-0">
            {fmtCS(stockVal)}
          </span>
        </div>
        {/* ยอดขาย */}
        <div className="flex items-center gap-2">
          <span className="text-[10px] text-emerald-600 w-12 flex-shrink-0 font-semibold">ขาย</span>
          <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
            <div className="h-full rounded-full bg-emerald-400 transition-all"
              style={{ width: `${salesPct}%` }} />
          </div>
          <span className="num text-[10px] font-bold text-emerald-600 w-10 text-right flex-shrink-0">
            {fmtCS(salesCSVal)}
          </span>
        </div>
        {/* ซื้อเข้า */}
        <div className="flex items-center gap-2">
          <span className="text-[10px] text-blue-500 w-12 flex-shrink-0 font-semibold">ซื้อเข้า</span>
          <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
            <div className="h-full rounded-full bg-blue-400 transition-all"
              style={{ width: `${saleInPct}%` }} />
          </div>
          <span className="num text-[10px] font-bold text-blue-500 w-10 text-right flex-shrink-0">
            {fmtCS(saleInVal)}
          </span>
        </div>
      </div>
    );
  }

  // ── Single-WH mode ──────────────────────────────────────
  if (selectedWH !== "ALL") {
    const idx = STOCK_WHS.indexOf(selectedWH);
    const v = idx >= 0 ? stocks[idx] : 0;
    return (
      <div className="bg-white border border-stone-100 rounded-2xl p-3.5 shadow-sm">
        <div className="flex items-start gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-sm font-semibold text-stone-900 line-clamp-2 leading-tight">{name}</div>
            <div className="text-[10px] text-stone-400 num mt-0.5">คลัง {selectedWH}</div>
          </div>
          <div className="text-right flex-shrink-0">
            <div className="num text-base font-extrabold text-stone-900">{v.toLocaleString()}</div>
            <div className="text-[10px] text-stone-400 num">ลัง</div>
          </div>
        </div>
        <ThreeBars stockVal={v} salesCSVal={salesCS} saleInVal={saleIn} />
      </div>
    );
  }

  // ── ALL mode ─────────────────────────────────────────────
  const maxStock = Math.max(...stocks, 1);
  return (
    <div className="bg-white border border-stone-100 rounded-2xl p-3.5 shadow-sm">
      {/* Header */}
      <div className="flex items-start gap-3 mb-2">
        <div className="flex-1 min-w-0">
          <div className="text-sm font-semibold text-stone-900 line-clamp-2 leading-tight">{name}</div>
        </div>
        <div className="text-right flex-shrink-0">
          <div className="num text-base font-extrabold text-stone-900">{filteredTotal.toLocaleString()}</div>
          <div className="text-[10px] text-stone-400 num">ลัง รวม</div>
        </div>
      </div>

      {/* Mini WH bar — breakdown per warehouse */}
      <div className="grid grid-cols-6 gap-1 mb-3">
        {STOCK_WHS.map((wh, i) => {
          const v = stocks[i];
          const pct = v > 0 ? (v / maxStock) * 100 : 0;
          const barColor = getStockColor(v, maxStock);
          return (
            <div key={wh} className="text-center">
              <div className="h-6 bg-stone-50 rounded relative overflow-hidden">
                {v > 0 && (
                  <div className="absolute bottom-0 left-0 right-0 rounded-sm transition-all"
                    style={{ height: `${Math.max(pct, 8)}%`, backgroundColor: barColor, opacity: 0.85 }} />
                )}
              </div>
              <div className="text-[9px] text-stone-400 mt-0.5 num">{wh}</div>
              <div className="text-[9px] font-semibold text-stone-700 num leading-tight">
                {v === 0 ? "—" : v >= 1000 ? (v / 1000).toFixed(1) + "K" : v}
              </div>
            </div>
          );
        })}
      </div>

      {/* 3-bar comparison */}
      <div className="border-t border-stone-100 pt-2.5">
        <ThreeBars stockVal={filteredTotal} salesCSVal={salesCS} saleInVal={saleIn} />
      </div>
    </div>
  );
}

function TabItem({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="flex flex-col items-center gap-0.5 py-1.5 px-3 flex-1">
      <Icon className={`w-5 h-5 ${active ? "text-stone-900" : "text-stone-400"}`} strokeWidth={active ? 2.5 : 2} />
      <span className={`text-[10px] font-semibold ${active ? "text-stone-900" : "text-stone-400"}`}>{label}</span>
    </button>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SalesApp />);
</script>
</body>
</html>
