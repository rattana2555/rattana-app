<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- v7.45 — Rattana Design Hub moved to rattanaphaiboon/app. The version in the title is higher than the last real build (v7.44),
     so tabs/desktop installs that are still open on the old address show their "มีเวอร์ชันใหม่" card → reload → land here → forwarded. -->
<title>Rattana Design Hub v7.45 — ย้ายไปที่ใหม่แล้ว</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rattanaphaiboon.github.io/app/rattana-design-hub.html">
<script>
(function () {
  var NEW = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? 'http://127.0.0.1:8781/rattana-design-hub.html'                         // local test copy of the new repo
    : 'https://rattanaphaiboon.github.io/app/rattana-design-hub.html';
  var hash = '';
  try {
    // Each website keeps its own browser storage → carry the saved settings over once in the URL hash (never sent to a server).
    // Skipped: the product / promo caches (they reload by themselves), the Gemini key (a secret), the user profile, update-prompt state.
    var skip = /^rattanaPriceTag_(cache|promoItems|locCache|geminiKey|updKeep|updSnooze)$/;
    var out = {}, total = 0, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!(/^rattanaPriceTag_/.test(k) || k === 'darkMode') || skip.test(k)) continue;
      var v = localStorage.getItem(k);
      if (v == null || v.length > 200000 || total + v.length > 400000) continue;
      out[k] = v; total += v.length; n++;
    }
    if (n) {
      var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(out)))).replace(/\+/g, '-').replace(/\//g, '_');
      hash = '#dhmigrate=b64.' + b64;
    }
  } catch (e) {}
  location.replace(NEW + location.search + hash);
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1b3e;color:#fff;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  a{color:#e8c86a;font-weight:700}
</style>
</head>
<body>
  <div>
    <h2>Rattana Design Hub ย้ายไปที่ใหม่แล้ว</h2>
    <p>กำลังพาไปที่ <a href="https://rattanaphaiboon.github.io/app/rattana-design-hub.html">rattanaphaiboon.github.io/app/rattana-design-hub.html</a></p>
    <p style="opacity:.75;font-size:14px">ถ้าไม่ไปเอง กดลิงก์ด้านบน แล้วบันทึกที่คั่นหน้า / ติดตั้งแอปใหม่จากที่อยู่ใหม่</p>
  </div>
</body>
</html>
