<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Card Designs — Rattana</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Kanit',sans-serif;background:#eef2f7;color:#0f172a;padding:24px 16px;min-height:100vh}
    .header{max-width:1100px;margin:0 auto 28px;text-align:center}
    .header h1{font-size:24px;color:#0d1b3e;margin-bottom:6px}
    .header p{color:#64748b;font-size:13px}
    .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:32px}
    @media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
    @media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
    .design-wrap{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;cursor:pointer}
    .design-wrap:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
    .design-wrap.selected{outline:3px solid #c8a02e;outline-offset:2px}
    .design-name{font-size:14px;font-weight:700;color:#0d1b3e;margin-bottom:4px}
    .design-desc{font-size:11px;color:#64748b;margin-bottom:14px;line-height:1.4;min-height:30px}

    .avatar-img{background:#94a3b8 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="35" r="18" fill="white"/><path d="M20 90 Q50 65 80 90 Z" fill="white"/></svg>') center/cover}

    .selected-bar{position:fixed;bottom:0;left:0;right:0;background:#0d1b3e;color:#fff;padding:14px;text-align:center;font-size:14px;display:none;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
    .selected-bar.show{display:block}
    .selected-bar code{background:rgba(200,160,46,.25);padding:4px 12px;border-radius:6px;font-weight:700;color:#e1ba50;margin:0 4px}

    /* ═══ Design 1: Current (Navy + Gold) ═══ */
    .d1{background:linear-gradient(135deg,#0d1b3e 0%,#1a2f5e 60%,#243b73 100%);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden}
    .d1::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(200,160,46,.18),transparent);border-radius:50%}
    .d1 .head{display:flex;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:1}
    .d1 .avatar{width:52px;height:52px;border-radius:50%;border:3px solid #c8a02e;background:#94a3b8}
    .d1 .hi{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px}
    .d1 .name{font-size:16px;font-weight:700;margin-top:2px}
    .d1 .tier{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(200,160,46,.14);border:1px solid rgba(200,160,46,.3);border-radius:12px;margin-bottom:18px;position:relative;z-index:1}
    .d1 .tier-info .label{font-size:10px;color:#e1ba50;text-transform:uppercase;font-weight:600}
    .d1 .tier-info .val{font-size:15px;font-weight:700}
    .d1 .points{text-align:center;position:relative;z-index:1}
    .d1 .points .label{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.6px}
    .d1 .points .val{font-size:36px;font-weight:800;color:#c8a02e;margin:4px 0;text-shadow:0 2px 12px rgba(200,160,46,.3)}
    .d1 .points .unit{font-size:12px;color:rgba(255,255,255,.6)}

    /* ═══ Design 2: Glassmorphism ═══ */
    .d2{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:24px;padding:20px;position:relative;overflow:hidden;color:#fff}
    .d2-bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.1),transparent 50%)}
    .d2 .glass{position:relative;z-index:1;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px}
    .d2 .head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .d2 .avatar{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:#94a3b8}
    .d2 .hi{font-size:11px;color:rgba(255,255,255,.75)}
    .d2 .name{font-size:16px;font-weight:700;margin-top:2px}
    .d2 .tier-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,.1);border-radius:12px;margin-bottom:14px}
    .d2 .tier-row .left{display:flex;align-items:center;gap:8px;font-weight:600}
    .d2 .pts-block{text-align:center;padding:8px 0}
    .d2 .pts-label{font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.5px}
    .d2 .pts-val{font-size:42px;font-weight:800;color:#fff;line-height:1;margin:6px 0}
    .d2 .pts-unit{font-size:12px;color:rgba(255,255,255,.75)}

    /* ═══ Design 3: Minimal White ═══ */
    .d3{background:#fff;border-radius:24px;padding:24px;border:1px solid #e2e8f0;color:#0f172a;box-shadow:0 8px 32px rgba(0,0,0,.06)}
    .d3 .head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
    .d3 .avatar{width:56px;height:56px;border-radius:50%;background:#94a3b8;border:3px solid #c8a02e}
    .d3 .hi{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .d3 .name{font-size:18px;font-weight:700;color:#0d1b3e;margin-top:2px}
    .d3 .pill{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fef3c7,#fde68a);padding:8px 16px;border-radius:24px;margin-bottom:18px}
    .d3 .pill .ico{font-size:18px}
    .d3 .pill .name-t{font-size:14px;font-weight:700;color:#92400e}
    .d3 .divider{border-top:1px dashed #e2e8f0;margin:14px 0}
    .d3 .points{text-align:center}
    .d3 .pts-l{font-size:11px;color:#64748b;letter-spacing:.5px;font-weight:600}
    .d3 .pts-v{font-size:44px;font-weight:800;background:linear-gradient(135deg,#c8a02e,#e1ba50);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin:6px 0}
    .d3 .pts-u{font-size:12px;color:#64748b}

    /* ═══ Design 4: Premium Black + Gold ═══ */
    .d4{background:#0a0a0a;background-image:linear-gradient(135deg,rgba(200,160,46,.08),transparent 60%),radial-gradient(circle at 80% 0%,rgba(200,160,46,.12),transparent 40%);border:1px solid rgba(200,160,46,.3);border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden}
    .d4::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#c8a02e,transparent)}
    .d4 .head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .d4 .avatar{width:54px;height:54px;border-radius:50%;border:2px solid #c8a02e;background:#94a3b8;box-shadow:0 0 16px rgba(200,160,46,.3)}
    .d4 .hi{font-size:10px;color:#c8a02e;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
    .d4 .name{font-size:16px;font-weight:700;margin-top:3px}
    .d4 .tier-line{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid rgba(200,160,46,.2);border-bottom:1px solid rgba(200,160,46,.2);margin-bottom:18px}
    .d4 .tier-line .lbl{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;text-transform:uppercase}
    .d4 .tier-line .val{font-size:14px;font-weight:700;color:#c8a02e;display:flex;align-items:center;gap:6px}
    .d4 .points-display{text-align:center}
    .d4 .pl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
    .d4 .pv{font-size:48px;font-weight:300;color:#c8a02e;margin:6px 0;line-height:1;letter-spacing:-1px}
    .d4 .pu{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px}

    /* ═══ Design 5: Pastel Pink (Cute) ═══ */
    .d5{background:linear-gradient(135deg,#fce7f3 0%,#fbcfe8 50%,#f9a8d4 100%);border-radius:28px;padding:22px;color:#831843;position:relative;overflow:hidden}
    .d5::before{content:'';position:absolute;top:-30px;right:-30px;font-size:120px;opacity:.15}
    .d5 .head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .d5 .avatar{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:#94a3b8;box-shadow:0 4px 12px rgba(190,24,93,.2)}
    .d5 .hi{font-size:11px;color:#be185d;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
    .d5 .name{font-size:16px;font-weight:700;margin-top:2px}
    .d5 .badge{display:inline-flex;align-items:center;gap:8px;background:#fff;padding:8px 16px;border-radius:24px;margin-bottom:16px;box-shadow:0 4px 12px rgba(190,24,93,.15)}
    .d5 .badge .ico{font-size:20px}
    .d5 .badge .n{font-size:14px;font-weight:700;color:#831843}
    .d5 .pts-card{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 12px rgba(190,24,93,.1)}
    .d5 .pl{font-size:10px;color:#be185d;text-transform:uppercase;font-weight:600;letter-spacing:.6px}
    .d5 .pv{font-size:38px;font-weight:800;color:#be185d;line-height:1;margin:4px 0}
    .d5 .pu{font-size:11px;color:#9f1239}

    /* ═══ Design 6: Side Layout ═══ */
    .d6{background:#fff;border-radius:22px;padding:20px;border:1px solid #e2e8f0;color:#0f172a;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.06)}
    .d6 .left-col{display:flex;flex-direction:column;align-items:center;text-align:center;padding-right:18px;border-right:1px solid #e2e8f0}
    .d6 .avatar{width:64px;height:64px;border-radius:50%;background:#94a3b8;border:3px solid #c8a02e;margin-bottom:8px}
    .d6 .name{font-size:13px;font-weight:700;color:#0d1b3e;max-width:90px;line-height:1.3}
    .d6 .tier-mini{font-size:10px;color:#64748b;margin-top:4px;display:flex;align-items:center;gap:4px;background:#fef3c7;padding:3px 8px;border-radius:10px;color:#92400e;font-weight:600}
    .d6 .right-col{text-align:left}
    .d6 .pl{font-size:10px;color:#64748b;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
    .d6 .pv{font-size:44px;font-weight:800;color:#0d1b3e;line-height:1;margin:4px 0}
    .d6 .pv .accent{color:#c8a02e}
    .d6 .pu{font-size:12px;color:#64748b}

    /* ═══ Design 7: Card stack ═══ */
    .d7{background:linear-gradient(135deg,#1e3a8a,#1e40af);border-radius:24px;padding:20px;color:#fff;position:relative}
    .d7-stack{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.15)}
    .d7 .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .d7 .head-l{display:flex;align-items:center;gap:10px}
    .d7 .avatar{width:44px;height:44px;border-radius:50%;background:#94a3b8;border:2px solid rgba(255,255,255,.3)}
    .d7 .name-block .hi{font-size:9px;color:rgba(255,255,255,.6);letter-spacing:.5px;text-transform:uppercase}
    .d7 .name-block .name{font-size:13px;font-weight:700}
    .d7 .tier-chip{background:#c8a02e;color:#0d1b3e;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
    .d7 .big-pts{padding:24px 0;text-align:center}
    .d7 .big-pts .l{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.6px}
    .d7 .big-pts .v{font-size:54px;font-weight:800;line-height:1;margin:6px 0;background:linear-gradient(135deg,#fff,#c8a02e);-webkit-background-clip:text;background-clip:text;color:transparent}
    .d7 .big-pts .u{font-size:11px;color:rgba(255,255,255,.6)}

    /* ═══ Design 8: Soft Lavender ═══ */
    .d8{background:linear-gradient(135deg,#ede9fe,#ddd6fe);border-radius:24px;padding:20px;color:#312e81;position:relative;overflow:hidden}
    .d8::before{content:'✨';position:absolute;top:8px;right:14px;font-size:18px;opacity:.4}
    .d8 .head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .d8 .avatar{width:52px;height:52px;border-radius:50%;background:#94a3b8;border:3px solid #fff;box-shadow:0 4px 12px rgba(76,29,149,.15)}
    .d8 .hi{font-size:11px;color:#6d28d9;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
    .d8 .name{font-size:16px;font-weight:700;margin-top:2px}
    .d8 .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .d8 .col-card{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border-radius:14px;padding:12px;text-align:center}
    .d8 .col-card .l{font-size:9px;color:#6d28d9;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px}
    .d8 .col-card .v{font-size:18px;font-weight:700;color:#312e81}
    .d8 .col-card.full{grid-column:1/-1}
    .d8 .col-card .vv{font-size:32px;font-weight:800;color:#6d28d9;line-height:1;margin:2px 0}
    .d8 .col-card .uu{font-size:11px;color:#6d28d9}

    /* ═══ Design 9: Sunset Orange ═══ */
    .d9{background:linear-gradient(135deg,#fb923c 0%,#f97316 50%,#ea580c 100%);border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden}
    .d9::before{content:'';position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent);border-radius:50%}
    .d9 .head{display:flex;align-items:center;gap:12px;margin-bottom:18px;position:relative;z-index:1}
    .d9 .avatar{width:52px;height:52px;border-radius:50%;background:#94a3b8;border:3px solid #fff;box-shadow:0 4px 12px rgba(154,52,18,.3)}
    .d9 .hi{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
    .d9 .name{font-size:16px;font-weight:700;margin-top:2px}
    .d9 .tier-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);padding:10px 14px;border-radius:14px;margin-bottom:16px;position:relative;z-index:1}
    .d9 .tier-row .tn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
    .d9 .pts-section{position:relative;z-index:1;text-align:center}
    .d9 .pl{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
    .d9 .pv{font-size:40px;font-weight:800;line-height:1;margin:6px 0}
    .d9 .pu{font-size:12px;color:rgba(255,255,255,.85)}

    /* ═══ Design 10: Compact Horizontal ═══ */
    .d10{background:#0d1b3e;color:#fff;border-radius:20px;padding:18px;border:1px solid rgba(200,160,46,.3);display:flex;flex-direction:column;gap:14px}
    .d10 .top{display:flex;align-items:center;gap:12px}
    .d10 .avatar{width:48px;height:48px;border-radius:50%;background:#94a3b8;border:2px solid #c8a02e;flex-shrink:0}
    .d10 .info{flex:1;min-width:0}
    .d10 .info .hi{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase}
    .d10 .info .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .d10 .tier-pill{background:#c8a02e;color:#0d1b3e;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;flex-shrink:0}
    .d10 .pts-bar{background:linear-gradient(135deg,rgba(200,160,46,.15),rgba(200,160,46,.05));border:1px solid rgba(200,160,46,.25);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
    .d10 .pts-bar .lbl{font-size:11px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px}
    .d10 .pts-bar .val{font-size:30px;font-weight:800;color:#c8a02e;line-height:1}
    .d10 .pts-bar .small{font-size:10px;color:rgba(255,255,255,.5);text-align:right;margin-top:2px}

    /* ═══ Design 11: Neon Cyber ═══ */
    .d11{background:#0a0e27;border-radius:20px;padding:22px;color:#fff;border:1px solid #1e3a8a;position:relative;overflow:hidden}
    .d11::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,rgba(59,130,246,.15),transparent 50%),radial-gradient(circle at 100% 100%,rgba(168,85,247,.15),transparent 50%)}
    .d11 .head{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .d11 .avatar{width:52px;height:52px;border-radius:50%;background:#94a3b8;border:2px solid #06b6d4;box-shadow:0 0 20px rgba(6,182,212,.4)}
    .d11 .hi{font-size:10px;color:#06b6d4;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
    .d11 .name{font-size:16px;font-weight:700;margin-top:3px}
    .d11 .tier-glow{position:relative;z-index:1;text-align:center;padding:10px 14px;background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);border-radius:12px;margin-bottom:18px}
    .d11 .tier-glow .l{font-size:9px;color:#67e8f9;letter-spacing:1.5px;text-transform:uppercase}
    .d11 .tier-glow .v{font-size:14px;font-weight:700;color:#06b6d4;text-shadow:0 0 12px rgba(6,182,212,.6)}
    .d11 .pts{position:relative;z-index:1;text-align:center}
    .d11 .pts .l{font-size:10px;color:#a78bfa;letter-spacing:1.2px;text-transform:uppercase}
    .d11 .pts .v{font-size:44px;font-weight:800;color:#a78bfa;text-shadow:0 0 24px rgba(168,85,247,.5);line-height:1;margin:6px 0}
    .d11 .pts .u{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1px}

    /* ═══ Design 12: Receipt Style ═══ */
    .d12{background:#fff;border-radius:18px;padding:0;border:1px dashed #cbd5e1;color:#0f172a;overflow:hidden}
    .d12 .top-bar{background:#0d1b3e;color:#fff;padding:14px;text-align:center;font-size:12px;letter-spacing:1px;font-weight:600}
    .d12 .body{padding:18px}
    .d12 .head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed #cbd5e1}
    .d12 .avatar{width:48px;height:48px;border-radius:50%;background:#94a3b8}
    .d12 .name{font-size:14px;font-weight:700}
    .d12 .sub{font-size:11px;color:#64748b}
    .d12 .row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}
    .d12 .row .l{color:#64748b}
    .d12 .row .v{font-weight:700}
    .d12 .pts-total{margin-top:10px;padding-top:14px;border-top:1px dashed #cbd5e1;display:flex;justify-content:space-between;align-items:baseline}
    .d12 .pts-total .l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
    .d12 .pts-total .v{font-size:32px;font-weight:800;color:#c8a02e}
  </style>
</head>
<body>

<div class="header">
  <h1>🎨 ออกแบบ Dashboard Card</h1>
  <p>คลิกการ์ดที่ชอบ แล้วบอกหมายเลขในแชท</p>
</div>

<div class="grid" id="grid"></div>
<div class="selected-bar" id="bar"></div>

<script>
const DESIGNS = [
  { n:1, name:'Navy + Gold (ปัจจุบัน)', desc:'หรู เป็นทางการ', html: `
    <div class="d1">
      <div class="head"><div class="avatar"></div><div><div class="hi">สวัสดี</div><div class="name">คุณ ภัทรวรรณ งั่วสมบูรณ์</div></div></div>
      <div class="tier"><div style="font-size:24px">💎</div><div class="tier-info"><div class="label">ระดับสมาชิก</div><div class="val">Platinum</div></div></div>
      <div class="points"><div class="label">แต้มสะสม</div><div class="val">100</div><div class="unit">คะแนน</div></div>
    </div>`
  },

const grid = document.getElementById('grid');
DESIGNS.forEach(d => {
  const wrap = document.createElement('div');
  wrap.className = 'design-wrap';
  wrap.dataset.n = d.n;
  wrap.innerHTML = `
    <div class="design-name">${d.n}. ${d.name}</div>
    <div class="design-desc">${d.desc}</div>
    ${d.html}
  `;
  wrap.onclick = () => pick(d.n, d.name);
  grid.appendChild(wrap);
});

function pick(n, name) {
  document.querySelectorAll('.design-wrap').forEach(w => w.classList.toggle('selected', w.dataset.n == n));
  const bar = document.getElementById('bar');
  bar.innerHTML = `✓ เลือก <code>#${n} ${name}</code> — บอกเลขนี้ในแชท`;
  bar.classList.add('show');
}
</script>
