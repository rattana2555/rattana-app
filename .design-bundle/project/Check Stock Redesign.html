<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rattana Stock — แนว B</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif}
  .phone-iframe{width:100%;height:100%;border:0;display:block;background:#eef1f7}
  .dir-note{font-size:13px;line-height:1.5;color:#46506a}
  .dir-note b{color:#13294d}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useRef } = React;

function Phone({ dir }) {
  // key forces a fresh iframe so each board keeps its own state
  return <iframe className="phone-iframe" src={`prototype.html?dir=${dir}`} title={`Direction ${dir}`}></iframe>;
}

function App() {
  return (
    <DesignCanvas title="Rattana Stock — แนว B (ฉบับใช้งานจริง)" subtitle="Live list · มือถือ + คอม · ธีมน้ำเงินเข้ม · รองรับเครื่องยิงบาร์โค้ด USB · กดเล่นได้จริง (ดับเบิลคลิกที่กรอบเพื่อเปิดเต็มจอ)">
      <DCSection id="main" title="แนว B · Live list" subtitle="หน้าหลักสะอาด · สแกนแล้วใส่จำนวนก่อน · แก้ในแถวได้ · สรุปผล CS.EA">
        <DCArtboard id="B" label="มือถือ · 390×844" width={390} height={844}>
          <Phone dir="B" />
        </DCArtboard>
        <DCArtboard id="nB" label="แนวคิด" width={360} height={844}>
          <div style={{padding:'24px',height:'100%',boxSizing:'border-box',background:'#fff'}}>
            <div className="dir-note">
              <b style={{fontSize:'15px'}}>B · Live list — เหมาะกับนับเร็ว / นับเยอะ</b><br/><br/>
              <b>หน้านับ</b><br/>
              เห็นทุกอย่างในจอเดียว · แถวโชว์สะอาด (ชื่อ · นับ/ระบบ · สถานะ) · แตะแถวเพื่อกางแก้จำนวน — ปรับได้ทั้งปุ่ม +/− และพิมพ์ตัวเลข (CS/PA/EA)<br/><br/>
              <b>สแกน</b><br/>
              ช่องล่างรับ <b>เครื่องยิงบาร์โค้ด USB</b> หรือพิมพ์เลข + Enter · มีปุ่มกล้องสำหรับมือถือ<br/><br/>
              <b>สแกนแล้วใส่จำนวนก่อน</b><br/>
              ยิง → การ์ดใส่จำนวนเด้งบนสุด → พิมพ์เลข + Enter → ยิงตัวถัดไป (ไม่ +1 อัตโนมัติ ไม่ต้องเลื่อนหาแก้ทีหลัง)<br/><br/>
              <b>สรุปผล</b><br/>
              แถวสั้นกระชับ เห็นหลายรายการ · ชิปสถานะเป็น <b>CS.EA</b> (เช่น ขาด 4 CS 17 EA)
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="desktop" title="บนคอมพิวเตอร์" subtitle="จอกว้าง ≥ 980px ปรับเป็น 2 ฝั่งอัตโนมัติ · ซ้าย=สแกน+รายการนับ · ขวา=สรุปผลสด · ไฟล์เดียวกัน">
        <DCArtboard id="dsk" label="Desktop · เต็มจอ + USB scanner" width={1280} height={800}>
          <Phone dir="B" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
