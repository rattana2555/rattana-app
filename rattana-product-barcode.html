<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rattana Product Catalog v1.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════
       RATTANA DESIGN TOKENS
    ══════════════════════════════════════════════ */
    :root {
      --navy:        #0d1b3e;
      --navy-mid:    #1a2f5e;
      --navy-light:  #243b73;
      --gold:        #c9a84c;
      --gold-light:  #e8c86a;
      --success:     #2ecc71;
      --danger:      #e74c3c;
      --warning:     #f39c12;
      --info:        #3498db;

      --bg:          #f4f6fb;
      --text:        #0d1b3e;
      --card-bg:     #ffffff;
      --border:      #dde3f0;
      --muted:       #6b7896;
      --row-alt:     #fafbfd;

      --space-xs: 4px;  --space-sm: 8px;   --space-md: 16px;
      --space-lg: 24px; --space-xl: 32px;
      --radius-sm: 6px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
      --shadow-sm:   0 1px 4px rgba(0,0,0,.06);
      --shadow-md:   0 2px 8px rgba(0,0,0,.08);
      --shadow-lg:   0 8px 24px rgba(13,27,62,.12);
      --shadow-gold: 0 4px 12px rgba(201,168,76,.35);
    }
    body.dark {
      --bg:      #0a1020;
      --text:    #e8eaf0;
      --card-bg: #111c35;
      --border:  #243b73;
      --muted:   #8a98b8;
      --row-alt: #0f1830;
    }

    /* ══════════════════════════════════════════════
       RESET + BASE
    ══════════════════════════════════════════════ */
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
    body {
      font-family:'Sarabun',sans-serif; font-size:14px; line-height:1.5;
      min-height:100dvh; overflow-x:hidden;
      background:var(--bg); color:var(--text);
      transition:background .25s,color .25s;
    }
    button { font-family:inherit; cursor:pointer; border:none;
             -webkit-tap-highlight-color:transparent; touch-action:manipulation }
    input  { font-family:inherit; font-size:16px }
    img    { display:block }
    a      { color:var(--gold) }

    /* ══════════════════════════════════════════════
       HEADER (navy + gold border — Rattana standard)
    ══════════════════════════════════════════════ */
    header {
      background:var(--navy); color:#fff;
      padding:12px 16px;
      padding-top:max(12px,env(safe-area-inset-top));
      position:sticky; top:0; z-index:100;
      display:flex; align-items:center; gap:10px;
      border-bottom:3px solid var(--gold);
    }
    .logo-seal {
      width:36px; height:36px; border-radius:50%;
      border:2px solid var(--gold); flex-shrink:0;
      background:var(--gold); color:var(--navy);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:700;
    }
    .logo-wrap { flex:1; min-width:0 }
    .logo-text  { font-size:16px; font-weight:700; letter-spacing:1px; color:#fff }
    .logo-text span { color:var(--gold) }
    .logo-sub   { font-size:10px; opacity:.6; margin-top:1px }
    .icon-btn {
      background:transparent; color:#fff;
      border:1px solid rgba(255,255,255,.2);
      width:38px; height:38px; border-radius:var(--radius-sm);
      display:flex; align-items:center; justify-content:center;
      font-size:17px; transition:background .15s; flex-shrink:0;
    }
    .icon-btn:hover { background:rgba(255,255,255,.12) }

    /* ══════════════════════════════════════════════
       PAGE SHELL
    ══════════════════════════════════════════════ */
    .page    { min-height:100dvh; display:flex; flex-direction:column }
    .content { flex:1; padding:12px; max-width:960px; margin:0 auto; width:100% }
    @media(min-width:640px)  { .content { padding:16px } }
    @media(min-width:1024px) { .content { padding:20px } }

    /* ══════════════════════════════════════════════
       SEARCH ZONE (navy-mid bg under header)
    ══════════════════════════════════════════════ */
    .search-zone {
      background:var(--navy-mid);
      padding:10px 16px 14px;
    }
    .search-inner { max-width:960px; margin:0 auto }
    .search-box {
      display:flex; align-items:center; gap:8px;
      background:var(--card-bg); border:1.5px solid var(--border);
      border-radius:30px; padding:0 14px; height:44px;
      transition:border-color .15s;
    }
    .search-box:focus-within { border-color:var(--gold) }
    .search-box input {
      flex:1; border:none; outline:none;
      background:transparent; color:var(--text); font-size:16px; font-family:inherit;
    }
    .search-box input::placeholder { color:var(--muted) }
    .s-icon  { color:var(--muted); font-size:16px; flex-shrink:0 }
    .s-clear {
      background:var(--border); border:none; border-radius:50%;
      width:20px; height:20px; color:var(--muted); font-size:11px;
      display:none; align-items:center; justify-content:center;
      cursor:pointer; flex-shrink:0;
    }
    .s-clear.vis { display:flex }

    /* ══════════════════════════════════════════════
       STATS BAR
    ══════════════════════════════════════════════ */
    .stats-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 4px 4px; font-size:12px; color:var(--muted);
    }
    .stats-bar strong { color:var(--text) }

    /* ══════════════════════════════════════════════
       CARDS
    ══════════════════════════════════════════════ */
    .card {
      background:var(--card-bg); border-radius:var(--radius-md);
      border:1px solid var(--border); box-shadow:var(--shadow-md);
      overflow:hidden;
    }
    .card-gold { border-top:3px solid var(--gold) }

    /* ══════════════════════════════════════════════
       PRODUCT LIST ITEMS
    ══════════════════════════════════════════════ */
    .product-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; cursor:pointer;
      border-bottom:1px solid var(--border);
      transition:background .12s;
      -webkit-tap-highlight-color:transparent;
    }
    .product-item:last-child { border-bottom:none }
    .product-item:hover  { background:rgba(201,168,76,.06) }
    .product-item:active { background:rgba(201,168,76,.13) }

    .p-thumb {
      width:52px; height:52px; border-radius:var(--radius-sm);
      object-fit:cover; flex-shrink:0;
      border:1px solid var(--border); background:var(--row-alt);
    }
    .p-thumb-ph {
      width:52px; height:52px; border-radius:var(--radius-sm);
      background:var(--row-alt); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:24px; border:1px solid var(--border); color:var(--muted);
    }
    .p-info   { flex:1; min-width:0 }
    .p-cat    { font-size:11px; color:var(--gold); font-weight:700; margin-bottom:2px;
                text-transform:uppercase; letter-spacing:.4px }
    .p-name   { font-size:14px; font-weight:600; color:var(--text); line-height:1.4 }
    .p-hint   { font-size:11px; color:var(--muted); margin-top:2px;
                font-family:'Courier New',monospace }
    .p-arrow  { color:var(--border); font-size:22px; flex-shrink:0; font-weight:300 }

    /* Badges */
    .badge       { display:inline-block; padding:2px 8px; border-radius:10px;
                   font-size:11px; font-weight:600; white-space:nowrap }
    .badge-gold  { background:rgba(201,168,76,.18); color:var(--navy);
                   border:1px solid rgba(201,168,76,.4) }
    body.dark .badge-gold { color:var(--gold-light) }
    .badge-ok    { background:#e8f7ee; color:#1e8449 }
    body.dark .badge-ok { background:#1a3a25; color:#7be0a3 }

    /* ══════════════════════════════════════════════
       PAGINATION
    ══════════════════════════════════════════════ */
    .pagination {
      display:flex; align-items:center; justify-content:center;
      gap:4px; padding:14px 4px 8px; flex-wrap:wrap;
    }
    .page-btn {
      min-width:36px; height:36px; border-radius:var(--radius-sm);
      border:1px solid var(--border); background:var(--card-bg);
      color:var(--text); font-family:inherit; font-size:13px; font-weight:500;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      padding:0 8px; transition:all .12s;
    }
    .page-btn:hover  { background:rgba(201,168,76,.1); border-color:var(--gold) }
    .page-btn.active { background:var(--gold); color:var(--navy);
                       border-color:var(--gold); font-weight:700 }
    .page-btn:disabled { opacity:.4; cursor:not-allowed }
    .page-ellipsis { color:var(--muted); padding:0 4px; font-size:13px; line-height:36px }

    /* ══════════════════════════════════════════════
       SPINNER OVERLAY
    ══════════════════════════════════════════════ */
    .spinner-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(13,27,62,.55); align-items:center;
      justify-content:center; z-index:99999; backdrop-filter:blur(3px);
    }
    .spinner-overlay.show { display:flex }
    .spinner-box {
      background:var(--card-bg); border-radius:var(--radius-lg);
      padding:32px 40px; text-align:center;
      border-top:4px solid var(--gold); min-width:220px;
    }
    .spinner-ring {
      width:48px; height:48px; border:5px solid var(--border);
      border-top-color:var(--gold); border-radius:50%;
      animation:spin .8s linear infinite; margin:0 auto 14px;
    }
    .spinner-box p { color:var(--muted); font-size:13px }

    /* ══════════════════════════════════════════════
       DETAIL PANEL (slide-in from right)
    ══════════════════════════════════════════════ */
    #detailPanel {
      display:none; position:fixed; inset:0; z-index:200;
      background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    #detailPanel.show {
      display:block;
      animation:slideIn .22s cubic-bezier(.25,.46,.45,.94);
    }

    /* Detail header */
    .dv-header {
      background:var(--navy); color:#fff;
      padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top));
      position:sticky; top:0; z-index:10;
      border-bottom:3px solid var(--gold);
      display:flex; align-items:center; gap:12px;
    }
    .dv-title {
      flex:1; font-size:16px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .dv-body { padding:14px; max-width:640px; margin:0 auto }
    @media(min-width:640px) { .dv-body { padding:20px } }

    /* Hero card */
    .hero-card {
      background:var(--card-bg); border-radius:var(--radius-lg);
      padding:18px; display:flex; align-items:flex-start; gap:14px;
      margin-bottom:14px; box-shadow:var(--shadow-md);
      border-top:3px solid var(--gold);
    }
    .hero-img {
      width:84px; height:84px; border-radius:var(--radius-md);
      object-fit:cover; border:1px solid var(--border); flex-shrink:0;
      background:var(--row-alt);
    }
    .hero-img-ph {
      width:84px; height:84px; border-radius:var(--radius-md);
      background:var(--row-alt); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:38px; border:1px solid var(--border);
    }
    .hero-info    { flex:1; min-width:0 }
    .hero-name    { font-size:16px; font-weight:700; line-height:1.45;
                    color:var(--text); margin-bottom:8px }

    /* Info card */
    .info-card {
      background:var(--card-bg); border-radius:var(--radius-md);
      margin-bottom:14px; box-shadow:var(--shadow-sm);
      border:1px solid var(--border); overflow:hidden;
    }
    .info-card-head {
      padding:10px 16px;
      background:linear-gradient(to right,rgba(201,168,76,.1),transparent);
      border-bottom:1px solid var(--border);
      font-size:11px; font-weight:700; color:var(--gold);
      text-transform:uppercase; letter-spacing:.6px;
    }
    .info-row {
      display:flex; justify-content:space-between; align-items:flex-start;
      padding:9px 16px; border-bottom:1px solid var(--border); gap:12px;
    }
    .info-row:last-child { border-bottom:none }
    .info-label { font-size:13px; color:var(--muted); flex-shrink:0 }
    .info-value { font-size:13px; font-weight:600; color:var(--text);
                  text-align:right; word-break:break-all }

    /* Barcode section */
    .bc-title {
      font-size:11px; font-weight:700; color:var(--muted);
      text-transform:uppercase; letter-spacing:.6px;
      margin-bottom:10px; display:flex; align-items:center; gap:8px;
    }
    .barcode-card {
      background:var(--card-bg); border-radius:var(--radius-md);
      padding:18px 14px 14px; margin-bottom:12px;
      box-shadow:var(--shadow-sm); border:1px solid var(--border);
      text-align:center;
    }
    .bc-type {
      display:inline-block; background:var(--navy); color:#fff;
      border-radius:var(--radius-sm); padding:3px 12px;
      font-size:11px; font-weight:700; letter-spacing:2px;
      margin-bottom:14px; border-bottom:2px solid var(--gold);
    }
    body.dark .bc-type { background:var(--navy-light) }
    .bc-svg-wrap {
      width:100%; overflow-x:auto; display:flex;
      justify-content:center; margin-bottom:6px;
    }
    .bc-svg-wrap svg { max-width:100%; display:block }
    .bc-num {
      font-size:14px; font-weight:600; letter-spacing:1.2px;
      font-family:'Courier New',monospace; color:var(--text); margin-top:2px;
    }
    .bc-unit  { font-size:12px; color:var(--muted); margin-top:4px }
    .bc-error { color:var(--danger); font-size:12px; padding:10px 0 }

    /* ══════════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════════ */
    .btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:9px 16px; border-radius:var(--radius-sm);
      font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
      border:1px solid transparent; min-height:40px;
      transition:opacity .15s,transform .1s;
    }
    .btn:active  { transform:scale(.97) }
    .btn-gold    { background:var(--gold); color:var(--navy); border-color:var(--gold) }
    .btn-gold:hover { background:var(--gold-light) }
    .btn-outline { background:transparent; color:#fff; border-color:rgba(255,255,255,.4) }
    .btn-outline:hover { background:rgba(255,255,255,.1) }
    .btn-sm { padding:5px 12px; font-size:12px; min-height:32px }

    /* ══════════════════════════════════════════════
       TOAST
    ══════════════════════════════════════════════ */
    .toast {
      position:fixed;
      bottom:max(24px,env(safe-area-inset-bottom));
      right:16px; padding:12px 20px; border-radius:var(--radius-md);
      color:#fff; z-index:9999; animation:toastIn .3s ease;
      font-weight:500; box-shadow:var(--shadow-lg);
      max-width:90vw; font-size:13px;
    }
    .toast-success { background:var(--success) }
    .toast-error   { background:var(--danger) }
    .toast-info    { background:var(--navy-mid); border-left:3px solid var(--gold) }

    /* ══════════════════════════════════════════════
       BACK-TO-TOP (gold circle — Rattana standard)
    ══════════════════════════════════════════════ */
    #backToTop {
      position:fixed;
      bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));
      right:max(16px,calc(12px + env(safe-area-inset-right)));
      background:var(--gold); color:var(--navy); border:none;
      border-radius:50%; width:46px; height:46px;
      display:none; align-items:center; justify-content:center;
      box-shadow:var(--shadow-gold); z-index:90;
      font-size:18px; font-weight:700; cursor:pointer;
    }
    #backToTop.show { display:flex }

    /* ══════════════════════════════════════════════
       EMPTY / ERROR
    ══════════════════════════════════════════════ */
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted) }
    .empty-icon  { font-size:52px; margin-bottom:14px }
    .empty-state p { font-size:15px }
    .error-card {
      background:rgba(231,76,60,.08); border:1px solid rgba(231,76,60,.25);
      border-radius:var(--radius-md); padding:20px; margin:8px 0;
      text-align:center; color:var(--danger); line-height:1.8; font-size:14px;
    }
    .footer-space { height:max(28px,env(safe-area-inset-bottom)) }

    /* ══════════════════════════════════════════════
       ANIMATIONS
    ══════════════════════════════════════════════ */
    @keyframes spin    { to { transform:rotate(360deg) } }
    @keyframes slideIn { from { transform:translateX(100%) } to { transform:translateX(0) } }
    @keyframes slideUp { from { transform:translateY(20px);opacity:0 } to { transform:translateY(0);opacity:1 } }
    @keyframes fadeIn  { from { opacity:0;transform:translateY(6px) } to { opacity:1;transform:translateY(0) } }
    @keyframes toastIn { from { transform:translateX(120%);opacity:0 } to { transform:translateX(0);opacity:1 } }

    /* ══════════════════════════════════════════════
       PRINT
    ══════════════════════════════════════════════ */
    @media print {
      #listPage    { display:none!important }
      #detailPanel { position:static!important;overflow:visible!important;
                     animation:none!important;display:block!important }
      .dv-header, #backToTop { display:none!important }
      .barcode-card { break-inside:avoid; box-shadow:none!important }
      .hero-card,.info-card { box-shadow:none!important }
    }
  </style>
</head>
<body>

<!-- ╔════════════════════════════════╗
     ║          LIST PAGE             ║
     ╚════════════════════════════════╝ -->
<div id="listPage" class="page">

  <!-- ── Header ── -->
  <header>
    <div class="logo-seal">R</div>
    <div class="logo-wrap">
      <div class="logo-text">RATTANA <span>PRODUCT</span></div>
      <div class="logo-sub">v1.1 · 2026-05-14</div>
    </div>
    <button class="icon-btn" id="btnRefresh" onclick="refreshData()" title="รีเฟรช">⟳</button>
    <button class="icon-btn" onclick="toggleDark()" title="โหมดมืด/สว่าง">🌙</button>
  </header>

  <!-- ── Search zone (navy-mid bg) ── -->
  <div class="search-zone">
    <div class="search-inner">
      <div class="search-box">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput"
               placeholder="ค้นหาสินค้า / หมวดหมู่ / บาร์โค้ด…"
               autocomplete="off" oninput="onSearch(this)">
        <button class="s-clear" id="clearBtn" onclick="clearSearch()">✕</button>
      </div>
    </div>
  </div>

  <!-- ── Content ── -->
  <div class="content">
    <div id="statsBar" class="stats-bar" style="display:none">
      <span id="statsText"></span>
      <span id="pageText" style="font-weight:600;color:var(--text)"></span>
    </div>
    <div id="productList"></div>
    <div id="pagination" class="pagination"></div>
    <div class="footer-space"></div>
  </div>

</div>

<!-- ╔════════════════════════════════╗
     ║        DETAIL PANEL            ║
     ╚════════════════════════════════╝ -->
<div id="detailPanel">
  <div class="dv-header">
    <button class="icon-btn" onclick="goBack()" aria-label="กลับ"
            style="border:1px solid rgba(255,255,255,.3)">←</button>
    <span class="dv-title" id="dvTitle">รายละเอียดสินค้า</span>
    <button class="btn btn-gold btn-sm" onclick="window.print()">🖨 พิมพ์</button>
  </div>
  <div class="dv-body" id="detailBody"></div>
  <div class="footer-space"></div>
</div>

<!-- Spinner overlay -->
<div class="spinner-overlay" id="spinnerOverlay">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <p>กำลังโหลดข้อมูล…</p>
  </div>
</div>

<!-- Back-to-top (gold circle) -->
<button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="กลับด้านบน">↑</button>

<script>
/* ═══════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════ */
const SHEET_ID  = '1ImkivuDxxTaluPVt2dJLX12fhVWvpU5czshn-OsRYuY';
const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const PAGE_SIZE = 8;

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let allProducts      = [];
let filteredProducts = [];
let currentPage      = 1;
let searchTimer      = null;
let rawRowsCache     = [];   // raw 2D array for unit-column lookup

/* ═══════════════════════════════════════════════════
   DARK MODE
═══════════════════════════════════════════════════ */
if (localStorage.getItem('rattana-dark') === '1') document.body.classList.add('dark');
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('rattana-dark', document.body.classList.contains('dark') ? '1' : '0');
}

/* ═══════════════════════════════════════════════════
   BACK-TO-TOP
═══════════════════════════════════════════════════ */
window.addEventListener('scroll', () =>
  document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300)
);

/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
function showToast(msg, type = 'info', ms = 3500) {
  const t = Object.assign(document.createElement('div'), {
    className: `toast toast-${type}`,
    textContent: msg,
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* ═══════════════════════════════════════════════════
   SPINNER
═══════════════════════════════════════════════════ */
const showSpinner = () => document.getElementById('spinnerOverlay').classList.add('show');
const hideSpinner = () => document.getElementById('spinnerOverlay').classList.remove('show');

/* ═══════════════════════════════════════════════════
   RFC-4180 CSV → OBJECT ARRAY  (Rattana skill standard)
═══════════════════════════════════════════════════ */
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else inQ=false;}
      else cell+=ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===','){row.push(cell);cell='';}
      else if (ch==='\r'){}
      else if (ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=ch;
    }
  }
  if (cell.length||row.length){row.push(cell);rows.push(row);}
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').replace(/\u00A0/g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1)
    .filter(r => r.some(c => clean(c)))
    .map(r => Object.fromEntries(headers.map((k,i) => [k, clean(r[i]||'')])));
}

/* RFC-4180 CSV → RAW 2D ARRAY (for index-based unit lookup) */
function parseCsvRaw(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else inQ=false;}
      else cell+=ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===','){row.push(cell);cell='';}
      else if (ch==='\r'){}
      else if (ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=ch;
    }
  }
  if (cell.length||row.length){row.push(cell);rows.push(row);}
  return rows;
}

/* ═══════════════════════════════════════════════════
   GOOGLE DRIVE THUMBNAIL
═══════════════════════════════════════════════════ */
function driveThumb(url) {
  if (!url) return null;
  const m = url.match(/[?&]id=([^&\s]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  return url.startsWith('http') ? url : null;
}

/* ═══════════════════════════════════════════════════
   BUILD PRODUCT OBJECTS
═══════════════════════════════════════════════════ */
function buildProducts(records, rawRows) {
  if (!records.length) return [];

  // Find CODE XX column indices from raw header row
  const rawHeaders = rawRows[0] || [];
  const codeColMap = {};   // type → { codeIdx, unitIdx }
  rawHeaders.forEach((h, i) => {
    const hc = h.trim();
    if (/^CODE\s+\w+$/i.test(hc)) {
      const type = hc.replace(/^CODE\s+/i,'').toUpperCase();
      codeColMap[type] = { codeIdx:i, unitIdx:i+1 };
    }
  });

  const g = (r, k) => (r[k] || '').trim();

  return rawRows.slice(1)
    .filter((r,i) => {
      const rec = records[i];
      return rec && rec['PRODUCT NAME'];
    })
    .map((rawRow, i) => {
      const rec   = records[i];
      const codes = Object.entries(codeColMap)
        .map(([type, {codeIdx, unitIdx}]) => ({
          type,
          code: (rawRow[codeIdx]||'').trim(),
          unit: (rawRow[unitIdx]||'').trim(),
        }))
        .filter(c => c.code);

      const skuUrl = g(rec,'SKU_USAGE');
      return {
        name:     g(rec,'PRODUCT NAME'),
        codes,
        catGroup: g(rec,'CAT GROUP'),
        catBrand: g(rec,'CAT BRAND'),
        catSize:  g(rec,'CAT SIZE'),
        vendor:   g(rec,'VENDOR NAME'),
        skuLife:  rec['SKU LIFE (DAYS)'] || rec['SKU LIFE'] || '',
        skuUsage: skuUrl,
        imageUrl: driveThumb(skuUrl),
      };
    });
}

/* ═══════════════════════════════════════════════════
   FETCH + REFRESH
═══════════════════════════════════════════════════ */
async function fetchData() {
  showSpinner();
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();

    const records = parseCsv(text);
    const rawRows = parseCsvRaw(text);
    rawRowsCache  = rawRows;

    allProducts      = buildProducts(records, rawRows);
    filteredProducts = allProducts;

    document.getElementById('statsBar').style.display = 'flex';
    renderAll();
    showToast(`โหลดสำเร็จ ${allProducts.length.toLocaleString()} รายการ ✓`, 'success');
  } catch (err) {
    document.getElementById('productList').innerHTML =
      `<div class="error-card">
        ❌ ไม่สามารถโหลดข้อมูลได้<br>
        <small style="color:var(--muted)">${esc(err.message)}</small><br><br>
        <small style="color:var(--muted)">กรุณาตรวจสอบว่า Google Sheet ตั้งค่าเป็น "Anyone with the link can view"</small>
      </div>`;
    showToast('โหลดข้อมูลล้มเหลว ❌', 'error');
  } finally {
    hideSpinner();
  }
}

async function refreshData() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.style.transform = 'rotate(360deg)';
  btn.style.transition = 'transform .6s';
  await fetchData();
  btn.disabled = false;
  setTimeout(() => { btn.style.transform=''; btn.style.transition=''; }, 600);
}

/* ═══════════════════════════════════════════════════
   RENDER — STATS
═══════════════════════════════════════════════════ */
function renderAll() { renderStats(); renderList(); }

function renderStats() {
  const total = filteredProducts.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('statsText').innerHTML =
    `แสดง <strong>${total.toLocaleString()}</strong> รายการ`;
  document.getElementById('pageText').textContent =
    `หน้า ${currentPage} / ${pages.toLocaleString()}`;
}

/* ═══════════════════════════════════════════════════
   RENDER — PRODUCT LIST
═══════════════════════════════════════════════════ */
function renderList() {
  const start  = (currentPage - 1) * PAGE_SIZE;
  const page   = filteredProducts.slice(start, start + PAGE_SIZE);
  const el     = document.getElementById('productList');

  if (!page.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>ไม่พบสินค้าที่ค้นหา</p>
      </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const items = page.map((p, i) => {
    const gIdx  = start + i;
    const code0 = p.codes[0]?.code || '';
    const imgH  = p.imageUrl
      ? `<img class="p-thumb" src="${p.imageUrl}" alt="" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="p-thumb-ph" style="display:none">📦</div>`
      : `<div class="p-thumb-ph">📦</div>`;
    return `
      <div class="product-item" onclick="showDetail(${gIdx})">
        ${imgH}
        <div class="p-info">
          ${p.catGroup ? `<div class="p-cat">${esc(p.catGroup)}</div>` : ''}
          <div class="p-name">${esc(p.name)}</div>
          ${code0 ? `<div class="p-hint">${esc(code0)}</div>` : ''}
        </div>
        <span class="p-arrow">›</span>
      </div>`;
  }).join('');

  el.innerHTML = `<div class="card card-gold" style="animation:fadeIn .2s ease">${items}</div>`;
  renderPagination();
}

/* ═══════════════════════════════════════════════════
   RENDER — PAGINATION
═══════════════════════════════════════════════════ */
function renderPagination() {
  const total = filteredProducts.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  const el    = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  const range = buildRange(currentPage, pages);
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  let prev = false;
  range.forEach(p => {
    if (p==='…'){ if(!prev) html+=`<span class="page-ellipsis">…</span>`; prev=true; }
    else { prev=false; html+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`; }
  });
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}

function buildRange(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const s = new Set([1,2,cur-1,cur,cur+1,total-1,total]);
  const a = [...s].filter(p=>p>=1&&p<=total).sort((a,b)=>a-b);
  const r = []; let last = -99;
  a.forEach(p => { if(p-last>1) r.push('…'); r.push(p); last=p; });
  return r;
}

function goPage(p) {
  const pages = Math.ceil(filteredProducts.length / PAGE_SIZE);
  if (p<1||p>pages) return;
  currentPage = p;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ═══════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════ */
function onSearch(input) {
  document.getElementById('clearBtn').classList.toggle('vis', input.value.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = input.value.trim().toLowerCase();
    filteredProducts = q
      ? allProducts.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.catGroup.toLowerCase().includes(q) ||
          p.catBrand.toLowerCase().includes(q) ||
          p.codes.some(c => c.code.toLowerCase().includes(q))
        )
      : allProducts;
    currentPage = 1;
    renderAll();
  }, 260);
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  document.getElementById('clearBtn').classList.remove('vis');
  filteredProducts = allProducts;
  currentPage = 1;
  renderAll();
  inp.focus();
}

/* ═══════════════════════════════════════════════════
   DETAIL PANEL
═══════════════════════════════════════════════════ */
function showDetail(idx) {
  const p = filteredProducts[idx];
  if (!p) return;
  document.getElementById('dvTitle').textContent = p.name;

  /* Hero */
  const imgH = p.imageUrl
    ? `<img class="hero-img" src="${p.imageUrl}" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="hero-img-ph" style="display:none">📦</div>`
    : `<div class="hero-img-ph">📦</div>`;

  let html = `
    <div class="hero-card">
      ${imgH}
      <div class="hero-info">
        <div class="hero-name">${esc(p.name)}</div>
        ${p.catGroup ? `<span class="badge badge-gold">${esc(p.catGroup)}</span>` : ''}
      </div>
    </div>`;

  /* Info card — CAT GROUP (highlighted) + other fields + SKU_USAGE (highlighted) */
  const infoRows = [
    p.catGroup && ['หมวดหมู่ (CAT GROUP)', p.catGroup, true],
    p.catBrand && ['แบรนด์', p.catBrand, false],
    p.catSize  && ['ขนาด', p.catSize, false],
    p.vendor   && ['ผู้จำหน่าย', p.vendor, false],
    p.skuLife  && ['อายุ SKU (วัน)', p.skuLife, false],
  ].filter(Boolean);

  if (infoRows.length || p.skuUsage) {
    html += `<div class="info-card">
      <div class="info-card-head">📋 ข้อมูลสินค้า</div>`;
    infoRows.forEach(([l,v,highlight]) => {
      const valStyle = highlight
        ? 'font-weight:700;color:var(--gold)'
        : '';
      html += `<div class="info-row">
        <span class="info-label">${l}</span>
        <span class="info-value" style="${valStyle}">${esc(v)}</span>
      </div>`;
    });
    if (p.skuUsage) {
      html += `<div class="info-row">
        <span class="info-label">SKU Usage</span>
        <a href="${esc(p.skuUsage)}" target="_blank" rel="noopener"
           style="font-size:12px;text-align:right;color:var(--gold)">
          ดูภาพสินค้า ↗
        </a>
      </div>`;
    }
    html += `</div>`;
  }

  /* Barcodes */
  if (p.codes.length) {
    html += `<div class="bc-title">
      📊 บาร์โค้ดทั้งหมด
      <span class="badge badge-gold">${p.codes.length} รายการ</span>
    </div>`;
    p.codes.forEach((c, i) => {
      html += `<div class="barcode-card">
        <div><span class="bc-type">${esc(c.type)}</span></div>
        <div class="bc-svg-wrap"><svg id="bc${i}"></svg></div>
        <div class="bc-num">${esc(c.code)}</div>
        ${c.unit ? `<div class="bc-unit">หน่วย: ${esc(c.unit)}</div>` : ''}
      </div>`;
    });
  } else {
    html += `<div class="empty-state">
      <div class="empty-icon">📭</div><p>ไม่มีบาร์โค้ด</p>
    </div>`;
  }

  const panel = document.getElementById('detailPanel');
  document.getElementById('detailBody').innerHTML = html;
  panel.classList.add('show');
  panel.scrollTop = 0;
  document.body.style.overflow = 'hidden';

  /* Render barcodes after DOM paint */
  requestAnimationFrame(() => {
    p.codes.forEach((c, i) => {
      try {
        JsBarcode(`#bc${i}`, c.code, {
          format:       detectFormat(c.code),
          displayValue: false,
          height:       80,
          margin:       10,
          lineColor:    document.body.classList.contains('dark') ? '#e8eaf0' : '#0d1b3e',
          background:   'transparent',
          width:        1.8,
        });
      } catch {
        const svg = document.getElementById(`bc${i}`);
        if (svg) svg.parentElement.innerHTML =
          `<div class="bc-error">⚠️ บาร์โค้ดไม่ถูกต้อง: ${esc(c.code)}</div>`;
      }
    });
  });
}

function detectFormat(code) {
  if (/^\d{13}$/.test(code)) return 'EAN13';
  if (/^\d{8}$/.test(code))  return 'EAN8';
  return 'CODE128';
}

function goBack() {
  document.getElementById('detailPanel').classList.remove('show');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════ */
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
fetchData();
</script>
