<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rattana Product Catalog v1.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --green:       #2e7d32;
      --green-mid:   #388e3c;
      --green-light: #43a047;
      --green-pale:  #e8f5e9;
      --gold:        #c9a84c;
      --bg:          #f4f6f4;
      --card-bg:     #ffffff;
      --text:        #1a2e1a;
      --muted:       #6b7b6b;
      --border:      #d0dcd0;
      --danger:      #c62828;
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   18px;
      --shadow-sm:   0 1px 4px rgba(0,0,0,.06);
      --shadow-md:   0 2px 10px rgba(0,0,0,.08);
      --shadow-lg:   0 8px 28px rgba(0,0,0,.13);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;-webkit-tap-highlight-color:transparent}
    body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
    button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    input{font-family:inherit;font-size:16px}
    img{display:block}
    a{color:var(--green)}

    /* ── LIST VIEW ─────────────────────────────── */
    #listView { min-height:100dvh; }

    /* Header */
    .lv-header {
      background:var(--green);
      color:#fff;
      padding:14px 16px max(14px,env(safe-area-inset-top));
      padding-top:max(14px,env(safe-area-inset-top));
      position:sticky;top:0;z-index:100;
      border-bottom:3px solid var(--gold);
    }
    .lv-header-row{display:flex;align-items:center;justify-content:space-between}
    .lv-title{font-size:24px;font-weight:700;letter-spacing:-.3px}
    .lv-version{font-size:11px;opacity:.65;margin-top:1px}
    .lv-count{font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}

    /* Search */
    .search-zone{background:var(--green);padding:10px 16px 14px}
    .search-box{
      display:flex;align-items:center;gap:10px;
      background:#fff;border-radius:30px;
      padding:0 16px;height:46px;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }
    .search-box input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:16px}
    .search-box input::placeholder{color:var(--muted)}
    .search-icon{color:var(--muted);font-size:17px;flex-shrink:0}
    .search-clear{
      background:var(--border);border:none;border-radius:50%;
      width:22px;height:22px;color:var(--muted);
      font-size:13px;display:none;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0
    }
    .search-clear.vis{display:flex}

    /* Stats */
    .stats-bar{padding:8px 16px 4px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

    /* Product list */
    .product-list{padding:4px 12px 8px;display:flex;flex-direction:column;gap:0}
    .product-group{
      background:var(--card-bg);border-radius:var(--radius-md);
      box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--border);
      margin-bottom:2px;
    }
    .product-item{
      display:flex;align-items:center;gap:12px;
      padding:12px 14px;cursor:pointer;
      border-bottom:1px solid var(--border);
      transition:background .12s;position:relative;
    }
    .product-item:last-child{border-bottom:none}
    .product-item:hover,.product-item:active{background:var(--green-pale)}
    .p-thumb{
      width:54px;height:54px;border-radius:var(--radius-sm);
      object-fit:cover;flex-shrink:0;border:1px solid var(--border);
      background:var(--green-pale);
    }
    .p-thumb-ph{
      width:54px;height:54px;border-radius:var(--radius-sm);
      background:var(--green-pale);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:26px;border:1px solid var(--border);color:var(--green-light);
    }
    .p-info{flex:1;min-width:0}
    .p-cat{font-size:11.5px;color:var(--green);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
    .p-name{font-size:14px;font-weight:500;line-height:1.4;color:var(--text)}
    .p-code-hint{font-size:11px;color:var(--muted);margin-top:3px;font-family:'Courier New',monospace}
    .p-arrow{color:var(--border);font-size:20px;flex-shrink:0;font-weight:300}

    /* Spinner */
    .spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner-text{color:var(--muted);font-size:14px}

    /* Empty */
    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-icon{font-size:52px;margin-bottom:14px}
    .empty-state p{font-size:15px}

    /* Error */
    .error-card{
      background:#fff3f3;border:1px solid #ffcdd2;border-radius:var(--radius-md);
      padding:20px;margin:16px;text-align:center;color:var(--danger);font-size:14px;line-height:1.7;
    }
    .error-card small{color:var(--muted);font-size:12px}

    /* Pagination */
    .pagination{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 16px 8px;flex-wrap:wrap}
    .page-btn{
      min-width:36px;height:36px;border-radius:8px;
      border:1px solid var(--border);background:var(--card-bg);
      color:var(--text);font-family:inherit;font-size:13px;font-weight:500;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      padding:0 8px;transition:all .12s;
    }
    .page-btn:hover{background:var(--green-pale);border-color:var(--green)}
    .page-btn.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .page-btn.nav{font-size:16px}
    .page-ellipsis{color:var(--muted);padding:0 4px;font-size:13px;line-height:36px}

    /* ── DETAIL VIEW ─────────────────────────────── */
    #detailView{
      display:none;position:fixed;inset:0;
      background:var(--bg);z-index:200;
      overflow-y:auto;-webkit-overflow-scrolling:touch;
    }
    #detailView.show{display:block;animation:slideIn .22s cubic-bezier(.25,.46,.45,.94)}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

    .dv-header{
      background:var(--green);color:#fff;
      padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
      position:sticky;top:0;z-index:10;
      border-bottom:3px solid var(--gold);
      display:flex;align-items:center;gap:12px;
    }
    .back-btn{
      background:rgba(255,255,255,.18);border:none;color:#fff;
      width:38px;height:38px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;cursor:pointer;flex-shrink:0;
      transition:background .15s;
    }
    .back-btn:hover{background:rgba(255,255,255,.3)}
    .dv-title{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .print-btn{
      background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
      color:#fff;padding:7px 13px;border-radius:20px;
      font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;
      white-space:nowrap;flex-shrink:0;transition:background .15s;
    }
    .print-btn:hover{background:rgba(255,255,255,.3)}

    .dv-body{padding:14px 14px 0}

    /* Hero card */
    .hero-card{
      background:var(--card-bg);border-radius:var(--radius-lg);
      padding:18px;display:flex;align-items:flex-start;gap:14px;
      margin-bottom:14px;box-shadow:var(--shadow-md);
      border-top:3px solid var(--green);
    }
    .hero-img{
      width:88px;height:88px;border-radius:var(--radius-md);
      object-fit:cover;border:1px solid var(--border);flex-shrink:0;
      background:var(--green-pale);
    }
    .hero-img-ph{
      width:88px;height:88px;border-radius:var(--radius-md);
      background:var(--green-pale);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:40px;border:1px solid var(--border);
    }
    .hero-info{flex:1;min-width:0}
    .hero-name{font-size:16px;font-weight:700;line-height:1.45;color:var(--text);margin-bottom:8px}
    .hero-badge{
      display:inline-block;background:var(--green-pale);color:var(--green);
      border:1px solid rgba(46,125,50,.25);border-radius:20px;
      padding:3px 11px;font-size:12px;font-weight:700;
    }

    /* Info card */
    .info-card{
      background:var(--card-bg);border-radius:var(--radius-md);
      padding:0;margin-bottom:14px;box-shadow:var(--shadow-sm);
      border:1px solid var(--border);overflow:hidden;
    }
    .info-card-head{
      padding:11px 16px;background:linear-gradient(to right,var(--green-pale),transparent);
      border-bottom:1px solid var(--border);
      font-size:12px;font-weight:700;color:var(--green);
      text-transform:uppercase;letter-spacing:.5px;
    }
    .info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--border);gap:12px}
    .info-row:last-child{border-bottom:none}
    .info-label{font-size:13px;color:var(--muted);flex-shrink:0}
    .info-value{font-size:13px;font-weight:600;color:var(--text);text-align:right;word-break:break-all}
    .info-link{font-size:12px;color:var(--green);text-decoration:underline;text-align:right;word-break:break-all}

    /* Barcode section */
    .bc-section-title{
      font-size:14px;font-weight:700;color:var(--text);
      margin-bottom:10px;display:flex;align-items:center;gap:8px;
    }
    .bc-count{
      background:var(--green);color:#fff;
      border-radius:20px;padding:1px 9px;font-size:12px;
    }
    .barcode-card{
      background:var(--card-bg);border-radius:var(--radius-md);
      padding:18px 14px 14px;margin-bottom:12px;
      box-shadow:var(--shadow-sm);border:1px solid var(--border);
      text-align:center;
    }
    .bc-type-badge{
      display:inline-block;background:var(--green);color:#fff;
      border-radius:6px;padding:3px 12px;
      font-size:12px;font-weight:700;letter-spacing:1.5px;
      margin-bottom:14px;
    }
    .bc-svg-wrap{width:100%;overflow-x:auto;margin-bottom:6px;display:flex;justify-content:center}
    .bc-svg-wrap svg{max-width:100%;display:block}
    .bc-number{font-size:14px;font-weight:600;letter-spacing:1.2px;font-family:'Courier New',monospace;color:var(--text);margin-top:2px}
    .bc-unit{font-size:12px;color:var(--muted);margin-top:4px}
    .bc-error{color:var(--danger);font-size:12px;padding:10px 0}

    /* Footer space */
    .footer-space{height:max(28px,env(safe-area-inset-bottom))}

    /* Print */
    @media print{
      #listView{display:none!important}
      #detailView{position:static!important;overflow:visible!important;animation:none!important}
      .dv-header,.print-btn,.back-btn{display:none!important}
      .barcode-card{break-inside:avoid;page-break-inside:avoid;box-shadow:none!important}
      .hero-card,.info-card{box-shadow:none!important}
    }

    /* Tablet+ */
    @media(min-width:640px){
      .product-list{padding:8px 20px 12px}
      .dv-body{padding:20px 20px 0}
      .barcode-card{max-width:480px;margin-left:auto;margin-right:auto}
      .hero-card{max-width:640px;margin-left:auto;margin-right:auto}
      .info-card{max-width:640px;margin-left:auto;margin-right:auto}
    }
  </style>
</head>
<body>

<!-- ══════════════ LIST VIEW ══════════════ -->
<div id="listView">
  <div class="lv-header">
    <div class="lv-header-row">
      <div>
        <div class="lv-title">Product</div>
        <div class="lv-version">Rattana Product Catalog · v1.0 · 2026-05-14</div>
      </div>
      <div id="lvCount" class="lv-count" style="display:none"></div>
    </div>
  </div>

  <div class="search-zone">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ค้นหาสินค้า / บาร์โค้ด..." autocomplete="off" oninput="onSearch(this)">
      <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div id="statsBar" class="stats-bar" style="display:none">
    <span id="statsText"></span>
    <span id="pageText" style="font-weight:600"></span>
  </div>

  <div id="productList" class="product-list">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-text">กำลังโหลดข้อมูลจาก Google Sheet…</div>
    </div>
  </div>

  <div id="pagination" class="pagination"></div>
  <div class="footer-space"></div>
</div>

<!-- ══════════════ DETAIL VIEW ══════════════ -->
<div id="detailView">
  <div class="dv-header">
    <button class="back-btn" onclick="goBack()" aria-label="กลับ">←</button>
    <span class="dv-title" id="dvTitle">รายละเอียดสินค้า</span>
    <button class="print-btn" onclick="window.print()">🖨 พิมพ์</button>
  </div>
  <div class="dv-body" id="detailBody"></div>
  <div class="footer-space"></div>
</div>

<script>
/* ══════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════ */
const SHEET_ID  = '1ImkivuDxxTaluPVt2dJLX12fhVWvpU5czshn-OsRYuY';
const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const PAGE_SIZE = 8;

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let allProducts      = [];
let filteredProducts = [];
let currentPage      = 1;
let searchTimer      = null;

/* ══════════════════════════════════════════════
   RFC-4180 CSV PARSER
══════════════════════════════════════════════ */
function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQ) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* ══════════════════════════════════════════════
   GOOGLE DRIVE THUMBNAIL
══════════════════════════════════════════════ */
function driveThumb(url) {
  if (!url) return null;
  const m = url.match(/[?&]id=([^&\s]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}`;
  if (url.startsWith('http')) return url;
  return null;
}

/* ══════════════════════════════════════════════
   PARSE PRODUCTS
══════════════════════════════════════════════ */
function parseProducts(rows) {
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());

  // Dynamically find CODE XX columns (CODE EA, CODE PA, CODE BP, CODE CS, ...)
  const codeCols = [];
  headers.forEach((h, i) => {
    if (/^CODE\s+\w+$/i.test(h)) {
      const type = h.replace(/^CODE\s+/i, '').toUpperCase();
      codeCols.push({ type, codeIdx: i, unitIdx: i + 1 });
    }
  });

  const idx = name => headers.findIndex(h => h === name);
  const catGroupIdx = idx('CAT GROUP');
  const catBrandIdx = idx('CAT BRAND');
  const catSizeIdx  = idx('CAT SIZE');
  const vendorIdx   = idx('VENDOR NAME');
  const skuLifeIdx  = headers.findIndex(h => h.startsWith('SKU LIFE'));
  const skuUsageIdx = idx('SKU_USAGE');

  const get = (cols, i) => (i >= 0 && cols[i]) ? cols[i].trim() : '';

  return rows.slice(1)
    .filter(cols => cols.length > 1 && cols[0]?.trim())
    .map(cols => {
      const codes = codeCols
        .map(c => ({ type: c.type, code: get(cols, c.codeIdx), unit: get(cols, c.unitIdx) }))
        .filter(c => c.code);

      const skuUrl = get(cols, skuUsageIdx);
      return {
        name:     cols[0].trim(),
        codes,
        catGroup: get(cols, catGroupIdx),
        catBrand: get(cols, catBrandIdx),
        catSize:  get(cols, catSizeIdx),
        vendor:   get(cols, vendorIdx),
        skuLife:  get(cols, skuLifeIdx),
        skuUsage: skuUrl,
        imageUrl: driveThumb(skuUrl),
      };
    });
}

/* ══════════════════════════════════════════════
   FETCH
══════════════════════════════════════════════ */
async function fetchData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allProducts = parseProducts(parseCsv(text));
    filteredProducts = allProducts;
    renderAll();
    document.getElementById('statsBar').style.display = 'flex';
    document.getElementById('lvCount').style.display  = 'flex';
  } catch (err) {
    document.getElementById('productList').innerHTML = `
      <div class="error-card">
        ❌ ไม่สามารถโหลดข้อมูลได้<br>
        <small>${esc(err.message)}</small><br><br>
        <small>กรุณาตรวจสอบว่า Google Sheet ตั้งค่าเป็น "Anyone with the link can view"</small>
      </div>`;
  }
}

/* ══════════════════════════════════════════════
   RENDER: LIST
══════════════════════════════════════════════ */
function renderAll() {
  renderStats();
  renderList();
}

function renderStats() {
  const total = filteredProducts.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('statsText').textContent =
    `${total.toLocaleString()} รายการ`;
  document.getElementById('pageText').textContent =
    `หน้า ${currentPage} / ${pages.toLocaleString()}`;
  document.getElementById('lvCount').textContent =
    `${total.toLocaleString()} รายการ`;
}

function renderList() {
  const start  = (currentPage - 1) * PAGE_SIZE;
  const page   = filteredProducts.slice(start, start + PAGE_SIZE);
  const listEl = document.getElementById('productList');

  if (!page.length) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>ไม่พบสินค้าที่ค้นหา</p>
      </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  // Group all page items into one card block for cleaner look
  const items = page.map((p, i) => {
    const globalIdx = start + i;
    const codeHint  = p.codes[0] ? p.codes[0].code : '';
    const imgHtml   = p.imageUrl
      ? `<img class="p-thumb" src="${p.imageUrl}" alt=""
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
           loading="lazy">
         <div class="p-thumb-ph" style="display:none">📦</div>`
      : `<div class="p-thumb-ph">📦</div>`;
    return `
      <div class="product-item" onclick="showDetail(${globalIdx})">
        ${imgHtml}
        <div class="p-info">
          ${p.catGroup ? `<div class="p-cat">${esc(p.catGroup)}</div>` : ''}
          <div class="p-name">${esc(p.name)}</div>
          ${codeHint ? `<div class="p-code-hint">${esc(codeHint)}</div>` : ''}
        </div>
        <span class="p-arrow">›</span>
      </div>`;
  }).join('');

  listEl.innerHTML = `<div class="product-group">${items}</div>`;
  renderPagination();
}

/* ══════════════════════════════════════════════
   RENDER: PAGINATION
══════════════════════════════════════════════ */
function renderPagination() {
  const total = filteredProducts.length;
  const pages = Math.ceil(total / PAGE_SIZE);
  const el    = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  const range = buildPageRange(currentPage, pages);
  let html = `<button class="page-btn nav" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  let lastWasEllipsis = false;
  range.forEach(p => {
    if (p === '…') {
      if (!lastWasEllipsis) html += `<span class="page-ellipsis">…</span>`;
      lastWasEllipsis = true;
    } else {
      lastWasEllipsis = false;
      html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    }
  });
  html += `<button class="page-btn nav" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  el.innerHTML = html;
}

function buildPageRange(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  const set = new Set([1,2, cur-1,cur,cur+1, total-1,total]);
  const arr = [...set].filter(p=>p>=1&&p<=total).sort((a,b)=>a-b);
  const out  = [];
  for (let i=0;i<arr.length;i++){
    if (i>0 && arr[i]-arr[i-1]>1) out.push('…');
    out.push(arr[i]);
  }
  return out;
}

function goPage(p) {
  const pages = Math.ceil(filteredProducts.length / PAGE_SIZE);
  if (p<1||p>pages) return;
  currentPage = p;
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════ */
function onSearch(input) {
  const hasText = input.value.length > 0;
  document.getElementById('clearBtn').classList.toggle('vis', hasText);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = input.value.trim().toLowerCase();
    filteredProducts = q
      ? allProducts.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.catGroup.toLowerCase().includes(q) ||
          p.catBrand.toLowerCase().includes(q) ||
          p.codes.some(c => c.code.toLowerCase().includes(q))
        )
      : allProducts;
    currentPage = 1;
    renderAll();
  }, 260);
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  inp.value = '';
  document.getElementById('clearBtn').classList.remove('vis');
  filteredProducts = allProducts;
  currentPage = 1;
  renderAll();
  inp.focus();
}

/* ══════════════════════════════════════════════
   DETAIL VIEW
══════════════════════════════════════════════ */
function showDetail(idx) {
  const p = filteredProducts[idx];
  if (!p) return;

  document.getElementById('dvTitle').textContent = p.name;

  // ── Hero card ──
  const imgHtml = p.imageUrl
    ? `<img class="hero-img" src="${p.imageUrl}" alt=""
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="hero-img-ph" style="display:none">📦</div>`
    : `<div class="hero-img-ph">📦</div>`;

  let html = `
    <div class="hero-card">
      ${imgHtml}
      <div class="hero-info">
        <div class="hero-name">${esc(p.name)}</div>
        ${p.catGroup ? `<span class="hero-badge">${esc(p.catGroup)}</span>` : ''}
      </div>
    </div>`;

  // ── Info card ──
  const infoRows = [
    p.catGroup && ['หมวดหมู่ (CAT GROUP)', p.catGroup],
    p.catBrand && ['แบรนด์', p.catBrand],
    p.catSize  && ['ขนาด', p.catSize],
    p.vendor   && ['ผู้จำหน่าย', p.vendor],
    p.skuLife  && ['อายุ SKU (วัน)', p.skuLife],
  ].filter(Boolean);

  if (infoRows.length || p.skuUsage) {
    html += `<div class="info-card"><div class="info-card-head">📋 ข้อมูลสินค้า</div>`;
    infoRows.forEach(([l,v]) => {
      html += `<div class="info-row">
        <span class="info-label">${l}</span>
        <span class="info-value">${esc(v)}</span>
      </div>`;
    });
    if (p.skuUsage) {
      html += `<div class="info-row">
        <span class="info-label">SKU Usage</span>
        <a class="info-link" href="${esc(p.skuUsage)}" target="_blank" rel="noopener">ดูภาพสินค้า ↗</a>
      </div>`;
    }
    html += `</div>`;
  }

  // ── Barcodes ──
  if (p.codes.length) {
    html += `<div class="bc-section-title">📊 บาร์โค้ด <span class="bc-count">${p.codes.length}</span></div>`;
    p.codes.forEach((c, i) => {
      html += `<div class="barcode-card">
        <div><span class="bc-type-badge">${esc(c.type)}</span></div>
        <div class="bc-svg-wrap"><svg id="bc${i}"></svg></div>
        <div class="bc-number">${esc(c.code)}</div>
        ${c.unit ? `<div class="bc-unit">หน่วย: ${esc(c.unit)}</div>` : ''}
      </div>`;
    });
  } else {
    html += `<div class="empty-state"><div class="empty-icon">📭</div><p>ไม่มีบาร์โค้ด</p></div>`;
  }

  document.getElementById('detailBody').innerHTML = html;

  // Show panel
  const dv = document.getElementById('detailView');
  dv.classList.add('show');
  dv.scrollTop = 0;
  document.body.style.overflow = 'hidden';

  // Render barcodes after DOM is ready
  requestAnimationFrame(() => {
    p.codes.forEach((c, i) => {
      try {
        JsBarcode(`#bc${i}`, c.code, {
          format:       detectBarcodeFormat(c.code),
          displayValue: false,
          height:       80,
          margin:       10,
          lineColor:    '#1a2e1a',
          background:   '#ffffff',
          width:        1.8,
        });
      } catch (e) {
        const svg = document.getElementById(`bc${i}`);
        if (svg) svg.parentElement.innerHTML =
          `<div class="bc-error">⚠️ ไม่สามารถสร้างบาร์โค้ดได้สำหรับ: ${esc(c.code)}</div>`;
      }
    });
  });
}

function detectBarcodeFormat(code) {
  // EAN-13 if 13 digits, EAN-8 if 8 digits, else CODE128
  if (/^\d{13}$/.test(code)) return 'EAN13';
  if (/^\d{8}$/.test(code))  return 'EAN8';
  return 'CODE128';
}

function goBack() {
  document.getElementById('detailView').classList.remove('show');
  document.body.style.overflow = '';
}

// Back button / swipe support
window.addEventListener('popstate', () => {
  if (document.getElementById('detailView').classList.contains('show')) goBack();
});

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════ */
fetchData();
</script>
