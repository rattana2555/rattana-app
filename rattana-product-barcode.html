<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rattana Product Barcode v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
:root {
  --navy:        #0d1b3e;
  --navy-mid:    #1a2f5e;
  --navy-light:  #243b73;
  --gold:        #c9a84c;
  --gold-light:  #e8c86a;
  --success:  #2ecc71;
  --danger:   #e74c3c;
  --warning:  #f39c12;
  --info:     #3498db;
  --bg:       #f4f6fb;
  --text:     #0d1b3e;
  --card-bg:  #ffffff;
  --border:   #dde3f0;
  --muted:    #6b7896;
  --row-alt:  #fafbfd;
  --space-xs:  4px;
  --space-sm:  8px;
  --space-md:  16px;
  --space-lg:  24px;
  --space-xl:  32px;
  --radius-sm:  6px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 4px rgba(0,0,0,.06);
  --shadow-md:  0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(13,27,62,.12);
}
body.dark {
  --bg:       #0a1020;
  --text:     #e8eaf0;
  --card-bg:  #111c35;
  --border:   #243b73;
  --muted:    #8a98b8;
  --row-alt:  #0f1830;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);transition:background .25s,color .25s;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;font-size:16px}

/* Header */
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;font-size:18px;color:#fff;flex:1}
.logo-text span{color:var(--gold)}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.back-btn{background:transparent;border:none;color:#fff;display:flex;align-items:center;gap:6px;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;padding:4px 0}

/* Screens */
.screen{display:none}
.screen.active{display:block}

/* Search bar */
.search-wrap{padding:12px 16px;background:var(--card-bg);border-bottom:1px solid var(--border);position:sticky;top:max(51px,calc(51px + env(safe-area-inset-top)));z-index:90}
.search-inner{position:relative}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.search-input{width:100%;height:44px;padding:0 14px 0 42px;border-radius:22px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--gold)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--muted);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;display:none;align-items:center;justify-content:center;cursor:pointer}
.search-clear.show{display:flex}

/* Stats bar */
.stats-bar{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--bg);display:flex;align-items:center;justify-content:space-between}

/* Product list */
.product-list{padding:8px 12px 80px}
.product-card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:8px;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.product-card:hover{border-color:var(--gold);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.product-card:active{transform:scale(.98)}
.product-num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;word-break:break-word}
.product-codes{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.code-chip{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600}
.code-chip.ea{color:#1a6fb8;border-color:#b8d6f5}
.code-chip.pa{color:#1e8449;border-color:#b8e8cb}
.code-chip.bp{color:#a87800;border-color:#f5dfa0}
.code-chip.cs{color:#c0392b;border-color:#f5c0b8}
.product-arrow{color:var(--muted);font-size:16px;flex-shrink:0}

/* Pagination */
.pagination{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:6px;z-index:90;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.page-btn{min-width:36px;height:36px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0 8px}
.page-btn:hover:not(:disabled){border-color:var(--gold);color:var(--navy)}
.page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
.page-ellipsis{color:var(--muted);font-size:13px;padding:0 4px}

/* Detail screen */
.detail-body{padding:16px 16px 32px}
.detail-product-header{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);border-top:3px solid var(--gold);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.detail-product-name{font-size:18px;font-weight:700;color:var(--text);line-height:1.3;flex:1}
.detail-unit-ea{margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* Barcode cards */
.barcode-section-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;padding-left:4px}
.barcode-card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:16px;margin-bottom:14px}
.barcode-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.barcode-type-badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.badge-ea{background:#e3f0fd;color:#1a6fb8}
.badge-pa{background:#e8f7ee;color:#1e8449}
.badge-bp{background:#fef3d7;color:#a87800}
.badge-cs{background:#ffd5d0;color:#c0392b}
.barcode-unit{font-size:12px;color:var(--muted);font-weight:600}
.barcode-canvas-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.barcode-canvas-wrap svg{max-width:100%;height:auto}
.barcode-number{font-size:13px;font-weight:700;color:var(--text);margin-top:4px;letter-spacing:1px;font-family:'Courier New',monospace}
.no-barcode{text-align:center;color:var(--muted);font-size:13px;padding:20px;background:var(--bg);border-radius:var(--radius-sm)}

/* Loading spinner */
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner-overlay.show{display:flex}
body.dark .spinner-overlay{background:rgba(10,16,32,.85)}
.spinner{width:42px;height:42px;border:4px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-text{font-size:14px;color:var(--muted)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none;border-left:3px solid var(--gold)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;font-weight:600}
.empty-sub{font-size:13px;margin-top:6px}

/* Version */
.version-tag{font-size:10px;color:rgba(255,255,255,.4);margin-left:auto}

/* Print barcodes */
.print-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.print-btn:hover{border-color:var(--gold);color:var(--navy)}

@media print {
  header, .search-wrap, .pagination, .icon-btn, .print-btn { display:none!important }
  .barcode-card { break-inside:avoid; page-break-inside:avoid }
}

@media(prefers-color-scheme:dark){
  body:not(.light){
    --bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830;
  }
}
</style>
</head>
<body>

<!-- Spinner -->
<div class="spinner-overlay" id="spinnerOverlay">
  <div class="spinner"></div>
  <div class="spinner-text" id="spinnerText">กำลังโหลดข้อมูล...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════
     LIST SCREEN
════════════════════════════════════════════════ -->
<div class="screen active" id="listScreen">
  <header>
    <div class="logo-text">Rattana <span>Product</span></div>
    <span class="version-tag">v1.0 · 2026-05-14</span>
    <button class="icon-btn" onclick="toggleDark()" title="Dark mode">🌙</button>
    <button class="icon-btn" onclick="loadData(true)" title="รีเฟรช">🔄</button>
  </header>

  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">🔍</span>
      <input type="search" class="search-input" id="searchInput"
             placeholder="ค้นหาชื่อสินค้า หรือ บาร์โค้ด..."
             oninput="onSearch(this.value)">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="stats-bar">
    <span id="statsText">กำลังโหลด...</span>
    <span id="pageInfo" style="font-weight:600;color:var(--text)"></span>
  </div>

  <div class="product-list" id="productList">
    <!-- Rendered by JS -->
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- ═══════════════════════════════════════════════
     DETAIL SCREEN
════════════════════════════════════════════════ -->
<div class="screen" id="detailScreen">
  <header>
    <button class="back-btn" onclick="showList()">← กลับ</button>
    <div class="logo-text" id="detailHeaderTitle" style="flex:1;text-align:right;font-size:14px;opacity:.7"></div>
    <button class="print-btn" onclick="window.print()">🖨️ พิมพ์</button>
  </header>
  <div class="detail-body" id="detailBody">
    <!-- Rendered by JS -->
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const SHEET_ID = '1ImkivuDxxTaluPVt2dJLX12fhVWvpU5czshn-OsRYuY';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
const PER_PAGE = 8;

// ═══════════════ STATE ════════════════
let allProducts   = [];
let filtered      = [];
let currentPage   = 1;
let searchQuery   = '';
let darkMode      = false;

// ═══════════════ INIT ════════════════
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('rattana-dark');
  if (saved === 'true') { darkMode = true; document.body.classList.add('dark'); }
  loadData(false);
});

// ═══════════════ DATA LOAD ═══════════
async function loadData(force = false) {
  const cacheKey = 'rattana-barcode-data';
  const cacheTs  = 'rattana-barcode-ts';
  const CACHE_MS = 5 * 60 * 1000; // 5 min

  if (!force) {
    try {
      const ts   = parseInt(localStorage.getItem(cacheTs) || '0');
      const raw  = localStorage.getItem(cacheKey);
      if (raw && Date.now() - ts < CACHE_MS) {
        allProducts = JSON.parse(raw);
        afterLoad();
        return;
      }
    } catch(e) {}
  }

  showSpinner('กำลังโหลดข้อมูลจาก Google Sheets...');
  try {
    const res  = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allProducts = parseCsv(text);
    localStorage.setItem(cacheKey, JSON.stringify(allProducts));
    localStorage.setItem(cacheTs, Date.now().toString());
    afterLoad();
  } catch(err) {
    hideSpinner();
    showToast('⚠️ โหลดข้อมูลไม่สำเร็จ: ' + err.message);
    renderEmpty('โหลดข้อมูลไม่สำเร็จ', 'ตรวจสอบการเชื่อมต่อ หรือ กด 🔄 รีเฟรช');
  }
}

function afterLoad() {
  hideSpinner();
  filtered = [...allProducts];
  currentPage = 1;
  renderList();
}

// ═══════════════ CSV PARSER ══════════
function parseCsv(text) {
  const lines = text.split('\n');
  const header = parseCsvLine(lines[0]);

  // Column indices
  // A=0 PRODUCT NAME, B=1 CODE EA, C=2 UNA EA, D=3 CODE PA, E=4 UNA PA,
  // F=5 CODE BP, G=6 UNA BP, H=7 CODE CS, I=8 UNA CS, J=9 UNIT EA
  const IDX = { name:0, codeEA:1, unitEA:2, codePA:3, unitPA:4, codeBP:5, unitBP:6, codeCS:7, unitCS:8, unitEALabel:9 };

  const products = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    if (!cols || !cols[IDX.name] || cols[IDX.name].trim() === '') continue;
    const name = cols[IDX.name].trim();
    if (name.toLowerCase() === 'product name') continue; // skip duplicate header

    const prod = {
      id:      i,
      name:    name,
      codeEA:  (cols[IDX.codeEA]  || '').trim(),
      unitEA:  (cols[IDX.unitEA]  || '').trim(),
      codePA:  (cols[IDX.codePA]  || '').trim(),
      unitPA:  (cols[IDX.unitPA]  || '').trim(),
      codeBP:  (cols[IDX.codeBP]  || '').trim(),
      unitBP:  (cols[IDX.unitBP]  || '').trim(),
      codeCS:  (cols[IDX.codeCS]  || '').trim(),
      unitCS:  (cols[IDX.unitCS]  || '').trim(),
      unitEALabel: (cols[IDX.unitEALabel] || '').trim(),
    };
    products.push(prod);
  }
  return products;
}

function parseCsvLine(line) {
  if (!line) return [];
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      result.push(cur); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result.map(s => s.trim().replace(/\r/g,''));
}

// ═══════════════ SEARCH ══════════════
function onSearch(val) {
  searchQuery = val.trim();
  document.getElementById('searchClear').classList.toggle('show', searchQuery.length > 0);
  currentPage = 1;

  if (!searchQuery) {
    filtered = [...allProducts];
  } else {
    const q = searchQuery.toLowerCase();
    filtered = allProducts.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.codeEA.toLowerCase().includes(q) ||
      p.codePA.toLowerCase().includes(q) ||
      p.codeBP.toLowerCase().includes(q) ||
      p.codeCS.toLowerCase().includes(q)
    );
  }
  renderList();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  onSearch('');
}

// ═══════════════ RENDER LIST ═══════════
function renderList() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * PER_PAGE;
  const end   = Math.min(start + PER_PAGE, total);
  const slice = filtered.slice(start, end);

  // Stats
  document.getElementById('statsText').textContent =
    searchQuery
      ? `ค้นพบ ${total.toLocaleString()} รายการ`
      : `สินค้าทั้งหมด ${total.toLocaleString()} รายการ`;

  document.getElementById('pageInfo').textContent =
    total > 0 ? `หน้า ${currentPage}/${pages}` : '';

  // List
  const list = document.getElementById('productList');
  if (slice.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📦</div>
      <div class="empty-text">ไม่พบสินค้า</div>
      <div class="empty-sub">ลองค้นหาคำอื่น</div>
    </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  list.innerHTML = slice.map((p, idx) => {
    const chips = [
      p.codeEA ? `<span class="code-chip ea">EA</span>` : '',
      p.codePA ? `<span class="code-chip pa">PA</span>` : '',
      p.codeBP ? `<span class="code-chip bp">BP</span>` : '',
      p.codeCS ? `<span class="code-chip cs">CS</span>` : '',
    ].filter(Boolean).join('');

    return `<div class="product-card" onclick="showDetail(${p.id})">
      <div class="product-num">${start + idx + 1}</div>
      <div class="product-info">
        <div class="product-name">${escHtml(p.name)}</div>
        <div class="product-codes">${chips || '<span style="color:var(--muted);font-size:11px">ไม่มีบาร์โค้ด</span>'}</div>
      </div>
      <div class="product-arrow">›</div>
    </div>`;
  }).join('');

  renderPagination(pages);
}

function renderPagination(pages) {
  const pg = document.getElementById('pagination');
  if (pages <= 1) { pg.innerHTML = ''; return; }

  const show = pagesToShow(currentPage, pages);
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;

  let prev = null;
  for (const p of show) {
    if (prev !== null && p - prev > 1) {
      html += `<span class="page-ellipsis">…</span>`;
    }
    html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    prev = p;
  }

  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  pg.innerHTML = html;
}

function pagesToShow(cur, total) {
  const set = new Set([1, total, cur]);
  for (let d = 1; d <= 2; d++) {
    if (cur - d >= 1)     set.add(cur - d);
    if (cur + d <= total) set.add(cur + d);
  }
  return [...set].sort((a,b)=>a-b);
}

function goPage(p) {
  const pages = Math.ceil(filtered.length / PER_PAGE);
  if (p < 1 || p > pages) return;
  currentPage = p;
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ═══════════════ DETAIL VIEW ═════════
function showDetail(id) {
  const p = allProducts.find(x => x.id === id);
  if (!p) return;

  document.getElementById('detailHeaderTitle').textContent = p.name;

  const barcodes = [
    { code: p.codeEA, unit: p.unitEA || 'EA', label: 'EA', cls: 'badge-ea' },
    { code: p.codePA, unit: p.unitPA || 'PA', label: 'PA', cls: 'badge-pa' },
    { code: p.codeBP, unit: p.unitBP || 'BP', label: 'BP', cls: 'badge-bp' },
    { code: p.codeCS, unit: p.unitCS || 'CS', label: 'CS', cls: 'badge-cs' },
  ].filter(b => b.code);

  const unitInfo = p.unitEALabel ? `<div class="detail-unit-ea">📦 ${escHtml(p.unitEALabel)}</div>` : '';

  const barcodesHtml = barcodes.length > 0
    ? barcodes.map((b, i) => `
        <div class="barcode-card">
          <div class="barcode-card-header">
            <span class="barcode-type-badge ${b.cls}">${b.label}</span>
            <span class="barcode-unit">${escHtml(b.unit)}</span>
          </div>
          <div class="barcode-canvas-wrap">
            <svg id="bc_${id}_${i}" class="barcode-svg"></svg>
            <div class="barcode-number">${escHtml(b.code)}</div>
          </div>
        </div>`).join('')
    : `<div class="no-barcode">📭 ไม่มีบาร์โค้ดสำหรับสินค้านี้</div>`;

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-product-header">
      <div>
        <div class="detail-product-name">${escHtml(p.name)}</div>
        ${unitInfo}
      </div>
    </div>
    ${barcodes.length > 0 ? '<div class="barcode-section-title">บาร์โค้ด</div>' : ''}
    ${barcodesHtml}
  `;

  // Render barcodes
  requestAnimationFrame(() => {
    barcodes.forEach((b, i) => {
      try {
        JsBarcode(`#bc_${id}_${i}`, b.code, {
          format: 'CODE128',
          width: 2.2,
          height: 80,
          displayValue: false,
          margin: 6,
          lineColor: document.body.classList.contains('dark') ? '#e8eaf0' : '#0d1b3e',
          background: 'transparent',
        });
      } catch(e) {
        const el = document.getElementById(`bc_${id}_${i}`);
        if (el) el.parentElement.innerHTML = `<div class="no-barcode">⚠️ บาร์โค้ดไม่ถูกต้อง: ${escHtml(b.code)}</div>`;
      }
    });
  });

  document.getElementById('listScreen').classList.remove('active');
  document.getElementById('detailScreen').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function showList() {
  document.getElementById('detailScreen').classList.remove('active');
  document.getElementById('listScreen').classList.add('active');
}

// ═══════════════ DARK MODE ════════════
function toggleDark() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  localStorage.setItem('rattana-dark', darkMode);
}

// ═══════════════ UTILS ═══════════════
function showSpinner(msg='กำลังโหลด...') {
  document.getElementById('spinnerText').textContent = msg;
  document.getElementById('spinnerOverlay').classList.add('show');
}
function hideSpinner() {
  document.getElementById('spinnerOverlay').classList.remove('show');
}
function showToast(msg, ms=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function renderEmpty(title, sub) {
  document.getElementById('productList').innerHTML = `<div class="empty-state">
    <div class="empty-icon">⚠️</div>
    <div class="empty-text">${title}</div>
    <div class="empty-sub">${sub}</div>
  </div>`;
  document.getElementById('statsText').textContent = '';
  document.getElementById('pagination').innerHTML = '';
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
