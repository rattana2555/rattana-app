<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Preview — Rattana</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Mali:wght@400;600;700&family=Itim&family=Charm:wght@400;700&family=Bai+Jamjuree:wght@400;600;700&family=Chakra+Petch:wght@400;600;700&family=Kanit:wght@400;600;700&family=Mitr:wght@400;600;700&family=Prompt:wght@400;600;700&family=Sriracha&family=Pattaya&family=Krub:wght@400;600;700&family=Niramit:wght@400;600;700&family=Athiti:wght@400;600;700&family=Trirong:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0d1b3e; --navy-2:#1a2f5e; --gold:#c8a02e; --gold-2:#e1ba50;
      --bg:#f8fafc; --text:#0f172a; --text-2:#64748b; --card:#fff; --border:#e2e8f0;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);padding:24px;min-height:100vh}

    .header{max-width:900px;margin:0 auto 32px;text-align:center}
    .header h1{font-size:28px;color:var(--navy);margin-bottom:8px}
    .header p{color:var(--text-2);font-size:14px}

    .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px}
    @media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}

    .card{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .2s;cursor:pointer}
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
    .card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,160,46,.2)}

    .card-head{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:14px 18px;position:relative}
    .card-head .font-name{font-size:18px;font-weight:700}
    .card-head .desc{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
    .card-head .pick-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:var(--gold);color:var(--navy);border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif}

    .demo{padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;margin:0}
    .demo .greet-hi{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px}
    .demo .greet-name{font-size:20px;font-weight:700;margin:4px 0 14px}
    .demo .tier-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(200,160,46,.18);border:1px solid rgba(200,160,46,.3);padding:6px 14px;border-radius:24px;margin-bottom:14px}
    .demo .tier-pill .icon{font-size:18px}
    .demo .tier-pill .name{font-size:14px;font-weight:600}
    .demo .points-label{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.6px}
    .demo .points-val{font-size:38px;font-weight:800;color:var(--gold);line-height:1;margin-top:2px}
    .demo .points-unit{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px}

    .demo-text{padding:18px;border-top:1px solid var(--border)}
    .demo-text .line{margin-bottom:8px;font-size:14px}
    .demo-text .line .label{display:inline-block;width:90px;color:var(--text-2);font-size:12px}
    .demo-text .line .val{font-weight:600}
    .demo-text .big{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:10px}

    .selected-bar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;padding:16px;text-align:center;font-size:14px;display:none;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
    .selected-bar.show{display:block}
    .selected-bar code{background:rgba(200,160,46,.2);padding:4px 10px;border-radius:6px;font-weight:700;color:var(--gold)}
  </style>
</head>
<body>

<div class="header">
  <h1>เลือกฟอนต์น่ารักๆ สำหรับ Rattana Mart</h1>
  <p>คลิกที่การ์ดเพื่อเลือก แล้วบอกชื่อฟอนต์ในแชทได้เลย</p>
</div>

<div class="grid" id="grid"></div>

<div class="selected-bar" id="selectedBar"></div>

<script>
const FONTS = [
  { name:'Sarabun',      desc:'ฟอนต์ปัจจุบัน — modern, clean' },
  { name:'Mali',         desc:'น่ารัก เขียนมือ — friendly handwritten 💕' },
  { name:'Itim',         desc:'อ่านง่าย โค้งมน — rounded friendly 🌸' },
  { name:'Charm',        desc:'หรู โค้งเก๋ — elegant cute ✨' },
  { name:'Bai Jamjuree', desc:'น่ารักทั่วไป — soft & approachable' },
  { name:'Chakra Petch', desc:'modern tech — เข้ม clean' },
  { name:'Kanit',        desc:'modern geometric — popular' },
  { name:'Mitr',         desc:'minimal ทันสมัย' },
  { name:'Prompt',       desc:'geometric ดูแพง' },
  { name:'Sriracha',     desc:'เขียนมือสุดน่ารัก 🍦' },
  { name:'Pattaya',      desc:'นุ่มนวล โค้งเก๋' },
  { name:'Krub',         desc:'สุภาพ น่าเชื่อถือ' },
  { name:'Niramit',      desc:'อ่านง่าย เป็นกันเอง' },
  { name:'Athiti',       desc:'modern ดูแพง' },
  { name:'Trirong',      desc:'serif หรู คลาสสิก' },
];

const grid = document.getElementById('grid');
let selected = null;

FONTS.forEach((f, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.font = f.name;
  card.innerHTML = `
    <div class="card-head">
      <div class="font-name">${f.name}</div>
      <div class="desc">${f.desc}</div>
      <button class="pick-btn" onclick="pickFont('${f.name}', event)">เลือก</button>
    </div>
    <div class="demo" style="font-family:'${f.name}',sans-serif">
      <div class="greet-hi">สวัสดี</div>
      <div class="greet-name">คุณ ภัทรวรรณ งั่วสมบูรณ์</div>
      <div class="tier-pill">
        <span class="icon">💎</span>
        <span class="name">Platinum</span>
      </div>
      <div>
        <div class="points-label">แต้มสะสม</div>
        <div class="points-val">1,234</div>
        <div class="points-unit">คะแนน</div>
      </div>
    </div>
    <div class="demo-text" style="font-family:'${f.name}',sans-serif">
      <div class="big">ยินดีต้อนรับสู่ Rattana Mart</div>
      <div class="line"><span class="label">เบอร์โทร</span><span class="val">0947799489</span></div>
      <div class="line"><span class="label">วันเกิด</span><span class="val">15 ตุลาคม 2544</span></div>
      <div class="line"><span class="label">ที่อยู่</span><span class="val">20/2 หมู่ 6 ตำบลนาโคก จังหวัดสมุทรสาคร</span></div>
      <div class="line" style="margin-top:10px;color:var(--text-2);font-size:12px">The quick brown fox jumps over the lazy dog 1234567890</div>
    </div>
  `;
  card.onclick = () => pickFont(f.name);
  grid.appendChild(card);
});

function pickFont(name, ev) {
  if (ev) ev.stopPropagation();
  selected = name;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.font === name));
  const bar = document.getElementById('selectedBar');
  bar.innerHTML = `✓ เลือก <code>${name}</code> — บอกชื่อฟอนต์นี้ในแชทเพื่อให้ผมปรับให้`;
  bar.classList.add('show');
  document.querySelector(`[data-font="${name}"]`).scrollIntoView({ behavior:'smooth', block:'center' });
}
</script>

</body>
</html>
