function getApiKey(){return localStorage.getItem(KEY_STORE)||'';}
function saveApiKey(k){localStorage.setItem(KEY_STORE,k);}

function _setLoad(msg,pct,sub){
  const m=document.getElementById('lm'),b=document.getElementById('lb'),s=document.getElementById('ls');
  if(m)m.textContent=msg; if(b)b.style.width=pct+'%';
  if(s&&sub!==undefined)s.textContent=sub||'';
}
function _csvLine(line){
  const r=[];let c='',q=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){q=!q;}
    else if(line[i]===','&&!q){r.push(c);c='';}
    else{c+=line[i];}
  }r.push(c);return r;
}
function _parseCSV(txt){
  const rows=txt.trim().split('\n');
  const hdr=_csvLine(rows[0]).map(h=>h.replace(/"/g,'').trim());
  return rows.slice(1).map(r=>{
    const v=_csvLine(r);const o={};
    hdr.forEach((h,i)=>{o[h]=(v[i]||'').replace(/^"|"$/g,'').trim();});
    return o;
  }).filter(r=>Object.values(r).some(v=>v));
}
async function _fetchSheet(name){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`);
  if(!r.ok)throw new Error(`Sheet "${name}" (${r.status}) — ตั้งค่าเป็น "ทุกคนที่มีลิงก์ดูได้"`);
  return r.text();
}
async function _loadSheets(){
  const HQ=[13.444304778884815,100.03838295867146];
  const PG={'สมุทรสงคราม':[13.409,100.002],'สมุทรสาคร':[13.540,100.010],
    'ราชบุรี':[13.537,99.817],'ประจวบคีรีขันธ์':[12.393,99.910],
    'เพชรบุรี':[13.111,99.939],'กาญจนบุรี':[14.003,99.548]};
  const [bc,rc]=await Promise.all([_fetchSheet('Bill DS'),_fetchSheet('Route')]);
  const br=_parseCSV(bc),rr=_parseCSV(rc);
  const rm={};
  rr.forEach(r=>{
    const code=r['รหัสร้านค้า'];if(!code)return;
    const gps=r['โลเคชัน']||'';
    let lat=null,lng=null;
    if(gps&&gps.includes(',')){const p=gps.split(',');lat=parseFloat(p[0]);lng=parseFloat(p[1]);}
    if(!isNaN(lat)&&!isNaN(lng))rm[code]={lat,lng,routeCode:r['Serial Route จด']||r['รูทจด']||'',routeName:r['ชื่อสายจด']||'',day:r['วันส่ง']||''};
  });
  const bm={};
  br.forEach(r=>{
    const ref=r['DI_REF'];if(!ref)return;
    if(!bm[ref])bm[ref]={ref,date:r['DI_DATE']||'',arCode:r['AR_CODE']||'',arName:r['AR_NAME']||'',
      slmn:r['SLMN_CODE']||'',province:r['ADDB_PROVINCE']||'',district:r['ADDB_DISTRICT']||'',totalEA:0,totalAmt:0};
    bm[ref].totalEA+=parseInt(r['EA']||'0',10)||0;
    bm[ref].totalAmt+=parseFloat((r['TRD_G_AMT']||'0').replace(/,/g,''))||0;
  });
  let idx=0;
  return Object.values(bm).filter(b=>b.totalEA>0).map(b=>{
    const rt=rm[b.arCode]||{};
    let lat=rt.lat,lng=rt.lng;
    if(!lat||!lng||isNaN(lat)||isNaN(lng)){
      const fb=PG[b.province];
      if(fb){const a=idx*0.72,rd=0.003*(1+Math.floor(idx/8));lat=+(fb[0]+rd*Math.sin(a)).toFixed(6);lng=+(fb[1]+rd*Math.cos(a)).toFixed(6);}
      else{lat=HQ[0]+(idx%5)*0.01;lng=HQ[1]+(idx%7)*0.01;}
    }
    idx++;
    let ds=b.date;
    try{const p=b.date.split('/');if(p.length===3)ds=`${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}/${p[2]}`;}catch(e){}
    return{ref:b.ref,date:ds,arCode:b.arCode,arName:b.arName,
      routeCode:rt.routeCode||(b.slmn+'R01'),
      totalEA:b.totalEA,totalAmt:Math.round(b.totalAmt),
      totalWeight:Math.round(b.totalEA*0.45),
      province:b.province,district:b.district,lat,lng};
  }).filter(b=>b.lat&&b.lng&&!isNaN(b.lat));
}

(async function(){

})();

    const R = 6371, toRad = x => x * Math.PI / 180;
