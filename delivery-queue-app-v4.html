/* ─── HAVERSINE ─── */
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const distFromHQ = (lat, lng) => haversine(HQ.lat, HQ.lng, lat, lng);

/* ─── VOLUME HELPERS ─── */
// ประมาณปริมาตรจากน้ำหนัก (density สินค้าอุปโภคบริโภคไทย ~350 กก./m³)
const GOODS_DENSITY = 350;
const billVol = b => parseFloat((b.totalWeight / GOODS_DENSITY).toFixed(2)); // m³

// คำนวณน้ำหนัก + ปริมาตรที่ใช้ไปแล้ว สำหรับแต่ละรถ → {plate: {w, v}}
const computeCarLoads = asgn => {
  const m = {};
  BILLS.forEach(b => {
    const p = asgn[b.ref];
    if (p) {
      if (!m[p]) m[p] = {w:0, v:0};
      m[p].w += b.totalWeight;
      m[p].v += billVol(b);
    }
  });
  return m;
};

// % ที่ตึงสุด (น้ำหนักหรือปริมาตร อย่างใดอย่างหนึ่ง)
const capPct   = (ld, car) => Math.max(
  car.payload > 0 ? Math.round((ld.w||0) / car.payload * 100) : 0,
  car.volCap  > 0 ? Math.round((ld.v||0) / car.volCap  * 100) : 0
);
const wPct     = (ld, car) => car.payload > 0 ? Math.round((ld.w||0) / car.payload * 100) : 0;
const vPct     = (ld, car) => car.volCap  > 0 ? Math.round((ld.v||0) / car.volCap  * 100) : 0;
// ตรวจว่าจะเกินถ้าเพิ่มบิลนี้
const wouldOverW = (ld, car, b) => (ld.w||0) + b.totalWeight > car.payload;
const wouldOverV = (ld, car, b) => car.volCap > 0 && (ld.v||0) + billVol(b) > car.volCap;
const wouldOver  = (ld, car, b) => wouldOverW(ld,car,b) || wouldOverV(ld,car,b);

/* ─── GEO AUTO-ASSIGN ─── */
// ลำดับลงรถ: 6 ล้อ → 4 ล้อจัมโบ้ → 12 ล้อ (12 ล้อใช้เฉพาะระยะทางไกล ≥60 กม.)
const TYPE_PRIORITY = { '6 ล้อ': 1, '4 ล้อจัมโบ้': 2, '12 ล้อ': 3 };
const LONG_DIST_KM = 60; // ระยะทางขั้นต่ำที่ 12 ล้อจะรับในรอบแรก

function geoAutoAssign(bills, cars) {
  const activeCars = cars.filter(c => c.active && c.payload > 0)
    .sort((a, b) => {
      const pa = TYPE_PRIORITY[a.type] ?? 9;
      const pb = TYPE_PRIORITY[b.type] ?? 9;
      if (pa !== pb) return pa - pb;          // 6 ล้อ → 4 ล้อ → 12 ล้อ
      return b.payload - a.payload;           // ถ้าประเภทเดียวกัน: บรรทุกได้มากก่อน
    });

  const loads = {};   // {plate: {w, v}}
  const assignments = {};
  const assigned = new Set();
  const carPos = {}; // current position per car (starts at HQ)
  activeCars.forEach(c => {
    carPos[c.plate] = { lat: HQ.lat, lng: HQ.lng };
    loads[c.plate] = { w: 0, v: 0 };
  });

  // Sort bills by distance from HQ
  const sorted = [...bills].sort((a, b) =>
    distFromHQ(a.lat, a.lng) - distFromHQ(b.lat, b.lng)
  );

  // Nearest-neighbour routing per truck
  for (const car of activeCars) {
    const is12wheel = car.type === '12 ล้อ';
    let improved = true;
    while (improved) {
      improved = false;
      const pos = carPos[car.plate];
      const ld = loads[car.plate];
      // Find nearest unassigned bill that fits BOTH weight AND volume
      const candidates = sorted
        .filter(b => !assigned.has(b.ref))
        .filter(b => (ld.w + b.totalWeight) <= car.payload)
        .filter(b => car.volCap <= 0 || (ld.v + billVol(b)) <= car.volCap)
        // 12 ล้อ: รอบแรกรับเฉพาะบิลระยะทางไกล (≥LONG_DIST_KM กม. จาก HQ)
        .filter(b => !is12wheel || distFromHQ(b.lat, b.lng) >= LONG_DIST_KM)
        .map(b => ({ b, dist: haversine(pos.lat, pos.lng, b.lat, b.lng) }))
        .sort((a, b) => a.dist - b.dist);

      if (!candidates.length) break;

      const nearest = candidates[0];
      const alreadyOnTruck = Object.entries(assignments).filter(([,p])=>p===car.plate).length;

      // If truck already has stops and nearest next stop is >80km away, stop routing this truck
      if (alreadyOnTruck > 0 && nearest.dist > 80) break;

      assignments[nearest.b.ref] = car.plate;
      assigned.add(nearest.b.ref);
      loads[car.plate].w += nearest.b.totalWeight;
      loads[car.plate].v += billVol(nearest.b);
      carPos[car.plate] = { lat: nearest.b.lat, lng: nearest.b.lng };
      improved = true;
    }
  }
  // Assign any remaining (overflow) to any car with space — ไม่กรองระยะทาง
  bills.filter(b => !assigned.has(b.ref)).forEach(b => {
    const car = activeCars
      .filter(c => (loads[c.plate].w + b.totalWeight) <= c.payload &&
                   (c.volCap <= 0 || (loads[c.plate].v + billVol(b)) <= c.volCap))
      .sort((a, b) => capPct(loads[a.plate],a) - capPct(loads[b.plate],b))[0];
    if (car) {
      assignments[b.ref] = car.plate;
      assigned.add(b.ref);
      loads[car.plate].w += b.totalWeight;
      loads[car.plate].v += billVol(b);
    }
  });
  return assignments;
}

  const hs = size, tail = size*0.55;
  return window.L.divIcon({
    html: `<div style="position:relative;width:${hs}px;height:${hs+tail}px;opacity:${opacity};filter:drop-shadow(0 3px 6px rgba(0,0,0,0.28))">
      <div style="position:absolute;top:0;left:0;width:${hs}px;height:${hs}px;border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);background:${col};border:2.5px solid white;">
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);
          color:white;font-weight:700;font-size:${Math.round(hs*0.42)}px;
          font-family:'Sarabun',sans-serif;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.35);">${label}</div>
      </div>
      <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);
        width:${Math.round(hs*0.3)}px;height:${Math.round(tail*0.4)}px;
        background:radial-gradient(ellipse at 50% 0%,rgba(0,0,0,0.2),transparent 70%)"></div>
    </div>`,
    className: '',
    iconSize:    [hs, hs + tail],
    iconAnchor:  [hs/2, hs + tail],
    popupAnchor: [0, -(hs + tail) - 2],
  });
}

function createHQIcon() {
  return window.L.divIcon({
    html: `<div style="filter:drop-shadow(0 4px 8px rgba(0,0,0,0.32))">

        background:#C9A84C;border:3px solid white;">
        <div style="transform:rotate(45deg);text-align:center;line-height:32px;font-size:17px;color:white;text-shadow:0 1px 3px rgba(0,0,0,.4);">★</div>
      </div>
    </div>`,
    className: '',
    iconSize:    [38, 57],
    iconAnchor:  [19, 57],
    popupAnchor: [0, -57],
  });
}

function RouteMap({ bills, assignments, filterPlate = null, showLines = true, height = 340 }) {
  const [lfReady, setLfReady] = useState(false);
  const [loading, setLoading] = useState(true);
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const layersRef    = useRef([]);

  // ── Load Leaflet CSS + JS once ──
  useEffect(() => {
    if (!document.getElementById('lf-css')) {
      const l = document.createElement('link');
      l.id = 'lf-css'; l.rel = 'stylesheet'; l.href = LEAFLET_CSS;
      document.head.appendChild(l);
    }
    if (window.L) { setLfReady(true); return; }
    const s = document.createElement('script');
    s.src = LEAFLET_JS;
    s.onload = () => setLfReady(true);
    s.onerror = () => setLoading(false);
    document.head.appendChild(s);
  }, []);

  // ── Init map once Leaflet is loaded ──
  useEffect(() => {
    if (!lfReady || !containerRef.current || mapRef.current) return;
    const L = window.L;
    const map = L.map(containerRef.current, {
      zoomControl: false, // custom controls below
      attributionControl: true,
      scrollWheelZoom: true,
    }).setView([HQ.lat, HQ.lng], 11);

    L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);

    mapRef.current = map;
    setLoading(false);

    return () => {
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    };
  }, [lfReady]);

  // ── Update markers & routes when data changes ──
  useEffect(() => {
    if (!mapRef.current || !lfReady || !window.L) return;
    const map = mapRef.current;
    const L   = window.L;

    // Clear old layers
    layersRef.current.forEach(ly => { try { map.removeLayer(ly); } catch(e){} });
    layersRef.current = [];

    // Build stop numbers per truck
    const stopNums = {};
    if (filterPlate) {
      const stops = bills.filter(b => assignments[b.ref] === filterPlate)
        .map(b => ({ ...b, d: distFromHQ(b.lat, b.lng) }))
        .sort((a,b) => a.d - b.d);
      stops.forEach((b,i) => { stopNums[b.ref] = i+1; });
    }

    const getCol = plate => {
      const gi = CARS.findIndex(c => c.plate === plate);
      return gi >= 0 ? TRUCK_COLORS[gi % TRUCK_COLORS.length] : '#9BAAB8';
    };

    // ── Route polylines ──
    if (showLines) {
      const truckStops = {};
      CARS.filter(c => c.active).forEach(c => {
        if (filterPlate && c.plate !== filterPlate) return;
        const bt = bills.filter(b => assignments[b.ref] === c.plate)
          .sort((a,b) => distFromHQ(a.lat,a.lng) - distFromHQ(b.lat,b.lng));
        if (bt.length) truckStops[c.plate] = bt;
      });

      Object.entries(truckStops).forEach(([plate, stops]) => {
        const col = getCol(plate);
        const pts = [[HQ.lat, HQ.lng], ...stops.map(b => [b.lat, b.lng])];
        const line = L.polyline(pts, {
          color: col, weight: 3.5, opacity: 0.8, dashArray: '10 6',
          lineJoin: 'round', lineCap: 'round',
        }).addTo(map);
        layersRef.current.push(line);
      });
    }

    // ── Bill markers ──
    bills.forEach(b => {
      const plate = assignments[b.ref];
      const isDimmed = filterPlate && plate !== filterPlate;
      const col  = plate ? getCol(plate) : '#9BAAB8';
      const num  = stopNums[b.ref];
      const car  = CARS.find(c => c.plate === plate);
      const dist = distFromHQ(b.lat, b.lng);

      const size = num ? 30 : (plate ? 26 : 22);
      const label = num ? String(num) : (plate ? '·' : '?');
      const icon = createPinIcon(col, label, size, isDimmed ? 0.25 : 1);

      const popup = `
        <div style="font-family:'Sarabun',sans-serif;min-width:180px">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;color:#07101F">${b.arName}</div>
          <div style="font-size:11px;color:#6B7A90;margin-bottom:3px">📍 ${b.district}, ${b.province}</div>
          <div style="font-size:11px;color:#1A5FA5;margin-bottom:3px">ห่าง HQ: <b>${dist.toFixed(1)} กม.</b></div>
          <div style="font-size:11px;color:#444;margin-bottom:4px">⚖ ${fmtKg(b.totalWeight)} &nbsp;·&nbsp; ฿${fmtNum(b.totalAmt)}</div>
          <div style="font-size:11px;padding:4px 8px;border-radius:6px;background:${plate?col+'18':'#F5F7FA'};color:${plate?col:'#9BAAB8'};font-weight:600">
            ${plate ? `${CAR_ICON[car?.type]||'🚛'} ${plate} — ${car?.driver}` : '⏳ รอจัดรถ'}
          </div>
          ${num ? `<div style="margin-top:4px;font-size:11px;color:#C9A84C;font-weight:700">🚩 จุดที่ ${num}</div>` : ''}
          <div style="margin-top:4px">
            <a href="https://www.google.com/maps?q=${b.lat},${b.lng}" target="_blank"
              style="font-size:10px;color:#1A5FA5;text-decoration:none">🔗 เปิด Google Maps</a>
          </div>
        </div>`;

      const marker = L.marker([b.lat, b.lng], { icon })
        .bindPopup(popup, { maxWidth: 240 })
        .addTo(map);
      layersRef.current.push(marker);
    });

    // ── HQ marker ──
    const hqPopup = `<div style="font-family:'Sarabun',sans-serif">
      <div style="font-weight:700;font-size:13px;color:#C9A84C">★ HQ รัตนไพบูลย์ กรุ๊ป</div>
      <div style="font-size:11px;color:#6B7A90;margin-top:2px">สมุทรสงคราม (จุดเริ่มต้น)</div>
      <div style="font-size:10px;color:#A0ABBB;margin-top:2px">${HQ.lat.toFixed(5)}, ${HQ.lng.toFixed(5)}</div>
    </div>`;
    const hqMarker = L.marker([HQ.lat, HQ.lng], { icon: createHQIcon(), zIndexOffset: 1000 })
      .bindPopup(hqPopup).addTo(map);
    layersRef.current.push(hqMarker);

    // ── Auto-fit bounds ──
    const validBills = bills.filter(b => !filterPlate || assignments[b.ref] === filterPlate);
    if (validBills.length > 0) {
      const pts = [[HQ.lat, HQ.lng], ...validBills.map(b => [b.lat, b.lng])];
      try { map.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 13 }); }
      catch(e) {}
    }
  }, [assignments, filterPlate, showLines, lfReady]);

  return (
    <div style={{ position: 'relative', borderRadius: 10, overflow: 'hidden', border: '1px solid #D4D9E3' }}>
      {/* loading overlay */}
      {loading && (
        <div style={{ position:'absolute', inset:0, background:'#EDF1F7', display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center', zIndex:10, borderRadius:10, gap:8 }}>
          <div style={{ fontSize:28 }}>🗺️</div>
          <div style={{ fontSize:13, color:'#6B7A90', fontFamily:'Sarabun' }}>กำลังโหลดแผนที่...</div>
        </div>
      )}
      <div ref={containerRef} style={{ height, width:'100%', background:'#EDF1F7' }}/>
    </div>
  );
}

            <div style={{fontFamily:'Kanit',fontSize:13,fontWeight:600,color:'#E4C46E',lineHeight:1.1}}>จัดคิวรถส่ง</div>
            <div style={{fontSize:9,color:'#4A6280'}}>รัตนไพบูลย์ กรุ๊ป</div>
          </div>
        </div>
        <div style={{display:'flex',gap:1,flex:1}}>
          {NAV.map(n=>{const a=active===n.k;return(

        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>

        <span style={{fontSize:18}}>{n.i}</span><span style={{fontWeight:a?600:400,fontSize:10}}>{n.l}</span>
      </button>);})}

}

/* ─── TRUCK CARD ─── */
function TruckCard({car,ld,isSelected,onClick,colorIdx}){
  const load = ld || {w:0, v:0};
  const wp=car.payload>0?Math.round(load.w/car.payload*100):0;
  const vp=car.volCap>0?Math.round(load.v/car.volCap*100):0;
  const eff=Math.max(wp,vp);
  const over=wp>100||vp>100;
  const tCol=TRUCK_COLORS[colorIdx%TRUCK_COLORS.length];
  const effCol=over?'#C62828':pcColor(eff);
  return(
    <div className="truck-card" onClick={onClick}
      style={{background:isSelected?'#FFF8EC':T.card,
        border:`2px solid ${isSelected?T.gold:over?'#C62828':T.border}`,
        borderRadius:10,padding:'10px 12px',cursor:'pointer',minWidth:140,flexShrink:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
        <div>
          <div style={{fontSize:9,color:tCol,fontWeight:600}}>{CAR_ICON[car.type]} {car.type}</div>
          <div style={{fontSize:14,fontWeight:700,fontFamily:'Kanit',color:isSelected?T.goldD:T.white,marginTop:1}}>{car.plate}</div>
        </div>
        <div style={{textAlign:'right'}}>
          {over&&<div style={{fontSize:9,color:'#C62828',fontWeight:700,marginBottom:1}}>⚠ เกิน</div>}
          <div style={{fontSize:15,fontWeight:700,color:effCol}}>{eff}%</div>
          <div style={{fontSize:9,color:T.muted}}>{fmtKg(load.w)}</div>
        </div>
      </div>
      <DualCapBar wUsed={load.w} wTotal={car.payload} vUsed={load.v} vTotal={car.volCap} h={4}/>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:3,fontSize:10}}>
        <span style={{color:wp>100?'#C62828':T.muted}}>⚖ {wp}%</span>
        <span style={{color:vp>100?'#C62828':T.muted}}>📦 {vp}%</span>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:11}}>
        <span style={{color:isSelected?T.goldD:T.muted,fontWeight:600}}>{car.driver}</span>
        <span style={{color:T.dim}}>{fmtKg(car.payload)}</span>
      </div>
      {isSelected&&<div style={{textAlign:'center',marginTop:4,fontSize:10,color:T.gold,fontWeight:600}}>▼ กำลังเลือก</div>}
    </div>
  );
}

/* ─── QUEUE PLANNER ─── */
function QueuePlanner({assignments,onAssign,onSaveSheet,addToast}){
  const [activePlate,setActivePlate]=useState(null);
  const [filterDate,setFilterDate]=useState('all');
  const [filterStatus,setFilterStatus]=useState('all');
  const [search,setSearch]=useState('');
  const [sortBy,setSortBy]=useState('dist'); // dist | weight | date
  const [selRefs,setSelRefs]=useState(new Set());
  const [saving,setSaving]=useState(false);
  const [aiLoading,setAiLoading]=useState(false);
  const [autoLoading,setAutoLoading]=useState(false);
  const [aiText,setAiText]=useState('');
  const activeCars=CARS.filter(c=>c.active&&c.payload>0);
  const activeCarIdx=useMemo(()=>{const m={};activeCars.forEach((c,i)=>m[c.plate]=i);return m;},[]);

  const carLoads=useMemo(()=>computeCarLoads(assignments),[assignments]);

  const dates=['all',...[...new Set(BILLS.map(b=>b.date))].sort()];

  const sortedFiltered=useMemo(()=>{
    let list=BILLS.filter(b=>{
      const mD=filterDate==='all'||b.date===filterDate;
      const mS=filterStatus==='all'||(filterStatus==='assigned'&&assignments[b.ref])||(filterStatus==='pending'&&!assignments[b.ref]);
      const mQ=!search||b.arName.includes(search)||b.ref.includes(search);
      return mD&&mS&&mQ;
    });
    if(sortBy==='dist') list=[...list].sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng));
    else if(sortBy==='weight') list=[...list].sort((a,b)=>b.totalWeight-a.totalWeight);
    else list=[...list].sort((a,b)=>a.date.localeCompare(b.date));
    // ถ้าเลือกรถอยู่ → เอาบิลของรถนั้นขึ้นก่อนทั้งหมด
    if(activePlate){
      list=[
        ...list.filter(b=>assignments[b.ref]===activePlate),
        ...list.filter(b=>assignments[b.ref]!==activePlate),
      ];
    }
    return list;
  },[filterDate,filterStatus,search,sortBy,assignments,activePlate]);

  const toggle=ref=>setSelRefs(p=>{const n=new Set(p);n.has(ref)?n.delete(ref):n.add(ref);return n;});
  const toggleAll=()=>setSelRefs(selRefs.size===sortedFiltered.length?new Set():new Set(sortedFiltered.map(b=>b.ref)));

  // ตรวจ overflow แล้วแจ้งเตือน แต่ยังจัดได้
  const checkAndWarn=(plate,billRefs)=>{
    const car=CARS.find(c=>c.plate===plate);
    if(!car) return;
    const curLd=carLoads[plate]||{w:0,v:0};
    const addW=billRefs.reduce((s,r)=>{const b=BILLS.find(x=>x.ref===r);return s+(b?.totalWeight||0);},0);
    const addV=billRefs.reduce((s,r)=>{const b=BILLS.find(x=>x.ref===r);return s+billVol(BILLS.find(x=>x.ref===r)||{totalWeight:0});},0);
    const newW=curLd.w+addW, newV=curLd.v+addV;
    const overW=newW>car.payload, overV=car.volCap>0&&newV>car.volCap;
    if(overW||overV){
      const msgs=[];
      if(overW) msgs.push(`น้ำหนัก ${fmtKg(newW)}/${fmtKg(car.payload)} (${Math.round(newW/car.payload*100)}%)`);
      if(overV) msgs.push(`ปริมาตร ${fmtM3(newV)}/${fmtM3(car.volCap)} (${Math.round(newV/car.volCap*100)}%)`);
      addToast(`⚠️ ${plate} เกินขีด: ${msgs.join(', ')} — จัดได้แต่ควรตรวจสอบ`,'warn');
    }
  };

  const handleBillClick=ref=>{
    if(activePlate){
      if(assignments[ref]===activePlate){onAssign({[ref]:''});addToast('ยกเลิกคิวแล้ว','warn');}
      else{
        checkAndWarn(activePlate,[ref]);
        onAssign({[ref]:activePlate});
      }
    } else toggle(ref);
  };

  const assignSelected=()=>{
    if(!activePlate||selRefs.size===0) return;
    const refs=[...selRefs];
    checkAndWarn(activePlate,refs);
    const u={};refs.forEach(r=>{u[r]=activePlate;});
    onAssign(u);setSelRefs(new Set());
    addToast(`✅ จัด ${selRefs.size} บิล → ${activePlate}`,'ok');
  };

  const handleAutoAssign=()=>{
    setAutoLoading(true);
    setTimeout(()=>{
      const result=geoAutoAssign(BILLS,CARS);
      onAssign(result,true);
      setAutoLoading(false);
      const assigned=Object.keys(result).length;
      addToast(`✅ จัดรถอัตโนมัติ (ระยะทาง) สำเร็จ — ${assigned} บิล`,'ok');
    },400);
  };

  const handleAI=async()=>{
    setAiLoading(true);setAiText('');
    const pending=BILLS.filter(b=>!assignments[b.ref]);
    try{
      const _key=getApiKey();if(!_key){addToast('⚠️ กรุณาใส่ API Key ก่อน (กดไอคอน 🔑)','warn');setAiLoading(false);return;}
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":_key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,
          messages:[{role:"user",content:
`จัดคิวรถส่งสินค้าโดยคำนึงถึงระยะทาง (จุดเริ่มต้น HQ: ${HQ.lat},${HQ.lng}):

บิลรอจัดรถ:
${pending.map(b=>`• ${b.ref} | ${b.arName} | ${b.province} ${b.district} | GPS: ${b.lat},${b.lng} | ห่าง HQ: ${distFromHQ(b.lat,b.lng).toFixed(1)}กม. | ${b.totalWeight}กก. | ${fmtM3(billVol(b))}`).join('\n')}

รถที่มี:
${activeCars.map(c=>{const ld=carLoads[c.plate]||{w:0,v:0};return`• ${c.plate} (${c.type}) | ${c.driver} | รับได้ ${c.payload}กก./${fmtM3(c.volCap)} | ใช้ไป ${fmtKg(ld.w)}/${fmtM3(ld.v)}`;}).join('\n')}

แนะนำว่าบิลไหนควรขึ้นรถคันไหน โดยจัดร้านที่ใกล้กันไว้รถเดียวกัน ร้านไกลใช้รถใหญ่ คำนึงทั้งน้ำหนักและปริมาตร ตอบกระชับภาษาไทย`}]})});
      const d=await res.json();
      setAiText(d.content?.find(c=>c.type==='text')?.text||'ไม่สามารถวิเคราะห์ได้');
    }catch(e){setAiText('เกิดข้อผิดพลาด: '+e.message);}
    setAiLoading(false);
  };

  const selWeight=[...selRefs].reduce((s,r)=>{const b=BILLS.find(x=>x.ref===r);return s+(b?.totalWeight||0);},0);

  return(
    <div className="fi">
      {/* Header */}
      <div style={{display:'flex',flexWrap:'wrap',gap:10,alignItems:'center',marginBottom:14}}>
        <div>
          <h1 style={{fontFamily:'Kanit',fontSize:20,fontWeight:600,color:'#07101F'}}>🚛 จัดคิวรถส่งสินค้า</h1>
          <p style={{color:T.muted,fontSize:12,marginTop:1}}>
            <span style={{color:'#15803D',fontWeight:600}}>{BILLS.filter(b=>assignments[b.ref]).length} จัดแล้ว</span>
            {' / '}<span style={{color:'#B45309',fontWeight:600}}>{BILLS.filter(b=>!assignments[b.ref]).length} รอจัด</span>
            <span style={{color:T.muted}}> — เรียงตามระยะทางจาก HQ</span>
          </p>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:7,flexWrap:'wrap'}}>
          <button className="btn" onClick={handleAutoAssign} disabled={autoLoading}
            style={{display:'flex',alignItems:'center',gap:6,background:'#EAF3DE',border:'1px solid #97C459',borderRadius:8,padding:'7px 12px',color:'#27500A',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {autoLoading?<><span className="spin" style={{fontSize:12}}>⏳</span> กำลังจัด...</>:'⚡ จัดอัตโนมัติ'}
          </button>
          <button className="btn" onClick={handleAI} disabled={aiLoading}
            style={{display:'flex',alignItems:'center',gap:6,background:'#FDF6E8',border:'1px solid #E4C46E',borderRadius:8,padding:'7px 12px',color:'#633806',fontSize:12,cursor:'pointer'}}>
            {aiLoading?<><span className="spin" style={{fontSize:12}}>⏳</span> AI...</>:'✨ AI แนะนำ'}
          </button>
          <button className="btn" onClick={()=>onSaveSheet(setSaving)} disabled={saving}
            style={{display:'flex',alignItems:'center',gap:6,background:saving?'#F4F6F9':'#07101F',border:'none',borderRadius:8,padding:'7px 14px',color:saving?T.muted:'#E4C46E',fontSize:12,fontWeight:700,cursor:'pointer'}}>
            {saving?<><span className="spin" style={{fontSize:12}}>⏳</span> บันทึก...</>:'💾 Keepdata'}
          </button>
        </div>
      </div>

      {aiText&&<div style={{marginBottom:12,border:'1px solid #E4C46E',background:'#FFFDF5',borderRadius:10,padding:'12px 15px'}}>
        <div style={{display:'flex',gap:8}}>
          <span>✨</span>
          <div><div style={{fontSize:12,fontWeight:600,color:'#633806',marginBottom:4}}>AI แนะนำ (ตามระยะทาง)</div>
          <p style={{fontSize:13,color:'#07101F',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{aiText}</p></div>
        </div>
      </div>}

      {/* Truck Cards */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:12,color:T.muted,marginBottom:7}}>
          👇 <strong style={{color:'#07101F'}}>คลิกเลือกรถ</strong> แล้วคลิกบิล
          {activePlate&&<><span style={{color:T.gold,fontWeight:600}}> — {activePlate}</span>
            <button className="btn" onClick={()=>setActivePlate(null)} style={{marginLeft:6,color:T.muted,fontSize:11,textDecoration:'underline'}}>ยกเลิก</button></>}
        </div>
        <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}}>
          {activeCars.map((car,i)=>(
            <TruckCard key={car.plate} car={car} ld={carLoads[car.plate]||{w:0,v:0}}
              isSelected={activePlate===car.plate} colorIdx={i}
              onClick={()=>setActivePlate(activePlate===car.plate?null:car.plate)}/>
          ))}
        </div>

        {/* ── โยกทั้งคัน — แสดงเมื่อเลือกรถที่มีบิลแล้ว ── */}
        {activePlate&&(()=>{
          const billsOnTruck=BILLS.filter(b=>assignments[b.ref]===activePlate);
          if(!billsOnTruck.length) return null;
          const totalW=billsOnTruck.reduce((s,b)=>s+b.totalWeight,0);
          const totalAmt=billsOnTruck.reduce((s,b)=>s+b.totalAmt,0);
          return(
            <div style={{marginTop:8,background:'#FFF8EC',border:'1.5px solid #E4C46E',borderRadius:10,padding:'10px 14px',display:'flex',flexWrap:'wrap',gap:10,alignItems:'center'}}>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:'#633806'}}>🔄 โยกทั้งคัน — {activePlate}</div>
                <div style={{fontSize:11,color:'#854F0B',marginTop:2}}>
                  {billsOnTruck.length} บิล • {fmtKg(totalW)} • ฿{fmtNum(totalAmt)}
                </div>
              </div>
              <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                <span style={{fontSize:12,color:'#854F0B'}}>ย้ายทุกบิลไปรถ →</span>
                <select defaultValue=""
                  onChange={e=>{
                    if(!e.target.value) return;
                    const tgt=e.target.value;
                    const u={};
                    billsOnTruck.forEach(b=>{u[b.ref]=tgt;});
                    onAssign(u);
                    addToast(`🔄 โยก ${billsOnTruck.length} บิล จาก ${activePlate} → ${tgt} สำเร็จ`,'ok');
                    setActivePlate(tgt);
                    e.target.value='';
                  }}
                  style={{background:'#fff',border:'1.5px solid #E4C46E',borderRadius:8,padding:'6px 10px',color:'#07101F',fontSize:12,fontWeight:600,cursor:'pointer',minWidth:180}}>
                  <option value="">— เลือกรถปลายทาง —</option>
                  {activeCars.filter(c=>c.plate!==activePlate).map(c=>{
                    const ld=carLoads[c.plate]||{w:0,v:0};
                    const ep=capPct(ld,c);
                    const afterW=ld.w+totalW;
                    const willOver=afterW>c.payload;
                    return(
                      <option key={c.plate} value={c.plate}>
                        {willOver?'⚠ ':''}{CAR_ICON[c.type]} {c.plate} ({c.driver}) [{ep}% → {Math.round(afterW/c.payload*100)}%]
                      </option>
                    );
                  })}
                </select>
                <button className="btn" onClick={()=>{
                  if(!window.confirm(`ล้างบิลทั้งหมด ${billsOnTruck.length} รายการออกจาก ${activePlate}?`)) return;
                  const u={};billsOnTruck.forEach(b=>{u[b.ref]='';});
                  onAssign(u);
                  addToast(`🗑 ล้าง ${billsOnTruck.length} บิลออกจาก ${activePlate} แล้ว`,'warn');
                  setActivePlate(null);
                }} style={{background:'#FEF2F2',border:'1.5px solid #FCA5A5',borderRadius:8,padding:'6px 11px',color:'#C62828',fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                  🗑 ล้างทั้งคัน
                </button>
              </div>
            </div>
          );
        })()}
      </div>

      {/* Filters */}
      <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:8,alignItems:'center'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 ร้านค้า / เลขบิล"
          style={{flex:1,minWidth:130,background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'7px 10px',color:'#07101F',fontSize:13}}/>
        <select value={filterDate} onChange={e=>setFilterDate(e.target.value)}
          style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'7px 8px',color:'#07101F',fontSize:12}}>
          {dates.map(d=><option key={d} value={d}>{d==='all'?'ทุกวันที่':d}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
          style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'7px 8px',color:'#07101F',fontSize:12}}>
          <option value="all">ทั้งหมด</option><option value="pending">⏳ รอจัด</option><option value="assigned">✅ จัดแล้ว</option>
        </select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
          style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'7px 8px',color:'#07101F',fontSize:12}}>
          <option value="dist">📍 เรียงตามระยะทาง</option>
          <option value="weight">⚖️ น้ำหนักมากสุด</option>
          <option value="date">📅 วันที่</option>
        </select>
        {selRefs.size>0&&(
          <div style={{display:'flex',gap:6,alignItems:'center',background:'#FDF6E8',border:'1px solid #E4C46E',borderRadius:7,padding:'5px 9px'}}>
            <span style={{color:'#633806',fontSize:12,fontWeight:600}}>✓ {selRefs.size} ({fmtKg(selWeight)})</span>
            {activePlate
              ?<button className="btn" onClick={assignSelected} style={{background:'#EAF0F8',border:'1px solid #93B8DE',borderRadius:6,padding:'4px 10px',color:'#1A5FA5',fontSize:12,fontWeight:700}}>→ {activePlate}</button>
              :<select onChange={e=>{if(e.target.value){const refs=[...selRefs];checkAndWarn(e.target.value,refs);const u={};refs.forEach(r=>{u[r]=e.target.value;});onAssign(u);setSelRefs(new Set());addToast(`✅ จัด ${selRefs.size} บิล → ${e.target.value}`,'ok');}e.target.value='';}} defaultValue=""
                style={{background:'#fff',border:`1px solid ${T.border}`,borderRadius:6,padding:'4px 8px',color:'#07101F',fontSize:12}}>
                <option value="">→ เลือกรถ</option>
                {activeCars.map(c=>{const ld=carLoads[c.plate]||{w:0,v:0};const ep=capPct(ld,c);return<option key={c.plate} value={c.plate}>{CAR_ICON[c.type]} {c.plate} — {c.driver} [{ep}%]</option>;})}
              </select>}
            <button className="btn" onClick={()=>{const u={};selRefs.forEach(r=>{u[r]='';});onAssign(u);setSelRefs(new Set());}} style={{border:'1px solid #FCA5A5',borderRadius:6,padding:'4px 7px',color:'#C62828',fontSize:11}}>✕</button>
            <button className="btn" onClick={()=>setSelRefs(new Set())} style={{color:T.muted,fontSize:11,textDecoration:'underline'}}>ยกเลิก</button>
          </div>
        )}
      </div>

      {/* Bill Table */}
      <div style={{background:'#fff',border:`1px solid ${T.border}`,borderRadius:10,overflow:'hidden'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead><tr style={{background:'#F5F7FA',borderBottom:`1.5px solid ${T.border}`}}>
            <th style={{padding:'9px 11px',width:34}}>
              <input type="checkbox" checked={selRefs.size===sortedFiltered.length&&sortedFiltered.length>0} onChange={toggleAll}
                style={{cursor:'pointer',width:14,height:14,accentColor:T.gold}}/>
            </th>
            {['📍 ระยะ','ร้านค้า','จังหวัด / สาย','⚖ น้ำหนัก / 📦 ปริมาตร','มูลค่า','รถที่จัด'].map(h=>(
              <th key={h} style={{padding:'9px 9px',textAlign:'left',color:'#444441',fontWeight:600,fontSize:11,whiteSpace:'nowrap'}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {sortedFiltered.length===0&&<tr><td colSpan={7} style={{padding:36,textAlign:'center',color:T.muted}}>ไม่พบข้อมูล</td></tr>}
            {sortedFiltered.map((b,i)=>{
              const plate=assignments[b.ref];
              const car=CARS.find(c=>c.plate===plate);
              const isSel=selRefs.has(b.ref);
              const isOnActive=activePlate&&plate===activePlate;
              const carIdx=car?activeCarIdx[car.plate]:null;
              const carCol=carIdx!=null?TRUCK_COLORS[carIdx%TRUCK_COLORS.length]:null;
              const dist=distFromHQ(b.lat,b.lng);
              const bg=isOnActive?'#FFF8EC':isSel?'#EAF4FF':i%2===0?'transparent':'#F8F9FB';
              return(
                <tr key={b.ref} className="bill-row" onClick={()=>handleBillClick(b.ref)} style={{borderBottom:`1px solid #EDF0F4`,background:bg}}>
                  <td style={{padding:'9px 11px'}} onClick={e=>{e.stopPropagation();toggle(b.ref);}}>
                    <input type="checkbox" checked={isSel} onChange={()=>toggle(b.ref)} style={{cursor:'pointer',width:14,height:14,accentColor:T.gold}}/>
                  </td>
                  <td style={{padding:'9px 9px',whiteSpace:'nowrap'}}>
                    <div style={{fontSize:12,fontWeight:700,color:dist<10?'#15803D':dist<40?'#C9A84C':'#C26A00'}}>{fmtKm(dist)}</div>
                    <div style={{fontSize:9,color:T.dim}}>{b.lat.toFixed(3)}, {b.lng.toFixed(3)}</div>
                  </td>
                  <td style={{padding:'9px 9px'}}>
                    <div style={{fontWeight:600,color:'#07101F'}}>{b.arName}</div>
                    <div style={{fontSize:10,color:T.muted,marginTop:1}}>{b.ref}</div>
                  </td>
                  <td style={{padding:'9px 9px'}}>
                    <div style={{fontSize:11,color:'#6B7A90'}}>{b.province}</div>
                    <div style={{fontSize:10,color:T.dim}}>{ROUTES.find(r=>r.code===b.routeCode)?.name?.split('-')[0]||b.routeCode}</div>
                  </td>
                  <td style={{padding:'9px 9px',whiteSpace:'nowrap'}}>
                    <div style={{color:'#1A5FA5',fontWeight:600,fontSize:12}}>{fmtKg(b.totalWeight)}</div>
                    <div style={{color:T.muted,fontSize:10}}>{fmtM3(billVol(b))}</div>
                  </td>
                  <td style={{padding:'9px 9px',fontWeight:600,whiteSpace:'nowrap',color:'#07101F'}}>฿{fmtNum(b.totalAmt)}</td>
                  <td style={{padding:'9px 8px',whiteSpace:'nowrap'}}>
                    {car?(
                      <div>
                        <Chip color={carCol||'#1A5FA5'} sm>{CAR_ICON[car.type]} {car.plate} {car.driver}</Chip>
                        {activePlate&&<div style={{fontSize:10,color:'#C62828',marginTop:2}}>✕ คลิกยกเลิก</div>}
                      </div>
                    ):(
                      <div>
                        <Chip color='#C47000' sm>⏳ รอจัด</Chip>
                        {activePlate&&<div style={{fontSize:10,color:T.gold,marginTop:2}}>→ คลิกจัดรถ</div>}
                      </div>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{padding:'7px 12px',borderTop:`1px solid #EDF0F4`,fontSize:11,color:'#6B7A90',display:'flex',gap:14,background:'#FAFBFC'}}>
          <span>แสดง {sortedFiltered.length}/{BILLS.length}</span>
          <span style={{color:'#B45309',fontWeight:600}}>รอจัด: {BILLS.filter(b=>!assignments[b.ref]).length}</span>
          <span style={{color:'#15803D',fontWeight:600}}>จัดแล้ว: {BILLS.filter(b=>assignments[b.ref]).length}</span>
        </div>
      </div>
    </div>
  );
}

/* ─── ROUTES VIEW (with map) ─── */
function RoutesView({assignments}){
  const [showMap,setShowMap]=useState(true);
  const [selTruck,setSelTruck]=useState(null);
  const carLoads=useMemo(()=>computeCarLoads(assignments),[assignments]);
  const activePlateIdx=useMemo(()=>{const m={};CARS.filter(c=>c.active).forEach((c,i)=>m[c.plate]=i);return m;},[]);

  const trucksWithBills=useMemo(()=>CARS.filter(c=>c.active&&BILLS.some(b=>assignments[b.ref]===c.plate)),[assignments]);

  const billsByDist=useMemo(()=>{
    let list=[...BILLS].sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng));
    if(selTruck) list=list.filter(b=>assignments[b.ref]===selTruck);
    return list;
  },[assignments,selTruck]);

  const selCar=selTruck?CARS.find(c=>c.plate===selTruck):null;
  const selLoad=selTruck?carLoads[selTruck]||{w:0,v:0}:null;

  return(
    <div className="fi">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:8}}>
        <h1 style={{fontFamily:'Kanit',fontSize:20,fontWeight:600,color:'#07101F'}}>🗺️ สายส่งและโลเคชัน</h1>
        <button className="btn" onClick={()=>setShowMap(v=>!v)}
          style={{background:'#F0F2F6',border:`1px solid ${T.border}`,borderRadius:7,padding:'6px 13px',color:'#07101F',fontSize:12,fontWeight:500}}>
          {showMap?'ซ่อนแผนที่':'แสดงแผนที่'}
        </button>
      </div>

      {/* ── Truck Selector — minimal icon cards ── */}
      <div style={{background:'#fff',border:`1px solid ${T.border}`,borderRadius:12,padding:'12px 16px',marginBottom:14}}>
        <div style={{fontSize:11,color:T.muted,marginBottom:10,fontWeight:500,letterSpacing:.3}}>เลือกดูโลเคชันรายคัน</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'stretch'}}>

          {/* All button */}
          <button className="btn" onClick={()=>setSelTruck(null)}
            style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
              padding:'8px 14px',borderRadius:10,border:`2px solid ${!selTruck?'#07101F':T.border}`,
              background:!selTruck?'#07101F':'#fff',gap:3,minWidth:72,cursor:'pointer',transition:'all .15s'}}>
            <span style={{fontSize:20}}>🌐</span>
            <span style={{fontSize:11,fontWeight:!selTruck?700:500,color:!selTruck?'#E4C46E':T.muted}}>ทั้งหมด</span>
            <span style={{fontSize:10,color:!selTruck?'#C9A84C':'#A0ABBB'}}>{BILLS.filter(b=>assignments[b.ref]).length} บิล</span>
          </button>

          {/* Per-truck mini cards */}
          {trucksWithBills.map(c=>{
            const isSel=selTruck===c.plate;
            const cnt=BILLS.filter(b=>assignments[b.ref]===c.plate).length;
            const ld=carLoads[c.plate]||{w:0,v:0};
            const wp=c.payload>0?Math.min(100,Math.round(ld.w/c.payload*100)):0;
            const vp=c.volCap>0?Math.min(100,Math.round(ld.v/c.volCap*100)):0;
            const eff=Math.max(wp,vp);
            const over=wp>100||vp>100;
            const gIdx=CARS.findIndex(x=>x.plate===c.plate);
            const col=TRUCK_COLORS[gIdx%TRUCK_COLORS.length];
            const icon=CAR_ICON[c.type]||'🚛';
            return(
              <button key={c.plate} className="btn" onClick={()=>setSelTruck(isSel?null:c.plate)}
                style={{display:'flex',flexDirection:'column',alignItems:'center',
                  padding:'8px 10px',borderRadius:10,border:`2px solid ${isSel?col:over?'#FCA5A5':T.border}`,
                  background:isSel?col+'12':'#fff',gap:2,minWidth:80,cursor:'pointer',transition:'all .15s',
                  boxShadow:isSel?`0 0 0 2px ${col}33`:'none'}}>
                {/* truck icon + color dot */}
                <div style={{position:'relative',width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <span style={{fontSize:20}}>{icon}</span>
                  <div style={{position:'absolute',bottom:0,right:0,width:9,height:9,borderRadius:'50%',background:col,border:'2px solid #fff'}}/>
                </div>
                {/* plate */}
                <span style={{fontFamily:'Kanit',fontSize:12,fontWeight:700,color:isSel?col:'#07101F',lineHeight:1.1}}>{c.plate}</span>
                {/* driver */}
                <span style={{fontSize:10,color:T.muted}}>{c.driver}</span>
                {/* mini dual bar */}
                <div style={{width:'100%',display:'flex',flexDirection:'column',gap:2,marginTop:2}}>
                  <div style={{height:3,background:'#E0E5ED',borderRadius:2,overflow:'hidden'}}>
                    <div style={{width:`${wp}%`,height:'100%',background:over?'#DC3545':pcColor(wp),borderRadius:2}}/>
                  </div>
                  <div style={{height:3,background:'#E0E5ED',borderRadius:2,overflow:'hidden'}}>
                    <div style={{width:`${vp}%`,height:'100%',background:over?'#DC3545':pcColor(vp),borderRadius:2,opacity:.65}}/>
                  </div>
                </div>
                {/* stats row */}
                <div style={{display:'flex',gap:5,marginTop:1}}>
                  <span style={{fontSize:9,color:over?'#C62828':pcColor(eff),fontWeight:700}}>{eff}%</span>
                  <span style={{fontSize:9,color:'#A0ABBB'}}>·</span>
                  <span style={{fontSize:9,color:'#1A5FA5',fontWeight:600}}>{cnt} จุด</span>
                </div>
              </button>
            );
          })}
        </div>

        {/* Selected truck summary strip */}
        {selCar&&selLoad&&(
          <div style={{marginTop:12,padding:'10px 14px',background:'#F5F7FA',borderRadius:9,display:'flex',flexWrap:'wrap',gap:14,alignItems:'center',borderLeft:`3px solid ${TRUCK_COLORS[CARS.findIndex(c=>c.plate===selCar.plate)%TRUCK_COLORS.length]}`}}>
            <div>
              <div style={{fontSize:10,color:T.muted}}>รถ</div>
              <div style={{fontSize:14,fontWeight:700,fontFamily:'Kanit',color:'#07101F'}}>{selCar.plate}
                <span style={{fontSize:12,color:T.muted,fontWeight:400,marginLeft:6}}>{selCar.driver} — {selCar.model}</span>
              </div>
            </div>
            {[
              {l:'จุดส่ง',v:billsByDist.length,c:'#1A5FA5'},
              {l:'น้ำหนัก',v:`${fmtKg(selLoad.w)}/${fmtKg(selCar.payload)}`,c:selLoad.w>selCar.payload?'#C62828':'#1E7D45'},
              {l:'ปริมาตร',v:`${fmtM3(selLoad.v)}/${fmtM3(selCar.volCap)}`,c:'#C47000'},
              {l:'มูลค่า',v:`฿${fmtNum(billsByDist.reduce((s,b)=>s+b.totalAmt,0))}`,c:'#7D6428'},
            ].map(({l,v,c})=>(
              <div key={l} style={{textAlign:'center'}}>
                <div style={{fontSize:10,color:T.muted}}>{l}</div>
                <div style={{fontSize:13,fontWeight:700,color:c}}>{v}</div>
              </div>
            ))}
            <div style={{marginLeft:'auto',minWidth:110}}>
              <DualCapBar wUsed={selLoad.w} wTotal={selCar.payload} vUsed={selLoad.v} vTotal={selCar.volCap} h={5}/>
              <div style={{fontSize:9,color:T.muted,marginTop:2}}>⚖ น้ำหนัก  ╌  📦 ปริมาตร</div>
            </div>
          </div>
        )}
      </div>

      {/* MAP */}
      {showMap&&(
        <div style={{background:'#fff',border:`1px solid ${T.border}`,borderRadius:10,padding:'14px',marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:600,color:'#7D6428',marginBottom:10}}>
            🗺️ {selTruck?`เส้นทาง ${selTruck} (${CARS.find(c=>c.plate===selTruck)?.driver}) — ${billsByDist.length} จุด`:'แผนที่โลเคชันทั้งหมด'}
          </div>
          <RouteMap bills={BILLS} assignments={assignments} height={360} filterPlate={selTruck}/>
        </div>
      )}

      {/* Store list */}
      <div style={{background:'#fff',border:`1px solid ${T.border}`,borderRadius:10,marginBottom:14,overflow:'hidden'}}>
        <div style={{padding:'10px 16px',borderBottom:`1px solid ${T.border}`,background:'#F5F7FA',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:13,fontWeight:600,color:'#7D6428'}}>
            📍 {selTruck?`จุดส่ง ${selTruck} (${CARS.find(c=>c.plate===selTruck)?.driver}) เรียงตามระยะทาง`:'ร้านค้าทั้งหมด เรียงตามระยะทาง'}
          </span>
          <span style={{fontSize:11,color:T.muted}}>{billsByDist.length} รายการ</span>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead><tr style={{borderBottom:`1px solid ${T.border}`,background:'#FAFBFC'}}>
            {['#','ร้านค้า','จังหวัด / อำเภอ','ระยะ','GPS','สาย',selTruck?'น้ำหนัก / ปริมาตร':'รถที่จัด'].map(h=>(
              <th key={h} style={{padding:'8px 11px',textAlign:'left',color:T.muted,fontWeight:500,whiteSpace:'nowrap'}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {billsByDist.map((b,i)=>{
              const plate=assignments[b.ref];
              const car=CARS.find(c=>c.plate===plate);
              const dist=distFromHQ(b.lat,b.lng);
              const route=ROUTES.find(r=>r.code===b.routeCode);
              const ci=car?activePlateIdx[car.plate]:null;
              const carCol=ci!=null?TRUCK_COLORS[ci%TRUCK_COLORS.length]:null;
              return(
                <tr key={b.ref} style={{borderBottom:'1px solid #EDF0F4',background:i%2===0?'transparent':'#F8F9FB'}}>
                  <td style={{padding:'8px 11px',color:T.dim,fontWeight:600,width:36}}>{i+1}</td>
                  <td style={{padding:'8px 11px'}}>
                    <div style={{fontWeight:500,color:'#07101F'}}>{b.arName}</div>
                    <div style={{fontSize:10,color:T.muted}}>{b.ref}</div>
                  </td>
                  <td style={{padding:'8px 11px',color:T.muted,fontSize:11}}>{b.province}<br/>{b.district}</td>
                  <td style={{padding:'8px 11px',whiteSpace:'nowrap'}}>
                    <span style={{fontWeight:700,color:dist<10?'#15803D':dist<40?'#C9A84C':'#C47000',fontSize:12}}>{fmtKm(dist)}</span>
                  </td>
                  <td style={{padding:'8px 11px'}}>
                    <a href={`https://www.google.com/maps?q=${b.lat},${b.lng}`} target="_blank" rel="noreferrer"
                      style={{color:'#1A5FA5',fontSize:11,textDecoration:'none'}}>
                      {b.lat.toFixed(4)}, {b.lng.toFixed(4)} ↗
                    </a>
                  </td>
                  <td style={{padding:'8px 11px',fontSize:11,color:'#6B7A90',whiteSpace:'nowrap'}}>{route?.name?.split('-')[0]||b.routeCode}{route?.day&&<><br/>วัน{route.day}</>}</td>
                  <td style={{padding:'8px 11px'}}>
                    {selTruck
                      ? <span style={{color:'#1A5FA5',fontWeight:600,fontSize:11}}>{fmtKg(b.totalWeight)} / {fmtM3(billVol(b))}</span>
                      : (car?<Chip color={carCol||'#1A5FA5'} sm>{CAR_ICON[car.type]} {car.plate} {car.driver}</Chip>
                             :<Chip color='#C47000' sm>⏳ รอจัด</Chip>)
                    }
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Route cards — only when showing all */}
      {!selTruck&&<>
        <div style={{fontSize:13,fontWeight:600,color:'#7D6428',marginBottom:10}}>📋 รายการตามสาย</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:12}}>
          {ROUTES.map((r,i)=>{
            const rb=BILLS.filter(b=>b.routeCode===r.code).sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng));
            const pend=rb.filter(b=>!assignments[b.ref]).length;
            const ta=rb.reduce((s,b)=>s+b.totalAmt,0);
            const avgDist=rb.length?rb.reduce((s,b)=>s+distFromHQ(b.lat,b.lng),0)/rb.length:0;
            if(!rb.length) return null;
            return(
              <Card key={i}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:600,color:'#7D6428'}}>{r.name}</div>
                    <Chip sm style={{marginTop:4}}>{r.code}</Chip>
                  </div>
                  <div style={{textAlign:'right',fontSize:11}}>
                    <div style={{color:T.muted}}>ส่งวัน<span style={{color:T.gold,fontWeight:600}}>{r.day}</span></div>
                    <div style={{color:'#1A5FA5',marginTop:2}}>เฉลี่ย {fmtKm(avgDist)}</div>
                  </div>
                </div>
                <div style={{background:'#F8F9FB',borderRadius:8,padding:'8px 10px',marginBottom:8}}>
                  {rb.map((b,j)=>{
                    const plate=assignments[b.ref];const car=CARS.find(c=>c.plate===plate);
                    const ci=car?activePlateIdx[car.plate]:null;
                    return(
                      <div key={b.ref} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 0',borderBottom:j<rb.length-1?`1px solid ${T.border}44`:'none'}}>
                        <span style={{fontSize:10,color:T.dim,minWidth:14}}>{j+1}.</span>
                        <span style={{flex:1,fontSize:11,color:'#07101F'}}>{b.arName}</span>
                        <span style={{fontSize:10,color:'#1A5FA5'}}>{fmtKm(distFromHQ(b.lat,b.lng))}</span>
                        {car&&<div style={{width:8,height:8,borderRadius:'50%',background:ci!=null?TRUCK_COLORS[ci%TRUCK_COLORS.length]:T.muted,flexShrink:0}}/>}
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11}}>
                  <span><span style={{color:T.muted}}>บิล </span><span style={{fontWeight:600}}>{rb.length}</span></span>
                  <span><span style={{color:T.muted}}>รอ </span><span style={{fontWeight:600,color:'#C47000'}}>{pend}</span></span>
                  <span style={{fontWeight:600,color:'#7D6428'}}>฿{fmtNum(ta)}</span>
                </div>
              </Card>
            );
          })}
        </div>
      </>}
    </div>
  );
}

/* ─── DASHBOARD ─── */

  const trucksWithBills=useMemo(()=>CARS.filter(c=>c.active&&BILLS.some(b=>assignments[b.ref]===c.plate)),[assignments]);
  const stats=[
    {l:'บิลรอจัดคิว',v:BILLS.filter(b=>!assignments[b.ref]).length,u:'บิล',i:'📋',c:T.orange},
    {l:'จัดคิวแล้ว',v:BILLS.filter(b=>assignments[b.ref]).length,u:'บิล',i:'✅',c:T.green},
    {l:'น้ำหนักรอส่ง',v:fmtKg(BILLS.filter(b=>!assignments[b.ref]).reduce((s,b)=>s+b.totalWeight,0)),u:'',i:'⚖️',c:T.blue},
    {l:'มูลค่ารวม',v:`฿${fmtNum(BILLS.reduce((s,b)=>s+b.totalAmt,0))}`,u:'',i:'💰',c:T.gold},
  ];
  return(
    <div className="fi">
      <h1 style={{fontFamily:'Kanit',fontSize:22,fontWeight:600,color:'#07101F',marginBottom:4}}>แดชบอร์ด</h1>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12,marginBottom:18}}>
        {stats.map((s,i)=><Card key={i} style={{textAlign:'center',padding:'14px 10px'}}>
          <div style={{fontSize:24,marginBottom:5}}>{s.i}</div>
          <div style={{fontSize:19,fontWeight:700,color:s.c,fontFamily:'Kanit'}}>{s.v} <span style={{fontSize:12,color:T.muted}}>{s.u}</span></div>
          <div style={{fontSize:11,color:'#6B7A90',marginTop:2}}>{s.l}</div>
        </Card>)}
      </div>

      {/* Map card */}
      <Card style={{marginBottom:16,padding:'14px 16px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexWrap:'wrap',gap:8}}>
          <div style={{fontSize:13,fontWeight:600,color:'#7D6428'}}>
            📍 {dashTruck?`เส้นทาง ${dashTruck} (${CARS.find(c=>c.plate===dashTruck)?.driver})`:'แผนที่ภาพรวม'}
          </div>
          {/* Mini truck tabs */}
          <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
            <button className="btn" onClick={()=>setDashTruck(null)}
              style={{padding:'4px 11px',borderRadius:20,border:`1.5px solid ${!dashTruck?'#07101F':T.border}`,
                background:!dashTruck?'#07101F':'transparent',color:!dashTruck?'#E4C46E':T.muted,
                fontSize:11,fontWeight:!dashTruck?700:400}}>
              ทั้งหมด
            </button>
            {trucksWithBills.map(c=>{
              const isSel=dashTruck===c.plate;
              const gIdx=CARS.findIndex(x=>x.plate===c.plate);
              const col=TRUCK_COLORS[gIdx%TRUCK_COLORS.length];
              const cnt=BILLS.filter(b=>assignments[b.ref]===c.plate).length;
              return(
                <button key={c.plate} className="btn" onClick={()=>setDashTruck(isSel?null:c.plate)}
                  style={{padding:'4px 11px',borderRadius:20,border:`1.5px solid ${isSel?col:T.border}`,
                    background:isSel?col:'transparent',color:isSel?'#fff':T.muted,
                    fontSize:11,fontWeight:isSel?700:400,display:'flex',alignItems:'center',gap:5,transition:'all .15s'}}>
                  <div style={{width:7,height:7,borderRadius:'50%',background:isSel?'#fff':col,flexShrink:0}}/>
                  {CAR_ICON[c.type]} {c.plate} <span style={{opacity:.75}}>{cnt}</span>
                </button>
              );
            })}
          </div>
        </div>
        <RouteMap bills={BILLS} assignments={assignments} height={280}
          filterPlate={dashTruck} showLines={!!dashTruck}/>
      </Card>
      <Card>
        <div style={{fontSize:13,fontWeight:600,color:'#7D6428',marginBottom:10}}>📋 บิลล่าสุด</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{borderBottom:`1px solid ${T.border}`}}>
              {['ร้านค้า','ระยะ','น้ำหนัก','มูลค่า','รถ'].map(h=><th key={h} style={{padding:'6px 9px',textAlign:'left',color:T.muted,fontWeight:500,whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{[...BILLS].sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng)).slice(0,8).map((b,i)=>{
              const car=CARS.find(c=>c.plate===assignments[b.ref]);
              const ci=car?CARS.filter(c=>c.active).findIndex(c=>c.plate===car.plate):null;
              return <tr key={i} style={{borderBottom:'1px solid #EDF0F4'}}>
                <td style={{padding:'7px 9px',fontWeight:500}}>{b.arName}</td>
                <td style={{padding:'7px 9px',color:'#1A5FA5',fontSize:11}}>{fmtKm(distFromHQ(b.lat,b.lng))}</td>
                <td style={{padding:'7px 9px',color:'#1A5FA5'}}>{fmtKg(b.totalWeight)}</td>
                <td style={{padding:'7px 9px',fontWeight:600}}>฿{fmtNum(b.totalAmt)}</td>
                <td style={{padding:'7px 9px'}}>{car?<Chip color={ci!=null?TRUCK_COLORS[ci%TRUCK_COLORS.length]:T.blue} sm>{CAR_ICON[car.type]} {car.plate} {car.driver}</Chip>:<Chip color={T.orange} sm>รอ</Chip>}</td>
              </tr>;})}
            </tbody>
          </table>
        </div>
      </Card>

}

/* ─── BILLS VIEW ─── */
function BillsView({assignments,onAssign,addToast}){
  const [s,setS]=useState('');const[fd,setFd]=useState('all');const[fs,setFs]=useState('all');const[sort,setSort]=useState('dist');
  const dates=['all',...[...new Set(BILLS.map(b=>b.date))].sort()];
  const activeCars=CARS.filter(c=>c.active&&c.payload>0);
  const carLoads=useMemo(()=>computeCarLoads(assignments),[assignments]);
  const activePlateIdx=useMemo(()=>{const m={};activeCars.forEach((c,i)=>m[c.plate]=i);return m;},[]);
  const filtered=useMemo(()=>{
    let l=BILLS.filter(b=>(fd==='all'||b.date===fd)&&(fs==='all'||(fs==='assigned'&&assignments[b.ref])||(fs==='pending'&&!assignments[b.ref]))&&(!s||b.arName.includes(s)||b.ref.includes(s)||b.province?.includes(s)));
    if(sort==='dist') l=[...l].sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng));
    else if(sort==='weight') l=[...l].sort((a,b)=>b.totalWeight-a.totalWeight);
    else l=[...l].sort((a,b)=>a.date.localeCompare(b.date));
    return l;
  },[s,fd,fs,sort,assignments]);

  return(
    <div className="fi">
      <h1 style={{fontFamily:'Kanit',fontSize:20,fontWeight:600,color:'#07101F',marginBottom:14}}>📋 บิลสินค้า</h1>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}}>
        <input value={s} onChange={e=>setS(e.target.value)} placeholder="🔍 ค้นหา..."
          style={{flex:1,minWidth:140,background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'8px 11px',color:'#07101F',fontSize:13}}/>
        <select value={fd} onChange={e=>setFd(e.target.value)} style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'8px 9px',color:'#07101F',fontSize:12}}>
          {dates.map(d=><option key={d} value={d}>{d==='all'?'ทุกวันที่':d}</option>)}
        </select>
        <select value={fs} onChange={e=>setFs(e.target.value)} style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'8px 9px',color:'#07101F',fontSize:12}}>
          <option value="all">ทุกสถานะ</option><option value="pending">รอจัด</option><option value="assigned">จัดแล้ว</option>
        </select>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{background:'#fff',border:`1.5px solid ${T.border}`,borderRadius:7,padding:'8px 9px',color:'#07101F',fontSize:12}}>
          <option value="dist">📍 ระยะทาง</option><option value="weight">⚖️ น้ำหนัก</option><option value="date">📅 วันที่</option>
        </select>
      </div>
      <Card style={{padding:0,overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{background:'#F5F7FA',borderBottom:`1px solid ${T.border}`}}>
              {['📍 ระยะ','ร้านค้า','จังหวัด','น้ำหนัก / ปริมาตร','มูลค่า','จัดรถ'].map(h=>(
                <th key={h} style={{padding:'9px 10px',textAlign:'left',color:T.muted,fontWeight:500,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>{filtered.map((b,i)=>{
              const plate=assignments[b.ref];const car=CARS.find(c=>c.plate===plate);
              const ci=car?activePlateIdx[car.plate]:null;
              const dist=distFromHQ(b.lat,b.lng);
              return(
                <tr key={i} style={{borderBottom:'1px solid #EDF0F4',background:i%2===0?'transparent':'#F8F9FB'}}>
                  <td style={{padding:'8px 10px',whiteSpace:'nowrap'}}>
                    <span style={{fontWeight:700,color:dist<10?T.green:dist<30?T.gold:T.orange}}>{fmtKm(dist)}</span>
                  </td>
                  <td style={{padding:'8px 10px'}}>
                    <div style={{fontWeight:500}}>{b.arName}</div>
                    <div style={{fontSize:10,color:T.muted}}>{b.ref}</div>
                  </td>
                  <td style={{padding:'8px 10px',color:T.muted,fontSize:11}}>{b.province}<br/>{b.district}</td>
                  <td style={{padding:'8px 10px'}}>
                    <div style={{color:'#1A5FA5',fontWeight:500,fontSize:12}}>{fmtKg(b.totalWeight)}</div>
                    <div style={{color:T.muted,fontSize:10}}>{fmtM3(billVol(b))}</div>
                  </td>
                  <td style={{padding:'8px 10px',fontWeight:600}}>฿{fmtNum(b.totalAmt)}</td>
                  <td style={{padding:'8px 7px'}}>
                    <select value={plate||''} onChange={e=>{
                      if(e.target.value){
                        const car2=CARS.find(c=>c.plate===e.target.value);
                        const cur=carLoads[e.target.value]||{w:0,v:0};
                        if(car2&&(wouldOverW(cur,car2,b)||wouldOverV(cur,car2,b))){
                          const msgs=[];
                          if(wouldOverW(cur,car2,b)) msgs.push(`น้ำหนักเกิน ${Math.round((cur.w+b.totalWeight)/car2.payload*100)}%`);
                          if(wouldOverV(cur,car2,b)) msgs.push(`ปริมาตรเกิน ${Math.round((cur.v+billVol(b))/car2.volCap*100)}%`);
                          addToast(`⚠️ ${e.target.value}: ${msgs.join(', ')} — จัดได้แต่ควรตรวจสอบ`,'warn');
                        }
                      }
                      onAssign({[b.ref]:e.target.value});addToast(e.target.value?`✅ ${b.arName} → ${e.target.value}`:`ยกเลิก ${b.ref}`,'ok');}}
                      style={{background:plate?'#EAF4FF':'#fff',border:`1px solid ${plate?'#1A5FA5':T.border}`,borderRadius:7,padding:'5px 7px',color:plate?'#1A5FA5':T.muted,fontSize:11,minWidth:145}}>
                      <option value="">⏳ เลือกรถ...</option>
                      {activeCars.map(c=>{
                        const cur=carLoads[c.plate]||{w:0,v:0};
                        // คำนวณ % หลังเพิ่มบิลนี้ (ถ้า re-assign ต้องลบบิลเดิมออกก่อน)
                        const adjustedLd = plate===c.plate ? cur : {w:cur.w+(plate?0:b.totalWeight),v:cur.v+(plate?0:billVol(b))};
                        const ep=capPct(adjustedLd,c);
                        const over=wouldOver(cur,c,b)&&plate!==c.plate;
                        return <option key={c.plate} value={c.plate}>{over?'⚠ ':''}{CAR_ICON[c.type]} {c.plate} {c.driver} [{ep}%]</option>;
                      })}
                    </select>
                    {car&&<div style={{fontSize:9,color:ci!=null?TRUCK_COLORS[ci%TRUCK_COLORS.length]:T.muted,marginTop:2}}>{car.fullName}</div>}
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
        {filtered.length===0&&<p style={{textAlign:'center',padding:32,color:T.muted}}>ไม่พบข้อมูล</p>}
      </Card>
    </div>
  );
}

                  <span style={{color:'#1A5FA5',fontWeight:600}}>{fmtM3(c.volCap)}</span>
                </div>
              </div>
              {c.active&&c.payload>0&&<>
                {over&&<div style={{background:'#FEF2F2',border:'1px solid #FCA5A5',borderRadius:6,padding:'4px 8px',fontSize:11,color:'#C62828',marginBottom:6,textAlign:'center',fontWeight:600}}>⚠ เกินขีดบรรทุก</div>}
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:3}}>
                  <span style={{color:T.muted}}>⚖ {fmtKg(ld.w)} / {fmtKg(c.payload)}</span>
                  <span style={{color:wp2>100?'#C62828':pcColor(wp2),fontWeight:600}}>{wp2}%</span>

                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,marginBottom:4}}>

/* ─── MAIN APP ─── */
function App(){
  const [tab,setTab]=useState('queue');
  const [showKeyModal,setShowKeyModal]=useState(false);
  const [mobile,setMobile]=useState(window.innerWidth<768);
  const [assignments,setAssignments]=useState({});
  const [toasts,setToasts]=useState([]);

  useEffect(()=>{
    const s=document.createElement('style');s.textContent=css;document.head.appendChild(s);
    const h=()=>setMobile(window.innerWidth<768);window.addEventListener('resize',h);
    (async()=>{try{const v=localStorage.getItem(STORAGE_KEY);if(v)setAssignments(JSON.parse(v));}catch(e){}})();
    return()=>window.removeEventListener('resize',h);
  },[]);

  const addToast=useCallback((msg,type='ok')=>{const id=Date.now()+Math.random();setToasts(p=>[...p,{id,msg,type}]);},[]);
  const rmToast=id=>setToasts(p=>p.filter(t=>t.id!==id));

  const handleAssign=useCallback((updates,replaceAll=false)=>{
    setAssignments(prev=>{
      let next;
      if(replaceAll&&typeof updates==='object'){next={...updates};}
      else{next={...prev};Object.entries(updates).forEach(([r,p])=>{if(p)next[r]=p;else delete next[r];});}
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));}catch(e){}
      return next;
    });
  },[]);

  const handleSaveSheet=useCallback(async(setSaving)=>{
    setSaving(true);
    try{
      const now=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'});
      const rows=BILLS.sort((a,b)=>distFromHQ(a.lat,a.lng)-distFromHQ(b.lat,b.lng)).map(b=>{
        const car=CARS.find(c=>c.plate===assignments[b.ref]);
        const dist=distFromHQ(b.lat,b.lng);
        return [b.date,b.ref,b.arCode,b.arName,b.routeCode,b.province,b.district,
                b.lat,b.lng,dist.toFixed(2),
                assignments[b.ref]||'',car?.driver||'',car?.fullName||'',car?.type||'',
                b.totalEA,b.totalWeight,b.totalAmt,
                assignments[b.ref]?'จัดคิวแล้ว':'รอจัดคิว',now];
      });
      const headers=['วันที่','เลขบิล','รหัสร้านค้า','ชื่อร้านค้า','รหัสสาย','จังหวัด','อำเภอ','Lat','Lng','ห่างHQ(กม.)','ทะเบียนรถ','ชื่อเล่น','ชื่อจริง','ประเภทรถ','EA','น้ำหนัก(กก.)','มูลค่า(บาท)','สถานะ','อัปเดตเมื่อ'];
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          messages:[{role:"user",content:`เขียนข้อมูลลง Spreadsheet ID: "${SPREADSHEET_ID}" ชีท "Keepdata"\nHeaders: ${JSON.stringify(headers)}\nData: ${JSON.stringify(rows)}\nลบข้อมูลเก่าก่อน แล้วเขียนใหม่ทั้งหมด`}],
          mcp_servers:[{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"google-drive"}]})
      });
      const d=await res.json();
      const txt=d.content?.map(c=>c.type==='text'?c.text:'').join('')||'';
      try{localStorage.setItem('keepdata-bk',JSON.stringify({savedAt:now,headers,rows}));}catch(e){}
      if(d.error||txt.toLowerCase().includes('error')){addToast('⚠️ บันทึกลง Sheets ไม่สำเร็จ — สำรองในเครื่องแล้ว','warn');}
      else{addToast(`✅ บันทึก ${rows.length} รายการลงชีท Keepdata สำเร็จ`,'ok');}
    }catch(e){
      try{localStorage.setItem('keepdata-bk',JSON.stringify({savedAt:new Date().toISOString()}));}catch(e){}
      addToast('ไม่สามารถเชื่อมต่อ — สำรองข้อมูลแล้ว','err');
    }
    setSaving(false);
  },[assignments,addToast]);

  const sw=mobile?0:0;
  return(
    <div style={{minHeight:'100vh',background:T.bg,color:'#07101F',fontFamily:"'Sarabun',sans-serif"}}>
      {!mobile&&<TopNav active={tab} onSelect={setTab}/>}
      <main style={{padding:mobile?'13px':'20px 24px',paddingBottom:mobile?86:28,minWidth:0,overflowX:'hidden'}}>
        {tab==='dashboard'&&<Dashboard assignments={assignments}/>}
        {tab==='queue'&&<QueuePlanner assignments={assignments} onAssign={handleAssign} onSaveSheet={handleSaveSheet} addToast={addToast}/>}
        {tab==='bills'&&<BillsView assignments={assignments} onAssign={handleAssign} addToast={addToast}/>}
        {tab==='routes'&&<RoutesView assignments={assignments}/>}
        {tab==='cars'&&<CarsView assignments={assignments}/>}
      </main>
      {mobile&&<BottomNav active={tab} onSelect={setTab}/>}
      {toasts.map(t=><Toast key={t.id} msg={t.msg} type={t.type} onClose={()=>rmToast(t.id)}/>)}
      {showKeyModal&&<ApiKeyModal onDone={k=>{setShowKeyModal(false);if(k)addToast('✅ บันทึก API Key แล้ว','ok');}}/>}
    </div>
  );
}


    /* ── Mount ── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
