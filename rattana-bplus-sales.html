<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rattana Bplus Sales v1.2</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;
  --gold:#c9a84c;--gold-light:#e8c86a;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
  --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;
  --muted:#6b7896;--row-alt:#fafbfd;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;
  --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}
/* Header */
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:17px;color:#fff;flex:1}
.logo-text span{color:var(--gold)}
.version-tag{font-size:10px;color:rgba(255,255,255,.45);font-weight:400;margin-left:6px}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}
/* Tabs */
.tab-nav{display:flex;background:var(--navy);border-bottom:3px solid var(--gold);padding:0 8px;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{background:transparent;border:none;color:rgba(255,255,255,.6);padding:11px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0;transition:all .18s;margin-bottom:-3px;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:var(--navy);background:var(--gold);border-bottom-color:var(--gold);font-weight:700}
/* Filter Bar */
.filter-bar{background:var(--card-bg);border-bottom:2px solid var(--border);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filter-bar .field{display:flex;flex-direction:column;gap:3px;min-width:130px}
.filter-bar label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.input{height:38px;padding:0 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--gold)}
.chip-group{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap}
.chip.active-fmcg{background:#1a6fb8;border-color:#1a6fb8;color:#fff}
.chip.active-thaibev{background:#c9a84c;border-color:#c9a84c;color:var(--navy)}
.chip.active-cig{background:#e74c3c;border-color:#e74c3c;color:#fff}
.chip.active-fn{background:#2ecc71;border-color:#2ecc71;color:#fff}
.chip.active-wh{background:var(--navy);border-color:var(--navy);color:#fff}
/* Content */
.content{padding:16px;max-width:1400px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-gold{border-top:3px solid var(--gold)}
.card-blue{border-top:3px solid var(--info)}
.card-red{border-top:3px solid var(--danger)}
.card-green{border-top:3px solid var(--success)}
.card-thaibev{border-top:3px solid var(--gold-light)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent)}
.card-head h3{font-size:14px;font-weight:700;color:var(--text)}
.card-body{padding:16px}
/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:14px 16px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-fmcg::before{background:#1a6fb8}
.kpi-thaibev::before{background:var(--gold)}
.kpi-cig::before{background:var(--danger)}
.kpi-fn::before{background:var(--success)}
.kpi-total::before{background:var(--navy)}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px}
.kpi-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.12}
/* Chart grid */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.chart-wrap{position:relative;height:220px}
/* Table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:700px}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.tbl thead th{padding:9px 10px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none}
.tbl thead th:hover{background:var(--navy-mid)}
.sort-ind{font-size:10px;color:var(--gold);margin-left:3px}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.07)}
.tbl td{padding:8px 10px;font-size:12px;vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.tbl .empty-row td{text-align:center;padding:40px;color:var(--muted);font-size:14px}
/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-fmcg{background:#e3f0fd;color:#1a6fb8}
.badge-thaibev{background:rgba(201,168,76,.2);color:#7a6428}
.badge-cig{background:#ffd5d0;color:#c0392b}
.badge-fn{background:#e8f7ee;color:#1e8449}
/* Spinner */
.spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
.spinner-overlay.show{display:flex}
.spinner-box{background:#fff;border-radius:var(--radius-lg);padding:28px 36px;text-align:center;border-top:4px solid var(--gold);min-width:200px}
body.dark .spinner-box{background:var(--card-bg)}
.spinner-ring{width:44px;height:44px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.spinner-text{font-size:13px;font-weight:600;color:var(--muted)}
/* Toast */
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:16px;padding:11px 18px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-error{background:var(--danger)}
.toast-success{background:var(--success)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
/* Summary by cat */
.cat-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.cat-card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow-sm);overflow:hidden;position:relative}
.cat-card .cat-name{font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text)}
.cat-card .cat-baht{font-size:18px;font-weight:700;color:var(--text)}
.cat-card .cat-cs{font-size:11px;color:var(--muted);margin-top:2px}
.cat-card .cat-bar{height:4px;border-radius:2px;margin-top:8px}
.cat-bar-fmcg{background:#1a6fb8}
.cat-bar-thaibev{background:var(--gold)}
.cat-bar-cig{background:var(--danger)}
.cat-bar-fn{background:var(--success)}
/* Btn */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:36px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:11px;min-height:28px}
/* Search */
.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.search-wrap .input{padding-left:32px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
/* Row flex */
.row-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
/* Animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%)}to{transform:translateX(0)}}
/* Responsive */
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.chart-grid{grid-template-columns:1fr}.cat-summary{grid-template-columns:repeat(2,1fr)}.filter-bar{flex-direction:column}.search-wrap{max-width:100%}}
</style>
</head>
<body>

<!-- Spinner -->
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <div class="spinner-text" id="spinnerText">กำลังโหลดข้อมูล...</div>

</div>

<!-- Header -->

</div>

<!-- Main Content -->
<div class="content">
  <!-- OVERVIEW TAB -->
  <div class="tab-panel active" id="tab-overview">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="chart-grid">
      <div class="card card-gold">

      </div>

        <div class="card-head"><h3>🏭 ยอดขาย (บาท) แยก WH</h3></div>

<script>
// ─── Config ───────────────────────────────────────────────────
const SHEET_ID  = '1QIusvLuKv38mYDszVd093qzuD6DD8462QkZCTHpUw6s';
const SHEET_GID = '1606652398';
const SHEET_NAME = 'SQLBP';

// ★ วาง Web App URL จาก Apps Script ตรงนี้ หลัง Deploy แล้ว ★
const GAS_URL = 'https://script.google.com/macros/s/AKfycby4h3bvctWeLWRUCOy7VMtKhzxuCtWCYiFp_1HhCtTy_705TS2UmSpykZv9p01hkqc_IQ/exec';

const TARGET_CATS = ['Bplus FMCG','Bplus Thaibev Al','Bplus บุหรี่','F&N'];
const CAT_COLORS = {
  'Bplus FMCG': '#1a6fb8',
  'Bplus Thaibev Al': '#c9a84c',
  'Bplus บุหรี่': '#e74c3c',
  'F&N': '#2ecc71'
};
const CAT_KEYS = {
  'Bplus FMCG':'fmcg','Bplus Thaibev Al':'thaibev','Bplus บุหรี่':'cig','F&N':'fn'
};
const WH_LIST = ['W1','W2','W3','W4'];

// CSV fallback URLs
const CSV_URLS = [
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`,
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`,
];

// ─── State ────────────────────────────────────────────────────
let allRows = [];
let filteredRows = [];
let selectedCats = new Set(TARGET_CATS);
let selectedWH = new Set(WH_LIST);
let dateFrom = '';
let dateTo = '';
let productSortKey = 'baht';
let productSortDir = 'desc';
let txnSortKey = 'date';
let txnSortDir = 'desc';
let charts = {};
let productSearch = '';
let txnSearch = '';

// ─── Helpers ──────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function parseTHDate(str) {
  if (!str) return null;
  const [d,m,y] = str.split('/');
  if (!d||!m||!y) return null;
  return new Date(+y, +m-1, +d);
}
function formatDate(str) {
  const d = parseTHDate(str);
  if (!d) return str;
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'2-digit'});
}
function parseNum(v) {
  if (!v && v!==0) return 0;
  return parseFloat(String(v).replace(/,/g,'')) || 0;
}
function fmtBaht(n) {
  return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtCs(n) {
  return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function showSpinner(txt='กำลังโหลดข้อมูล...'){$('spinner').classList.add('show');$('spinnerText').textContent=txt}
function hideSpinner(){$('spinner').classList.remove('show')}
function showToast(msg,type='info'){
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400)},3000);
}
function catBadge(cat) {
  const k = CAT_KEYS[cat]||'info';
  return `<span class="badge badge-${k}">${cat}</span>`;
}

// ─── CSV Parser ───────────────────────────────────────────────
function parseCsvLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && !inQ) { inQ = true; continue; }
    if (c === '"' && inQ) {
      if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false;
      continue;
    }
    if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  result.push(cur.trim());
  return result;
}

// ─── Fetch Data ───────────────────────────────────────────────
async function fetchData() {
  showSpinner('กำลังโหลดข้อมูล...');

  // 1) Try GAS (JSON) if URL configured
  if (GAS_URL && GAS_URL !== 'PASTE_YOUR_WEB_APP_URL_HERE') {
    try {
      $('spinnerText').textContent = 'โหลดผ่าน Apps Script...';
      const res  = await fetch(GAS_URL, {redirect:'follow'});
      if (!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      // GAS returns pre-parsed rows
      loadFromGAS(json.rows);
      showToast(`โหลดสำเร็จ (GAS) ${allRows.length.toLocaleString()} รายการ 🎉`, 'success');
      return;
    } catch(e) {
      console.warn('GAS failed:', e.message);
    }
  }

  // 2) Try CSV URLs
  for (let i = 0; i < CSV_URLS.length; i++) {
    try {
      $('spinnerText').textContent = `ลอง CSV ${i+1}/${CSV_URLS.length}...`;
      const res  = await fetch(CSV_URLS[i], {redirect:'follow'});
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      if (!text || text.trim().length < 20) throw new Error('Empty');
      parseCSV(text);
      showToast(`โหลดสำเร็จ ${allRows.length.toLocaleString()} รายการ 🎉`, 'success');
      return;
    } catch(e) {
      console.warn(`CSV URL ${i+1} failed:`, e.message);
    }
  }

  // 3) All failed → upload prompt
  hideSpinner();
  showUploadPrompt();
}

function loadFromGAS(rows) {
  allRows = rows.map(r => ({
    date:    r.date,
    product: r.product,
    cat:     r.cat,
    wh:      r.wh,
    baht:    Number(r.baht) || 0,
    cs:      Number(r.cs)   || 0
  }));
  // Set default date range
  if (allRows.length) {
    const dates = allRows.map(r => parseTHDate(r.date)).filter(Boolean);
    const minD  = new Date(Math.min(...dates));
    const maxD  = new Date(Math.max(...dates));
    const toISO = d => d.toISOString().split('T')[0];
    $('dateFrom').value = toISO(minD);
    $('dateTo').value   = toISO(maxD);
  }
  applyFilters();
  hideSpinner();
}

    <div style="background:var(--card-bg);border-radius:16px;padding:28px;max-width:440px;width:100%;border-top:4px solid var(--gold);text-align:center">
      <div style="font-size:36px;margin-bottom:12px">⚠️</div>
      <h3 style="font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)">โหลดอัตโนมัติไม่สำเร็จ</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6">
        เกิดจาก CORS policy ของเบราว์เซอร์<br>
        เลือกวิธีแก้ไข:
      </p>
      <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:16px;text-align:left;font-size:12px;color:var(--muted);line-height:1.8">
        <b style="color:var(--gold)">🔧 วิธีถาวร (แนะนำ):</b> ติดตั้ง Apps Script ตามไฟล์ <code>BplusSalesProxy_GAS.js</code><br>
        <b style="color:var(--info)">📂 วิธีด่วน:</b> Export CSV จาก Sheet SQLBP แล้วอัปโหลดด้านล่าง
      </div>
      <div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:16px;text-align:left;font-size:11px;color:var(--muted)">
        <b style="color:var(--text)">Export CSV:</b>
        เปิด Sheet SQLBP → ไฟล์ → ดาวน์โหลด → CSV
      </div>
      <label style="display:block;background:var(--gold);color:var(--navy);font-weight:700;font-size:14px;

function handleFileUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const banner = $('uploadBanner');
  if (banner) banner.remove();
  showSpinner('กำลังอ่านไฟล์...');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      parseCSV(e.target.result);
      showToast(`โหลดจากไฟล์สำเร็จ ${allRows.length.toLocaleString()} รายการ 🎉`, 'success');
    } catch(err) { hideSpinner(); showToast('อ่านไฟล์ไม่ได้: '+err.message,'error'); }
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) { hideSpinner(); return; }
  const headers = parseCsvLine(lines[0]);
  const colIdx = {};
  headers.forEach((h,i) => colIdx[h.replace(/\r/,'').trim()] = i);

  const dIdx = colIdx['Doc_Date'] ?? 0;
  const pIdx = colIdx['Product_Name'] ?? 6;
  const csIdx = colIdx['Sales_CS'] ?? 9;
  const exIdx = colIdx['EXVat'] ?? 13;
  const whIdx = colIdx['WH'] ?? 15;
  const catIdx = colIdx['Cat_BU'] ?? 17;

  allRows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    const cat = (cols[catIdx]||'').replace(/\r/,'').trim();
    if (!TARGET_CATS.includes(cat)) continue;
    const baht = parseNum(cols[exIdx]);
    const cs = parseNum(cols[csIdx]);
    allRows.push({
      date: (cols[dIdx]||'').trim(),
      product: (cols[pIdx]||'').trim(),
      cat,
      wh: (cols[whIdx]||'').trim(),
      baht,
      cs
    });
  }

  // Set default date range
  if (allRows.length) {
    const dates = allRows.map(r => parseTHDate(r.date)).filter(Boolean);
    const minD = new Date(Math.min(...dates));
    const maxD = new Date(Math.max(...dates));
    const toISO = d => d.toISOString().split('T')[0];
    dateFrom = toISO(minD);
    dateTo = toISO(maxD);
    $('dateFrom').value = dateFrom;
    $('dateTo').value = dateTo;
  }

  applyFilters();
  hideSpinner();
}

// ─── Filters ──────────────────────────────────────────────────
function applyFilters() {
  const from = $('dateFrom').value;
  const to = $('dateTo').value;
  filteredRows = allRows.filter(r => {
    if (!selectedCats.has(r.cat)) return false;
    if (!selectedWH.has(r.wh)) return false;
    if (from || to) {
      const d = parseTHDate(r.date);
      if (!d) return false;
      const dStr = d.toISOString().split('T')[0];
      if (from && dStr < from) return false;
      if (to && dStr > to) return false;
    }
    return true;
  });
  $('filterResult').textContent = filteredRows.length.toLocaleString() + ' รายการ';
  render();
}

// ─── Render ───────────────────────────────────────────────────
function render() {
  renderKPI();
  renderCharts();
  renderCatSummary();
  renderTopProductByCat();
  renderProductTable();
  renderTxnTable();
}

function renderKPI() {
  const total = filteredRows.reduce((s,r) => ({baht: s.baht+r.baht, cs: s.cs+r.cs}), {baht:0,cs:0});
  const byCat = {};
  TARGET_CATS.forEach(c => byCat[c] = {baht:0,cs:0,cnt:0});
  filteredRows.forEach(r => {
    byCat[r.cat].baht += r.baht;
    byCat[r.cat].cs += r.cs;
    byCat[r.cat].cnt++;
  });

  const html = [
    `<div class="kpi-card kpi-total"><div class="kpi-label">ยอดขายรวม</div><div class="kpi-value">${fmtBaht(total.baht)}</div><div class="kpi-sub">฿ EXVat · ${fmtCs(total.cs)} ลัง</div><span class="kpi-icon">💰</span></div>`,
    ...TARGET_CATS.map(c => {
      const k = CAT_KEYS[c];
      const pct = total.baht ? (byCat[c].baht/total.baht*100).toFixed(1) : 0;
      return `<div class="kpi-card kpi-${k}"><div class="kpi-label">${c}</div><div class="kpi-value">${fmtBaht(byCat[c].baht)}</div><div class="kpi-sub">${fmtCs(byCat[c].cs)} ลัง · ${pct}%</div><span class="kpi-icon">${k==='fmcg'?'🛒':k==='thaibev'?'🍺':k==='cig'?'🚬':'🥛'}</span></div>`;
    })
  ].join('');
  $('kpiGrid').innerHTML = html;
}

function getOrCreate(id, type, data, options) {
  if (charts[id]) { charts[id].destroy(); }
  const ctx = $(id).getContext('2d');
  charts[id] = new Chart(ctx, {type, data, options});
}

function chartOpts(horizontal=false) {
  const isDark = document.body.classList.contains('dark');
  const textColor = isDark ? '#e8eaf0' : '#0d1b3e';
  const gridColor = isDark ? '#243b73' : '#dde3f0';
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{
      if(ctx.dataset.label?.includes('ลัง')) return ` ${fmtCs(ctx.parsed.x??ctx.parsed.y)} ลัง`;
      return ` ฿${fmtBaht(ctx.parsed.x??ctx.parsed.y)}`;
    }}}},
    scales:{
      x:{ticks:{color:textColor,font:{size:10},maxRotation:horizontal?0:45},grid:{color:gridColor}},
      y:{ticks:{color:textColor,font:{size:10}},grid:{color:gridColor}}
    }
  };
}

function renderCharts() {
  const byCat = {};
  TARGET_CATS.forEach(c => byCat[c] = {baht:0,cs:0});
  const byWH = {};
  WH_LIST.forEach(w => byWH[w] = {baht:0});
  const byDate = {};
  filteredRows.forEach(r => {
    byCat[r.cat].baht += r.baht;
    byCat[r.cat].cs += r.cs;
    if (byWH[r.wh]) byWH[r.wh].baht += r.baht;
    const d = parseTHDate(r.date);
    if (d) {
      const k = d.toISOString().split('T')[0];
      byDate[k] = (byDate[k]||0) + r.baht;
    }
  });

  const labels = TARGET_CATS;
  const colors = TARGET_CATS.map(c => CAT_COLORS[c]);

  // Cat Baht
  getOrCreate('catBahtChart','bar',{
    labels: TARGET_CATS.map(c => c.replace('Bplus ','').replace(' Al','')),
    datasets:[{data:TARGET_CATS.map(c=>byCat[c].baht),backgroundColor:colors,borderRadius:4}]
  }, chartOpts());

  // Cat CS
  getOrCreate('catCsChart','bar',{
    labels: TARGET_CATS.map(c => c.replace('Bplus ','').replace(' Al','')),
    datasets:[{data:TARGET_CATS.map(c=>byCat[c].cs),backgroundColor:colors,borderRadius:4, label:'ลัง'}]
  }, chartOpts());

  // WH Baht
  const whColors = ['#1a6fb8','#c9a84c','#e74c3c','#2ecc71'];
  getOrCreate('whBahtChart','bar',{
    labels: WH_LIST,
    datasets:[{data:WH_LIST.map(w=>byWH[w].baht),backgroundColor:whColors,borderRadius:4}]
  }, chartOpts());

  // Daily
  const sortedDates = Object.keys(byDate).sort();
  const isDark = document.body.classList.contains('dark');
  getOrCreate('dailyChart','line',{
    labels: sortedDates.map(d => {const dt=new Date(d);return `${dt.getDate()}/${dt.getMonth()+1}`;}),
    datasets:[{data:sortedDates.map(d=>byDate[d]),borderColor:'#c9a84c',backgroundColor:'rgba(201,168,76,.12)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#c9a84c'}]
  }, {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ฿${fmtBaht(ctx.parsed.y)}`}}},
    scales:{
      x:{ticks:{color:isDark?'#e8eaf0':'#0d1b3e',font:{size:9},maxRotation:45},grid:{color:isDark?'#243b73':'#dde3f0'}},
      y:{ticks:{color:isDark?'#e8eaf0':'#0d1b3e',font:{size:9}},grid:{color:isDark?'#243b73':'#dde3f0'}}
    }
  });
}

function renderCatSummary() {
  const byCat = {};
  TARGET_CATS.forEach(c => byCat[c] = {baht:0,cs:0,cnt:0});
  filteredRows.forEach(r => {
    byCat[r.cat].baht += r.baht;
    byCat[r.cat].cs += r.cs;
    byCat[r.cat].cnt++;
  });
  const maxBaht = Math.max(...TARGET_CATS.map(c => Math.abs(byCat[c].baht)));

  $('catSummary').innerHTML = TARGET_CATS.map(c => {
    const k = CAT_KEYS[c];
    const pct = maxBaht ? (Math.abs(byCat[c].baht)/maxBaht*100).toFixed(0) : 0;
    return `<div class="cat-card">
      <div class="cat-name">${['🛒','🍺','🚬','🥛'][TARGET_CATS.indexOf(c)]} ${c}</div>
      <div class="cat-baht">฿${fmtBaht(byCat[c].baht)}</div>
      <div class="cat-cs">${fmtCs(byCat[c].cs)} ลัง · ${byCat[c].cnt} รายการ</div>
      <div class="cat-bar cat-bar-${k}" style="width:${pct}%"></div>
    </div>`;
  }).join('');
}

function renderTopProductByCat() {
  const grouped = {};
  filteredRows.forEach(r => {
    const key = r.cat + '|||' + r.product;
    if (!grouped[key]) grouped[key] = {cat:r.cat, product:r.product, baht:0, cs:0};
    grouped[key].baht += r.baht;
    grouped[key].cs += r.cs;
  });

  let html = '';
  TARGET_CATS.forEach(cat => {
    const products = Object.values(grouped).filter(g => g.cat===cat)
      .sort((a,b) => b.baht - a.baht).slice(0,5);
    if (!products.length) return;
    const k = CAT_KEYS[cat];
    html += `<div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:${CAT_COLORS[cat]};margin-bottom:8px;padding-left:8px;border-left:3px solid ${CAT_COLORS[cat]}">${cat}</div>
      <table class="tbl" style="min-width:400px">
        <thead><tr>
          <th>#</th><th>ชื่อสินค้า</th>
          <th style="text-align:right">ยอดขาย (บาท)</th>
          <th style="text-align:right">ยอดขาย (ลัง)</th>
        </tr></thead><tbody>
        ${products.map((p,i) => `<tr>
          <td>${i+1}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.product}">${p.product}</td>
          <td class="num">฿${fmtBaht(p.baht)}</td>
          <td class="num">${fmtCs(p.cs)}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  });
  $('topProductByCat').innerHTML = html || '<div style="text-align:center;color:var(--muted);padding:24px">ไม่มีข้อมูล</div>';
}

function renderProductTable() {
  const q = productSearch.toLowerCase();
  const grouped = {};
  filteredRows.forEach(r => {
    const key = r.product + '|||' + r.cat;
    if (!grouped[key]) grouped[key] = {name:r.product, cat:r.cat, baht:0, cs:0, txn:0};
    grouped[key].baht += r.baht;
    grouped[key].cs += r.cs;
    grouped[key].txn++;
  });
  let rows = Object.values(grouped).filter(r => !q || r.name.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q));
  rows.sort((a,b) => {
    const m = productSortDir==='asc'?1:-1;
    const va=a[productSortKey], vb=b[productSortKey];
    if(typeof va==='number') return (va-vb)*m;
    return String(va).localeCompare(String(vb),'th')*m;
  });
  $('productCount').textContent = rows.length.toLocaleString() + ' สินค้า';
  if (!rows.length) {
    $('productTbody').innerHTML = '<tr class="empty-row"><td colspan="6">ไม่มีข้อมูล</td></tr>';
    return;
  }
  $('productTbody').innerHTML = rows.map((r,i) => {
    const k = CAT_KEYS[r.cat]||'info';
    return `<tr>
      <td style="color:var(--muted);font-weight:700">${i+1}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.name}">${r.name}</td>
      <td><span class="badge badge-${k}">${r.cat}</span></td>
      <td class="num">฿${fmtBaht(r.baht)}</td>
      <td class="num">${fmtCs(r.cs)}</td>
      <td class="num">${r.txn}</td>
    </tr>`;
  }).join('');
  // update sort indicators
  document.querySelectorAll('#productTbl thead th').forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (!ind) return;
    ind.textContent = th.dataset.key===productSortKey ? (productSortDir==='asc'?'▲':'▼') : '';
  });
}

function renderTxnTable() {
  const q = txnSearch.toLowerCase();
  let rows = filteredRows.filter(r => !q || r.product.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q) || r.wh.toLowerCase().includes(q) || r.date.includes(q));
  rows = [...rows].sort((a,b) => {
    const m = txnSortDir==='asc'?1:-1;
    if (txnSortKey==='date') return ((parseTHDate(a.date)||0)-(parseTHDate(b.date)||0))*m;
    if (txnSortKey==='baht'||txnSortKey==='cs') return (a[txnSortKey]-b[txnSortKey])*m;
    return String(a[txnSortKey]).localeCompare(String(b[txnSortKey]),'th')*m;
  });
  $('txnCount').textContent = rows.length.toLocaleString() + ' รายการ';
  if (!rows.length) {
    $('txnTbody').innerHTML = '<tr class="empty-row"><td colspan="6">ไม่มีข้อมูล</td></tr>';
    return;
  }
  $('txnTbody').innerHTML = rows.slice(0,500).map(r => {
    const k = CAT_KEYS[r.cat]||'info';
    const negStyle = r.baht < 0 ? 'color:var(--danger)' : '';
    return `<tr>
      <td>${formatDate(r.date)}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.product}">${r.product}</td>
      <td><span class="badge badge-${k}">${r.cat.replace('Bplus ','')}</span></td>
      <td><span class="badge" style="background:rgba(13,27,62,.1);color:var(--navy)">${r.wh}</span></td>
      <td class="num" style="${negStyle}">฿${fmtBaht(r.baht)}</td>
      <td class="num" style="${negStyle}">${fmtCs(r.cs)}</td>
    </tr>`;
  }).join('');
  if (rows.length > 500) {
    $('txnTbody').innerHTML += `<tr><td colspan="6" style="text-align:center;padding:10px;color:var(--muted);font-size:12px">แสดง 500 รายการแรก จากทั้งหมด ${rows.length.toLocaleString()} รายการ</td></tr>`;
  }
  document.querySelectorAll('#txnTbl thead th').forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (!ind) return;
    ind.textContent = th.dataset.key===txnSortKey ? (txnSortDir==='asc'?'▲':'▼') : '';
  });
}

// ─── Events ───────────────────────────────────────────────────
// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Cat chips
document.querySelectorAll('[data-cat]').forEach(chip => {
  chip.addEventListener('click', () => {
    const cat = chip.dataset.cat;
    const k = CAT_KEYS[cat];
    if (selectedCats.has(cat)) {
      if (selectedCats.size === 1) return; // keep at least 1
      selectedCats.delete(cat);
      chip.classList.remove(`active-${k}`);
      chip.style.opacity = '.4';
    } else {
      selectedCats.add(cat);
      chip.classList.add(`active-${k}`);
      chip.style.opacity = '';
    }
    applyFilters();
  });
});

// WH chips
document.querySelectorAll('[data-wh]').forEach(chip => {
  chip.addEventListener('click', () => {
    const wh = chip.dataset.wh;
    if (selectedWH.has(wh)) {
      if (selectedWH.size === 1) return;
      selectedWH.delete(wh);
      chip.classList.remove('active-wh');
      chip.style.opacity = '.4';
    } else {
      selectedWH.add(wh);
      chip.classList.add('active-wh');
      chip.style.opacity = '';
    }
    applyFilters();
  });
});

// Date filters
$('dateFrom').addEventListener('change', () => { dateFrom = $('dateFrom').value; applyFilters(); });
$('dateTo').addEventListener('change', () => { dateTo = $('dateTo').value; applyFilters(); });

// Product search
$('productSearch').addEventListener('input', e => { productSearch = e.target.value; renderProductTable(); });
$('txnSearch').addEventListener('input', e => { txnSearch = e.target.value; renderTxnTable(); });

// Product table sort
document.querySelectorAll('#productTbl thead th').forEach(th => {
  if (!th.dataset.key) return;
  th.addEventListener('click', () => {
    const key = th.dataset.key, type = th.dataset.type||'str';
    if (productSortKey===key) productSortDir = productSortDir==='asc'?'desc':'asc';
    else { productSortKey=key; productSortDir=type==='num'?'desc':'asc'; }
    renderProductTable();
  });
});

// Txn table sort
document.querySelectorAll('#txnTbl thead th').forEach(th => {
  if (!th.dataset.key) return;
  th.addEventListener('click', () => {
    const key = th.dataset.key, type = th.dataset.type||'str';
    if (txnSortKey===key) txnSortDir = txnSortDir==='asc'?'desc':'asc';
    else { txnSortKey=key; txnSortDir=(type==='num'||type==='date')?'desc':'asc'; }
    renderTxnTable();
  });
});

// Refresh
$('refreshBtn').addEventListener('click', () => fetchData());

// Upload button
$('uploadBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', function() { handleFileUpload(this); });

// Dark mode
$('darkBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  $('darkBtn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  renderCharts();
});

// ─── Boot ─────────────────────────────────────────────────────
fetchData();
</script>
</body>
</html>
