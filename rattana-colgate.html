<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rattana Colgate v1.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --navy:#0d1b3e; --navy-mid:#1a2f5e; --navy-light:#243b73;
      --gold:#c9a84c; --gold-light:#e8c86a;
      --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
      --bg:#f4f6fb; --text:#0d1b3e; --card-bg:#ffffff;
      --border:#dde3f0; --muted:#6b7896; --row-alt:#fafbfd;
      --radius-sm:6px; --radius-md:12px; --radius-lg:16px;
      --shadow-sm:0 1px 4px rgba(0,0,0,.06);
      --shadow-md:0 2px 8px rgba(0,0,0,.08);
      --shadow-lg:0 8px 24px rgba(13,27,62,.12);
      --shadow-gold:0 4px 12px rgba(201,168,76,.35);
    }
    body.dark {
      --bg:#0a1020; --text:#e8eaf0; --card-bg:#111c35;
      --border:#243b73; --muted:#8a98b8; --row-alt:#0f1830;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
    button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    input,select,textarea{font-family:inherit;font-size:16px}

    /* Header */
    header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(12px,env(safe-area-inset-top))}
    .logo-text{font-weight:700;letter-spacing:1.5px;font-size:17px;color:#fff;flex:1;white-space:nowrap}
    .logo-text span{color:var(--gold)}
    .icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;flex-shrink:0}
    .icon-btn:hover{background:rgba(255,255,255,.12)}
    .version-badge{font-size:11px;color:rgba(255,255,255,.45);padding:2px 8px;border:1px solid rgba(255,255,255,.15);border-radius:10px;white-space:nowrap;flex-shrink:0}

    /* Layout */
    .page{min-height:100dvh;display:flex;flex-direction:column}
    .content{flex:1;padding:12px;max-width:860px;margin:0 auto;width:100%}
    @media(min-width:640px){.content{padding:16px}}
    @media(min-width:1024px){.content{padding:20px}}

    /* Cards */
    .card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
    .card-gold{border-top:3px solid var(--gold)}
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent);flex-wrap:wrap;gap:8px}
    .card-body{padding:16px}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:40px;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
    .btn:hover{opacity:.88} .btn:active{transform:scale(.97)}
    .btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
    .btn-gold:hover{background:var(--gold-light)}
    .btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-success{background:var(--success);color:#fff}
    .btn-sm{padding:5px 10px;font-size:12px;min-height:32px}
    .btn-lg{padding:13px 24px;font-size:15px;min-height:50px;border-radius:var(--radius-md)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

    /* Forms */
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
    .req{color:var(--danger);margin-left:2px}
    .input{height:44px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;font-family:inherit;outline:none;width:100%;transition:border-color .15s,background .15s}
    .input:focus{border-color:var(--gold)}
    .input[readonly]{background:var(--row-alt);color:var(--muted);cursor:default}
    .input.auto-filled{background:rgba(201,168,76,.08);border-color:var(--gold);color:var(--text);font-weight:700}

    /* Grid */
    .form-grid{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:580px){.form-grid{grid-template-columns:repeat(2,1fr)}}
    .full-col{grid-column:1/-1}

    /* Table */
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl{width:100%;border-collapse:collapse;min-width:640px}
    .tbl thead{background:var(--navy);color:#fff}
    .tbl thead th{padding:10px 12px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border-bottom:2px solid var(--gold)}
    .tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
    .tbl tbody tr:nth-child(even){background:var(--row-alt)}
    .tbl tbody tr:hover{background:rgba(201,168,76,.07)}
    .tbl td{padding:9px 12px;font-size:13px;vertical-align:middle}
    .tbl .empty-row td{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

    /* Custom Dropdown */
    .dd-wrap{position:relative;width:100%}
    .dd-trigger{width:100%;min-height:44px;padding:10px 14px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Sarabun',sans-serif;font-size:16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:border-color .15s}
    .dd-trigger:hover,.dd-trigger.open{border-color:var(--gold)}
    .dd-trigger .dd-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .dd-trigger .dd-arrow{color:var(--muted);font-size:11px;flex-shrink:0;transition:transform .18s}
    .dd-trigger.open .dd-arrow{transform:rotate(180deg)}
    .dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-bg);border:1.5px solid var(--gold);border-radius:var(--radius-sm);z-index:600;box-shadow:var(--shadow-lg);max-height:270px;display:flex;flex-direction:column}
    .dd-search{padding:10px 14px;font-size:15px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text);outline:none;font-family:'Sarabun',sans-serif;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
    .dd-list{overflow-y:auto;flex:1;list-style:none;padding:4px 0;margin:0}
    .dd-list li{padding:10px 14px;cursor:pointer;font-size:14px;transition:background .1s}
    .dd-list li:hover{background:var(--navy-light);color:#fff}
    .dd-list li.no-result{color:var(--muted);cursor:default;font-style:italic;font-size:13px}

    /* Toast */
    .toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;padding:12px 20px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px;pointer-events:none}
    .toast-success{background:var(--success)}
    .toast-error{background:var(--danger)}
    .toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

    /* Spinner */
    .spinner-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.55);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
    .spinner-overlay.show{display:flex}
    .spinner-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:240px}
    .spinner-ring{width:48px;height:48px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}

    /* Back to top */
    #backToTop{position:fixed;bottom:max(24px,calc(16px + env(safe-area-inset-bottom)));right:max(16px,calc(12px + env(safe-area-inset-right)));background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:46px;height:46px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:20px;font-weight:700;cursor:pointer}
    #backToTop.show{display:flex}

    /* Utilities */
    .mt-12{margin-top:12px}.mt-16{margin-top:16px}
    .flex{display:flex;align-items:center}.gap-8{gap:8px}
    .flex-end{justify-content:flex-end}
    .flex-between{justify-content:space-between}
    .txt-muted{color:var(--muted);font-size:12px}
    .section-title{font-size:15px;font-weight:700}

    /* Loading state */
    .data-loading .dd-trigger{opacity:.6;pointer-events:none}

    /* Photo source picker */
    .photo-choice{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:14px;color:var(--text);text-align:left;transition:background .12s}
    .photo-choice:hover{background:rgba(201,168,76,.08)}
    .photo-choice strong{font-size:14px;font-weight:600}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    .anim-up{animation:slideUp .3s ease}

    /* Login Screen */
    #loginScreen{position:fixed;inset:0;background:var(--navy);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 28px;width:100%;max-width:400px;border-top:4px solid var(--gold);box-shadow:var(--shadow-lg);animation:slideUp .35s ease}
    .login-logo{text-align:center;margin-bottom:24px}
    .login-logo .brand{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:1px}
    .login-logo .brand span{color:var(--gold)}
    .login-logo .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .login-field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
    .login-field label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
    .login-input{height:48px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;font-family:'Sarabun',sans-serif;outline:none;width:100%;transition:border-color .15s}
    .login-input:focus{border-color:var(--gold)}
    #loginError{font-size:13px;color:var(--danger);min-height:20px;text-align:center;margin-bottom:8px}
    .btn-login{width:100%;height:50px;background:var(--gold);color:var(--navy);border:none;border-radius:var(--radius-md);font-size:16px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;transition:opacity .15s}
    .btn-login:hover{opacity:.88}
    .btn-login:disabled{opacity:.5;cursor:not-allowed}

    /* User chip in header */
    .user-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 10px 4px 6px;cursor:pointer;max-width:160px;overflow:hidden}
    .user-avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
    .user-name{font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand">RATTANA <span>COLGATE</span></div>
      <div class="sub">กรุณาเข้าสู่ระบบเพื่อใช้งาน</div>
    </div>
    <div class="login-field">
      <label>E-mail</label>
      <input type="email" class="login-input" id="loginEmail" placeholder="กรอก E-mail ของคุณ"
        autocomplete="email" inputmode="email" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    </div>
    <div class="login-field">
      <label>รหัสพนักงาน (Password)</label>
      <input type="password" class="login-input" id="loginPass" placeholder="เช่น 68000"
        autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="loginError"></div>
    <button class="btn-login" id="btnLogin" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--muted)">Rattana Colgate v1.1 · 2026-05-27</div>
  </div>
</div>

<!-- Spinner -->
<div class="spinner-overlay" id="spinner">
  <div class="spinner-box">
    <div class="spinner-ring"></div>
    <p id="spinnerMsg" style="font-size:14px;color:var(--text)">กำลังโหลด...</p>
  </div>
</div>

<div class="page">

  <div class="content">

    <!-- ── Form Card ── -->
    <div class="card card-gold anim-up" id="formCard">
      <div class="card-head">
        <span class="section-title">📋 บันทึกข้อมูลร้านค้า</span>
        <span id="dataStatus" class="txt-muted">กำลังโหลดข้อมูล...</span>
      </div>
      <div class="card-body">
        <div class="form-grid" id="formArea">

          <!-- 1. ชื่อร้านค้า (full width) -->
          <div class="field full-col">
            <label>ชื่อร้านค้า <span class="req">*</span></label>
            <input type="text" class="input" id="shopName"
              placeholder="กรอกชื่อร้านค้า" autocomplete="off" maxlength="120">
          </div>

          <!-- 2. ประเภทร้านค้า -->
          <div class="field">
            <label>ประเภทร้านค้า <span class="req">*</span></label>
            <div class="dd-wrap" id="ddType">
              <button class="dd-trigger" type="button" onclick="toggleDD('ddType')">
                <span class="dd-label" id="ddTypeLabel" style="color:var(--muted)">-- เลือกประเภทร้านค้า --</span>
                <span class="dd-arrow">▾</span>
              </button>
              <div class="dd-panel" id="ddTypePanel" style="display:none">
                <input class="dd-search" type="text" placeholder="🔍 ค้นหาประเภท..."
                  oninput="filterDD(this,'ddTypeList')" autocomplete="off">
                <ul class="dd-list" id="ddTypeList">
                  <li class="no-result">กำลังโหลด...</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- 3a. บ้านเลขที่ -->
          <div class="field">
            <label>บ้านเลขที่</label>
            <input type="text" class="input" id="houseNo"
              placeholder="เช่น 123/4" autocomplete="off" maxlength="40">
          </div>

          <!-- 3b. หมู่ที่ (new row pair) -->
          <div class="field">
            <label>หมู่ที่</label>
            <input type="text" class="input" id="mooNo"
              placeholder="เช่น 5" autocomplete="off" maxlength="10">
          </div>

          <!-- 4. ตำบล/อำเภอ/จังหวัด (full width) -->
          <div class="field full-col">
            <label>ตำบล / อำเภอ / จังหวัด <span class="req">*</span></label>
            <div class="dd-wrap" id="ddAddr">
              <button class="dd-trigger" type="button" onclick="toggleDD('ddAddr')">
                <span class="dd-label" id="ddAddrLabel" style="color:var(--muted)">-- เลือกตำบล / อำเภอ / จังหวัด --</span>
                <span class="dd-arrow">▾</span>
              </button>
              <div class="dd-panel" id="ddAddrPanel" style="display:none">
                <input class="dd-search" type="text" placeholder="🔍 พิมพ์ตำบล อำเภอ หรือจังหวัด..."
                  oninput="filterDD(this,'ddAddrList')" autocomplete="off">
                <ul class="dd-list" id="ddAddrList">
                  <li class="no-result">กำลังโหลด...</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- 5. รหัสไปรษณีย์ (auto) -->
          <div class="field">
            <label>รหัสไปรษณีย์ <span style="font-size:10px;font-weight:400;color:var(--muted)">(อัตโนมัติ)</span></label>
            <input type="text" class="input" id="postalCode"
              placeholder="— เลือกที่อยู่ก่อน —" readonly>
          </div>

          <!-- 6. รูทตำบล -->
          <div class="field">
            <label>รูทตำบล <span style="font-size:10px;font-weight:400;color:var(--muted)">(ชื่อรูท-ตำบล)</span></label>
            <div class="dd-wrap" id="ddRoute">
              <button class="dd-trigger" type="button" onclick="toggleDD('ddRoute')">
                <span class="dd-label" id="ddRouteLabel" style="color:var(--muted)">-- เลือกรูทตำบล --</span>
                <span class="dd-arrow">▾</span>
              </button>
              <div class="dd-panel" id="ddRoutePanel" style="display:none">
                <input class="dd-search" type="text" placeholder="🔍 ค้นหารูทตำบล..."
                  oninput="filterDD(this,'ddRouteList')" autocomplete="off">
                <ul class="dd-list" id="ddRouteList">
                  <li class="no-result">กำลังโหลด...</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- 7. ชื่อรูท (auto) -->
          <div class="field">
            <label>ชื่อรูท <span style="font-size:10px;font-weight:400;color:var(--muted)">(อัตโนมัติ)</span></label>
            <input type="text" class="input" id="routeName"
              placeholder="— เลือกรูทตำบลก่อน —" readonly>

          <!-- 8. ชื่อผู้ติดต่อ -->
          <div class="field full-col">
            <label>ชื่อผู้ติดต่อ</label>
            <input type="text" class="input" id="contactName"

          <div class="field full-col">

            <input type="text" class="input" id="taxId"

<script>
// ════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════
const USER_SHEET_NAME = 'User';
let currentUser = null;
let userRows = [];

async function fetchUserSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(USER_SHEET_NAME)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCsv(await res.text());
}

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim().toLowerCase();
  const empId    = document.getElementById('loginPass').value.trim();
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('btnLogin');

  errEl.textContent = '';
  if (!email || !empId) {
    errEl.textContent = '⚠ กรุณากรอก E-mail และรหัสพนักงาน';
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ กำลังตรวจสอบ...';

  try {
    if (!userRows.length) {
      userRows = await fetchUserSheet();
    }

    const matched = userRows.find(r => {
      const rowEmail = (r['E-mail'] || '').toLowerCase().trim();
      const rowEmpId = (r['รหัสพนักงาน'] || '').trim();
      return rowEmail === email && rowEmpId === empId;
    });

    if (!matched) {
      errEl.textContent = '⚠ E-mail หรือรหัสพนักงานไม่ถูกต้อง';
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
      return;
    }

    if ((matched['Status'] || '').trim().toLowerCase() !== 'active') {
      errEl.textContent = '⚠ บัญชีนี้ถูกระงับการใช้งาน';
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
      return;
    }

    currentUser = matched;
    localStorage.setItem('rattana_colgate_user', JSON.stringify({ user: matched, loginAt: Date.now() }));

    // Show user chip
    const nick = matched['ชื่อเล่น'] || matched['ชื่อ-สกุล'] || 'User';
    const initial = nick.charAt(0).toUpperCase();
    document.getElementById('userAvatar').textContent = initial;
    document.getElementById('userName').textContent = nick;
    document.getElementById('userChip').style.display = 'flex';

    // Hide login screen
    document.getElementById('loginScreen').style.display = 'none';

    // Boot main app
    loadFromStorage();
    renderTable();
    await loadData();

  } catch (e) {
    errEl.textContent = '⚠ เชื่อมต่อไม่ได้: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

function doLogout() {
  if (!confirm('ออกจากระบบ?')) return;
  currentUser = null;
  userRows = [];
  localStorage.removeItem('rattana_colgate_user');
  document.getElementById('userChip').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('btnLogin').disabled = false;
  document.getElementById('btnLogin').textContent = 'เข้าสู่ระบบ';
  document.getElementById('loginScreen').style.display = 'flex';
}

// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const SHEET_ID   = '19XHdS_Ft7NpQVkFEd2InNjH1CD6y6w6Vgd38Zyx8j0w';
const SHEET_NAME = 'App Data Center';
const GAS_WRITE_URL = 'https://script.google.com/macros/s/AKfycbwxPmHWhM4McUEOQOF54gJAu8S3inMHfMD55dKvDmQzd8uLvhN5boluuL7YZIEAyXQnDA/exec';
const COL_TYPE       = 'ประเภทร้านค้า';
const COL_ADDR       = 'ตำบล,อำเภอ,จังหวัด ส่วนกลาง';
const COL_ZIP        = 'รหัสไปรษณีย์';
const COL_ROUTE_SUB  = 'ชื่อรูท-ตำบล';
const COL_ROUTE_NAME = 'ชื่อรูท';

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let storeTypes   = [];   // string[]
let addressRows  = [];   // [{address, zip}]  deduplicated
let routeRows    = [];   // [{routeSub, routeName}]  deduplicated by routeSub
let stores       = [];   // saved entries
let selType      = '';
let selAddress   = '';
let selZip       = '';
let selRouteSub  = '';
let selRouteName = '';

// ════════════════════════════════════════════
//  SPINNER / TOAST
// ════════════════════════════════════════════
const showSpinner = (m = 'กำลังโหลด...') => {
  document.getElementById('spinnerMsg').textContent = m;
  document.getElementById('spinner').classList.add('show');
};
const hideSpinner = () => document.getElementById('spinner').classList.remove('show');

function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ════════════════════════════════════════════
//  CSV PARSER  (RFC-4180, handles Thai, BOM)
// ════════════════════════════════════════════
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1]==='"'){cell+='"';i++;}else inQ=false; }
      else cell += ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===',')  { row.push(cell); cell=''; }
      else if (ch==='\r') { /* skip */ }
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'')
    .replace(/[​‌‍﻿]/g,'')
    .replace(/ /g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1)
    .filter(r => r.some(c => clean(c)))
    .map(r => Object.fromEntries(headers.map((k,i) => [k, clean(r[i])])));
}

// ════════════════════════════════════════════
//  FETCH SHEET
// ════════════════════════════════════════════
async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCsv(await res.text());
}

// ════════════════════════════════════════════
//  LOAD DATA
// ════════════════════════════════════════════
async function loadData() {
  showSpinner('กำลังดึงข้อมูลจาก Google Sheet...');
  try {
    const rows = await fetchSheet();

    // ── Store types (unique, sorted) ──────
    const typeSet = new Set();
    rows.forEach(r => { const v = r[COL_TYPE]; if (v) typeSet.add(v); });
    storeTypes = [...typeSet].sort((a, b) => a.localeCompare(b, 'th'));

    // ── Address + zip (deduplicate by address text) ──
    const addrMap = new Map();
    rows.forEach(r => {
      const addr = r[COL_ADDR];
      const zip  = String(r[COL_ZIP] || '');
      if (addr && !addrMap.has(addr)) addrMap.set(addr, zip);
    });
    addressRows = [...addrMap.entries()]
      .map(([address, zip]) => ({ address, zip }))
      .sort((a, b) => a.address.localeCompare(b.address, 'th'));

    // ── Route sub + route name (deduplicate by routeSub) ──
    const routeMap = new Map();
    rows.forEach(r => {
      const sub  = r[COL_ROUTE_SUB];
      const name = r[COL_ROUTE_NAME] || '';
      if (sub && !routeMap.has(sub)) routeMap.set(sub, name);
    });
    routeRows = [...routeMap.entries()]
      .map(([routeSub, routeName]) => ({ routeSub, routeName }))
      .sort((a, b) => a.routeSub.localeCompare(b.routeSub, 'th'));

    renderTypeList();
    renderAddrList();
    renderRouteList();

    document.getElementById('dataStatus').textContent =
      `✓ ${storeTypes.length} ประเภท · ${addressRows.length} พื้นที่ · ${routeRows.length} รูท`;
    showToast(`โหลดสำเร็จ: ${storeTypes.length} ประเภทร้านค้า · ${addressRows.length} พื้นที่`, 'success');
  } catch (e) {
    document.getElementById('dataStatus').textContent = '⚠ โหลดไม่สำเร็จ';
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    console.error(e);
  } finally {
    hideSpinner();
  }
}

// ════════════════════════════════════════════
//  DROPDOWN — RENDER LISTS
// ════════════════════════════════════════════
function renderTypeList() {
  const ul = document.getElementById('ddTypeList');
  ul.innerHTML = '';
  if (!storeTypes.length) {
    ul.innerHTML = '<li class="no-result">ไม่พบข้อมูลประเภทร้านค้า</li>';
    return;
  }
  storeTypes.forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    li.onclick = () => {
      selType = t;
      const lbl = document.getElementById('ddTypeLabel');
      lbl.textContent = t;
      lbl.style.color = 'var(--text)';
      closePanel('ddTypePanel');
    };
    ul.appendChild(li);
  });
}

function renderAddrList() {
  const ul = document.getElementById('ddAddrList');
  ul.innerHTML = '';
  if (!addressRows.length) {
    ul.innerHTML = '<li class="no-result">ไม่พบข้อมูลที่อยู่</li>';
    return;
  }
  addressRows.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item.address + (item.zip ? `  [${item.zip}]` : '');
    li.onclick = () => {
      selAddress = item.address;
      selZip     = item.zip;
      // Update label
      const lbl = document.getElementById('ddAddrLabel');
      lbl.textContent = item.address;
      lbl.style.color = 'var(--text)';
      // Auto-fill zip
      const zipEl = document.getElementById('postalCode');
      zipEl.value = item.zip;
      zipEl.classList.toggle('auto-filled', !!item.zip);
      closePanel('ddAddrPanel');
    };
    ul.appendChild(li);
  });
}

function renderRouteList() {
  const ul = document.getElementById('ddRouteList');
  ul.innerHTML = '';
  if (!routeRows.length) {
    ul.innerHTML = '<li class="no-result">ไม่พบข้อมูลรูท</li>';
    return;
  }
  routeRows.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item.routeSub + (item.routeName ? `  — ${item.routeName}` : '');
    li.onclick = () => {
      selRouteSub  = item.routeSub;
      selRouteName = item.routeName;
      const lbl = document.getElementById('ddRouteLabel');
      lbl.textContent = item.routeSub;
      lbl.style.color = 'var(--text)';
      // Auto-fill route name
      const nameEl = document.getElementById('routeName');
      nameEl.value = item.routeName;
      nameEl.classList.toggle('auto-filled', !!item.routeName);
      closePanel('ddRoutePanel');
    };
    ul.appendChild(li);
  });
}

// ════════════════════════════════════════════
//  DROPDOWN — TOGGLE / FILTER / CLOSE
// ════════════════════════════════════════════
function toggleDD(wrapId) {
  const panel   = document.querySelector(`#${wrapId} .dd-panel`);
  const trigger = document.querySelector(`#${wrapId} .dd-trigger`);
  const isOpen  = panel.style.display !== 'none';

  // close all first
  document.querySelectorAll('.dd-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.dd-trigger').forEach(t => t.classList.remove('open'));

  if (!isOpen) {
    panel.style.display = 'flex';
    trigger.classList.add('open');
    const search = panel.querySelector('.dd-search');
    search.value = '';
    // show all items
    panel.querySelectorAll('li:not(.no-result)').forEach(li => li.style.display = '');
    const noRes = panel.querySelector('li.no-result');
    if (noRes) noRes.style.display = 'none';
    setTimeout(() => search.focus(), 50);
  }
}

function closePanel(panelId) {
  document.getElementById(panelId).style.display = 'none';
  // un-open trigger
  const wrap = document.getElementById(panelId).closest('.dd-wrap');
  if (wrap) wrap.querySelector('.dd-trigger')?.classList.remove('open');
}

function filterDD(inp, listId) {
  const q  = inp.value.toLowerCase();
  const ul = document.getElementById(listId);
  let vis  = 0;

  ul.querySelectorAll('li:not(.no-result)').forEach(li => {
    const show = li.textContent.toLowerCase().includes(q);
    li.style.display = show ? '' : 'none';
    if (show) vis++;
  });

  let noRes = ul.querySelector('li.no-result');
  if (vis === 0) {
    if (!noRes) {
      noRes = document.createElement('li');
      noRes.className = 'no-result';
      noRes.textContent = 'ไม่พบรายการที่ค้นหา';
      ul.appendChild(noRes);
    }
    noRes.style.display = '';
  } else {
    if (noRes) noRes.style.display = 'none';
  }
}

// Close on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.dd-wrap')) {
    document.querySelectorAll('.dd-panel').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.dd-trigger').forEach(t => t.classList.remove('open'));
  }
});

// ════════════════════════════════════════════
//  FORM — SAVE / CLEAR
// ════════════════════════════════════════════
function saveStore() {
  const shopName = document.getElementById('shopName').value.trim();
  const houseNo  = document.getElementById('houseNo').value.trim();
  const mooNo    = document.getElementById('mooNo').value.trim();
  const contactName = document.getElementById('contactName').value.trim();
  const taxId       = String(document.getElementById('taxId').dataset.raw || '');
  const phone       = String(document.getElementById('phone').value || '');
  const remark      = document.getElementById('remark').value.trim();
  const gpsCoords   = document.getElementById('gpsCoords').value.trim();
  const photo       = currentPhoto;

  // Validation
  if (!shopName) {
    showToast('⚠ กรุณากรอกชื่อร้านค้า', 'error');
    document.getElementById('shopName').focus();
    return;
  }
  if (!selType) {
    showToast('⚠ กรุณาเลือกประเภทร้านค้า', 'error');
    return;
  }
  if (!selAddress) {
    showToast('⚠ กรุณาเลือกตำบล / อำเภอ / จังหวัด', 'error');
    return;
  }

  const entry = {
    id:         Date.now(),
    shopName,
    shopType:   selType,
    houseNo,
    mooNo,
    contactName,
    phone,
    taxId,
    remark,
    routeSub:  selRouteSub,
    routeName: selRouteName,
    gpsCoords,
    photo,
    photoUrl:   currentPhotoUrl,
    address:    selAddress,
    postalCode: String(selZip),
    salesCode:  currentUser?.['รหัสเซลล์'] || '',
    warehouse:  currentUser?.['W'] || '',
    sellerName: (() => {
      if (!currentUser) return '';
      const fullName  = (currentUser['ชื่อ-สกุล'] || currentUser['ชื่อ - สกุล'] || '').trim();
      const firstName = fullName.split(/\s+/)[0].replace(/[:：]+$/, '').trim();
      const phone     = (currentUser['เบอร์โทร'] || '').trim();
      if (firstName && phone) return firstName + ' ' + phone;
      return firstName || phone;
    })(),
    savedAt:    new Date().toLocaleString('th-TH'),
  };

  stores.push(entry);
  saveToStorage();
  renderTable();
  clearForm();
  showToast(`✓ บันทึก "${shopName}" เรียบร้อยแล้ว`, 'success');
  submitToSheet(entry);

  // Scroll to table
  setTimeout(() => {
    document.getElementById('tableCard')
      .scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 350);
}

async function submitToSheet(entry) {
  try {
    await fetch(GAS_WRITE_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ type: 'store', sheet: 'Customer', ...entry })
    });
    showToast('☁ บันทึกลง Google Sheet แล้ว', 'info');
  } catch (err) {
    showToast('⚠ ส่ง Sheet ไม่สำเร็จ: ' + err.message, 'error');
  }
}

function clearForm() {
  document.getElementById('shopName').value    = '';
  document.getElementById('houseNo').value     = '';
  document.getElementById('mooNo').value       = '';
  document.getElementById('contactName').value  = '';
  document.getElementById('remark').value       = '';
  document.getElementById('phone').value        = '';
  document.getElementById('phoneStatus').textContent = '';
  document.getElementById('taxId').value       = '';
  document.getElementById('taxId').dataset.raw = '';
  document.getElementById('taxIdStatus').textContent = '';
  selRouteSub = ''; selRouteName = '';
  document.getElementById('ddRouteLabel').textContent = '-- เลือกรูทตำบล --';
  document.getElementById('ddRouteLabel').style.color = 'var(--muted)';

function deleteStore(id) {
  const name = stores.find(s => s.id === id)?.shopName || '';
  stores = stores.filter(s => s.id !== id);
  saveToStorage();
  renderTable();
  showToast(`ลบ "${name}" แล้ว`, 'info');
}

function clearAll() {
  if (!stores.length) return;
  if (!confirm(`ยืนยันลบรายการทั้งหมด ${stores.length} รายการ?`)) return;
  stores = [];
  saveToStorage();
  renderTable();
  showToast('ล้างข้อมูลทั้งหมดแล้ว', 'info');
}

// ════════════════════════════════════════════
//  TABLE RENDER
// ════════════════════════════════════════════
function renderTable() {
  const tbody   = document.getElementById('storeBody');
  const countEl = document.getElementById('storeCount');
  countEl.textContent = `${stores.length} รายการ`;
  document.getElementById('btnExport').disabled   = !stores.length;
  document.getElementById('btnClearAll').disabled = !stores.length;

  if (!stores.length) {
    tbody.innerHTML = `
      <tr class="empty-row">
        <td colspan="16">ยังไม่มีรายการ — กรอกข้อมูลด้านบนแล้วกด "บันทึกร้านค้า"</td>
      </tr>`;
    return;
  }

  tbody.innerHTML = stores.map((s, i) => `
    <tr>
      <td style="color:var(--muted);font-size:12px;text-align:center">${i + 1}</td>
      <td style="font-weight:600">${esc(s.shopName)}</td>
      <td>${esc(s.shopType)}</td>
      <td style="color:var(--muted)">${s.houseNo ? esc(s.houseNo) : '—'}</td>
      <td style="color:var(--muted)">${s.mooNo ? esc(s.mooNo) : '—'}</td>
      <td style="font-size:12px">${esc(s.address)}</td>
      <td style="font-family:'Courier New',monospace;font-weight:700;color:var(--navy);text-align:center">
        ${s.postalCode || '—'}
      </td>
      <td>${s.contactName || '—'}</td>
      <td style="font-size:12px;color:var(--muted);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s.remark||'')}">${s.remark ? esc(s.remark) : '—'}</td>
      <td style="font-family:'Courier New',monospace">${s.phone || '—'}</td>
      <td style="font-family:'Courier New',monospace;font-size:12px">${s.taxId ? fmtTaxId(s.taxId) : '—'}</td>
      <td>${s.routeSub || '—'}</td>
      <td style="color:var(--muted)">${s.routeName || '—'}</td>
      <td style="font-weight:600;color:var(--navy)">${s.salesCode || '—'}</td>
      <td style="font-family:'Courier New',monospace;font-size:11px;color:var(--muted)">${s.gpsCoords || '—'}</td>
      <td style="text-align:center">
        ${s.photoUrl
          ? `<a href="${s.photoUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--info);font-weight:600;text-decoration:none" title="${s.photoUrl}">🖼 ดูรูป</a>`
          : s.photo
            ? `<img src="${s.photo}" style="width:60px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer" onclick="viewPhoto('${s.id}')" title="คลิกดูรูปขยาย">`
            : '<span style="color:var(--muted);font-size:11px">—</span>'}
      </td>
      <td style="text-align:center">
        <button class="btn btn-danger btn-sm" onclick="deleteStore(${s.id})" title="ลบ">🗑</button>
      </td>
    </tr>
  `).join('');
}

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function viewPhoto(id) {

  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  overlay.innerHTML = `
    <div style="position:relative;max-width:92vw;max-height:92dvh">

function exportExcel() {
  if (!stores.length) { showToast('ไม่มีข้อมูล', 'error'); return; }
  const data = stores.map((s, i) => ({
    'ลำดับ':              i + 1,
    'ชื่อร้านค้า':        s.shopName,
    'ประเภทร้านค้า':      s.shopType,
    'บ้านเลขที่':          s.houseNo,
    'หมู่ที่':             s.mooNo,
    'ตำบล/อำเภอ/จังหวัด': s.address,
    'รหัสไปรษณีย์':       s.postalCode,
    'ผู้ติดต่อ':           s.contactName,
    'หมายเหตุ':            s.remark,
    'เบอร์โทร':           s.phone,
    'เลข ภพ.20/บัตรปชช.': s.taxId,
    'รูทตำบล':            s.routeSub,
    'ชื่อรูท':             s.routeName,
    'รหัสเซลล์':          s.salesCode,
    'พิกัด GPS':          s.gpsCoords,
    'รูปถ่าย':            s.photoUrl || (s.photo ? 'มี (local)' : 'ไม่มี'),
    'บันทึกเมื่อ':        s.savedAt,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  // Column widths
  ws['!cols'] = [
    {wch:6},{wch:30},{wch:22},{wch:14},{wch:8},{wch:36},{wch:12},{wch:20},{wch:14},{wch:18},{wch:20},{wch:20},{wch:22},{wch:22}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ร้านค้า Colgate');
  const d = new Date();
  const fname = `rattana-colgate-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast('Export Excel สำเร็จ ✓', 'success');
}

let currentPhoto = '';
let currentPhotoUrl = '';

function togglePhotoMenu() {
  const menu = document.getElementById('photoMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

  document.getElementById('photoMenu').style.display = 'none';

// Close menu on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#photoMenu') && !e.target.closest('#btnAddPhoto')) {
    const m = document.getElementById('photoMenu');
    if (m) m.style.display = 'none';
  }
});

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.72);
      currentPhoto = b64;
      currentPhotoUrl = '';
      document.getElementById('photoImg').src = b64;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('btnClearPhoto').style.display = '';
      document.getElementById('btnAddPhoto').textContent = '📸 เปลี่ยนรูป';
      const kb = Math.round(b64.length * 0.75 / 1024);
      document.getElementById('photoSize').textContent = `${w}×${h}px · ~${kb} KB`;
      const shopName = document.getElementById('shopName').value.trim() || 'shop';
      uploadPhotoToDrive(b64, shopName + '_' + Date.now());
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

async function uploadPhotoToDrive(base64, name) {
  const statusEl = document.getElementById('photoUploadStatus');
  statusEl.innerHTML = '<span style="color:var(--warning)">⏳ กำลังอัพโหลดรูปไป Google Drive...</span>';
  try {
    const resp = await fetch(GAS_WRITE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ type: 'photo', base64, name })
    });
    const result = await resp.json();
    if (result.ok && result.url) {
      currentPhotoUrl = result.url;
      statusEl.innerHTML = `✓ อัพโหลดแล้ว · <a href="${result.url}" target="_blank" style="color:var(--info);font-weight:600">ดูรูปใน Drive 🔗</a>`;
    } else {
      throw new Error(result.error || 'unknown');
    }
  } catch(err) {
    statusEl.innerHTML = '<span style="color:var(--danger)">⚠ อัพโหลด Drive ไม่สำเร็จ (บันทึกแบบ local แทน)</span>';
    currentPhotoUrl = '';
  }
}

function clearPhoto() {
  currentPhoto = '';
  currentPhotoUrl = '';
  document.getElementById('photoImg').src = '';
  document.getElementById('photoPreview').style.display = 'none';

  document.getElementById('btnAddPhoto').textContent = '📸 เพิ่มรูปถ่าย';

// ════════════════════════════════════════════
//  TAX ID / ID CARD  (13 digits, stored raw, displayed formatted)
// ════════════════════════════════════════════
// Format: X-XXXX-XXXXX-XX-X
function fmtTaxId(raw) {
  const d = String(raw).replace(/\D/g, '').slice(0, 13);
  if (d.length < 2) return d;
  const p = [1,4,5,2,1];  // group sizes
  let out = '', pos = 0;
  for (let i = 0; i < p.length; i++) {
    const chunk = d.slice(pos, pos + p[i]);
    if (!chunk) break;
    out += (i > 0 ? '-' : '') + chunk;
    pos += p[i];
  }
  return out;
}

function formatTaxId(el) {
  const raw   = el.value.replace(/\D/g, '').slice(0, 13);
  el.dataset.raw = raw;                  // store raw digits
  el.value       = fmtTaxId(raw);        // display formatted

  const status = document.getElementById('taxIdStatus');
  if (raw.length === 0) {
    status.textContent = '';
  } else if (raw.length < 13) {
    status.textContent = `กรอกแล้ว ${raw.length}/13 หลัก`;
    status.style.color = 'var(--warning)';
  } else {
    status.textContent = '✓ ครบ 13 หลัก';
    status.style.color = 'var(--success)';
  }
}

function validatePhone(el) {
  const v = el.value;
  const status = document.getElementById('phoneStatus');
  if (!v.length) { status.textContent = ''; return; }
  if (v.length < 9) {
    status.textContent = `กรอกแล้ว ${v.length} หลัก (ต้องการ 9-10 หลัก)`;
    status.style.color = 'var(--warning)';
  } else {
    status.textContent = '✓ ถูกต้อง';
    status.style.color = 'var(--success)';
  }
}

// ════════════════════════════════════════════
//  GPS
// ════════════════════════════════════════════
function getGPS() {
  if (!navigator.geolocation) {
    showToast('อุปกรณ์ไม่รองรับ GPS', 'error');
    return;
  }
  const btn = document.getElementById('btnGps');
  const status = document.getElementById('gpsStatus');
  btn.disabled = true;
  btn.textContent = '⏳ กำลังจับ...';
  status.textContent = 'กำลังขอสัญญาณ GPS...';
  status.style.color = 'var(--warning)';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const acc = Math.round(pos.coords.accuracy);

      const coordsEl = document.getElementById('gpsCoords');
      coordsEl.value = `${lat},${lng}`;
      coordsEl.classList.add('auto-filled');

      status.textContent = `✓ ความแม่นยำ ±${acc} เมตร`;
      status.style.color = 'var(--success)';
      btn.disabled = false;
      btn.textContent = '📍 GPS';
      showToast(`จับพิกัดสำเร็จ: ${lat},${lng}`, 'success');
    },
    err => {
      const msgs = {
        1: 'ปฏิเสธการเข้าถึง GPS — กรุณาอนุญาตใน Settings',
        2: 'ไม่พบสัญญาณ GPS',
        3: 'หมดเวลา — ลองใหม่อีกครั้ง',
      };
      status.textContent = '⚠ ' + (msgs[err.code] || 'เกิดข้อผิดพลาด');
      status.style.color = 'var(--danger)';
      btn.disabled = false;
      btn.textContent = '📍 GPS';
      showToast(msgs[err.code] || 'GPS error', 'error');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
window.onload = async () => {
  // Restore dark mode
  if (localStorage.getItem('rattana_colgate_dark') === '1') {
    document.body.classList.add('dark');
    document.getElementById('btnDark').textContent = '☀️';
  }

  // Check existing session (expire after 30 days)
  const saved = localStorage.getItem('rattana_colgate_user');
  if (saved) {
    try {
      const { user, loginAt } = JSON.parse(saved);
      const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
      if (user && loginAt && (Date.now() - loginAt) < THIRTY_DAYS) {
        currentUser = user;
        const nick = currentUser['ชื่อเล่น'] || currentUser['ชื่อ-สกุล'] || 'User';
        document.getElementById('userAvatar').textContent = nick.charAt(0).toUpperCase();
        document.getElementById('userName').textContent = nick;
        document.getElementById('userChip').style.display = 'flex';
        document.getElementById('loginScreen').style.display = 'none';
        loadFromStorage();
        renderTable();
        await loadData();
        return;
      } else {
        // Session expired
        localStorage.removeItem('rattana_colgate_user');
      }
    } catch {}
  }

  // Show login — do NOT load app yet
  document.getElementById('loginScreen').style.display = 'flex';
  setTimeout(() => document.getElementById('loginEmail').focus(), 100);
};
