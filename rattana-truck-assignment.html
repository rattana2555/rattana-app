<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana กำหนดรถส่งร้านค้า v1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;--gold:#c9a84c;--gold-light:#e8c86a;--success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;--bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;--muted:#6b7896;--row-alt:#fafbfd;--radius-sm:6px;--radius-md:12px;--radius-lg:16px;--shadow-md:0 2px 8px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(13,27,62,.12);--shadow-gold:0 4px 12px rgba(201,168,76,.35)}
body.dark{--bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;--muted:#8a98b8;--row-alt:#0f1830}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-family:inherit;font-size:16px}

header{background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.logo-text{font-weight:700;font-size:15px;color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo-text span{color:var(--gold)}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.12)}

.content{padding:12px;max-width:1200px;margin:0 auto;width:100%;padding-bottom:80px}
@media(min-width:640px){.content{padding:16px;padding-bottom:80px}}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--card-bg);border-radius:var(--radius-md);padding:13px 14px;border:1px solid var(--border);border-top:3px solid var(--gold)}
.s-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:5px}
.s-value{font-size:22px;font-weight:700;line-height:1.2}
.s-sub{font-size:11px;color:var(--muted);margin-top:3px}

.filter-bar{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);padding:12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{flex:1;min-width:150px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:4px}
.input{height:40px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;width:100%;transition:border-color .15s}
.input:focus{border-color:var(--gold)}
select.input{cursor:pointer}

.card{background:var(--card-bg);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to right,rgba(201,168,76,.07),transparent)}
.card-head h3{font-size:14px;font-weight:700}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl thead{background:var(--navy);color:#fff;position:sticky;top:57px;z-index:5}
.tbl thead th{padding:9px 10px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.3px;white-space:nowrap;border-bottom:2px solid var(--gold);cursor:pointer;user-select:none}
.tbl thead th:hover{background:var(--navy-mid)}
.sort-ind{font-size:10px;color:var(--gold);margin-left:3px;font-weight:700}
.tbl tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr:hover{background:rgba(201,168,76,.07)}
.tbl td{padding:8px 10px;font-size:13px;vertical-align:middle}
.empty-row td{text-align:center;padding:40px;color:var(--muted)}

/* Truck pills */
.truck-pills{display:flex;flex-wrap:wrap;gap:4px}
.truck-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.truck-pill:hover{opacity:.85;transform:scale(1.04)}
.truck-pill.t4{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}
.truck-pill.t6{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}
.truck-pill.tnone{background:#f3f4f6;color:var(--muted);border-color:var(--border)}
.truck-pill.t4.sel{background:#1d4ed8;color:#fff;border-color:#1d4ed8;box-shadow:0 2px 8px rgba(29,78,216,.35)}
.truck-pill.t6.sel{background:#b91c1c;color:#fff;border-color:#b91c1c;box-shadow:0 2px 8px rgba(185,28,28,.35)}
.truck-pill.tnone.sel{background:var(--muted);color:#fff;border-color:var(--muted)}
body.dark .truck-pill.tnone{background:#1e2940}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid transparent;min-height:38px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;min-height:32px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e8f7ee;color:#1e8449}
body.dark .badge-ok{background:#1a3a25;color:#7be0a3}

#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spin-box{background:var(--card-bg);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;border-top:4px solid var(--gold);min-width:220px}
.spin-ring{width:46px;height:46px;border:5px solid #dde3f0;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
#loadBar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;transition:width .4s;z-index:10000}

.toast{position:fixed;bottom:max(88px,calc(72px + env(safe-area-inset-bottom)));right:16px;padding:11px 18px;border-radius:var(--radius-md);color:#fff;z-index:9999;animation:slideIn .3s ease;font-weight:500;box-shadow:var(--shadow-lg);max-width:90vw;font-size:13px}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}

.save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:2px solid var(--gold);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:80;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.save-info{font-size:12px;color:var(--muted)}
.save-info b{color:var(--text)}

#backToTop{position:fixed;bottom:max(70px,calc(60px + env(safe-area-inset-bottom)));right:16px;background:var(--gold);color:var(--navy);border:none;border-radius:50%;width:42px;height:42px;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow-gold);z-index:90;font-size:18px;font-weight:700;cursor:pointer}
#backToTop.show{display:flex}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<header>

<div class="content">

<!-- Save bar -->

  <div style="display:flex;gap:8px">
    <button class="btn btn-success" onclick="saveAll()">💾 บันทึกทั้งหมด</button>
  </div>

<script>
const SHEET_ID   = '1_QyRBMnUJM244i0yFOMGqWMW4iDVb86oX-SDPtxJ9pE';
const SHEET_NAME = 'Cus';
const STORE_KEY  = 'rattanaTruckAssign';
const TIME_KEY   = 'rattanaTruckAssign_time';

const TRUCKS = [
  { val:'รถ 4 ล้อ', cls:'t4', icon:'🚐' },
  { val:'รถ 6 ล้อ', cls:'t6', icon:'🚚' },
];

let allRows      = [];
let filteredRows = [];
let assignments  = {};
let sortState    = { key:'store', dir:'asc' };

/* ── Persist ──────────────────────────────── */
function loadAssignments() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; }
}
function saveAll() {
  localStorage.setItem(STORE_KEY, JSON.stringify(assignments));
  const t = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}.${String(t.getMinutes()).padStart(2,'0')} น. (${t.getDate()}/${t.getMonth()+1})`;
  localStorage.setItem(TIME_KEY, ts);
  document.getElementById('lastSave').textContent = ts;
  showToast('บันทึกเรียบร้อย ✓', 'success');
}

/* ── Spinner ──────────────────────────────── */
const showSpin = m => { document.getElementById('spinMsg').textContent = m||'กำลังโหลด...'; document.getElementById('spinner').classList.add('show'); };
const hideSpin = () => document.getElementById('spinner').classList.remove('show');

/* ── Toast ────────────────────────────────── */
function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ── CSV parser ───────────────────────────── */
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) { if (ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else inQ=false;}else cell+=ch; }
    else { if(ch==='"')inQ=true; else if(ch===','){row.push(cell);cell='';}else if(ch==='\r'){}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch; }
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  if(!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>Object.fromEntries(headers.map((k,i)=>[k,clean(r[i])])));
}

async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCsv(await res.text());
}

/* ── Key per store ────────────────────────── */
const rowKey = r => `${r.route}||${r.store}`;

/* ── Load ─────────────────────────────────── */
async function loadData() {
  showSpin('กำลังดึงข้อมูลร้านค้า...');
  document.getElementById('loadBar').style.width = '55%';
  try {
    const raw = await fetchSheet();
    assignments = loadAssignments();

    // Try multiple possible column name variations
    allRows = raw.map(r => ({
      route: r['ชื่อรูท'] || r['Route'] || r['รูท'] || '',
      store: r['ชื่อร้านค้า'] || r['Store'] || r['ร้านค้า'] || r['ชื่อร้าน'] || '',
      sales: r['เซลล์ผู้ดูแล'] || r['Sales'] || r['เซลล์'] || r['ผู้ดูแล'] || '',
    })).filter(r => r.store.trim());

    document.getElementById('loadBar').style.width = '100%';
    applyFilter();
    showToast(`โหลดสำเร็จ ${allRows.length} ร้านค้า ✓`, 'success');
  } catch(e) {
    showToast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
    document.getElementById('tblBody').innerHTML = '<tr class="empty-row"><td colspan="5">❌ โหลดไม่สำเร็จ กรุณารีเฟรช</td></tr>';
  } finally {
    hideSpin();
    setTimeout(() => document.getElementById('loadBar').style.width = '0', 500);
  }
}

/* ── Filter + Sort + Render ───────────────── */
function applyFilter() {
  const fR = document.getElementById('fRoute').value.toLowerCase();
  const fS = document.getElementById('fSales').value.toLowerCase();
  const fT = document.getElementById('fTruck').value;

  filteredRows = allRows.filter(r => {
    if (fR && !r.route.toLowerCase().includes(fR)) return false;
    if (fS && !r.sales.toLowerCase().includes(fS)) return false;
    if (fT) {
      const a = assignments[rowKey(r)] || '';
      if (fT === '__none__') return !a;
      return a === fT;
    }
    return true;
  });

  // Sort
  const dir = sortState.dir === 'asc' ? 1 : -1;
  filteredRows.sort((a, b) => String(a[sortState.key]||'').localeCompare(String(b[sortState.key]||''), 'th') * dir);

  renderTable();
  updateStats();
}

function renderTable() {
  const tbody = document.getElementById('tblBody');
  document.getElementById('rowCount').textContent = `${filteredRows.length} รายการ`;

  if (!filteredRows.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">ไม่พบข้อมูล</td></tr>';
    return;
  }

  tbody.innerHTML = filteredRows.map((r, i) => {
    const k = rowKey(r);
    const a = assignments[k] || '';
    const pills = TRUCKS.map(t => {
      const sel = a === t.val ? ' sel' : '';
      return `<span class="truck-pill ${t.cls}${sel}" onclick="assignTruck(this,'${esc(k)}','${t.val}')">${t.icon} ${t.val}</span>`;
    }).join('');
    const noneSel = !a ? ' sel' : '';
    const nonePill = `<span class="truck-pill tnone${noneSel}" onclick="assignTruck(this,'${esc(k)}','')">— ไม่กำหนด</span>`;
    return `<tr>
      <td style="font-size:11px;color:var(--muted);font-weight:600">${i+1}</td>
      <td style="font-size:12px">${r.route||'—'}</td>
      <td style="font-weight:600">${r.store}</td>
      <td style="font-size:12px;color:var(--muted)">${r.sales||'—'}</td>
      <td><div class="truck-pills">${pills}${nonePill}</div></td>
    </tr>`;
  }).join('');
}

function esc(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function assignTruck(el, key, val) {
  assignments[key] = val;
  const row = el.closest('tr');
  row.querySelectorAll('.truck-pill').forEach(p => p.classList.remove('sel'));
  el.classList.add('sel');
  updateStats();
}

/* ── Stats ────────────────────────────────── */
function updateStats() {
  const total = allRows.length;
  let assigned = 0, c4 = 0, c6 = 0;
  allRows.forEach(r => {
    const a = assignments[rowKey(r)] || '';
    if (a) assigned++;
    if (a === 'รถ 4 ล้อ') c4++;
    if (a === 'รถ 6 ล้อ') c6++;
  });
  const pct = total ? Math.round(assigned/total*100) : 0;
  document.getElementById('st-total').textContent    = total;
  document.getElementById('st-assigned').textContent = assigned;
  document.getElementById('st-pct').textContent      = `คิดเป็น ${pct}%`;
  document.getElementById('st-4').textContent        = c4;
  document.getElementById('st-6').textContent        = c6;
}

/* ── Export ───────────────────────────────── */
function exportExcel() {
  if (!allRows.length) { showToast('ไม่มีข้อมูลสำหรับ Export', 'error'); return; }
  const data = allRows.map(r => ({
    'ชื่อรูท':       r.route,
    'ชื่อร้านค้า':   r.store,
    'เซลล์ผู้ดูแล': r.sales,
    'ประเภทรถ':     assignments[rowKey(r)] || 'ยังไม่กำหนด',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:18},{wch:30},{wch:18},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'กำหนดรถส่ง');
  XLSX.writeFile(wb, 'rattana-กำหนดรถส่งร้านค้า.xlsx');
  showToast('Export Excel เรียบร้อย ✓', 'success');
}

/* ── Refresh ──────────────────────────────── */
async function refreshData() {
  const b = document.getElementById('btnRefresh');
  b.disabled = true; b.style.transform = 'rotate(360deg)'; b.style.transition = 'transform .6s';
  await loadData();
  b.disabled = false;
  setTimeout(() => { b.style.transform = ''; b.style.transition = ''; }, 700);
}

function clearFilter() {
  document.getElementById('fRoute').value = '';
  document.getElementById('fSales').value = '';
  document.getElementById('fTruck').value = '';
  applyFilter();
}

/* ── Sort headers ─────────────────────────── */
document.querySelectorAll('#mainTbl thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    else { sortState.key = key; sortState.dir = 'asc'; }
    document.querySelectorAll('#mainTbl .sort-ind').forEach(s => s.textContent = '');
    const ind = th.querySelector('.sort-ind');
    if (ind) ind.textContent = sortState.dir === 'asc' ? '▲' : '▼';
    applyFilter();
  });
});

/* ── Dark mode ────────────────────────────── */
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('rattanaDark2', document.body.classList.contains('dark') ? '1' : '0');
}
if (localStorage.getItem('rattanaDark2') === '1') document.body.classList.add('dark');

/* ── Back to top ──────────────────────────── */
window.addEventListener('scroll', () => {
  document.getElementById('backToTop').classList.toggle('show', window.scrollY > 300);
});

/* ── Init ─────────────────────────────────── */
const saved = localStorage.getItem(TIME_KEY);
if (saved) document.getElementById('lastSave').textContent = saved;
loadData();
</script>
</body>
