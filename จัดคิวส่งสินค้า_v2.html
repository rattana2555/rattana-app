<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>จัดคิวส่งสินค้า — ตัวอย่าง</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f3f7;--sur:#fff;--hdr:#1c2b3a;--acc:#0f6e56;--acc-lt:#e1f5ee;--acc-dk:#085041;
  --tx:#1c2b3a;--tx2:#5a6a7a;--tx3:#9aabb8;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.14);
  --warn-lt:#faeeda;--warn-dk:#854f0b;--err:#E24B4A;--err-lt:#FCEBEB;
  --ok:#1D9E75;--info:#185FA5;--info-lt:#E6F1FB;--r:12px;--r2:8px;--r3:20px
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Sarabun','Tahoma',sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;overscroll-behavior:none}
button{font-family:inherit;font-size:13px;padding:8px 16px;border-radius:var(--r2);border:1px solid var(--bd2);
  background:var(--sur);color:var(--tx);cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap}
button:hover{background:#f4f7fa}button:active{transform:scale(.97)}
#app{display:flex;flex-direction:column;min-height:100vh}
#hdr{background:var(--hdr);color:#fff;padding:0 14px;height:52px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#hdr h1{font-size:15px;font-weight:600;flex:1}
.htab{background:transparent;border:none;color:rgba(255,255,255,.55);font-size:12px;padding:5px 9px;border-radius:6px}
.htab.on{background:rgba(255,255,255,.15);color:#fff}
#hgear{background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px 8px}
#main{flex:1;padding:14px;max-width:960px;width:100%;margin:0 auto;padding-bottom:72px}
@media(min-width:640px){#main{padding:18px}}
#abar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bd);
  padding:8px 12px;gap:8px;z-index:90}
@media(max-width:639px){#abar{display:flex}}
#abar button{flex:1;font-size:13px;padding:10px}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.btn-p:hover{background:#0b5e49}
.btn-d{color:var(--err);border-color:rgba(226,75,74,.3)}
.tag{font-size:10px;padding:1px 7px;border-radius:var(--r3);flex-shrink:0;font-weight:600}
.tag-r{background:var(--info-lt);color:var(--info)}
.tag-d{background:var(--acc-lt);color:var(--acc-dk)}
.tag-e{background:var(--err-lt);color:var(--err)}
.tag-w{background:var(--warn-lt);color:var(--warn-dk)}
.foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.foot-i{font-size:12px;color:var(--tx3)}
.cb{margin-bottom:4px}
.cb-row{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin-bottom:2px}
.cb-track{height:5px;background:var(--bg);border-radius:2px;overflow:hidden}
.cb-fill{height:100%;border-radius:2px}

/* Dashboard */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.stat-box{background:var(--sur);border-radius:var(--r2);padding:14px 16px;border:1px solid var(--bd)}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--tx2);margin-top:4px}
.stat-box.green .stat-num{color:var(--ok)}
.stat-box.blue .stat-num{color:var(--info)}
.stat-box.orange .stat-num{color:#EF9F27}
.dc-grid{display:flex;flex-direction:column;gap:8px}
.dc{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.dc.no-bill{opacity:.55}
.dc-hdr{padding:13px 14px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;user-select:none}
.dc-hdr:active{background:#f8f9fb}
.dc-icon{width:40px;height:40px;border-radius:50%;background:var(--acc-lt);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dc-main{flex:1;min-width:0}
.dc-name{font-size:14px;font-weight:700}
.dc-sub{font-size:12px;color:var(--tx2);margin-top:2px}
.dc-right{text-align:right;flex-shrink:0}
.dc-count{font-size:20px;font-weight:800;line-height:1}
.dc-clbl{font-size:10px;color:var(--tx3)}
.dc-bars{padding:0 14px 12px}
.dc-body{border-top:1px solid var(--bd);background:#fafbfc}
.dc-body.hidden{display:none}
.dc-list{padding:10px 14px}
.dc-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.dc-row:last-child{border-bottom:none}
.dc-rno{font-weight:700;min-width:90px;font-size:12px;flex-shrink:0;color:var(--tx)}
.dc-actions{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;background:#fff}

/* Queue */
#cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:12px}
@media(max-width:480px){#cars-grid{grid-template-columns:repeat(2,1fr)}}
.cc{background:var(--sur);border-radius:var(--r);border:2px solid transparent;padding:12px;cursor:pointer;transition:border-color .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cc.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,110,86,.1)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.cc-name{font-size:13px;font-weight:700}
.cc-plate{font-size:11px;color:var(--tx2);margin-top:1px}
.cc-type{font-size:10px;color:var(--tx3);margin-top:1px}
.cbadge{font-size:10px;font-weight:700;padding:2px 7px;background:var(--acc-lt);color:var(--acc-dk);border-radius:var(--r3)}
#car-strip{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r2);padding:9px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cs-n{font-size:13px;font-weight:700}.cs-i{font-size:12px;color:var(--tx2)}
.cs-acts{margin-left:auto;display:flex;gap:6px}
#fbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fpill{font-size:12px;padding:5px 11px;border-radius:var(--r3);border:1px solid var(--bd2);background:var(--sur);color:var(--tx2)}
.fpill.on{background:var(--info-lt);color:var(--info);border-color:rgba(24,95,165,.3);font-weight:600}
#fcnt{margin-left:auto;font-size:12px;color:var(--tx3)}
#blist{display:flex;flex-direction:column;gap:4px}
.bi{display:flex;align-items:center;gap:10px;background:var(--sur);border-radius:var(--r2);border:1.5px solid var(--bd);padding:10px 12px;cursor:pointer;transition:all .15s;user-select:none}
.bi:active{transform:scale(.99)}
.bi.ok{background:var(--acc-lt);border-color:rgba(15,110,86,.25)}
.bi.other{opacity:.42;cursor:default}
.chk{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.bi-inf{flex:1;min-width:0}
.bi-r1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bi-no{font-size:13px;font-weight:700}
.bi-st{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.bi-its{font-size:11px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi-loc{font-size:10px;color:var(--tx3);margin-top:1px}
.bi-nums{text-align:right;flex-shrink:0}
.bi-kg{font-size:13px;font-weight:700}
.bi-m3{font-size:10px;color:var(--tx2)}
.bi-ocar{font-size:10px;color:var(--tx3);flex-shrink:0;text-align:right;max-width:60px;line-height:1.3}

/* demo banner */
.demo-bar{background:linear-gradient(135deg,#185FA5,#0f6e56);color:#fff;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-bar span{flex:1}
.demo-bar button{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff;font-size:12px;padding:5px 12px}
.demo-bar button:hover{background:rgba(255,255,255,.3)}

@media print{#hdr,#abar,#fbar,#cars-grid,#car-strip,.foot,.dc-actions,.demo-bar{display:none!important}
  .dc{break-inside:avoid;box-shadow:none;border:1px solid #ccc;margin-bottom:12px}
  .dc-body.hidden{display:block!important}}
</style>
</head>
<body>
<div id="app">
  <div class="demo-bar">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" style="flex-shrink:0"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
    <span>นี่คือข้อมูลตัวอย่าง (Demo) เพื่อแสดงหน้าตาแอปก่อนใช้งานจริง</span>
    <button onclick="alert('เวอร์ชั่นจริงต้องต่อ Google Sheet ที่ตั้งค่าเป็นสาธารณะก่อนครับ')">ใช้งานจริง →</button>
  </div>

  <div id="hdr">
    <svg style="width:20px;height:20px;flex-shrink:0" viewBox="0 0 24 24" fill="none">
      <rect x="1" y="6" width="16" height="12" rx="2" fill="rgba(255,255,255,.8)"/>
      <path d="M17 10h4l2 3v5h-6V10z" fill="rgba(255,255,255,.8)"/>
      <circle cx="6" cy="19" r="2.5" fill="var(--hdr)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/>
      <circle cx="19" cy="19" r="2.5" fill="var(--hdr)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/>
    </svg>
    <h1>จัดคิวส่งสินค้า</h1>
    <button class="htab on" onclick="setView('dash')">ภาพรวม</button>
    <button class="htab" onclick="setView('queue')">จัดคิว</button>
    <button id="hgear">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="rgba(255,255,255,.6)">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
  <div id="main"></div>
  <div id="abar">
    <button onclick="autoAssign()">แนะนำอัตโนมัติ</button>
    <button class="btn-d">ล้างคิว</button>
  </div>
</div>

<script>
// ── DEMO DATA ──────────────────────────────────────
const CARS = [
  {id:'806893',driver:'มนัส รักษาวงศ์',plate:'806893',type:'6 ล้อ HINO',maxWeightKg:9580,widthCm:221,lengthCm:485,heightCm:220},
  {id:'806991',driver:'ประสงค์ คำคุ้ม',plate:'806991',type:'10 ล้อ HINO',maxWeightKg:14200,widthCm:233,lengthCm:692,heightCm:253},
  {id:'805865',driver:'ขันติ บุญเฉลียว',plate:'805865',type:'12 ล้อ HINO',maxWeightKg:18000,widthCm:222,lengthCm:730,heightCm:225},
  {id:'บจ7437',driver:'ชยพล พูลศรี',plate:'บจ7437',type:'กระบะ VIGO',maxWeightKg:2000,widthCm:0,lengthCm:0,heightCm:0},
  {id:'บฉ1693',driver:'ภราดร สวนน้อย',plate:'บฉ1693',type:'4 ล้อจัมโบ้',maxWeightKg:4000,widthCm:175,lengthCm:320,heightCm:190},
];

const BILLS = [
  {billNo:'BK026904/00290',date:'24/4/2026',store:'บริษัท ไอรินลดา พาณิชย์ จำกัด',route:'ขุนพิทักษ์-ปราสาทสิทธิ์',delivDay:'พุธ',district:'เมืองสมุทรสาคร',province:'สมุทรสาคร',totalWeight:3840,totalVolM3:2.1,items:'ติ่งฟง น้ำแอปเปิ้ล ×72, ติ่งฟง น้ำองุ่น ×48'},
  {billNo:'BK026904/00291',date:'24/4/2026',store:'ร้าน เจ้ต้อย (ร้านสมควร)',route:'ขุนพิทักษ์-ปราสาทสิทธิ์',delivDay:'พุธ',district:'สวนส้ม',province:'สมุทรสาคร',totalWeight:2800,totalVolM3:1.8,items:'กระทิงแดง 150มล. ×2800'},
  {billNo:'BK026904/00292',date:'24/4/2026',store:'คุณ แหม่ม (สว่างกิจ)',route:'ปากท่อ-ปราโมทย์',delivDay:'เสาร์',district:'ปากท่อ',province:'ราชบุรี',totalWeight:1450,totalVolM3:0.9,items:'ชาช่า เมล็ดทานตะวัน ×408'},
  {billNo:'BK026904/00293',date:'24/4/2026',store:'ร้าน เจ้เล็ก ด่านใน',route:'ปากท่อ-ปราโมทย์',delivDay:'เสาร์',district:'ปากท่อ',province:'ราชบุรี',totalWeight:980,totalVolM3:0.6,items:'มิตรผล น้ำตาลทราย 1กก. ×200'},
  {billNo:'BK026904/00294',date:'24/4/2026',store:'ร้าน เจนบริการ',route:'กระดังงา-บางคนที',delivDay:'จันทร์',district:'บางคนที',province:'สมุทรสงคราม',totalWeight:2200,totalVolM3:1.4,items:'มิตรผล น้ำตาลทรายขาว 50กก. ×10, อัมรินทร์ทิพย์ เกล็ดขนม ×50'},
  {billNo:'BV976904/00167',date:'4/5/2026',store:'บริษัท น้อยเบเกอรี่ จำกัด',route:'บางแค-บางสแก',delivDay:'ศุกร์',district:'บางแค',province:'สมุทรสาคร',totalWeight:1680,totalVolM3:1.1,items:'เฮลบลูบอยเขียว710 ×120'},
  {billNo:'BV976904/00168',date:'4/5/2026',store:'ร้านอาหารเต็มสูตร',route:'บางแค-บางสแก',delivDay:'ศุกร์',district:'บ้านแพ้ว',province:'สมุทรสาคร',totalWeight:760,totalVolM3:0.5,items:'คริสตัล น้ำดื่ม 600มล. ×240'},
  {billNo:'BV976904/00169',date:'4/5/2026',store:'บริษัท อ.วัฒนากิจ จำกัด',route:'ดอนทราย',delivDay:'พุธ',district:'ดอนทราย',province:'ราชบุรี',totalWeight:3200,totalVolM3:2.5,items:'1113101@คาร์เนชั่น นมข้น ×480'},
  {billNo:'BV976904/00170',date:'4/5/2026',store:'ร้านมิ่งมิตร',route:'คลองกระซ้า-บางจะเกร็ง',delivDay:'จันทร์',district:'บางจะเกร็ง',province:'สมุทรสงคราม',totalWeight:540,totalVolM3:0.4,items:'ชาช่า เมล็ดทานตะวัน 30ก. ×96'},
  {billNo:'BV976904/00171',date:'4/5/2026',store:'ร้าน ลุงสำรวย(ดอนไผ่)',route:'กระดังงา-บางคนที',delivDay:'จันทร์',district:'กระดังงา',province:'สมุทรสงคราม',totalWeight:1100,totalVolM3:0.8,items:'มิตรผล น้ำตาลทรายแดง 1กก. ×300'},
];

const ASSIGN = {
  '806893': ['BK026904/00290','BK026904/00291','BK026904/00292'],
  '806991': ['BK026904/00293','BK026904/00294','BV976904/00169'],
  '805865': ['BV976904/00167','BV976904/00168','BV976904/00170'],
  'บจ7437': [],
  'บฉ1693': [],
};

let S={selCar:'806893',assign:JSON.parse(JSON.stringify(ASSIGN)),fRoute:'all',view:'dash',exp:{}};

function getStat(id){
  const car=CARS.find(c=>c.id===id);if(!car)return{};
  const bs=(S.assign[id]||[]).map(no=>BILLS.find(b=>b.billNo===no)).filter(Boolean);
  const uw=bs.reduce((s,b)=>s+b.totalWeight,0);
  const uv=bs.reduce((s,b)=>s+b.totalVolM3,0);
  const mw=car.maxWeightKg,mv=car.widthCm*car.lengthCm*car.heightCm/1e6;
  return{uw,uv,mw,mv,wp:mw?Math.min(100,uw/mw*100):0,vp:mv?Math.min(100,uv/mv*100):0,n:bs.length,bills:bs};
}
function assignedTo(no){return Object.entries(S.assign).find(([,bs])=>bs.includes(no))?.[0]||null;}
function getRoutes(){return[...new Set(BILLS.map(b=>b.route).filter(Boolean))].sort();}

function selCar(id){S.selCar=id;renderC();}
function setView(v){
  S.view=v;
  document.querySelectorAll('.htab').forEach(t=>t.classList.toggle('on',
    (v==='dash'&&t.textContent==='ภาพรวม')||(v==='queue'&&t.textContent==='จัดคิว')));
  document.getElementById('abar').style.display=v==='queue'?'':'none';
  renderC();
}
function setRoute(r){S.fRoute=r;renderC();}
function toggleBill(no){
  const prev=assignedTo(no);
  Object.keys(S.assign).forEach(c=>{S.assign[c]=S.assign[c].filter(b=>b!==no);});
  if(prev!==S.selCar)S.assign[S.selCar]=[...(S.assign[S.selCar]||[]),no];
  const sy=window.scrollY;renderC();requestAnimationFrame(()=>window.scrollTo(0,sy));
}
function toggleExp(id){S.exp[id]=!S.exp[id];renderC();}
function autoAssign(){
  const st=getStat(S.selCar);
  let rw=(st.mw||1e9)-st.uw,rv=(st.mv||1e9)-st.uv;
  const pool=BILLS.filter(b=>S.fRoute==='all'||b.route===S.fRoute).filter(b=>!assignedTo(b.billNo)).sort((a,b)=>a.totalWeight-b.totalWeight);
  const add=[];
  pool.forEach(b=>{if(b.totalWeight<=rw&&(!st.mv||b.totalVolM3<=rv)){add.push(b.billNo);rw-=b.totalWeight;rv-=b.totalVolM3;}});
  if(!add.length){alert('ไม่มีบิลที่เพิ่มได้แล้ว');return;}
  S.assign[S.selCar]=[...(S.assign[S.selCar]||[]),...add];
  renderC();
}

function renderC(){
  const el=document.getElementById('main');
  if(S.view==='queue'){el.innerHTML=qHTML();document.getElementById('blist')?.addEventListener('click',e=>{const item=e.target.closest('.bi');if(item&&!item.classList.contains('other'))toggleBill(item.dataset.no);});return;}
  el.innerHTML=dashHTML();
}

function capB(label,used,max,unit,pct){
  const col=pct>100?'#E24B4A':pct>90?'#E24B4A':pct>70?'#EF9F27':'#1D9E75';
  const u=unit==='kg'?f1(used):f2(used),m=unit==='kg'?f0(max):f2(max);
  return`<div class="cb"><div class="cb-row"><span>${label}</span><span style="${pct>100?'color:#E24B4A;font-weight:700':''}">${u}/${m} ${unit}${pct>100?' ⚠️':''}</span></div>
    <div class="cb-track"><div class="cb-fill" style="width:${Math.min(100,pct||0).toFixed(1)}%;background:${col};height:100%;border-radius:2px"></div></div></div>`;
}

function dashHTML(){
  const total=BILLS.length,assigned=Object.values(S.assign).flat().length,unas=total-assigned;
  const cwb=CARS.filter(c=>(S.assign[c.id]||[]).length>0).length;
  let h=`<div class="dash-stats">
    <div class="stat-box green"><div class="stat-num">${assigned}</div><div class="stat-lbl">บิลจัดแล้ว</div></div>
    <div class="stat-box${unas>0?' orange':' green'}"><div class="stat-num">${unas}</div><div class="stat-lbl">ยังไม่จัด</div></div>
    <div class="stat-box blue"><div class="stat-num">${cwb}</div><div class="stat-lbl">รถที่มีงาน</div></div>
    <div class="stat-box"><div class="stat-num">${CARS.length}</div><div class="stat-lbl">รถทั้งหมด</div></div>
  </div><div class="dc-grid">`;

  CARS.forEach(car=>{
    const st=getStat(car.id),bills=st.bills||[],exp=S.exp[car.id];
    const oW=st.mw>0&&st.uw>st.mw,oV=st.mv>0&&st.uv>st.mv;
    const routes=[...new Set(bills.map(b=>b.route).filter(Boolean))];
    h+=`<div class="dc${bills.length===0?' no-bill':''}">
      <div class="dc-hdr" onclick="toggleExp('${car.id}')">
        <div class="dc-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="1" y="6" width="16" height="12" rx="2" fill="${bills.length?'#0f6e56':'#9aabb8'}"/>
            <path d="M17 10h4l2 3v5h-6V10z" fill="${bills.length?'#0f6e56':'#9aabb8'}"/>
            <circle cx="6" cy="19" r="2.5" fill="white" stroke="${bills.length?'#0f6e56':'#9aabb8'}" stroke-width="1.5"/>
            <circle cx="19" cy="19" r="2.5" fill="white" stroke="${bills.length?'#0f6e56':'#9aabb8'}" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="dc-main">
          <div class="dc-name">${car.driver} <span style="font-size:11px;font-weight:400;color:var(--tx2)">${car.plate}</span></div>
          <div class="dc-sub">${car.type}${car.maxWeightKg?` · ${f0(car.maxWeightKg)} kg`:''}</div>
          ${bills.length>0?`<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
            ${routes.map(r=>`<span class="tag tag-r">${r}</span>`).join('')}
            ${oW||oV?`<span class="tag tag-e">⚠️ ${oW?'น้ำหนักเกิน':''}${oW&&oV?'/':''}${oV?'ปริมาตรเกิน':''}</span>`:''}
          </div>`:''}
        </div>
        <div class="dc-right">
          <div class="dc-count" style="color:${bills.length?'var(--acc)':'var(--tx3)'}">${bills.length||'-'}</div>
          <div class="dc-clbl">บิล</div>
          <div style="font-size:14px;margin-top:2px;color:var(--tx3)">${exp?'▲':'▼'}</div>
        </div>
      </div>
      ${bills.length>0?`<div class="dc-bars">${capB('น้ำหนัก',st.uw,st.mw,'kg',st.wp)}${capB('ปริมาตร',st.uv,st.mv,'m³',st.vp)}</div>`:''}
      <div class="dc-body${exp?'':' hidden'}">
        ${bills.length===0
          ?`<div style="padding:12px 14px;font-size:13px;color:var(--tx3)">ยังไม่มีบิล — กด "จัดคิว" เพื่อเพิ่มบิล</div>`
          :`<div class="dc-list">${bills.map((b,i)=>`<div class="dc-row">
              <span class="dc-rno">${i+1}. ${b.billNo}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.store}</div>
                <div style="font-size:11px;color:var(--tx3)">${b.district} ${b.province}</div>
                ${b.route?`<span class="tag tag-r" style="margin-top:2px;display:inline-block">${b.route}</span>`:''}
                ${b.delivDay?`<span class="tag tag-d" style="margin-top:2px;display:inline-block;margin-left:3px">${b.delivDay}</span>`:''}
              </div>
              <div style="text-align:right;flex-shrink:0;font-size:12px;font-weight:600">${f1(b.totalWeight)} kg<br><span style="font-weight:400;color:var(--tx3)">${f3(b.totalVolM3)} m³</span></div>
            </div>`).join('')}</div>`}
        <div class="dc-actions">
          <button onclick="S.selCar='${car.id}';setView('queue')" style="font-size:12px;padding:6px 12px">✏️ จัดคิว</button>
          ${bills.length>0?`<button style="font-size:12px;padding:6px 12px;background:var(--acc);color:#fff;border-color:var(--acc)" onclick="alert('พิมพ์ใบงาน ${car.driver}\\n${bills.length} บิล · ${f1(st.uw)} kg · ${f2(st.uv)} m³')">🖨️ พิมพ์ใบงาน</button>
          <button style="font-size:12px;padding:6px 12px" class="btn-d" onclick="if(confirm('ล้างคิว?')){S.assign['${car.id}']=[];renderC();}">ล้างคิว</button>`:''}
        </div>
      </div>
    </div>`;
  });
  h+=`</div>`;

  const unasB=BILLS.filter(b=>!assignedTo(b.billNo));
  if(unasB.length){
    h+=`<div style="margin-top:12px;background:var(--err-lt);border-radius:var(--r2);border:1px solid rgba(226,75,74,.2);overflow:hidden">
      <div style="padding:10px 14px;font-size:13px;font-weight:700;color:var(--err)">⚠️ บิลยังไม่ได้จัด (${unasB.length} ใบ)</div>
      <div style="padding:0 14px 10px;display:flex;flex-direction:column;gap:2px">
      ${unasB.map(b=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(226,75,74,.1)">
        <span style="font-weight:700;min-width:100px;flex-shrink:0">${b.billNo}</span>
        <span style="flex:1;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.store}</span>
        <span class="tag tag-r">${b.route}</span>
        <span style="color:var(--tx3);font-size:11px;flex-shrink:0">${b.district}</span>
        <span style="font-weight:600;flex-shrink:0">${f1(b.totalWeight)} kg</span>
      </div>`).join('')}</div></div>`;
  } else {
    h+=`<div style="margin-top:12px;background:var(--acc-lt);border-radius:var(--r2);padding:12px 14px;font-size:13px;color:var(--acc-dk)">✅ บิลทั้งหมด ${BILLS.length} ใบ ถูกจัดครบแล้ว</div>`;
  }

  h+=`<div class="foot"><span></span><span class="foot-i">${BILLS.length} บิล (ตัวอย่าง) · ${CARS.length} คัน</span></div>`;
  return h;
}

function qHTML(){
  const routes=getRoutes();
  const filt=S.fRoute==='all'?BILLS:BILLS.filter(b=>b.route===S.fRoute);
  const car=CARS.find(c=>c.id===S.selCar);
  let h=`<div id="cars-grid">`;
  CARS.forEach(c=>{
    const st=getStat(c.id),sel=c.id===S.selCar;
    h+=`<div class="cc${sel?' sel':''}" onclick="selCar('${c.id}')">
      <div class="cc-top"><div>
        <div class="cc-name">${c.driver}</div>
        <div class="cc-plate">${c.plate}</div>
        <div class="cc-type">${c.type}</div>
      </div>${st.n?`<span class="cbadge">${st.n}</span>`:''}</div>
      ${capB('น้ำหนัก',st.uw,st.mw,'kg',st.wp)}${capB('ปริมาตร',st.uv,st.mv,'m³',st.vp)}
    </div>`;
  });
  h+=`</div>`;
  if(car){
    const st=getStat(car.id);
    h+=`<div id="car-strip">
      <span class="cs-n">${car.driver}</span>
      <span class="cs-i">${car.plate}</span>
      <span class="cs-i">${car.type}</span>
      ${car.maxWeightKg?`<span class="cs-i">บรรทุก ${f0(car.maxWeightKg)} kg</span>`:''}
      ${car.widthCm?`<span class="cs-i">${car.widthCm}×${car.lengthCm}×${car.heightCm} cm</span>`:''}
      <div class="cs-acts">
        <button style="font-size:12px;padding:6px 12px" onclick="autoAssign()">แนะนำอัตโนมัติ</button>
        <button style="font-size:12px;padding:6px 12px;background:var(--acc);color:#fff;border-color:var(--acc)">🖨️ พิมพ์</button>
        <button style="font-size:12px;padding:6px 12px" class="btn-d" onclick="if(confirm('ล้างคิว?')){S.assign[S.selCar]=[];renderC();}">ล้างคิว</button>
      </div>
    </div>`;
  }
  h+=`<div id="fbar">`;
  ['all',...routes].forEach(r=>{
    h+=`<button class="fpill${S.fRoute===r?' on':''}" onclick="setRoute('${r}')">${r==='all'?'ทุกรูท':r}</button>`;
  });
  h+=`<span id="fcnt">${filt.length} บิล</span></div>`;
  h+=`<div id="blist">`;
  filt.forEach(bill=>{
    const at=assignedTo(bill.billNo),isSel=at===S.selCar,isOth=at&&!isSel;
    const oCar=isOth?CARS.find(c=>c.id===at):null;
    h+=`<div class="bi${isSel?' ok':''}${isOth?' other':''}" data-no="${bill.billNo}">
      <div class="chk${isSel?' on':''}">${isSel?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</div>
      <div class="bi-inf">
        <div class="bi-r1">
          <span class="bi-no">${bill.billNo}</span>
          <span class="bi-st">${bill.store}</span>
          ${bill.route?`<span class="tag tag-r">${bill.route}</span>`:''}
          ${bill.delivDay?`<span class="tag tag-d">${bill.delivDay}</span>`:''}
        </div>
        <div class="bi-its">${bill.items}</div>
        <div class="bi-loc">${bill.district} · ${bill.province}</div>
      </div>
      <div class="bi-nums">
        <div class="bi-kg">${f1(bill.totalWeight)} kg</div>
        <div class="bi-m3">${f3(bill.totalVolM3)} m³</div>
      </div>
      ${isOth?`<div class="bi-ocar">${oCar?.driver||at}</div>`:''}
    </div>`;
  });
  h+=`</div><div class="foot"><span></span><span class="foot-i">ข้อมูลตัวอย่าง · ${BILLS.length} บิล · ${CARS.length} คัน</span></div>`;
  return h;
}

function f0(n){return Math.round(+n||0).toLocaleString();}
function f1(n){return(+n||0).toFixed(1);}
function f2(n){return(+n||0).toFixed(2);}
function f3(n){return(+n||0).toFixed(3);}

renderC();
</script>
</body>
</html>
