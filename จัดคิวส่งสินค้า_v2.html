<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>จัดคิวส่งสินค้า</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f3f7;--sur:#fff;--hdr:#1c2b3a;--acc:#0f6e56;--acc-lt:#e1f5ee;--acc-dk:#085041;
  --tx:#1c2b3a;--tx2:#5a6a7a;--tx3:#9aabb8;--bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.14);
  --warn-lt:#faeeda;--warn-dk:#854f0b;--err:#E24B4A;--err-lt:#FCEBEB;
  --ok:#1D9E75;--info:#185FA5;--info-lt:#E6F1FB;--r:12px;--r2:8px;--r3:20px
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai','Sarabun','Tahoma',sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;overscroll-behavior:none}
button{font-family:inherit;font-size:13px;padding:8px 16px;border-radius:var(--r2);border:1px solid var(--bd2);
  background:var(--sur);color:var(--tx);cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap}
button:hover{background:#f4f7fa}button:active{transform:scale(.97)}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border-radius:var(--r2);
  border:1px solid var(--bd2);background:var(--sur);color:var(--tx);width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,110,86,.12)}
#app{display:flex;flex-direction:column;min-height:100vh}
#hdr{background:var(--hdr);color:#fff;padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#hdr h1{font-size:15px;font-weight:600;flex:1}
.htab{background:transparent;border:none;color:rgba(255,255,255,.55);font-size:13px;padding:6px 10px;border-radius:6px}
.htab.on{background:rgba(255,255,255,.15);color:#fff}
#hgear{background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px 8px;line-height:1}
#main{flex:1;padding:12px;max-width:960px;width:100%;margin:0 auto;padding-bottom:72px}
@media(min-width:640px){#main{padding:16px;padding-bottom:16px}}
.setup-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh}
.sc{background:var(--sur);border-radius:var(--r);padding:24px 20px;width:100%;max-width:440px;border:1px solid var(--bd);box-shadow:0 2px 16px rgba(0,0,0,.06)}
.si{width:48px;height:48px;margin:0 auto 14px}
.st{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.ss{color:var(--tx2);font-size:13px;text-align:center;margin-bottom:18px}
.steps{background:#f0f8ff;border-radius:var(--r2);border:1px solid rgba(24,95,165,.15);padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--tx2);line-height:2.2}
.steps strong{color:var(--tx)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:11px;color:var(--tx3);margin-top:4px;line-height:1.5}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);font-size:14px;padding:12px 20px;width:100%;font-weight:700}
.btn-p:hover{background:#0b5e49}
.btn-d{color:var(--err);border-color:rgba(226,75,74,.3)}
details summary{cursor:pointer;color:var(--acc);font-size:13px;padding:4px 0;user-select:none}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.cgrid{grid-template-columns:1fr}}
#cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:12px}
@media(max-width:480px){#cars-grid{grid-template-columns:repeat(2,1fr)}}
.cc{background:var(--sur);border-radius:var(--r);border:2px solid transparent;padding:12px;cursor:pointer;transition:border-color .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cc:active{transform:scale(.98)}
.cc.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,110,86,.1)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.cc-name{font-size:13px;font-weight:700}
.cc-plate{font-size:11px;color:var(--tx2);margin-top:1px}
.cc-type{font-size:10px;color:var(--tx3);margin-top:1px}
.cbadge{font-size:10px;font-weight:700;padding:2px 7px;background:var(--acc-lt);color:var(--acc-dk);border-radius:var(--r3)}
.cb{margin-bottom:5px}
.cb-row{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin-bottom:2px}
.cb-track{height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.cb-fill{height:100%;border-radius:2px;transition:width .3s,background .3s}
#car-strip{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r2);padding:9px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cs-n{font-size:13px;font-weight:700}
.cs-i{font-size:12px;color:var(--tx2)}
.cs-acts{margin-left:auto;display:flex;gap:6px}
#fbar,#dbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.fpill,.dpill{font-size:12px;padding:5px 11px;border-radius:var(--r3);border:1px solid var(--bd2);background:var(--sur);color:var(--tx2);transition:all .15s}
.fpill.on,.dpill.on{background:var(--info-lt);color:var(--info);border-color:rgba(24,95,165,.3);font-weight:600}
.dpill{font-size:11px;padding:4px 10px}
#fcnt{margin-left:auto;font-size:12px;color:var(--tx3)}
#blist{display:flex;flex-direction:column;gap:4px}
.bi{display:flex;align-items:center;gap:10px;background:var(--sur);border-radius:var(--r2);border:1.5px solid var(--bd);padding:10px 12px;cursor:pointer;transition:all .15s;user-select:none}
.bi:active{transform:scale(.99)}
.bi.ok{background:var(--acc-lt);border-color:rgba(15,110,86,.25)}
.bi.other{opacity:.42;cursor:default}
.chk{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--bd2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.bi-inf{flex:1;min-width:0}
.bi-r1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bi-no{font-size:13px;font-weight:700}
.bi-st{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.rtag{font-size:10px;padding:1px 7px;background:var(--info-lt);color:var(--info);border-radius:var(--r3);flex-shrink:0;font-weight:600}
.dtag{font-size:10px;padding:1px 7px;background:var(--acc-lt);color:var(--acc-dk);border-radius:var(--r3);flex-shrink:0}
.wtag{font-size:10px;padding:1px 7px;background:var(--warn-lt);color:var(--warn-dk);border-radius:var(--r3);flex-shrink:0}
.bi-its{font-size:11px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi-loc{font-size:10px;color:var(--tx3);margin-top:1px}
.bi-nums{text-align:right;flex-shrink:0}
.bi-kg{font-size:13px;font-weight:700}
.bi-m3{font-size:10px;color:var(--tx2)}
.bi-ocar{font-size:10px;color:var(--tx3);flex-shrink:0;text-align:right;max-width:60px;line-height:1.3}
.empty{text-align:center;color:var(--tx3);font-size:14px;padding:3rem 1rem}
#abar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bd);padding:8px 12px;gap:8px;z-index:90;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
@media(max-width:639px){#abar{display:flex}}
#abar button{flex:1;font-size:13px;padding:10px}
.rc{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:10px;overflow:hidden}
.rc-hdr{background:#f7f9fb;padding:11px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--bd)}
.rc-name{font-size:14px;font-weight:700}
.rc-stat{font-size:12px;color:var(--tx2)}
.rc.unas{border-color:rgba(226,75,74,.25)}
.rc.unas .rc-hdr{background:var(--err-lt)}
.rc.unas .rc-name{color:var(--err)}
.rrow{display:flex;gap:10px;padding:7px 14px;border-bottom:1px solid var(--bd);align-items:center}
.rrow:last-child{border-bottom:none}
.rno{font-weight:700;min-width:100px;font-size:12px;flex-shrink:0}
.rst{flex:1;font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rloc{font-size:11px;color:var(--tx3);flex-shrink:0;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkg{font-size:12px;flex-shrink:0;font-weight:600;margin-left:auto}
.pbt{background:var(--acc);color:#fff;border-color:var(--acc)}
.pbt:hover{background:#0b5e49}
.load-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center}
.spin{width:36px;height:36px;border:3px solid var(--bd2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ebox{background:var(--err-lt);border:1px solid rgba(226,75,74,.3);color:var(--err);padding:12px 16px;border-radius:var(--r2);font-size:13px;max-width:380px;white-space:pre-wrap}
#sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
#sov.open{display:flex}
#sp{background:var(--sur);border-radius:var(--r) var(--r) 0 0;padding:20px 16px 36px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
@media(min-width:640px){#sov{align-items:center}#sp{border-radius:var(--r);max-height:85vh}}
.sp-t{font-size:16px;font-weight:700;margin-bottom:16px}
.divider{height:1px;background:var(--bd);margin:14px 0}
.foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.foot-i{font-size:12px;color:var(--tx3)}
@media print{#hdr,#abar,#fbar,#dbar,#cars-grid,#car-strip,#reload-btn,.pbt,.foot,#hgear,details{display:none!important}.rc{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <svg style="width:22px;height:22px;flex-shrink:0" viewBox="0 0 24 24" fill="none">
      <rect x="1" y="6" width="16" height="12" rx="2" fill="rgba(255,255,255,.8)"/>
      <path d="M17 10h4l2 3v5h-6V10z" fill="rgba(255,255,255,.8)"/>
      <circle cx="6" cy="19" r="2.5" fill="var(--hdr)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/>
      <circle cx="19" cy="19" r="2.5" fill="var(--hdr)" stroke="rgba(255,255,255,.8)" stroke-width="1.5"/>
    </svg>
    <h1>จัดคิวส่งสินค้า</h1>
    <button class="htab on" onclick="setView('queue')">คิวรถ</button>
    <button class="htab" onclick="setView('report')">รายงาน</button>
    <button id="hgear" onclick="openS()">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
  <div id="main"></div>
  <div id="abar">
    <button onclick="autoAssign()">แนะนำอัตโนมัติ</button>
    <button onclick="clearCar()" class="btn-d">ล้างคิว</button>
  </div>
</div>

<div id="sov" onclick="closeSovOut(event)">
  <div id="sp">
    <div class="sp-t">ตั้งค่า</div>
    <div class="fld"><label>Google Sheet URL</label>
      <input type="url" id="s-url" placeholder="https://docs.google.com/spreadsheets/d/..."/>
      <p class="hint">Sheet ต้องตั้งค่าเป็น "ใครก็ตามที่มีลิงก์" → "ผู้ดู" ก่อน</p>
    </div>
    <details style="margin-bottom:14px">
      <summary>ชื่อชีท (ค่าเริ่มต้น: Bill DS / Product / Route / Car)</summary>
      <div style="margin-top:10px" class="cgrid">
        <div class="fld"><label>บิล</label><input id="s-b" placeholder="Bill DS"/></div>
        <div class="fld"><label>สินค้า</label><input id="s-p" placeholder="Product"/></div>
        <div class="fld"><label>รูท</label><input id="s-r" placeholder="Route"/></div>
        <div class="fld"><label>รถ</label><input id="s-c" placeholder="Car"/></div>
      </div>
    </details>
    <div class="divider"></div>
    <div style="display:flex;gap:8px">
      <button class="btn-p" style="flex:1" onclick="saveS()">บันทึกและโหลด</button>
      <button onclick="closeS()">ยกเลิก</button>
      <button onclick="resetAll()" class="btn-d">รีเซ็ต</button>
    </div>
  </div>
</div>

<script>
const S={cfg:null,data:null,eb:[],loading:false,error:null,selCar:null,assign:{},fRoute:'all',fDate:'all',view:'queue'};

function init(){
  const c=ls('dq_cfg');
  if(c){S.cfg=c;const a=ls('dq_assign');if(a)S.assign=a;loadData();}
  else render();
}
function openS(){if(S.cfg){qi('s-url').value=S.cfg.sheetUrl||'';qi('s-b').value=S.cfg.bs||'';qi('s-p').value=S.cfg.ps||'';qi('s-r').value=S.cfg.rs||'';qi('s-c').value=S.cfg.cs||'';}qi('sov').classList.add('open');}
function closeS(){qi('sov').classList.remove('open');}
function closeSovOut(e){if(e.target.id==='sov')closeS();}
function saveS(){const u=qi('s-url').value.trim();if(!u){alert('กรุณาใส่ URL');return;}S.cfg={sheetUrl:u,bs:qi('s-b').value.trim()||'Bill DS',ps:qi('s-p').value.trim()||'Product',rs:qi('s-r').value.trim()||'Route',cs:qi('s-c').value.trim()||'Car'};sv('dq_cfg',S.cfg);closeS();loadData();}
function resetAll(){if(!confirm('ล้างข้อมูลทั้งหมด?'))return;localStorage.removeItem('dq_cfg');localStorage.removeItem('dq_assign');Object.assign(S,{cfg:null,data:null,eb:[],loading:false,error:null,selCar:null,assign:{},fRoute:'all',fDate:'all',view:'queue'});closeS();render();}

function sheetId(url){const m=(url||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:null;}
function csvUrl(id,name){return`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;}
async function fetchCSV(id,name){const res=await fetch(csvUrl(id,name));if(!res.ok)throw new Error(`โหลดชีท "${name}" ไม่สำเร็จ (${res.status})\nตรวจสอบชื่อชีทและการตั้งค่าสาธารณะ`);return res.text();}
function pcsv(text){return Papa.parse(text,{skipEmptyLines:false}).data;}

function fc(headers,...hints){
  const h=headers.map(x=>(x||'').toString().toLowerCase().trim().replace(/\s+/g,' '));
  for(const hint of hints){const hl=hint.toLowerCase().trim();let i=h.findIndex(x=>x===hl);if(i===-1)i=h.findIndex(x=>x.includes(hl));if(i!==-1)return i;}
  return -1;
}
function cv(r,i,d=''){return i>=0&&i<r.length?((r[i]||'').toString().trim()||d):d;}
function cn(r,i){return i>=0?parseFloat((r[i]||'').toString().replace(/,/g,''))||0:0;}

// ── Bill DS ──────────────────────────────────────────────────
// DI_DATE | DI_REF | AR_CODE | AR_NAME | SLMN_CODE | WL_CODE | TRD_SH_CODE | SKU_NAME | TRD_UTQNAME | EA | TRD_G_AMT | DI_REMARK | ADDB_SUB_DISTRICT | ADDB_DISTRICT | ADDB_PROVINCE
function parseBills(rows){
  const map={};
  let cDate=-1,cRef=-1,cAR=-1,cAN=-1,cSKU=-1,cSN=-1,cUnit=-1,cEA=-1,cDistrict=-1,cProvince=-1;
  rows.forEach(r=>{
    if(!r.length||r.every(x=>!x))return;
    if(r.some(x=>(x||'').toString().toUpperCase()==='DI_DATE')){
      cDate=fc(r,'di_date');cRef=fc(r,'di_ref');cAR=fc(r,'ar_code');cAN=fc(r,'ar_name');
      cSKU=fc(r,'trd_sh_code');cSN=fc(r,'sku_name');cUnit=fc(r,'trd_utqname');cEA=fc(r,'ea');
      cDistrict=fc(r,'addb_district');cProvince=fc(r,'addb_province');
      return;
    }
    if(cRef===-1)return;
    const bno=cv(r,cRef);
    if(!bno||bno.length<3)return;
    if(!map[bno])map[bno]={billNo:bno,date:cv(r,cDate),arCode:cv(r,cAR),store:cv(r,cAN),route:'',items:[],district:cv(r,cDistrict),province:cv(r,cProvince)};
    const sku=cv(r,cSKU),sn=cv(r,cSN),ea=cn(r,cEA),unit=cv(r,cUnit);
    if(sku||sn)map[bno].items.push({sku,name:sn||sku,qty:ea||1,unit});
  });
  return Object.values(map);
}

// ── Product ──────────────────────────────────────────────────
// ชื่อสินค้า | ก*ย*ส EA | นน. EA | ปริมาตร EA
function parseProducts(rows){
  let cName=-1,cVol=-1,cWt=-1;
  const list=[];
  rows.forEach(r=>{
    if(!r.length||r.every(x=>!x))return;
    if(r.some(x=>(x||'').toString().includes('ชื่อสินค้า'))){
      cName=fc(r,'ชื่อสินค้า');
      cVol=fc(r,'ปริมาตร ea','ปริมาตร');
      cWt=fc(r,'นน. ea','นน.ea','นน.','weight');
      return;
    }
    if(cName===-1)return;
    const name=cv(r,cName);
    if(!name)return;
    list.push({name,weightKg:cn(r,cWt),volLiters:cn(r,cVol)});
  });
  return list;
}

// ── Route ────────────────────────────────────────────────────
// รหัสร้านค้า | ชื่อร้านค้า | รหัสเซลล์ | ชื่อเซลล์ | คลัง | F | รูทจด | ชื่อสายจด | ลำดับจด | Serial Route จด | วันส่ง
function parseRoutes(rows){
  let cCode=-1,cRoute=-1,cSerial=-1,cDay=-1;
  const list=[];
  rows.forEach(r=>{
    if(!r.length||r.every(x=>!x))return;
    if(r.some(x=>(x||'').toString().includes('รหัสร้านค้า'))){
      cCode=fc(r,'รหัสร้านค้า');cRoute=fc(r,'ชื่อสายจด');cSerial=fc(r,'serial route','serial');cDay=fc(r,'วันส่ง');
      return;
    }
    if(cCode===-1)return;
    const code=cv(r,cCode);if(!code)return;
    list.push({arCode:code,routeName:cv(r,cRoute),serialRoute:cv(r,cSerial),delivDay:cv(r,cDay)});
  });
  return list;
}

// ── Car ──────────────────────────────────────────────────────
// ... | ผู้ดูแล-ขับขี่ | ... | ทะเบียน Final | ... | ประเภทรถ | ... | แผนก | นน.บรรทุก | ... | กว้าง | ยาว | สูง | ...
function parseCars(rows){
  let cDrv=-1,cPlt=-1,cType=-1,cDpt=-1,cWt=-1,cW=-1,cL=-1,cH=-1;
  const list=[];
  rows.forEach(r=>{
    if(!r.length||r.every(x=>!x))return;
    if(r.some(x=>(x||'').toString().includes('ผู้ดูแล-ขับขี่'))){
      cDrv=fc(r,'ผู้ดูแล-ขับขี่');
      cPlt=fc(r,'ทะเบียน final','ทะเบียน');
      cType=fc(r,'ประเภทรถ');
      cDpt=fc(r,'แผนก');
      cWt=fc(r,'นน.บรรทุก','น้ำหนักบรรทุก');
      cW=fc(r,'กว้าง');cL=fc(r,'ยาว');cH=fc(r,'สูง');
      return;
    }
    if(cDrv===-1)return;
    const drv=cv(r,cDrv),plt=cv(r,cPlt);
    if(!drv&&!plt)return;
    const dpt=cv(r,cDpt);
    if(dpt==='ขาย')return; // Skip sales vehicles
    const id=plt||drv||`CAR${list.length+1}`;
    list.push({id,driver:drv||id,plate:plt,type:cv(r,cType),dept:dpt,maxWeightKg:cn(r,cWt),widthCm:cn(r,cW),lengthCm:cn(r,cL),heightCm:cn(r,cH)});
  });
  return list;
}

function buildEB(bills,products,routes){
  const prodMap={};
  products.forEach(p=>{if(p.name)prodMap[p.name.toLowerCase().trim()]=p;});
  const routeMap={};
  routes.forEach(r=>{if(r.arCode&&!routeMap[r.arCode])routeMap[r.arCode]=r;});
  return bills.map(bill=>{
    let tw=0,tv=0,miss=false;
    bill.items.forEach(item=>{
      const key=(item.name||item.sku||'').toLowerCase().trim();
      const p=prodMap[key];
      const qty=item.qty||1;
      if(p){tw+=p.weightKg*qty;tv+=p.volLiters*qty;}
      else if(key)miss=true;
    });
    const ri=routeMap[bill.arCode];
    return{...bill,route:bill.route||ri?.routeName||'',serialRoute:ri?.serialRoute||'',delivDay:ri?.delivDay||'',totalWeight:tw,totalVolM3:tv/1000,missingProd:miss};
  });
}

async function loadData(){
  S.loading=true;S.error=null;render();
  try{
    const id=sheetId(S.cfg.sheetUrl);
    if(!id)throw new Error('URL ไม่ถูกต้อง');
    const[bcsv,prodcsv,rcsv,ccsv]=await Promise.all([fetchCSV(id,S.cfg.bs),fetchCSV(id,S.cfg.ps),fetchCSV(id,S.cfg.rs),fetchCSV(id,S.cfg.cs)]);
    const bills=parseBills(pcsv(bcsv));
    const products=parseProducts(pcsv(prodcsv));
    const routes=parseRoutes(pcsv(rcsv));
    const cars=parseCars(pcsv(ccsv));
    S.data={bills,products,routes,cars};
    S.eb=buildEB(bills,products,routes);
    cars.forEach(c=>{if(!S.assign[c.id])S.assign[c.id]=[];});
    if(!S.selCar&&cars.length)S.selCar=cars[0].id;
  }catch(e){S.error=e.message;}
  finally{S.loading=false;render();}
}

function getStat(id){
  const car=S.data.cars.find(c=>c.id===id);if(!car)return{};
  const bs=(S.assign[id]||[]).map(no=>S.eb.find(b=>b.billNo===no)).filter(Boolean);
  const uw=bs.reduce((s,b)=>s+b.totalWeight,0);
  const uv=bs.reduce((s,b)=>s+b.totalVolM3,0);
  const mw=car.maxWeightKg,mv=car.widthCm*car.lengthCm*car.heightCm/1e6;
  return{uw,uv,mw,mv,wp:mw?Math.min(100,uw/mw*100):0,vp:mv?Math.min(100,uv/mv*100):0,n:bs.length,bills:bs};
}
function assignedTo(no){return Object.entries(S.assign).find(([,bs])=>bs.includes(no))?.[0]||null;}
function getRoutes(){return[...new Set(S.eb.map(b=>b.route).filter(Boolean))].sort();}
function getDates(){return[...new Set(S.eb.map(b=>b.date).filter(Boolean))].sort();}
function filtered(){return S.eb.filter(b=>S.fRoute==='all'||b.route===S.fRoute).filter(b=>S.fDate==='all'||b.date===S.fDate);}

function selCar(id){S.selCar=id;renderC();}
function setView(v){S.view=v;document.querySelectorAll('.htab').forEach(t=>t.classList.toggle('on',t.textContent===(v==='queue'?'คิวรถ':'รายงาน')));renderC();}
function setRoute(r){S.fRoute=r;renderC();}
function setDate(d){S.fDate=d;renderC();}
function toggleBill(no){
  if(!S.selCar)return;
  const prev=assignedTo(no);
  Object.keys(S.assign).forEach(c=>{S.assign[c]=S.assign[c].filter(b=>b!==no);});
  if(prev!==S.selCar)S.assign[S.selCar]=[...(S.assign[S.selCar]||[]),no];
  sv('dq_assign',S.assign);
  const sy=window.scrollY;renderC();requestAnimationFrame(()=>window.scrollTo(0,sy));
}
function autoAssign(){
  if(!S.selCar||!S.data)return;
  const st=getStat(S.selCar);
  let rw=(st.mw||1e9)-st.uw,rv=(st.mv||1e9)-st.uv;
  const pool=filtered().filter(b=>!assignedTo(b.billNo)).sort((a,b)=>a.totalWeight-b.totalWeight);
  const add=[];
  pool.forEach(b=>{if(b.totalWeight<=rw&&(!st.mv||b.totalVolM3<=rv)){add.push(b.billNo);rw-=b.totalWeight;rv-=b.totalVolM3;}});
  if(!add.length){alert('ไม่มีบิลที่เพิ่มได้\n(เต็มหรือบิลถูกจัดหมดแล้ว)');return;}
  S.assign[S.selCar]=[...(S.assign[S.selCar]||[]),...add];
  sv('dq_assign',S.assign);renderC();
}
function clearCar(){
  if(!S.selCar)return;
  const car=S.data?.cars.find(c=>c.id===S.selCar);
  if(!confirm(`ล้างคิว ${car?.driver||S.selCar}?`))return;
  S.assign[S.selCar]=[];sv('dq_assign',S.assign);renderC();
}

function render(){
  const el=qi('main');if(!el)return;
  if(!S.cfg){el.innerHTML=setupHTML();return;}
  if(S.loading){el.innerHTML=`<div class="load-wrap"><div class="spin"></div><div style="font-size:14px;color:var(--tx2)">กำลังโหลดข้อมูล...</div><div style="font-size:12px;color:var(--tx3)">เชื่อมต่อ Google Sheets</div></div>`;return;}
  if(S.error){el.innerHTML=errHTML();return;}
  if(!S.data){el.innerHTML=setupHTML();return;}
  renderC();
}

function setupHTML(){
  return`<div class="setup-wrap"><div class="sc">
    <svg class="si" viewBox="0 0 48 48" fill="none"><rect x="2" y="10" width="32" height="22" rx="3" fill="#0f6e56"/><path d="M34 20h9l5 8v8H34V20z" fill="#0f6e56"/><circle cx="10" cy="36" r="4" fill="white" stroke="#0f6e56" stroke-width="2"/><circle cx="40" cy="36" r="4" fill="white" stroke="#0f6e56" stroke-width="2"/></svg>
    <div class="st">จัดคิวส่งสินค้า</div>
    <div class="ss">เชื่อมต่อ Google Sheets เพื่อเริ่มใช้งาน</div>
    <div class="steps"><strong>เตรียม Google Sheet:</strong><br>1. เปิด Sheet → กด <strong>แชร์</strong> → <strong>เปลี่ยนการเข้าถึง</strong><br>2. เลือก <strong>"ใครก็ตามที่มีลิงก์"</strong> → <strong>"ผู้ดู"</strong><br>3. คัดลอก URL แล้ววางด้านล่าง</div>
    <div class="fld"><label>Google Sheet URL</label>
      <input type="url" id="init-url" placeholder="https://docs.google.com/spreadsheets/d/..." value="${esc(S.cfg?.sheetUrl||'')}"/>
    </div>
    <details style="margin-bottom:16px"><summary>ชื่อชีท (ถ้าต่างจากค่าเริ่มต้น)</summary>
      <div style="margin-top:10px" class="cgrid">
        <div class="fld"><label>บิล</label><input id="i-b" placeholder="Bill DS"/></div>
        <div class="fld"><label>สินค้า</label><input id="i-p" placeholder="Product"/></div>
        <div class="fld"><label>รูท</label><input id="i-r" placeholder="Route"/></div>
        <div class="fld"><label>รถ</label><input id="i-c" placeholder="Car"/></div>
      </div>
    </details>
    <button class="btn-p" onclick="initApp()">เชื่อมต่อและโหลดข้อมูล</button>
  </div></div>`;
}
function initApp(){
  const u=qi('init-url')?.value.trim();if(!u){alert('กรุณาใส่ URL');return;}
  S.cfg={sheetUrl:u,bs:qi('i-b')?.value.trim()||'Bill DS',ps:qi('i-p')?.value.trim()||'Product',rs:qi('i-r')?.value.trim()||'Route',cs:qi('i-c')?.value.trim()||'Car'};
  sv('dq_cfg',S.cfg);loadData();
}
function errHTML(){return`<div style="padding:2rem 0;max-width:440px;margin:0 auto"><div class="ebox">${esc(S.error)}</div><div style="margin-top:12px;font-size:13px;color:var(--tx2);line-height:2.2">สาเหตุที่พบบ่อย:<br>• Google Sheet ยังไม่ได้ตั้งค่าเป็นสาธารณะ<br>• ชื่อชีทไม่ตรง (ตัวพิมพ์เล็ก-ใหญ่ต้องตรงกัน)<br>• URL ไม่ถูกต้อง</div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="loadData()" class="btn-p">ลองใหม่</button><button onclick="openS()">ตั้งค่า</button></div></div>`;}

function renderC(){
  const el=qi('main');if(!el||!S.data)return;
  if(S.view==='report'){el.innerHTML=reportHTML();return;}
  el.innerHTML=queueHTML();
  qi('blist')?.addEventListener('click',e=>{const item=e.target.closest('.bi');if(item&&!item.classList.contains('other'))toggleBill(item.dataset.no);});
}

function queueHTML(){
  const routes=getRoutes(),dates=getDates(),filt=filtered();
  const car=S.data.cars.find(c=>c.id===S.selCar);
  let h='';
  // Cars grid
  h+=`<div id="cars-grid">`;
  S.data.cars.forEach(c=>{
    const st=getStat(c.id),sel=c.id===S.selCar;
    h+=`<div class="cc${sel?' sel':''}" onclick="selCar('${esc(c.id)}')"><div class="cc-top"><div><div class="cc-name">${esc(c.driver)}</div><div class="cc-plate">${esc(c.plate)}</div><div class="cc-type">${esc(c.type)}</div></div>${st.n?`<span class="cbadge">${st.n}</span>`:''}</div>${capB('น้ำหนัก',st.uw,st.mw,'kg',st.wp)}${capB('ปริมาตร',st.uv,st.mv,'m³',st.vp)}</div>`;
  });
  h+=`</div>`;
  // Car strip
  if(car){h+=`<div id="car-strip"><span class="cs-n">${esc(car.driver)}</span><span class="cs-i">${esc(car.plate)}</span><span class="cs-i">${esc(car.type)}</span>${car.maxWeightKg?`<span class="cs-i">บรรทุก ${f0(car.maxWeightKg)} kg</span>`:''} ${car.widthCm?`<span class="cs-i">${car.widthCm}×${car.lengthCm}×${car.heightCm} cm</span>`:''}<div class="cs-acts"><button style="font-size:12px;padding:6px 12px" onclick="autoAssign()">แนะนำอัตโนมัติ</button><button style="font-size:12px;padding:6px 12px" class="btn-d" onclick="clearCar()">ล้างคิว</button></div></div>`;}
  // Date filter
  if(dates.length>1){h+=`<div id="dbar">`;['all',...dates].forEach(d=>{h+=`<button class="dpill${S.fDate===d?' on':''}" onclick="setDate('${esc(d)}')">${d==='all'?'ทุกวัน':esc(d)}</button>`;});h+=`</div>`;}
  // Route filter
  h+=`<div id="fbar">`;['all',...routes].forEach(r=>{h+=`<button class="fpill${S.fRoute===r?' on':''}" onclick="setRoute('${esc(r)}')">${r==='all'?'ทุกรูท':esc(r)}</button>`;});h+=`<span id="fcnt">${filt.length} บิล</span></div>`;
  // Bills
  h+=`<div id="blist">`;
  if(!filt.length)h+=`<div class="empty">ไม่มีบิลในเงื่อนไขที่เลือก</div>`;
  filt.forEach(bill=>{
    const at=assignedTo(bill.billNo),isSel=at===S.selCar,isOth=at&&!isSel;
    const oCar=isOth?S.data.cars.find(c=>c.id===at):null;
    const its=bill.items.map(i=>`${i.name} ×${i.qty}${i.unit?' ('+i.unit+')':''}`).join(', ');
    const loc=[bill.district,bill.province].filter(Boolean).join(' ');
    h+=`<div class="bi${isSel?' ok':''}${isOth?' other':''}" data-no="${esc(bill.billNo)}">
      <div class="chk${isSel?' on':''}">${isSel?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</div>
      <div class="bi-inf">
        <div class="bi-r1"><span class="bi-no">${esc(bill.billNo)}</span><span class="bi-st">${esc(bill.store)}</span>${bill.route?`<span class="rtag">${esc(bill.route)}</span>`:''}${bill.delivDay?`<span class="dtag">${esc(bill.delivDay)}</span>`:''}${bill.missingProd?`<span class="wtag">ไม่พบสินค้า</span>`:''}</div>
        ${its?`<div class="bi-its">${esc(its)}</div>`:''}
        ${loc?`<div class="bi-loc">${esc(loc)}</div>`:''}
      </div>
      <div class="bi-nums"><div class="bi-kg">${f1(bill.totalWeight)} kg</div>${bill.totalVolM3>0?`<div class="bi-m3">${f3(bill.totalVolM3)} m³</div>`:''}</div>
      ${isOth?`<div class="bi-ocar">${esc(oCar?.driver||at)}</div>`:''}
    </div>`;
  });
  h+=`</div>`;
  h+=`<div class="foot"><button id="reload-btn" onclick="loadData()" style="font-size:12px;padding:6px 12px">รีโหลด</button><span class="foot-i">${S.eb.length} บิล · ${S.data.products.length} สินค้า · ${S.data.cars.length} คัน</span></div>`;
  return h;
}

function reportHTML(){
  const assigned=Object.values(S.assign).flat().length,total=S.eb.length;
  const unas=S.eb.filter(b=>!assignedTo(b.billNo));
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px"><div style="font-size:14px;color:var(--tx2)">${assigned}/${total} บิลถูกจัดแล้ว</div><button class="pbt" onclick="window.print()">พิมพ์รายงาน</button></div>`;
  S.data.cars.forEach(car=>{
    const st=getStat(car.id);if(!st.n)return;
    h+=`<div class="rc"><div class="rc-hdr"><span class="rc-name">${esc(car.driver)} · ${esc(car.plate)}</span><span class="rc-stat">${esc(car.type)}</span><span class="rc-stat">${st.n} บิล</span><span class="rc-stat">น้ำหนัก ${f1(st.uw)} kg${st.mw?` (${Math.round(st.wp)}%)`:''}  </span>${st.mv>0?`<span class="rc-stat">ปริมาตร ${f2(st.uv)} m³ (${Math.round(st.vp)}%)</span>`:''}</div><div>`;
    (st.bills||[]).forEach(b=>{
      const loc=[b.district,b.province].filter(Boolean).join(' ');
      h+=`<div class="rrow"><span class="rno">${esc(b.billNo)}</span><span class="rst">${esc(b.store)}</span><span class="rloc">${esc(loc)}</span>${b.route?`<span class="rtag" style="flex-shrink:0">${esc(b.route)}</span>`:''}<span class="rkg">${f1(b.totalWeight)} kg</span></div>`;
    });
    h+=`</div></div>`;
  });
  if(unas.length){
    h+=`<div class="rc unas"><div class="rc-hdr"><span class="rc-name">ยังไม่ได้จัดคิว (${unas.length} บิล)</span></div><div>`;
    unas.forEach(b=>{const loc=[b.district,b.province].filter(Boolean).join(' ');h+=`<div class="rrow"><span class="rno">${esc(b.billNo)}</span><span class="rst">${esc(b.store)}</span><span class="rloc">${esc(loc)}</span>${b.route?`<span class="rtag" style="flex-shrink:0">${esc(b.route)}</span>`:''}<span class="rkg">${f1(b.totalWeight)} kg</span></div>`;});
    h+=`</div></div>`;
  }else{h+=`<div class="empty" style="padding:1.5rem">บิลทั้งหมดถูกจัดคิวแล้ว</div>`;}
  return h;
}

function capB(label,used,max,unit,pct){
  const col=pct>90?'#E24B4A':pct>70?'#EF9F27':'#1D9E75';
  const u=unit==='kg'?f1(used):f2(used),m=unit==='kg'?f0(max):f2(max);
  return`<div class="cb"><div class="cb-row"><span>${label}</span><span>${u}/${m} ${unit}</span></div><div class="cb-track"><div class="cb-fill" style="width:${Math.min(100,pct||0).toFixed(1)}%;background:${col}"></div></div></div>`;
}
function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function f0(n){return Math.round(+n||0).toLocaleString();}
function f1(n){return(+n||0).toFixed(1);}
function f2(n){return(+n||0).toFixed(2);}
function f3(n){return(+n||0).toFixed(3);}
function qi(id){return document.getElementById(id);}
function ls(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

init();
</script>
</body>
