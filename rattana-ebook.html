<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rattana E-Book v2.3</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- PDF.js — เปิดไฟล์ PDF เป็นหนังสือ -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Google sign-in ปิดชั่วคราว (origin_mismatch) — เปิดใช้ใหม่: คืนบรรทัด GSI ด้านล่าง -->
<!-- <script src="https://accounts.google.com/gsi/client" async defer></script> -->
<style>
:root{
  --navy:#0d1b3e; --navy-mid:#1a2f5e; --navy-light:#243b73;
  --gold:#c9a84c; --gold-light:#e8c86a;
  --success:#2ecc71; --danger:#e74c3c; --warning:#f39c12; --info:#3498db;
  --bg:#f4f6fb; --text:#0d1b3e; --card-bg:#ffffff; --border:#dde3f0; --muted:#6b7896; --row-alt:#fafbfd;
  --paper:#fbf8f1; --paper-edge:#efe9db;
  --radius-sm:6px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06); --shadow-md:0 2px 8px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(13,27,62,.12); --shadow-gold:0 4px 12px rgba(201,168,76,.35);
}
body.dark{
  --bg:#0a1020; --text:#e8eaf0; --card-bg:#111c35; --border:#243b73; --muted:#8a98b8; --row-alt:#0f1830;
  --paper:#16223e; --paper-edge:#0d1730;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font-family:inherit;font-size:16px}
img{max-width:100%}

/* Header */
header{background:var(--navy);color:#fff;padding:9px 12px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:7px;border-bottom:3px solid var(--gold);padding-top:max(9px,env(safe-area-inset-top))}
.logo-text{font-weight:700;letter-spacing:1px;font-size:15px;color:#fff;white-space:nowrap}
.logo-text span{color:var(--gold)}
.grow{flex:1}
.icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);min-width:40px;height:40px;padding:0 11px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn:active{background:rgba(255,255,255,.2)}
.icon-btn.solid{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.icon-btn.solid:hover{background:var(--gold-light)}
.icon-btn .lbl{font-size:12px}
@media(max-width:600px){.icon-btn .lbl{display:none}}

/* Login (ปิดใช้ชั่วคราว) */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,rgba(201,168,76,.12),transparent),var(--navy)}
.login-card{background:var(--card-bg);border-radius:var(--radius-lg);border-top:4px solid var(--gold);box-shadow:var(--shadow-lg);padding:34px 30px;max-width:400px;width:100%;text-align:center}
.login-card .book-emoji{font-size:52px;margin-bottom:8px}
.login-card h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-card h1 span{color:var(--gold)}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:22px}
#gbtn{display:flex;justify-content:center;min-height:44px}
.login-err{color:var(--danger);font-size:13px;margin-top:14px;min-height:18px;font-weight:600}
.login-foot{margin-top:20px;color:var(--muted);font-size:11px}

/* App shell */
#appScreen{display:none;flex-direction:column;min-height:100dvh;height:100dvh}
.reader{flex:1;display:flex;flex-direction:column;min-height:0}

/* Book stage */
.book-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:2600px;padding:14px 12px;min-height:0;overflow:hidden;
  background:radial-gradient(1000px 500px at 50% 0%,rgba(13,27,62,.05),transparent)}
body.dark .book-stage{background:radial-gradient(1000px 500px at 50% 0%,rgba(0,0,0,.35),transparent)}
.book{position:relative;width:min(94vw,440px);aspect-ratio:3/4;max-height:82dvh;transform-style:preserve-3d}
.book.spread{width:min(96vw,900px);aspect-ratio:3/2;max-height:82dvh}
/* single-mode spine shadow (left) */
.book:not(.spread)::before{content:"";position:absolute;left:-6px;top:2%;height:96%;width:12px;background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,0));border-radius:6px;filter:blur(1px);z-index:0}
/* spread: static left backing (so cover sits on right) + center spine */
.book.spread::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--paper);border-radius:8px 2px 2px 8px;box-shadow:inset -14px 0 22px -12px rgba(0,0,0,.32);z-index:0}
.book.spread::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:rgba(0,0,0,.14);z-index:1}

/* single-page leaves */
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.35,.08,.2,1)}
.page.flipping,.book.spread .leaf.flipping{will-change:transform}
.page.flipped{transform:rotateY(-180deg)}
.page .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:3px 10px 10px 3px;background:var(--paper);color:var(--text);box-shadow:var(--shadow-lg)}
.page .face.back{transform:rotateY(180deg);background:var(--paper);background-image:linear-gradient(to left,var(--paper-edge),transparent 22%)}
.page .face.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(to right,rgba(0,0,0,.16),transparent);pointer-events:none;z-index:3}

/* spread leaves (right half, turn on spine) */
.book.spread .leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.35,.08,.2,1)}
.book.spread .leaf.flipped{transform:rotateY(-180deg)}
.book.spread .leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper);color:var(--text);box-shadow:var(--shadow-lg)}
.book.spread .leaf .face.front{border-radius:2px 9px 9px 2px}
.book.spread .leaf .face.back{transform:rotateY(180deg);border-radius:9px 2px 2px 9px}
.book.spread .leaf .face.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(to right,rgba(0,0,0,.15),transparent);z-index:3;pointer-events:none}
.book.spread .leaf .face.back::before{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:linear-gradient(to left,rgba(0,0,0,.15),transparent);z-index:3;pointer-events:none}
/* turning shadow */
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.18),transparent 12%);opacity:0;transition:opacity .4s;pointer-events:none}
.flipping .face.front::after{opacity:1}

/* page content */
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 24px 42px}
.pg-blank{background:var(--paper)}
.pg-img{padding:0}
.pg-img img{width:100%;height:100%;object-fit:contain;background:var(--paper)}
.pg-num{position:absolute;bottom:11px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px}
.pg-cover{align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(700px 500px at 50% 18%,rgba(201,168,76,.18),transparent),linear-gradient(160deg,var(--navy),#060e22);color:#fff}
.pg-cover .brand{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:auto;padding-top:12px;text-transform:uppercase}
.pg-cover .h{font-size:28px;font-weight:700;line-height:1.25;margin-bottom:10px}
.pg-cover .s{font-size:14px;color:rgba(255,255,255,.8)}
.pg-cover .rule{width:60px;height:3px;background:var(--gold);border-radius:2px;margin:16px auto}
.pg-cover .foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1px}
.pg-back{align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,var(--navy-mid),var(--navy));color:#fff}
.pg-back .h{font-size:22px;font-weight:700}
.pg-back .s{font-size:13px;color:rgba(255,255,255,.7);margin-top:8px}
.pg h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3}
.pg .kicker{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:12px}
.pg p{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:10px;text-indent:1.4em;opacity:.92}
.pg .hr{height:1px;background:var(--border);margin:10px 0}
.pg-toc{padding:26px 20px 42px}
.pg-toc .kicker{text-align:center}
.pg-toc h2{text-align:center;margin-bottom:14px}

/* tap zones (mobile easy flip) */
.tap-zone{position:absolute;top:0;bottom:0;width:32%;z-index:40;background:transparent}
.tap-zone.left{left:0}.tap-zone.right{right:0}

/* controls */
.controls{background:var(--card-bg);border-top:1px solid var(--border);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:60}
.ctrl-row{display:flex;align-items:center;gap:12px}
.nav-btn{background:var(--navy);color:#fff;border-radius:var(--radius-md);min-width:56px;height:48px;font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
.nav-btn:active{background:var(--navy-mid)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.page-ind{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--text)}
.page-ind b{color:var(--gold);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}

/* TOC overlay */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);z-index:9000;backdrop-filter:blur(4px)}
.sheet-overlay.open{display:block}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(92vw,380px);background:var(--card-bg);border-left:4px solid var(--gold);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideL .25s ease}
@keyframes slideL{from{transform:translateX(100%)}to{transform:translateX(0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.sheet-head h3{font-size:16px;font-weight:700}
.sheet-body{flex:1;overflow-y:auto;padding:8px 10px calc(16px + env(safe-area-inset-bottom))}
.toc-sec-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;padding:12px 4px 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.toc-list{list-style:none;margin:0;padding:0}
.toc-row{width:100%;display:flex;align-items:baseline;gap:8px;background:transparent;border:none;padding:11px 6px;text-align:left;color:var(--text);font-family:inherit;border-radius:8px;cursor:pointer;min-height:44px}
.toc-row:hover,.toc-row:active{background:rgba(201,168,76,.14)}
.toc-row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-row .dots{flex:1;border-bottom:1.5px dotted var(--border);transform:translateY(-4px)}
.toc-row .n{font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.toc-row.active{background:rgba(201,168,76,.18)}
.toc-empty{color:var(--muted);font-size:13px;text-align:center;margin:14px 0}
.pg-toc .toc-list{flex:1;overflow-y:auto}
.page-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:6px 2px}
.page-grid button{aspect-ratio:1;border:1px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;transition:all .12s}
.page-grid button:hover{border-color:var(--gold)}
.page-grid button.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.modal-close{background:transparent;border:none;font-size:28px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 10px}

/* Manage modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(13,27,62,.65);z-index:9100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:92dvh;overflow-y:auto;border-top:4px solid var(--gold);animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-body{padding:16px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pdf-status{background:var(--row-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pdf-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.pdf-status.on .dot{background:var(--success)}
.sec-div{text-align:center;font-size:11px;color:var(--muted);margin:16px 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.input{height:44px;padding:0 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);font-size:16px;outline:none;width:100%}
.input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:1px solid transparent;min-height:44px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.mng-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mng-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--row-alt)}
.mng-item .thumb{width:34px;height:44px;border-radius:4px;object-fit:cover;background:var(--navy-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.mng-item .meta{flex:1;min-width:0}
.mng-item .meta .ttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mng-item .meta .sub{font-size:11px;color:var(--muted)}
.mng-item .acts{display:flex;gap:4px}
.mng-item .acts button{width:30px;height:30px;border-radius:6px;background:var(--card-bg);border:1px solid var(--border);font-size:13px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border:1.5px solid var(--border);background:transparent;color:var(--text);border-radius:var(--radius-sm);font-weight:600;font-size:13px}
.seg button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* spinner + toast */
#spinner{display:none;position:fixed;inset:0;background:rgba(13,27,62,.6);align-items:center;justify-content:center;z-index:99999;backdrop-filter:blur(3px)}
#spinner.show{display:flex}
.spin-box{background:var(--card-bg);border-radius:16px;padding:30px 40px;text-align:center;border-top:4px solid var(--gold);min-width:230px}
.ring{width:48px;height:48px;border:5px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:max(84px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:var(--radius-md);color:#fff;z-index:99999;font-weight:500;font-size:13px;box-shadow:var(--shadow-lg);animation:fadeUp .3s ease;max-width:92vw;text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-warning{background:var(--warning);color:var(--navy)}.toast-info{background:var(--navy-mid);border-left:3px solid var(--gold)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ══ LOGIN (ปิดใช้ชั่วคราว) ══ -->
<div id="loginScreen" style="display:none">
  <div class="login-card">
    <div class="book-emoji">📖</div>
    <h1>Rattana <span>E-Book</span></h1>
    <p>ห้องสมุดอิเล็กทรอนิกส์ · รัตนไพบูลย์</p>
    <div id="gbtn">
      <div id="g_id_onload" data-client_id="615875645128-gasjjvkt6lu8g449cbnhl40k1pu25r0b.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="pill"></div>
    </div>
    <div class="login-err" id="loginErr"></div>
    <div class="login-foot">เฉพาะพนักงานที่ได้รับสิทธิ์</div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="appScreen">
  <header>
    <span class="logo-text">RATTANA <span>E-BOOK</span></span>
    <span class="grow"></span>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" class="hidden" onchange="openPdf(this.files[0]);this.value='';">
    <button class="icon-btn solid" id="btnPdf" onclick="document.getElementById('pdfInput').click()" title="เปิด PDF ของคุณ">📄<span class="lbl">เปิด PDF</span></button>
    <button class="icon-btn" id="btnToc" onclick="openToc()" title="สารบัญ / ไปหน้า">☰<span class="lbl">สารบัญ</span></button>
    <button class="icon-btn hidden" id="btnManage" onclick="openManage()" title="จัดการ">✎</button>
    <button class="icon-btn" id="btnDark" onclick="toggleDark()" title="โหมดมืด">🌙</button>
  </header>

  <div class="reader">
    <div class="book-stage" id="bookStage">
      <div class="tap-zone left" id="tapL"></div>
      <div class="tap-zone right" id="tapR"></div>
      <div class="book" id="book"></div>
    </div>

    <div class="controls">
      <div class="ctrl-row">
        <button class="nav-btn" id="btnPrev" onclick="step(-1)">‹</button>
        <div class="page-ind">หน้า <b id="pgCur">1</b> / <span id="pgTot">1</span></div>
        <button class="nav-btn" id="btnNext" onclick="step(1)">›</button>
      </div>
      <input type="range" id="pgSlider" min="1" max="1" value="1" oninput="jumpTo(this.value-1)">
    </div>
  </div>
</div>

<!-- TOC + page jump overlay -->
<div class="sheet-overlay" id="tocOverlay" onclick="if(event.target===this)closeToc()">
  <div class="sheet">
    <div class="sheet-head"><h3>สารบัญ · ไปหน้า</h3><button class="modal-close" onclick="closeToc()">&times;</button></div>
    <div class="sheet-body">
      <div class="toc-sec-title">สารบัญ (บท)</div>
      <ul class="toc-list" id="tocOverlayList"></ul>
      <div class="toc-sec-title">ไปหน้า — แตะเลขหน้า</div>
      <div class="page-grid" id="pageGrid"></div>
    </div>
  </div>
</div>

<!-- Manage / source modal -->
<div class="modal-overlay" id="manageOverlay" onclick="if(event.target===this)closeManage()">
  <div class="modal">
    <div class="modal-head"><h3>แหล่งที่มาหนังสือ</h3><button class="modal-close" onclick="closeManage()">&times;</button></div>
    <div class="modal-body">
      <div class="pdf-status" id="pdfStatus"><span class="dot"></span><span id="pdfStatusText">—</span></div>
      <input type="file" id="pdfInput2" accept="application/pdf,.pdf" class="hidden" onchange="openPdf(this.files[0]);this.value='';closeManage();">

</div>

<div id="spinner"><div class="spin-box"><div class="ring"></div><p id="spinMsg">กำลังโหลด...</p></div></div>

<script>
/* ════════ CONFIG ════════ */
const AUTH_CONFIG = { usersSheetId:'1M6HdISsLN684qRWyQ73CA4AmUzmYtZaOlffDJXZZIXQ', usersSheetName:'Rattana Users for apps' };
const EDIT_MIN_ROLE = 5;
const STORE_KEY = 'rattanaEbookPages_v1';
const BOOK_MANIFEST = 'ebook/book.json';   // หนังสือกลางที่แชร์ = รูปทีละหน้า + manifest (แก้หนังสือ: แทนที่รูปใน ebook/pages/ + book.json)
const PDF_WORKER  = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const PDF_CMAP    = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/';
const PDF_STDFONT = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/';
const PDF_TARGET_W = 1100;
const SPREAD_MQ = '(min-width:820px) and (min-height:480px)';

/* ════════ DEFAULT (DEMO) BOOK ════════ */
const DEFAULT_PAGES = [
  {type:'cover', heading:'Rattana E-Book', sub:'เปิดไฟล์ PDF เป็นหนังสือ'},
  {type:'toc'},
  {type:'demo', chapter:'เริ่มต้นใช้งาน', kicker:'ยินดีต้อนรับ',
   body:['กดปุ่ม 📄 เปิด PDF ด้านบน เลือกไฟล์ PDF จากเครื่อง ระบบจะแปลงเป็นหนังสือพลิกอ่านได้ทันที (เฉพาะเครื่องคุณ)',
          'พลิกหน้า: แตะครึ่งซ้าย/ขวาของจอ · ปัดหน้าจอ · กดลูกศร ‹ › · ลากแถบเลื่อน']},
  {type:'demo', chapter:'สารบัญ & ไปหน้า', kicker:'การนำทาง',
   body:['กดปุ่ม ☰ สารบัญ ด้านบน จะเห็นรายการบท (ดึงจาก bookmark ใน PDF) — แตะชื่อบทหรือเลขหน้าเพื่อกระโดดไปหน้านั้นทันที',
          'ด้านล่างมีตาราง “ไปหน้า” แตะเลขหน้าใดก็ได้เพื่อข้ามไปหน้านั้นตรง ๆ']},
  {type:'demo', chapter:'จอเล็ก-จอใหญ่', kicker:'สมจริง',
   body:['บนมือถือแสดงทีละหน้า อ่านง่าย · บนคอม/แท็บเล็ตกางเป็น 2 หน้าเหมือนหนังสือจริง สลับให้อัตโนมัติตามขนาดจอ',
          'หนังสือกลางที่บริษัทแชร์จะขึ้นให้ทุกคนที่เปิดลิงก์เห็นเล่มเดียวกัน']},
  {type:'back', heading:'พร้อมแล้ว', sub:'กด 📄 เพื่อเปิด PDF ของคุณ · รัตนไพบูลย์'},
];

/* ════════ STATE ════════ */
let currentUser=null;
let PAGES=[], CHAPTERS=[], BOOK_MODE='manual', PDF_NAME='', IS_HOSTED=false;
let pageEls=[], leafEls=[], SPREAD=false, currentIndex=0, N=0, addMode='url', HOSTED_LAZY=false;

/* ════════ IndexedDB ════════ */
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('rattanaEbook',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();rej(tx.error);}; }); }
async function idbGet(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readonly'); const g=tx.objectStore('kv').get(k); g.onsuccess=()=>{db.close();res(g.result);}; g.onerror=()=>{db.close();rej(g.error);}; }); }
async function idbDel(k){ const db=await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();rej(tx.error);}; }); }

/* ════════ AUTH (ปิดใช้ชั่วคราว — คงไว้เผื่อเปิดใหม่) ════════ */
function decodeJwtPayload(token){ const parts=String(token||'').split('.'); if(parts.length<2) throw new Error('JWT invalid');
  let b64=parts[1].replace(/-/g,'+').replace(/_/g,'/'); const pad=(4-b64.length%4)%4; if(pad) b64+='='.repeat(pad);
  const bin=atob(b64), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes)); }
const normalizeEmail=s=>String(s||'').replace(/[​‌‍﻿]/g,'').replace(/\s+/g,'').toLowerCase();
function parseCsv(text){ if(!text) return []; if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;}else q=false;} else cell+=ch; }
    else{ if(ch==='"')q=true; else if(ch===',')row.push(cell),cell=''; else if(ch==='\r'){} else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';} else cell+=ch; } }
  if(cell.length||row.length){row.push(cell);rows.push(row);} if(!rows.length) return [];
  const clean=s=>String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const headers=rows[0].map(clean);
  return rows.slice(1).filter(r=>r.some(c=>clean(c))).map(r=>Object.fromEntries(headers.map((k,i)=>[k,clean(r[i])]))); }
async function loadFromSheets(id,name){ const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(url); if(!res.ok) throw new Error('fetch failed'); return parseCsv(await res.text()); }
async function handleGoogleLogin(r){ showSpinner('กำลังตรวจสอบสิทธิ์...');
  try{ const email=normalizeEmail(decodeJwtPayload(r.credential).email);
    const users=await loadFromSheets(AUTH_CONFIG.usersSheetId,AUTH_CONFIG.usersSheetName);
    const u=users.find(x=>normalizeEmail(x['E-mail'])===email);
    if(!u){ loginErr('ไม่พบอีเมลนี้ในระบบ'); return; }
    if(String(u['Status']||'').trim().toLowerCase()!=='active'){ loginErr('บัญชีถูกระงับ'); return; }
    currentUser={ email, name:u['ชื่อ - สกุล'], nickname:u['ชื่อเล่น'], role:parseInt(u['User Role'])||1 };
    localStorage.setItem('rattanaUser',JSON.stringify({data:currentUser,exp:Date.now()+30*24*60*60*1000})); enterApp();
  }catch(e){ loginErr('เกิดข้อผิดพลาด ลองใหม่'); } finally{ hideSpinner(); } }
function loginErr(m){ document.getElementById('loginErr').textContent=m; }
function checkSession(){ try{ const raw=localStorage.getItem('rattanaUser'); if(!raw) return;
    const {data,exp}=JSON.parse(raw); if(Date.now()>exp){ localStorage.removeItem('rattanaUser'); return; }
    currentUser=data; enterApp(); }catch{ localStorage.removeItem('rattanaUser'); } }
function logout(){ localStorage.removeItem('rattanaUser'); location.reload(); }

function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';
  document.getElementById('btnManage').classList.toggle('hidden',!(currentUser && currentUser.role>=EDIT_MIN_ROLE));
  startReader();
}

/* ════════ BOOT READER: override ส่วนตัว → หนังสือที่แชร์ → demo ════════ */
async function startReader(){
  try{
    const override=await idbGet('isOverride'); const buf=await idbGet('pdfData');
    if(override && buf && buf.byteLength){ const nm=await idbGet('pdfName'); await renderPdf(buf, nm||'PDF', true, false); return; }
  }catch(e){}
  showSpinner('กำลังโหลดหนังสือ...');
  const ok=await loadHostedBook();
  hideSpinner();
  if(ok) return;
  BOOK_MODE='manual'; PDF_NAME=''; IS_HOSTED=false; HOSTED_LAZY=false; loadBook(); buildBook(); jumpTo(0,false);
}
/* หนังสือที่แชร์ = รูปทีละหน้า (โหลด lazy รอบ ๆ หน้าปัจจุบัน — มือถือไม่ต้องโหลดทั้งเล่ม) */
async function loadHostedBook(){
  try{
    const r=await fetch(BOOK_MANIFEST,{cache:'force-cache'}); if(!r.ok) return false;
    const m=await r.json(); if(!m || !m.count) return false;
    const dir=m.dir||'', ext=m.ext||'jpg', pad=m.pad||4, pages=[];
    for(let i=1;i<=m.count;i++) pages.push({type:'image', img:dir+String(i).padStart(pad,'0')+'.'+ext, lazy:true});
    PAGES=pages; CHAPTERS=(m.chapters||[]).map(c=>({title:c.title, index:(c.page||1)-1}));
    BOOK_MODE='pdf'; IS_HOSTED=true; HOSTED_LAZY=true; PDF_NAME=m.title||'หนังสือ';
    buildBook(); jumpTo(0,false); hydrateImages();
    return true;
  }catch(e){ console.warn('hosted book fail',e); return false; }
}
function hydrateImages(){
  if(!HOSTED_LAZY) return;
  const lo=Math.max(0,currentIndex-2), hi=Math.min(N-1,currentIndex+4);
  for(let i=lo;i<=hi;i++){ const im=document.querySelector('#book img[data-page="'+i+'"]'); if(im && im.dataset.src){ im.src=im.dataset.src; im.removeAttribute('data-src'); } }
}

/* ════════ MANUAL BOOK ════════ */
function loadBook(){ try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); PAGES=(Array.isArray(s)&&s.length)?s:JSON.parse(JSON.stringify(DEFAULT_PAGES)); }
  catch{ PAGES=JSON.parse(JSON.stringify(DEFAULT_PAGES)); } }
function saveBook(){ if(BOOK_MODE!=='manual') return; try{ localStorage.setItem(STORE_KEY,JSON.stringify(PAGES)); }catch(e){ showToast('บันทึกไม่สำเร็จ (พื้นที่เต็ม)','error'); } }

/* ════════ PDF PIPELINE ════════ */
function ensurePdfWorker(){ if(window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER; }
async function cdnReachable(url){ try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000); const r=await fetch(url,{signal:c.signal,cache:'force-cache'}); clearTimeout(t); return r.ok; }catch(e){ return false; } }

async function openPdf(file){
  if(!file) return;
  if(!/pdf$/i.test(file.type||'') && !/\.pdf$/i.test(file.name||'')){ showToast('กรุณาเลือกไฟล์ PDF','warning'); return; }
  try{ const buf=await file.arrayBuffer(); await renderPdf(buf, file.name, false, false); }
  catch(e){ console.error(e); showToast('อ่านไฟล์ไม่สำเร็จ','error'); }
}
async function renderPdf(buf, name, fromStore, isHosted){
  if(!window.pdfjsLib){ showToast('ไลบรารี PDF ยังโหลดไม่เสร็จ ลองอีกครั้ง','error'); return; }
  ensurePdfWorker(); showSpinner('กำลังเปิด PDF...');
  try{
    if(!fromStore){ try{ await idbSet('pdfData', buf.slice(0)); await idbSet('pdfName', name||'PDF'); await idbSet('isOverride', true); }catch(e){ console.warn('idb store fail',e); } }
    let fontOpts={};
    if(await cdnReachable(PDF_STDFONT+'LiberationSans-Regular.ttf')) fontOpts={cMapUrl:PDF_CMAP, cMapPacked:true, standardFontDataUrl:PDF_STDFONT};
    else console.warn('font CDN ไม่พร้อม — render เฉพาะฟอนต์ที่ฝังใน PDF');
    const pdf=await pdfjsLib.getDocument(Object.assign({data: buf.slice(0)}, fontOpts)).promise;
    const num=pdf.numPages; const pages=[];
    for(let i=1;i<=num;i++){
      showSpinner(`กำลังแปลงหน้า ${i} / ${num} ...`);
      const page=await pdf.getPage(i);
      const v1=page.getViewport({scale:1});
      const scale=Math.min(2.2, Math.max(1, PDF_TARGET_W/v1.width));
      const vp=page.getViewport({scale});
      const canvas=document.createElement('canvas'); canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      const ctx=canvas.getContext('2d',{alpha:false}); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      const rt=page.render({canvasContext:ctx, viewport:vp});
      await Promise.race([ rt.promise.catch(()=>{}), new Promise(r=>setTimeout(r,20000)) ]);   // freeze-guard
      pages.push({type:'image', img:canvas.toDataURL('image/jpeg',0.82)});
      canvas.width=canvas.height=0;
    }
    let chapters=[];
    try{ const outline=await pdf.getOutline(); if(outline&&outline.length) chapters=await outlineToChapters(pdf,outline); }catch(e){ console.warn('outline fail',e); }
    PDF_NAME=name||'PDF'; BOOK_MODE='pdf'; IS_HOSTED=!!isHosted; HOSTED_LAZY=false; CHAPTERS=chapters; PAGES=pages;
    buildBook(); jumpTo(0,false);
    showToast(`เปิด “${PDF_NAME}” · ${num} หน้า${chapters.length?` · ${chapters.length} บท`:''}`,'success');
  }catch(e){ console.error(e); showToast('เปิด PDF ไม่สำเร็จ: '+(e&&e.message||e),'error'); }
  finally{ hideSpinner(); }
}
async function outlineToChapters(pdf, outline){
  const out=[];
  async function walk(items, depth){
    for(const it of (items||[])){
      let idx=null;
      try{ let dest=it.dest; if(typeof dest==='string') dest=await pdf.getDestination(dest);
        if(Array.isArray(dest) && dest[0]) idx=await pdf.getPageIndex(dest[0]); }catch(e){}
      if(idx!=null) out.push({title:(depth?'· ':'')+String(it.title||'(ไม่มีชื่อ)').trim(), index:idx});
      if(it.items && it.items.length) await walk(it.items, depth+1);
    }
  }
  await walk(outline,0); return out;
}
async function clearPdf(){
  if(!confirm('กลับไปหนังสือที่แชร์ไว้ (หรือหนังสือตัวอย่าง)?')) return;
  try{ await idbDel('pdfData'); await idbDel('pdfName'); await idbDel('isOverride'); }catch(e){}
  closeManage(); startReader();
}

/* ════════ RENDER PAGE FACE ════════ */
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function faceHTML(p,i){
  if(!p) return '<div class="pg pg-blank"></div>';
  const num=`<div class="pg-num">${i+1}</div>`;
  if(p.type==='cover') return `<div class="pg pg-cover"><div class="brand">RATTANA</div><div class="h">${esc(p.heading)}</div><div class="rule"></div><div class="s">${esc(p.sub)}</div><div class="foot">แตะเพื่อเปิดอ่าน · v2.2</div></div>`;
  if(p.type==='back') return `<div class="pg pg-back"><div class="h">${esc(p.heading)}</div><div class="s">${esc(p.sub)}</div></div>${num}`;
  if(p.type==='toc') return `<div class="pg pg-toc"><div class="kicker">Table of Contents</div><h2>สารบัญ</h2><ul class="toc-list" id="tocInBook"></ul></div>${num}`;
  if(p.type==='image'){ const s=p.lazy?`data-src="${esc(p.img)}"`:`src="${esc(p.img)}"`;
    return `<div class="pg pg-img"><img data-page="${i}" ${s} alt="page ${i+1}" onerror="this.style.display='none'"></div>${num}`; }
  const body=(p.body||[]).map(t=>`<p>${esc(t)}</p>`).join('');
  return `<div class="pg">${p.kicker?`<div class="kicker">${esc(p.kicker)}</div>`:''}${p.chapter?`<h2>${esc(p.chapter)}</h2><div class="hr"></div>`:''}${body}</div>${num}`;
}
function deriveChapters(){ const out=[]; PAGES.forEach((p,i)=>{ if(p.chapter && p.type!=='cover' && p.type!=='toc') out.push({title:p.chapter,index:i}); }); return out; }

function buildBook(){
  SPREAD = matchSpread();
  const book=document.getElementById('book');
  N=PAGES.length; book.className='book'+(SPREAD?' spread':''); book.innerHTML=''; pageEls=[]; leafEls=[];
  if(SPREAD){
    const lv=Math.ceil(N/2);
    for(let i=0;i<lv;i++){ const fp=2*i, bp=2*i+1;
      const leaf=document.createElement('div'); leaf.className='leaf';
      leaf.innerHTML='<div class="face front">'+faceHTML(PAGES[fp],fp)+'</div><div class="face back">'+(bp<N?faceHTML(PAGES[bp],bp):'<div class="pg pg-blank"></div>')+'</div>';
      book.appendChild(leaf); leafEls.push(leaf);
    }
  }else{
    PAGES.forEach((p,i)=>{ const el=document.createElement('div'); el.className='page';
      el.innerHTML='<div class="face front">'+faceHTML(p,i)+'</div><div class="face back"></div>';
      book.appendChild(el); pageEls.push(el); });
  }
  if(BOOK_MODE==='manual') CHAPTERS=deriveChapters();
  document.getElementById('pgTot').textContent=N;
  const sl=document.getElementById('pgSlider'); sl.min=1; sl.max=Math.max(1,N);
  buildTocLists();
}
function matchSpread(){ try{ return window.matchMedia(SPREAD_MQ).matches; }catch(e){ return false; } }

/* ════════ TOC + PAGE GRID ════════ */
function tocEntries(){ return CHAPTERS; }
function tocRowsHTML(){
  const e=tocEntries();
  if(!e.length) return `<li class="toc-empty">PDF นี้ไม่มีสารบัญ (bookmark) — ใช้ “ไปหน้า” ด้านล่างแทน</li>`;
  return e.map(x=>`<li><button class="toc-row" data-idx="${x.index}" onclick="jumpTo(${x.index});closeToc()"><span class="t">${esc(x.title)}</span><span class="dots"></span><span class="n">${x.index+1}</span></button></li>`).join('');
}
function buildPageGrid(){ const g=document.getElementById('pageGrid'); if(!g) return;
  let h=''; for(let i=0;i<N;i++) h+=`<button data-pg="${i}" onclick="jumpTo(${i});closeToc()">${i+1}</button>`; g.innerHTML=h; }
function buildTocLists(){ const html=tocRowsHTML();
  const inBook=document.getElementById('tocInBook'); if(inBook) inBook.innerHTML=html;
  const ov=document.getElementById('tocOverlayList'); if(ov) ov.innerHTML=html; buildPageGrid(); }
function highlightToc(){ const vis=visiblePages();
  document.querySelectorAll('.toc-row').forEach(r=>r.classList.toggle('active', vis.includes(+r.dataset.idx)));
  document.querySelectorAll('#pageGrid button').forEach(b=>b.classList.toggle('active', vis.includes(+b.dataset.pg))); }

/* ════════ FLIP ENGINE (single + spread) ════════ */
function leafOf(idx){ return Math.ceil(idx/2); }          // จำนวนใบที่พลิกแล้วเพื่อโชว์หน้า idx
function visiblePages(){
  if(!SPREAD) return [currentIndex];
  const L=Math.min(leafEls.length, leafOf(currentIndex)); const out=[];
  if(2*L-1>=0 && 2*L-1<N) out.push(2*L-1);
  if(2*L<N) out.push(2*L);
  return out.length?out:[0];
}
function applyState(animate){
  if(SPREAD){ const lv=leafEls.length, L=Math.min(lv, leafOf(currentIndex));
    leafEls.forEach((el,i)=>{ if(!animate) el.style.transition='none'; el.classList.toggle('flipped', i<L); el.style.zIndex = i<L ? i : (2*lv - i); });
    if(!animate) requestAnimationFrame(()=>leafEls.forEach(el=>el.style.transition=''));
  }else{ pageEls.forEach((el,i)=>{ if(!animate) el.style.transition='none'; el.classList.toggle('flipped', i<currentIndex); el.style.zIndex = i<currentIndex ? i : (2*N - i); });
    if(!animate) requestAnimationFrame(()=>pageEls.forEach(el=>el.style.transition='')); }
}
function flipAnim(el, rest){ if(!el){ rest(); return; } el.classList.add('flipping'); el.style.zIndex=999999;
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.classList.remove('flipping'); rest(); },840); }
function step(dir){
  if(SPREAD){
    const lv=leafEls.length; let L=Math.min(lv, leafOf(currentIndex));
    const nl=Math.max(0, Math.min(lv, L+dir)); if(nl===L) return;
    const movingIdx = dir>0 ? nl-1 : nl;
    currentIndex = Math.max(0, Math.min(N-1, 2*nl));
    leafEls.forEach((el,i)=>{ el.classList.toggle('flipped', i<nl); el.style.zIndex = i<nl ? i : (2*lv - i); });
    flipAnim(leafEls[movingIdx], ()=>applyState(true));
  }else{
    const target=currentIndex+dir; if(target<0||target>=N) return;
    const movingIdx = dir>0 ? currentIndex : currentIndex-1;
    currentIndex=target;
    pageEls.forEach((el,i)=>{ el.classList.toggle('flipped', i<currentIndex); el.style.zIndex = i<currentIndex ? i : (2*N - i); });
    flipAnim(pageEls[movingIdx], ()=>applyState(true));
  }
  updateUI();
}
function jumpTo(idx,animate=true){ currentIndex=Math.max(0,Math.min(N-1,+idx)); applyState(animate); updateUI(); }
function updateUI(){
  const vis=visiblePages();
  document.getElementById('pgCur').textContent = vis.length>1 ? (vis[0]+1)+'–'+(vis[vis.length-1]+1) : String((vis[0]||0)+1);
  document.getElementById('pgSlider').value=(vis[vis.length-1]||0)+1;
  if(SPREAD){ const L=Math.min(leafEls.length, leafOf(currentIndex));
    document.getElementById('btnPrev').disabled=L<=0; document.getElementById('btnNext').disabled=L>=leafEls.length; }
  else{ document.getElementById('btnPrev').disabled=currentIndex<=0; document.getElementById('btnNext').disabled=currentIndex>=N-1; }
  highlightToc();
  hydrateImages();
}

/* ════════ OVERLAYS ════════ */
function openToc(){ buildTocLists(); highlightToc(); document.getElementById('tocOverlay').classList.add('open'); }
function closeToc(){ document.getElementById('tocOverlay').classList.remove('open'); }
function anyOverlayOpen(){ return document.getElementById('tocOverlay').classList.contains('open')||document.getElementById('manageOverlay').classList.contains('open'); }
function openManage(){
  if(!(currentUser&&currentUser.role>=EDIT_MIN_ROLE)){ showToast('ไม่มีสิทธิ์แก้ไข','warning'); return; }
  const isPdf=BOOK_MODE==='pdf';
  const st=document.getElementById('pdfStatus'), stt=document.getElementById('pdfStatusText');
  st.classList.toggle('on',isPdf);
  stt.textContent = !isPdf ? 'หนังสือตัวอย่าง (demo)' : (IS_HOSTED?`หนังสือที่แชร์: ${PDF_NAME} · ${N} หน้า`:`PDF ของคุณ (เครื่องนี้): ${PDF_NAME} · ${N} หน้า`);
  document.getElementById('btnClearPdf').classList.toggle('hidden', !(isPdf && !IS_HOSTED));
  document.getElementById('manualSection').classList.toggle('hidden', isPdf);
  document.getElementById('btnResetBook').classList.toggle('hidden', isPdf);
  if(!isPdf) renderMngList();
  document.getElementById('manageOverlay').classList.add('open');
}
function closeManage(){ document.getElementById('manageOverlay').classList.remove('open'); }
function setAddMode(m){ addMode=m;
  document.getElementById('segUrl').classList.toggle('on',m==='url'); document.getElementById('segFile').classList.toggle('on',m==='file');
  document.getElementById('fieldUrl').classList.toggle('hidden',m!=='url'); document.getElementById('fieldFile').classList.toggle('hidden',m!=='file'); }
function commitAdd(img,chap){ PAGES.push({type:'image',img,chapter:chap||''}); saveBook(); buildBook(); jumpTo(N-1); renderMngList(); showToast('เพิ่มหน้าแล้ว ✓','success'); }
function addPage(){
  if(BOOK_MODE==='pdf'){ showToast('อยู่ในโหมด PDF — กลับหนังสือที่แชร์ก่อนจึงจะเพิ่มรูปเองได้','warning'); return; }
  const chap=document.getElementById('inpChap').value.trim();
  if(addMode==='url'){ const url=document.getElementById('inpUrl').value.trim(); if(!url){ showToast('ใส่ลิงก์รูปก่อน','warning'); return; }
    commitAdd(url,chap); document.getElementById('inpUrl').value=''; document.getElementById('inpChap').value=''; }
  else{ const f=document.getElementById('inpFile').files[0]; if(!f){ showToast('เลือกไฟล์ก่อน','warning'); return; }
    const rd=new FileReader(); rd.onload=()=>{ commitAdd(rd.result,chap); document.getElementById('inpFile').value=''; document.getElementById('inpChap').value=''; }; rd.readAsDataURL(f); }
}
function renderMngList(){ const box=document.getElementById('mngList'); if(!box) return;
  box.innerHTML=PAGES.map((p,i)=>{
    const label = p.type==='image' ? (p.chapter||`รูปหน้า ${i+1}`) : p.type==='cover' ? 'ปกหน้า' : p.type==='back' ? 'ปกหลัง' : p.type==='toc' ? 'สารบัญ (อัตโนมัติ)' : (p.chapter||p.kicker||`หน้า ${i+1}`);
    const thumb = p.type==='image' ? `<img class="thumb" src="${esc(p.img)}" alt="">` : `<div class="thumb">${p.type==='cover'?'📕':p.type==='back'?'📗':p.type==='toc'?'☰':'📄'}</div>`;
    const locked = p.type==='cover'||p.type==='back'||p.type==='toc';
    return `<li class="mng-item">${thumb}<div class="meta"><div class="ttl">${esc(label)}</div><div class="sub">หน้า ${i+1} · ${p.type}</div></div>
      <div class="acts"><button onclick="movePage(${i},-1)">▲</button><button onclick="movePage(${i},1)">▼</button><button onclick="delPage(${i})" ${locked?'disabled style="opacity:.3"':''}>🗑</button></div></li>`;
  }).join(''); }
function movePage(i,dir){ if(BOOK_MODE==='pdf')return; const j=i+dir; if(j<0||j>=PAGES.length) return;
  [PAGES[i],PAGES[j]]=[PAGES[j],PAGES[i]]; saveBook(); buildBook(); renderMngList(); jumpTo(Math.min(currentIndex,N-1),false); }
function delPage(i){ if(BOOK_MODE==='pdf')return; const p=PAGES[i];
  if(p.type==='cover'||p.type==='back'||p.type==='toc'){ showToast('หน้านี้ลบไม่ได้','warning'); return; }
  PAGES.splice(i,1); saveBook(); buildBook(); renderMngList(); jumpTo(Math.min(currentIndex,N-1),false); showToast('ลบหน้าแล้ว','info'); }
function resetBook(){ if(BOOK_MODE==='pdf'){ showToast('กลับหนังสือที่แชร์ก่อน','warning'); return; }
  if(!confirm('รีเซ็ตหนังสือรูปกลับค่าเริ่มต้น?')) return;
  PAGES=JSON.parse(JSON.stringify(DEFAULT_PAGES)); saveBook(); buildBook(); renderMngList(); jumpTo(0,false); showToast('รีเซ็ตแล้ว','success'); }

/* ════════ INPUT: keyboard, swipe, tap-half ════════ */
document.addEventListener('keydown',e=>{ if(document.getElementById('appScreen').style.display==='none'||anyOverlayOpen()) return;
  if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1); });
const stage=document.getElementById('bookStage');
let tsx=0,tsy=0,_suppressClick=false;
stage.addEventListener('touchstart',e=>{ tsx=e.changedTouches[0].clientX; tsy=e.changedTouches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ _suppressClick=true; setTimeout(()=>_suppressClick=false,450); step(dx<0?1:-1); } },{passive:true});
function tapFlip(e){ if(anyOverlayOpen()){ return; } if(_suppressClick){ _suppressClick=false; return; }
  const r=stage.getBoundingClientRect(); if(e.clientX < r.left + r.width*0.5) step(-1); else step(1); }
document.getElementById('tapL').addEventListener('click',()=>{ if(!anyOverlayOpen()&&!_suppressClick) step(-1); });
document.getElementById('tapR').addEventListener('click',()=>{ if(!anyOverlayOpen()&&!_suppressClick) step(1); });

/* rebuild on breakpoint change (mobile 1 page ↔ desktop 2 pages) */
let _rzT; window.addEventListener('resize',()=>{ clearTimeout(_rzT); _rzT=setTimeout(()=>{ if(matchSpread()!==SPREAD){ const keep=currentIndex; buildBook(); jumpTo(keep,false); } },250); });

/* ════════ MISC UI ════════ */
function toggleDark(){ document.body.classList.toggle('dark');
  document.getElementById('btnDark').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
  localStorage.setItem('rattanaEbookDark',document.body.classList.contains('dark')?'1':'0'); }
function showSpinner(m){ document.getElementById('spinMsg').textContent=m||'กำลังโหลด...'; document.getElementById('spinner').classList.add('show'); }
function hideSpinner(){ document.getElementById('spinner').classList.remove('show'); }
function showToast(msg,type='info'){ const t=document.createElement('div'); t.className='toast toast-'+type; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

/* ════════ BOOT ════════ */
if(localStorage.getItem('rattanaEbookDark')==='1'){ document.body.classList.add('dark'); }
/* login ปิดชั่วคราว — เข้าอ่านตรง ๆ (guest role 8)
   เปิด login ใหม่: enterApp() → checkSession() + คืน GSI script + ลบ style display:none ที่ #loginScreen */
window.onload=()=>{
  ensurePdfWorker();
  document.getElementById('btnDark').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
  currentUser={ name:'ผู้อ่าน', nickname:'ผู้อ่าน', role:8 };
  enterApp();
};
