<!doctype html>
<meta charset="utf-8">
<title>Shopee Bridge</title>
<style>
  body{font-family:'Sarabun',system-ui,sans-serif;width:280px;padding:14px;margin:0;
       background:#0d1b3e;color:#fff;font-size:13px}
  h1{font-size:14px;margin:0 0 2px;letter-spacing:.5px}
  h1 span{color:#c9a84c}
  .sub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:14px}
  label{display:block;font-size:11px;color:rgba(255,255,255,.6);margin:10px 0 4px;text-transform:uppercase}
  input[type=password]{width:100%;height:34px;padding:0 10px;border-radius:6px;border:1.5px solid #243b73;
       background:#111c35;color:#fff;font-size:13px;box-sizing:border-box}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px}
  .row input{width:16px;height:16px}
  .row span{font-size:12px}
  button{width:100%;height:36px;margin-top:14px;border:0;border-radius:6px;background:#c9a84c;
       color:#0d1b3e;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .ok{font-size:11px;color:#2ecc71;margin-top:8px;min-height:14px;text-align:center}
  .note{font-size:10px;color:rgba(255,255,255,.4);margin-top:10px;line-height:1.6}
</style>

<h1>RATTANA <span>Chat Hub</span></h1>
<div class="sub">Shopee Bridge — อ่านอย่างเดียว</div>

<label for="secret">รหัสลับ (SHOPEE_INGEST_SECRET)</label>
<input id="secret" type="password" placeholder="วางรหัสจาก Supabase">

<div class="row">
  <input id="enabled" type="checkbox">
  <span>เปิดใช้งาน</span>
</div>
<div class="row">
  <input id="discovery" type="checkbox">
  <span>โหมดสำรวจ (ยังไม่ส่งข้อมูล)</span>
</div>

<button id="save">บันทึก</button>
<div class="ok" id="ok"></div>

<div class="note">
  เปิด Shopee Seller Center หน้าแชทค้างไว้ ระบบจะอ่านข้อมูลจากหน้าที่เปิดอยู่
  แล้วส่งเข้า Chat Hub — ไม่มีการล็อกอินแทนหรือตอบลูกค้าแทน
</div>

<script src="popup.js"></script>
