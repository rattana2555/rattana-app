<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rattana Store Budget Report v2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0d1b3e;--navy-mid:#1a2f5e;--navy-light:#243b73;
      --gold:#c9a84c;--gold-light:#e8c86a;
      --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;
      --bg:#f4f6fb;--text:#0d1b3e;--card-bg:#ffffff;--border:#dde3f0;
      --muted:#6b7896;--row-alt:#fafbfd;
      --radius-sm:6px;--radius-md:12px;--radius-lg:16px;
      --shadow-sm:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 2px 8px rgba(0,0,0,.08);
    }
    body.dark {
      --bg:#0a1020;--text:#e8eaf0;--card-bg:#111c35;--border:#243b73;
      --muted:#8a98b8;--row-alt:#0f1830;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Sarabun',sans-serif;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
    button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
    input,select{font-family:inherit;font-size:16px}

    header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);padding-top:max(10px,env(safe-area-inset-top))}
    .header-title{flex:1;min-width:0}
    .header-title h1{font-size:16px;font-weight:700;color:#fff;line-height:1.2}
    .header-title .ver{font-size:11px;color:rgba(255,255,255,.55);font-weight:400}
    .icon-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.2);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background .15s}
    .icon-btn:hover{background:rgba(255,255,255,.12)}

    .content{padding:12px;max-width:1200px;margin:0 auto;width:100%}
    @media(min-width:640px){.content{padding:16px}}

    /* Stats */
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    @media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
    .stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow-sm)}
    .stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
    .stat-value{font-size:22px;font-weight:700;margin-top:2px;line-height:1.1}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .stat-danger .stat-value{color:var(--danger)}
    .stat-success .stat-value{color:var(--success)}
    .stat-warning .stat-value{color:var(--warning)}
    .stat-info .stat-value{color:var(--info)}

    /* Filter */
    .filter-bar{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
    .filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
    .filter-field{display:flex;flex-direction:column;gap:3px;min-width:160px;flex:1}
    .filter-field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
    .filter-field input,.filter-field select{height:40px;padding:8px 12px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);transition:border-color .15s;outline:none}
    .filter-field input:focus,.filter-field select:focus{border-color:var(--gold)}

    /* Card list */
    .card-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
    .card-list-header h2{font-size:15px;font-weight:700}
    .card-list-header .count{font-size:12px;color:var(--muted)}
    .card-list{display:flex;flex-direction:column;gap:8px}

    .store-card{background:var(--card-bg);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;transition:transform .1s,box-shadow .15s;cursor:pointer}
    .store-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .store-card.level-danger{border-left-color:var(--danger)}
    .store-card.level-warning{border-left-color:var(--warning)}
    .store-card.level-success{border-left-color:var(--success)}

    .card-rank{font-size:12px;font-weight:700;color:var(--muted);min-width:24px;text-align:center;flex-shrink:0}

    .card-info{flex:1;min-width:0}
    .card-store{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12px;color:var(--muted)}
    .card-meta span{display:flex;align-items:center;gap:3px;white-space:nowrap}

    .card-stats{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .card-pills{display:flex;gap:4px}
    .pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
    .pill-ok{background:rgba(46,204,113,.1);color:var(--success)}
    .pill-x{background:rgba(231,76,60,.1);color:var(--danger)}

    .card-amount{text-align:right;min-width:80px;flex-shrink:0}
    .card-amount .val{font-size:20px;font-weight:700;line-height:1.1}
    .card-amount .unit{font-size:11px;color:var(--muted)}
    .card-amount .val.text-danger{color:var(--danger)}
    .card-amount .val.text-warning{color:var(--warning)}
    .card-amount .val.text-success{color:var(--success)}

    .text-danger{color:var(--danger)}
    .text-success{color:var(--success)}
    .text-warning{color:var(--warning)}
    .text-muted{color:var(--muted)}

    /* Spinner */
    .spinner-overlay{position:fixed;inset:0;background:rgba(13,27,62,.6);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
    .spinner-overlay.show{display:flex}
    .spinner-ring{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner-msg{color:#fff;font-size:14px}

    .loading-bar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:200;transition:width .4s}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius-sm);color:#fff;font-size:13px;font-weight:500;z-index:1000;animation:toastIn .3s ease}
    .toast-success{background:#27ae60}
    .toast-error{background:#c0392b}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state .icon{font-size:40px;margin-bottom:8px}

    .sort-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .sort-chip{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-weight:500;transition:all .15s}
    .sort-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

    /* Detail overlay */
    .detail-overlay{position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
    .detail-overlay.open{transform:translateX(0)}
    .detail-header{background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
    .detail-back{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;cursor:pointer}
    .detail-back:hover{background:rgba(255,255,255,.12)}
    .detail-title{flex:1;min-width:0}
    .detail-title h2{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .detail-title .detail-sub{font-size:11px;color:rgba(255,255,255,.55)}
    .detail-body{padding:12px;max-width:1200px;margin:0 auto}
    @media(min-width:640px){.detail-body{padding:16px}}

    .detail-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
    @media(min-width:640px){.detail-summary{grid-template-columns:repeat(4,1fr)}}

    .detail-search{margin-bottom:12px}
    .detail-search input{width:100%;height:40px;padding:8px 12px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none}
    .detail-search input:focus{border-color:var(--gold)}

    .detail-count{font-size:12px;color:var(--muted);margin-bottom:8px;padding:0 2px}

    .detail-table-wrap{display:flex;flex-direction:column;gap:12px}
    .day-group{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
    .day-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;gap:8px;flex-wrap:wrap}
    .day-date{font-size:14px}
    .day-ref{font-size:11px;opacity:.8;font-weight:400}
    .day-summary{display:flex;gap:14px;font-size:12px;align-items:center}
    .day-summary span{opacity:.8}
    .day-total-val{font-size:14px;font-weight:700}
    .day-total-neg{color:#ff6b6b}
    .day-total-pos{color:#51cf66}
    .day-total-zero{opacity:.6}
    .day-body{overflow-x:auto}
    .diff-neg{color:var(--danger);font-weight:700}
    .diff-pos{color:var(--success);font-weight:700}
    .diff-zero{color:var(--muted)}
    .price-match{color:var(--success);font-weight:700}
    .price-zero{color:var(--muted);font-size:11px}
    .badge-free{display:inline-block;background:rgba(52,152,219,.12);color:var(--info);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}

    /* Desktop table */
    .detail-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:900px}
    .detail-table th{position:sticky;top:0;background:#1e3a5f;color:#fff;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;text-align:center;white-space:nowrap;z-index:2}
    .detail-table th.th-left{text-align:left}
    .detail-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;text-align:center}
    .detail-table tbody tr:nth-child(even) td{background:var(--row-alt)}
    .detail-table tbody tr:hover td{background:rgba(201,168,76,.06)}
    .detail-table .td-sku{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
    .detail-table .td-left{text-align:left}
    .td-cs{background:rgba(52,152,219,.05)}
    .td-other{background:rgba(155,89,182,.05)}
    body.dark .td-cs{background:rgba(52,152,219,.1)}
    body.dark .td-other{background:rgba(155,89,182,.1)}
    .th-sell{background:#2d6a4f}
    .th-cs{background:#1a4a7e}
    .th-other{background:#5e3a7e}
    .td-sell{background:rgba(45,106,79,.06);font-weight:700}
    body.dark .td-sell{background:rgba(45,106,79,.12)}

    /* Mobile item cards */
    .m-items{display:none}
    .m-item{padding:10px 12px;border-bottom:1px solid var(--border)}
    .m-item:last-child{border-bottom:none}
    .m-item-name{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.3}
    .m-item-name small{font-weight:400;color:var(--muted);font-size:11px}
    .m-item-prices{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px 8px;font-size:11px;margin-bottom:6px}
    .m-price-cell{text-align:center}
    .m-price-label{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px}
    .m-price-val{font-size:13px;font-weight:600}
    .m-sell-val{color:#2d6a4f;font-size:14px;font-weight:700}
    body.dark .m-sell-val{color:#51cf66}
    .m-item-diff{display:flex;gap:16px;font-size:12px;padding-top:4px;border-top:1px dashed var(--border)}
    .m-item-diff span{font-weight:600}

    @media(max-width:768px){
      .day-body .detail-table{display:none}
      .m-items{display:block}
      .day-header{padding:8px 12px;font-size:12px}
      .day-date{font-size:13px}
    }


  </style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header>
  <div class="header-title">
    <h1>Store Budget Report</h1>
    <div class="ver">v2.0 — สรุปบัดเจ็ทรายร้าน (รวมส่วนต่าง)</div>
  </div>
  <button class="icon-btn" onclick="location.reload()" title="Refresh">↻</button>
  <button class="icon-btn" id="btnDark" onclick="toggleDark()" title="Dark mode">🌙</button>
</header>

<div class="content">
  <!-- Stats -->
  <div class="stat-grid" id="statGrid">
    <div class="stat-card stat-info"><div class="stat-label">จำนวนร้าน</div><div class="stat-value" id="sTotal">—</div></div>
    <div class="stat-card stat-danger"><div class="stat-label">รวมส่วนต่างทั้งหมด</div><div class="stat-value" id="sBudgetUsed">—</div><div class="stat-sub" id="sBudgetSub"></div></div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <div class="filter-row">
      <div class="filter-field" style="flex:2">
        <label>ค้นหาร้าน</label>
        <input type="text" id="fSearch" placeholder="พิมพ์ชื่อร้าน..." oninput="applyFilters()">
      </div>
      <div class="filter-field">
        <label>เซลล์</label>
        <select id="fSale" onchange="applyFilters()"><option value="">— ทั้งหมด —</option></select>
      </div>
      <div class="filter-field">
        <label>คลัง</label>
        <select id="fWare" onchange="applyFilters()"><option value="">— ทั้งหมด —</option></select>
      </div>
      <div class="filter-field">
        <label>Channel</label>
        <select id="fChannel" onchange="applyFilters()"><option value="">— ทั้งหมด —</option></select>
      </div>
    </div>
  </div>

  <!-- Sort chips -->
  <div class="sort-chips">
    <span class="sort-chip active" data-sort="budget" onclick="setSort('budget')">ส่วนต่างมาก→น้อย</span>
    <span class="sort-chip" data-sort="budgetAsc" onclick="setSort('budgetAsc')">ส่วนต่างน้อย→มาก</span>
    <span class="sort-chip" data-sort="count" onclick="setSort('count')">จำนวนรายการ</span>
    <span class="sort-chip" data-sort="name" onclick="setSort('name')">ชื่อร้าน ก-ฮ</span>
  </div>

  <!-- Card list -->
  <div class="card-list-header">
    <h2>รายร้าน</h2>
    <span class="count" id="filteredCount"></span>
  </div>
  <div class="card-list" id="cardList"></div>
</div>

<!-- Detail overlay -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-header">
    <button class="detail-back" onclick="closeDetail()">←</button>
    <div class="detail-title">
      <h2 id="detailName">—</h2>
      <div class="detail-sub" id="detailSub"></div>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-summary" id="detailStats"></div>
    <div class="detail-search">
      <input type="text" id="detailSearch" placeholder="ค้นหาสินค้า..." oninput="filterDetailRows()">
    </div>
    <div class="detail-count" id="detailCount"></div>
    <div class="detail-table-wrap" id="detailTableWrap"></div>
  </div>
</div>

<!-- Spinner -->
<div class="spinner-overlay" id="spinner">
  <div class="spinner-ring"></div>
  <div class="spinner-msg" id="spinnerMsg">กำลังโหลด...</div>
</div>

<script>
const SHEET_ID = '1ww64IJdFJk8z8CDCCoFYZyE8FNzuH9W6sFDO6K44gWw';
const SHEET_NAME = 'SQL_Claude';

let allData = [];
let storeMap = {};
let filteredStores = [];
let currentSort = 'budget';

// ── Dark mode ──
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark') ? '1' : '0');
}
if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');

// ── Helpers ──
const fmt = n => Number(n).toLocaleString('th-TH', {maximumFractionDigits:0});
const showSpinner = m => { document.getElementById('spinnerMsg').textContent = m; document.getElementById('spinner').classList.add('show'); };
const hideSpinner = () => document.getElementById('spinner').classList.remove('show');
const setLoading = on => document.getElementById('loadingBar').style.width = on ? '85%' : '0';

function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── CSV parser ──
function parseCsv(text) {
  if (!text) return [];
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1]==='"'){cell+='"';i++;}else inQ=false; }
      else cell += ch;
    } else {
      if (ch==='"') inQ=true;
      else if (ch===',') { row.push(cell); cell=''; }
      else if (ch==='\r') {}
      else if (ch==='\n') { row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell += ch;
    }
  }
  if (cell||row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return [];
  const clean = s => String(s||'').replace(/[​‌‍﻿]/g,'').replace(/ /g,' ').trim();
  const headers = rows[0].map(clean);
  return rows.slice(1)
    .filter(r => r.some(c => clean(c)))
    .map(r => Object.fromEntries(headers.map((k, i) => [k, clean(r[i])])));
}

// ── Fetch ──
async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCsv(await res.text());
}

// ── Find column ──
function findCol(keys, ...patterns) {
  for (const p of patterns) {
    const found = keys.find(k => k.includes(p));
    if (found) return found;
  }
  return patterns[0];
}

// ── Process data ──
function processData(data) {
  if (!data.length) return {};
  const keys = Object.keys(data[0]);

  const colAR     = findCol(keys, 'AR_NAME', 'AR_Name', 'ชื่อลูกค้า');
  const colSale   = findCol(keys, 'SLMN_NAME', 'Sale', 'ชื่อเซลล์');
  const colSaleCD = findCol(keys, 'SLMN_CODE', 'SaleCode');
  const colWare   = findCol(keys, 'Ware', 'คลัง', 'WH');
  const colCheck  = findCol(keys, 'Check', 'สถานะ');
  const colDiff   = findCol(keys, 'รวมส่วนต่าง', 'TotalDiff');
  const colChannel= findCol(keys, 'Channel', 'ช่องทาง');
  const colSaleNo = findCol(keys, 'Sale No Roo', 'SaleRoute');

  const map = {};
  for (const row of data) {
    const store = row[colAR] || '(ไม่ระบุ)';
    if (!map[store]) {
      map[store] = {
        name: store,
        saleName: row[colSale] || '',
        saleCode: row[colSaleCD] || '',
        warehouse: row[colWare] || '',
        channel: row[colChannel] || '',
        saleRoute: row[colSaleNo] || '',
        totalDiff: 0,
        count: 0,
        xCount: 0,
        okCount: 0,
      };
    }
    const s = map[store];
    const diff = parseFloat(String(row[colDiff] || '0').replace(/,/g, '')) || 0;
    s.totalDiff += diff;
    s.count++;
    const chk = (row[colCheck] || '').toUpperCase().trim();
    if (chk === 'X') s.xCount++;
    else if (chk === 'OK') s.okCount++;
  }
  return map;
}

// ── Build filter dropdowns ──
function buildFilters() {
  const stores = Object.values(storeMap);
  const sales = [...new Set(stores.map(s => s.saleRoute).filter(Boolean))].sort();
  const wares = [...new Set(stores.map(s => s.warehouse).filter(Boolean))].sort();
  const channels = [...new Set(stores.map(s => s.channel).filter(Boolean))].sort();

  const fSale = document.getElementById('fSale');
  fSale.innerHTML = '<option value="">— ทั้งหมด —</option>' + sales.map(s => `<option value="${s}">${s}</option>`).join('');

  const fWare = document.getElementById('fWare');
  fWare.innerHTML = '<option value="">— ทั้งหมด —</option>' + wares.map(w => `<option value="${w}">${w}</option>`).join('');

  const fChannel = document.getElementById('fChannel');
  fChannel.innerHTML = '<option value="">— ทั้งหมด —</option>' + channels.map(c => `<option value="${c}">${c}</option>`).join('');
}

// ── Apply filters ──
function applyFilters() {
  const search = (document.getElementById('fSearch').value || '').toLowerCase();
  const sale = document.getElementById('fSale').value;
  const ware = document.getElementById('fWare').value;
  const channel = document.getElementById('fChannel').value;

  let stores = Object.values(storeMap);

  if (search) stores = stores.filter(s => s.name.toLowerCase().includes(search) || s.saleRoute.toLowerCase().includes(search) || s.saleName.toLowerCase().includes(search));
  if (sale) stores = stores.filter(s => s.saleRoute === sale);
  if (ware) stores = stores.filter(s => s.warehouse === ware);
  if (channel) stores = stores.filter(s => s.channel === channel);

  // Sort
  switch (currentSort) {
    case 'budget': stores.sort((a, b) => a.totalDiff - b.totalDiff); break;
    case 'budgetAsc': stores.sort((a, b) => b.totalDiff - a.totalDiff); break;
    case 'count': stores.sort((a, b) => b.count - a.count); break;
    case 'name': stores.sort((a, b) => a.name.localeCompare(b.name, 'th')); break;
  }

  filteredStores = stores;
  updateStats(stores);
  renderTable(stores);
}

function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-chip').forEach(c => c.classList.toggle('active', c.dataset.sort === s));
  applyFilters();
}

// ── Update stats ──
function updateStats(stores) {
  const totalDiff = stores.reduce((s, r) => s + r.totalDiff, 0);
  const totalCount = stores.reduce((s, r) => s + r.count, 0);

  document.getElementById('sTotal').textContent = fmt(stores.length);
  document.getElementById('sBudgetUsed').textContent = fmt(totalDiff);
  document.getElementById('sBudgetSub').textContent = `จาก ${fmt(totalCount)} รายการ`;
  document.getElementById('filteredCount').textContent = `แสดง ${stores.length} ร้าน`;
}

// ── Render cards ──
function renderTable(stores) {
  const el = document.getElementById('cardList');
  if (!stores.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div>ไม่พบข้อมูล</div>';
    return;
  }

  el.innerHTML = stores.map((s, i) => {
    const level = s.totalDiff < -5000 ? 'danger' : s.totalDiff < 0 ? 'warning' : 'success';
    const valCls = 'text-' + level;

    return `<div class="store-card level-${level}" onclick="openDetail('${s.name.replace(/'/g, "\\'")}')">
      <div class="card-rank">${i + 1}</div>
      <div class="card-info">
        <div class="card-store">${s.name}</div>
        <div class="card-meta">
          <span>👤 ${s.saleRoute || s.saleName}</span>
          <span>🏭 ${s.warehouse}</span>
          <span>📋 ${fmt(s.count)} รายการ</span>
        </div>
      </div>
      <div class="card-stats"></div>
      <div class="card-amount">
        <div class="val ${valCls}">${fmt(s.totalDiff)}</div>
        <div class="unit">บาท</div>
      </div>
    </div>`;
  }).join('');
}

// ── Detail view ──
let detailRows = [];
let colNames = {};

function cacheColNames() {
  if (!allData.length) return;
  const keys = Object.keys(allData[0]);
  colNames = {
    ar:      findCol(keys, 'AR_NAME', 'AR_Name', 'ชื่อลูกค้า'),
    date:    findCol(keys, 'DI_DATE', 'วันที่'),
    ref:     findCol(keys, 'DI_REF', 'เลขบิล'),
    sku:     findCol(keys, 'SKU_NAME', 'ชื่อสินค้า'),
    qty:     findCol(keys, 'TRD_QTY', 'จำนวน'),
    unit:    findCol(keys, 'Unit', 'หน่วย'),
    price:   findCol(keys, 'TRD_SH_UPRC', 'ราคา'),
    total:   findCol(keys, 'Total', 'รวม'),
    check:   findCol(keys, 'Check', 'สถานะ'),
    diff:    findCol(keys, 'ส่วนต่าง'),
    sumDiff: findCol(keys, 'รวมส่วนต่าง', 'TotalDiff'),
    note:    findCol(keys, 'หมายเหตุ'),
    cat:     findCol(keys, 'CAT BU'),
    brand:   findCol(keys, 'CAT BRAND'),
    csCtrl:  findCol(keys, 'CS_ราคาควบคุม'),
    csSub1:  findCol(keys, 'CS_ราคาซับใหญ่'),
    csSub2:  findCol(keys, 'CS_ราคาซับย่อย'),
    csRetail:findCol(keys, 'CS_ราคาปลีก'),
    paRetail:findCol(keys, 'PA_ราคาปลีก'),
    bpRetail:findCol(keys, 'BP_ราคาปลีก'),
    eaRetail:findCol(keys, 'EA_ราคาปลีก'),
  };
}

function openDetail(storeName) {
  if (!colNames.ar) cacheColNames();
  const store = storeMap[storeName];
  if (!store) return;

  detailRows = allData.filter(r => (r[colNames.ar] || '') === storeName);

  document.getElementById('detailName').textContent = storeName;
  document.getElementById('detailSub').textContent =
    `${store.saleRoute || store.saleName} | ${store.warehouse} | ${store.channel}`;

  const level = store.totalDiff < -5000 ? 'danger' : store.totalDiff < 0 ? 'warning' : 'success';
  document.getElementById('detailStats').innerHTML = `
    <div class="stat-card stat-${level}"><div class="stat-label">รวมส่วนต่าง</div><div class="stat-value">${fmt(store.totalDiff)}</div><div class="stat-sub">บาท</div></div>
    <div class="stat-card stat-info"><div class="stat-label">จำนวนรายการ</div><div class="stat-value">${fmt(store.count)}</div></div>
`;

  document.getElementById('detailSearch').value = '';
  renderDetailTable(detailRows);

  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function filterDetailRows() {
  const q = (document.getElementById('detailSearch').value || '').toLowerCase();
  const rows = q ? detailRows.filter(r =>
    (r[colNames.sku]||'').toLowerCase().includes(q) ||
    (r[colNames.ref]||'').toLowerCase().includes(q) ||
    (r[colNames.cat]||'').toLowerCase().includes(q) ||
    (r[colNames.brand]||'').toLowerCase().includes(q)
  ) : detailRows;
  renderDetailTable(rows);
}

function renderDetailTable(rows) {
  const c = colNames;
  const fmtN = v => { const n = parseFloat(String(v||'0').replace(/,/g,'')); return isNaN(n) ? v : n.toLocaleString('th-TH', {maximumFractionDigits:2}); };
  const parseN = v => parseFloat(String(v||'0').replace(/,/g,'')) || 0;
  const diffCls = v => { const n = parseN(v); return n < 0 ? 'diff-neg' : n > 0 ? 'diff-pos' : 'diff-zero'; };

  document.getElementById('detailCount').textContent = `แสดง ${rows.length} รายการ`;

  const el = document.getElementById('detailTableWrap');
  if (!rows.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div>ไม่พบรายการ</div>';
    return;
  }

  const priceCls = (val, sellPrice) => {
    const n = parseN(val);
    if (n === 0) return 'price-zero';
    if (n === sellPrice) return 'price-match';
    return '';
  };
  const priceVal = (val) => {
    const n = parseN(val);
    return n === 0 ? '-' : fmtN(val);
  };

  const groups = new Map();
  rows.forEach(r => {
    const key = r[c.date] || 'ไม่ระบุวันที่';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  el.innerHTML = Array.from(groups.entries()).map(([date, gRows]) => {
    const refs = [...new Set(gRows.map(r => r[c.ref]).filter(Boolean))];
    const gTotal = gRows.reduce((s, r) => s + parseN(r[c.sumDiff]), 0);
    const totalCls = gTotal < 0 ? 'day-total-neg' : gTotal > 0 ? 'day-total-pos' : 'day-total-zero';

    return `<div class="day-group">
      <div class="day-header">
        <div>
          <span class="day-date">${date}</span>
          <span class="day-ref">${refs.join(', ')}</span>
        </div>
        <div class="day-summary">
          <span>${gRows.length} รายการ</span>
          <span class="day-total-val ${totalCls}">${fmtN(gTotal)} บาท</span>
        </div>
      </div>
      <div class="day-body">
        <table class="detail-table">
          <thead><tr>
            <th class="th-left">#</th>
            <th class="th-left">สินค้า</th>
            <th class="th-sell">ราคาขาย</th>
            <th class="th-cs">CS S00</th><th class="th-cs">CS S01</th><th class="th-cs">CS S02</th><th class="th-cs">CS S03</th>
            <th class="th-other">PA S03</th><th class="th-other">BP S03</th><th class="th-other">EA S03</th>
            <th>ส่วนต่าง</th>
            <th>รวมส่วนต่าง</th>
          </tr></thead>
          <tbody>${gRows.map((r, i) => {
            const sp = parseN(r[c.price]);
            return `<tr>
              <td class="td-left">${i+1}</td>
              <td class="td-sku" title="${r[c.sku]||''}">${r[c.sku]||''}${sp === 0 ? '<span class="badge-free">แถม</span>' : ''}<br><span style="font-size:11px;color:var(--muted)">${fmtN(r[c.qty])} ${r[c.unit]||''}</span></td>
              <td class="td-sell">${sp === 0 ? '-' : fmtN(r[c.price])}</td>
              <td class="td-cs ${priceCls(r[c.csCtrl],sp)}">${priceVal(r[c.csCtrl])}</td>
              <td class="td-cs ${priceCls(r[c.csSub1],sp)}">${priceVal(r[c.csSub1])}</td>
              <td class="td-cs ${priceCls(r[c.csSub2],sp)}">${priceVal(r[c.csSub2])}</td>
              <td class="td-cs ${priceCls(r[c.csRetail],sp)}">${priceVal(r[c.csRetail])}</td>
              <td class="td-other ${priceCls(r[c.paRetail],sp)}">${priceVal(r[c.paRetail])}</td>
              <td class="td-other ${priceCls(r[c.bpRetail],sp)}">${priceVal(r[c.bpRetail])}</td>
              <td class="td-other ${priceCls(r[c.eaRetail],sp)}">${priceVal(r[c.eaRetail])}</td>
              <td class="${diffCls(r[c.diff])}">${fmtN(r[c.diff])}</td>
              <td class="${diffCls(r[c.sumDiff])}" style="font-weight:700">${fmtN(r[c.sumDiff])}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
        <div class="m-items">${gRows.map((r, i) => {
          const sp = parseN(r[c.price]);
          const sd = parseN(r[c.sumDiff]);
          return `<div class="m-item">
            <div class="m-item-name">${i+1}. ${r[c.sku]||''}${sp === 0 ? ' <span class="badge-free">แถม</span>' : ''}<br><small>${fmtN(r[c.qty])} ${r[c.unit]||''}</small></div>
            <div class="m-item-prices">
              <div class="m-price-cell"><div class="m-price-label">ขาย</div><div class="m-price-val m-sell-val">${sp === 0 ? '-' : fmtN(r[c.price])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">CS S00</div><div class="m-price-val ${priceCls(r[c.csCtrl],sp)}">${priceVal(r[c.csCtrl])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">CS S01</div><div class="m-price-val ${priceCls(r[c.csSub1],sp)}">${priceVal(r[c.csSub1])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">CS S02</div><div class="m-price-val ${priceCls(r[c.csSub2],sp)}">${priceVal(r[c.csSub2])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">CS S03</div><div class="m-price-val ${priceCls(r[c.csRetail],sp)}">${priceVal(r[c.csRetail])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">PA S03</div><div class="m-price-val ${priceCls(r[c.paRetail],sp)}">${priceVal(r[c.paRetail])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">BP S03</div><div class="m-price-val ${priceCls(r[c.bpRetail],sp)}">${priceVal(r[c.bpRetail])}</div></div>
              <div class="m-price-cell"><div class="m-price-label">EA S03</div><div class="m-price-val ${priceCls(r[c.eaRetail],sp)}">${priceVal(r[c.eaRetail])}</div></div>
            </div>
            <div class="m-item-diff">ส่วนต่าง <span class="${diffCls(r[c.diff])}">${fmtN(r[c.diff])}</span> &nbsp; รวม <span class="${diffCls(r[c.sumDiff])}">${fmtN(r[c.sumDiff])}</span></div>
          </div>`;
        }).join('')}</div>
      </div>
    </div>`;
  }).join('');

}

// ── Init ──
(async function init() {
  showSpinner('กำลังโหลดข้อมูลจาก SQL_Claude...');
  setLoading(true);
  try {
    allData = await fetchSheet();
    storeMap = processData(allData);
    buildFilters();
    applyFilters();
    showToast(`โหลดสำเร็จ — ${allData.length.toLocaleString()} รายการ, ${Object.keys(storeMap).length} ร้าน`, 'success');
  } catch (e) {
    showToast('โหลดข้อมูลล้มเหลว: ' + e.message, 'error');
    document.getElementById('cardList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>โหลดข้อมูลล้มเหลว: ${e.message}<br><small>ตรวจสอบว่าชีตเปิดการแชร์แบบ "ทุกคนที่มีลิงก์สามารถดูได้"</small></div>`;
  } finally {
    hideSpinner(); setLoading(false);
    setTimeout(() => document.getElementById('loadingBar').style.width = '0', 400);
  }
})();
</script>
